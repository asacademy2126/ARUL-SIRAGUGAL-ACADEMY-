<script>
/* =========================================================
   V2 FEATURE PATCH
   - Offline marks
   - Individual student PDF report
   - Full student fee history
   - Admin/Teacher edit for attendance, fees, marks
   - WhatsApp paid-fee receipt message
   - Date-wise attendance history
   ========================================================= */
(function(){
  const byId = id => document.getElementById(id);

  function actor(){
    return role==='admin' ? 'Admin' : (db.settings.teacher || 'Teacher');
  }

  function saveEdited(){
    save();
    setTimeout(()=>{ if(typeof setSyncStatus==='function') setSyncStatus('success'); },200);
  }

  /* ---------- OFFLINE / REGULAR MARKS ---------- */
  window.markForm = function(editIndex){
    const editing = Number.isInteger(editIndex);
    const m = editing ? db.marks[editIndex] : {
      studentId: db.students[0]?.id || '',
      exam:'', mark:'', total:100, date:today(),
      entryType:'Offline Mark', enteredBy:actor()
    };
    openModal(editing ? '✏️ Edit Offline Mark' : '📝 Add Offline Mark',`
      <label>Student</label>
      <select id="markStudent">${db.students.map(s=>`<option value="${esc(s.id)}" ${s.id===m.studentId?'selected':''}>${esc(s.name)} (${esc(s.class||'')})</option>`).join('')}</select>
      <label>Test / Exam / Subject</label>
      <input id="markExam" value="${esc(m.exam||'')}" placeholder="e.g. Science Unit Test">
      <div class="two">
        <div><label>Mark Scored</label><input id="markValue" type="number" min="0" value="${m.mark??''}"></div>
        <div><label>Total Mark</label><input id="markTotal" type="number" min="1" value="${m.total||100}"></div>
      </div>
      <label>Date</label><input id="markDate" type="date" value="${esc(m.date||today())}">
      <label>Record Type</label><select id="markEntryType"><option value="Offline Mark">Offline Mark</option><option value="Regular Mark">Regular Mark</option></select>
      <br><button class="btn success" style="width:100%" onclick="saveOfflineMark(${editing?editIndex:-1})">${editing?'Update Mark':'Save Offline Mark'}</button>
    `);
  };

  window.saveOfflineMark = function(editIndex){
    const studentId=byId('markStudent').value;
    const exam=byId('markExam').value.trim();
    const mark=Number(byId('markValue').value);
    const total=Number(byId('markTotal').value);
    const date=byId('markDate').value||today();
    const entryType=byId('markEntryType').value||'Offline Mark';
    if(!studentId||!exam||!Number.isFinite(mark)||!Number.isFinite(total)||total<=0||mark<0||mark>total)
      return alert('Student, Test/Exam, Mark மற்றும் Total சரியாக கொடுக்கவும்.');
    const obj={studentId,exam,mark,total,date,entryType,enteredBy:actor()};
    if(editIndex>=0) db.marks[editIndex]=obj; else db.marks.push(obj);
    saveEdited(); closeModal(); marksPage();
  };

  window.deleteMark = function(i){
    if(!confirm('இந்த offline mark record-ஐ delete செய்யவா?')) return;
    db.marks.splice(i,1); saveEdited(); marksPage();
  };

  window.editOnlineMark = function(i){
    const m=db.onlineMarks[i]; if(!m)return;
    openModal('✏️ Edit Online Test Mark',`
      <p><b>${esc(m.testName||'Online Test')}</b> — ${esc(m.studentName||m.studentId)}</p>
      <div class="two">
        <div><label>Mark</label><input id="omMark" type="number" min="0" max="${Number(m.total)||100}" value="${Number(m.mark)||0}"></div>
        <div><label>Total</label><input id="omTotal" type="number" min="1" value="${Number(m.total)||100}"></div>
      </div>
      <label>Date</label><input id="omDate" type="date" value="${esc(m.date||today())}">
      <br><button class="btn success" style="width:100%" onclick="saveOnlineMarkEdit(${i})">Update Online Mark</button>
    `);
  };
  window.saveOnlineMarkEdit=function(i){
    const m=db.onlineMarks[i]; if(!m)return;
    const mark=Number(byId('omMark').value), total=Number(byId('omTotal').value);
    if(!Number.isFinite(mark)||!Number.isFinite(total)||total<=0||mark<0||mark>total)return alert('Mark / Total சரியாக கொடுக்கவும்.');
    m.mark=mark; m.total=total; m.date=byId('omDate').value||today(); m.editedBy=actor(); m.editedAt=new Date().toISOString();
    saveEdited(); closeModal(); marksPage();
  };

  window.marksPage = function(){
    document.getElementById('content').innerHTML=`
      <div class="toolbar">
        <button class="btn" onclick="markForm()">➕ Add Offline Mark</button>
        <button class="btn secondary" onclick="showPage('tests')">🧪 Manage Test Links</button>
      </div>
      <div class="card table-wrap">
        <h3>📝 Offline / Regular Marks — Admin / Teacher</h3>
        <table class="table">
          <thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Test / Subject</th><th>Mark</th><th>Total</th><th>%</th><th>Entered By</th><th>Edit</th></tr></thead>
          <tbody>${db.marks.slice().reverse().map((m,rev)=>{
            const i=db.marks.length-1-rev, s=db.students.find(x=>x.id===m.studentId);
            const pct=m.total?((m.mark/m.total)*100).toFixed(1)+'%':'-';
            return `<tr><td>${esc(m.date||'-')}</td><td><b>${esc(s?.name||m.studentId)}</b></td><td>${esc(s?.class||'-')}</td>
              <td>${esc(m.exam||'-')}<br><small>${esc(m.entryType||'Offline Mark')}</small></td>
              <td><b>${m.mark}</b></td><td>${m.total}</td><td><span class="badge info">${pct}</span></td>
              <td>${esc(m.enteredBy||'-')}</td><td>
                <button class="btn secondary" style="padding:4px 8px;font-size:11px" onclick="markForm(${i})">✏️ Edit</button>
                <button class="btn danger" style="padding:4px 8px;font-size:11px" onclick="deleteMark(${i})">Delete</button>
              </td></tr>`;
          }).join('')||'<tr><td colspan="9" style="text-align:center">Offline Marks இல்லை.</td></tr>'}</tbody>
        </table>
      </div>
      <div class="card table-wrap">
        <h3>🧪 Student Submitted Online Test Marks</h3>
        <table class="table">
          <thead><tr><th>Date</th><th>Student</th><th>Test</th><th>Subject</th><th>Mark</th><th>Total</th><th>%</th><th>Edit</th></tr></thead>
          <tbody>${(db.onlineMarks||[]).slice().reverse().map((m,rev)=>{
            const i=db.onlineMarks.length-1-rev, s=db.students.find(x=>x.id===m.studentId);
            const pct=m.total?((m.mark/m.total)*100).toFixed(1)+'%':'-';
            return `<tr><td>${esc(m.date||'-')}</td><td>${esc(s?.name||m.studentName||m.studentId)}</td><td>${esc(m.testName||'-')}</td>
              <td>${esc(m.subject||'-')}</td><td><b>${m.mark}</b></td><td>${m.total}</td><td>${pct}</td>
              <td><button class="btn secondary" style="padding:4px 8px;font-size:11px" onclick="editOnlineMark(${i})">✏️ Edit</button>
              <button class="btn danger" style="padding:4px 8px;font-size:11px" onclick="deleteOnlineMark(${i})">Delete</button></td></tr>`;
          }).join('')||'<tr><td colspan="8" style="text-align:center">Online Marks இல்லை.</td></tr>'}</tbody>
        </table>
      </div>`;
  };

  /* ---------- ATTENDANCE: DATE-WISE + EDIT ---------- */
  window.editAttendance = function(i){
    const a=db.attendance[i]; if(!a)return;
    const s=db.students.find(x=>x.id===a.studentId);
    openModal('✏️ Edit Attendance',`
      <p><b>${esc(s?.name||a.studentId)}</b> — ${esc(s?.class||'')}</p>
      <label>Date</label><input id="eaDate" type="date" value="${esc(a.date)}">
      <label>Status</label><select id="eaStatus"><option ${a.status==='Present'?'selected':''}>Present</option><option ${a.status==='Absent'?'selected':''}>Absent</option></select>
      <br><button class="btn success" style="width:100%" onclick="saveAttendanceEdit(${i})">Update Attendance</button>
    `);
  };
  window.saveAttendanceEdit=function(i){
    const a=db.attendance[i]; if(!a)return;
    const date=byId('eaDate').value, status=byId('eaStatus').value;
    if(!date)return alert('Date தேவை');
    const duplicate=db.attendance.findIndex((x,idx)=>idx!==i&&x.studentId===a.studentId&&x.date===date);
    if(duplicate>=0){db.attendance.splice(duplicate,1);if(duplicate<i)i--;}
    a.date=date;a.status=status;a.editedBy=actor();a.editedAt=new Date().toISOString();
    saveEdited();closeModal();attendancePage();
  };

  window.attendancePage = function(){
    const classes=[...new Set(db.students.map(s=>s.class).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    const d=today();
    document.getElementById('content').innerHTML=`
      <div class="card">
        <h3>📅 Date-wise Attendance Entry</h3>
        <div class="toolbar">
          <div><label>Date</label><input id="attDate" type="date" value="${d}" onchange="renderClassAttendance()"></div>
          <div><label>Class</label><select id="attClass" onchange="renderClassAttendance()"><option value="">All Classes</option>${classes.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
          <button class="btn success" style="align-self:flex-end" onclick="saveClassAttendance()">💾 Save Attendance</button>
        </div>
        <div id="classAttendanceBox"></div>
      </div>
      <div class="card">
        <h3>📋 Attendance History — Date / Student / Class</h3>
        <div class="toolbar">
          <div><label>From</label><input id="attFrom" type="date" value="${today()}"></div>
          <div><label>To</label><input id="attTo" type="date" value="${today()}"></div>
          <div><label>Class</label><select id="attHistoryClass"><option value="">All Classes</option>${classes.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
          <button class="btn secondary" onclick="renderAttendanceHistoryV2()">🔎 View Date-wise</button>
          <button class="btn secondary" onclick="exportAttendanceV2PDF()">🖨️ PDF</button>
        </div>
        <div id="attendanceHistoryV2"></div>
      </div>`;
    renderClassAttendance();
    renderAttendanceHistoryV2();
  };

  window.renderAttendanceHistoryV2=function(){
    const from=byId('attFrom')?.value||'', to=byId('attTo')?.value||'', cls=byId('attHistoryClass')?.value||'';
    let arr=db.attendance.filter(a=>inPeriod(a.date,from,to)).map((a,i)=>({...a,_i:i,s:db.students.find(s=>s.id===a.studentId)}));
    if(cls)arr=arr.filter(x=>x.s?.class===cls);
    const grouped={};
    arr.forEach(x=>(grouped[x.date]??=[]).push(x));
    const dates=Object.keys(grouped).sort().reverse();
    byId('attendanceHistoryV2').innerHTML=dates.map(date=>{
      const rows=grouped[date];
      return `<div class="card" style="margin-top:12px">
        <h4>📅 ${esc(date)} — ${rows.length} records</h4>
        <div class="table-wrap"><table class="table"><tr><th>Student</th><th>Class</th><th>Status</th><th>Edit</th></tr>
        ${rows.map(x=>`<tr><td>${esc(x.s?.name||x.studentId)}</td><td>${esc(x.s?.class||'-')}</td>
        <td><span class="badge ${x.status==='Present'?'ok':'pending'}">${esc(x.status)}</span></td>
        <td>${(role==='admin'||role==='teacher')?`<button class="btn secondary" style="padding:4px 8px;font-size:11px" onclick="editAttendance(${x._i})">✏️ Edit</button>`:''}</td></tr>`).join('')}</table></div>
      </div>`;
    }).join('')||'<p style="color:var(--muted)">இந்த date range-ல் attendance இல்லை.</p>';
  };
  window.exportAttendanceV2PDF=function(){
    pdfPrint('Date-wise Attendance Report',byId('attendanceHistoryV2')?.innerHTML||'No records');
  };

  /* ---------- FEES: EDIT + PAID WHATSAPP + FULL HISTORY ---------- */
  window.editFee = function(i){
    const f=db.fees[i]; if(!f)return;
    const isExtra=f.type==='Extra';
    openModal(isExtra?'✏️ Edit Extra Fee':'✏️ Edit Paid Fee',`
      <label>Student</label><select id="efStudent">${db.students.map(s=>`<option value="${esc(s.id)}" ${s.id===f.studentId?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
      <label>Amount</label><input id="efAmount" type="number" value="${Number(isExtra?f.extraAmount:f.amount)||0}">
      ${isExtra?`<label>Extra Type</label><select id="efType">${['Book','Pen','Notebook','Exam','Other'].map(x=>`<option ${x===(f.extraType||'Other')?'selected':''}>${x}</option>`).join('')}</select>`:''}
      <label>Date</label><input id="efDate" type="date" value="${esc(f.date||today())}">
      <br><button class="btn success" style="width:100%" onclick="saveFeeEdit(${i})">Update Fee Record</button>
    `);
  };
  window.saveFeeEdit=function(i){
    const f=db.fees[i];if(!f)return;
    const amt=Number(byId('efAmount').value), date=byId('efDate').value;
    if(amt<=0||!date)return alert('Amount / Date சரியாக கொடுக்கவும்.');
    f.studentId=byId('efStudent').value; f.date=date; f.editedBy=actor(); f.editedAt=new Date().toISOString();
    if(f.type==='Extra'){f.extraAmount=amt;f.extraType=byId('efType').value;f.amount=0;}
    else {f.amount=amt;f.type='Payment';}
    saveEdited();closeModal();feesPage();
  };

  window.deleteFee = function(i){
    if(!confirm('இந்த fee record-ஐ delete செய்யவா?'))return;
    db.fees.splice(i,1);saveEdited();feesPage();
  };

  window.whatsappPaidFee=function(i){
    const f=db.fees[i]; if(!f||f.type==='Extra')return;
    const s=db.students.find(x=>x.id===f.studentId); if(!s?.mobile)return alert('இந்த student-க்கு mobile number இல்லை.');
    const month=f.date?.slice(0,7)||monthNow();
    const paid=calcPaid(s.id,month), pending=calcPending(s.id,month);
    const msg=`வணக்கம் ${s.parent||s.name},%0A${db.settings.academy}%0A%0A✅ கட்டணம் பெறப்பட்டது%0A👨‍🎓 மாணவர்: ${s.name}%0A🆔 ID: ${s.id}%0A📅 தேதி: ${f.date}%0A💰 செலுத்திய தொகை: ₹${Number(f.amount||0).toLocaleString('en-IN')}%0A📊 இந்த மாதம் மொத்தம் செலுத்தியது: ₹${paid.toLocaleString('en-IN')}%0A${pending>0?'⏳ நிலுவை: ₹'+pending.toLocaleString('en-IN'):'🎉 இந்த மாத கட்டணம் முழுமையாக செலுத்தப்பட்டது.'}%0A%0Aநன்றி.`;
    window.open(waLink(s.mobile,decodeURIComponent(msg)),'_blank');
  };

  window.showStudentFeeDetails=function(id){
    const s=db.students.find(x=>x.id===id);if(!s)return;
    const records=db.fees.filter(f=>f.studentId===id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    const paid=records.filter(f=>f.type!=='Extra').reduce((a,f)=>a+Number(f.amount||0),0);
    const extra=records.filter(f=>f.type==='Extra').reduce((a,f)=>a+Number(f.extraAmount||0),0);
    const months=[...new Set(records.map(f=>String(f.date||'').slice(0,7)).filter(Boolean))].sort().reverse();
    openModal('💰 Full Fee History — '+s.name,`
      <div class="paybox"><h3>${esc(s.name)}</h3><p>ID: <b>${esc(s.id)}</b> | Class: <b>${esc(s.class||'-')}</b></p>
      <p>Total Paid: <b class="success-text">${money(paid)}</b> &nbsp; Extra: <b>${money(extra)}</b></p></div>
      <div class="toolbar"><button class="btn secondary" onclick="exportStudentReportPDF('${esc(s.id)}')">🖨️ Student PDF</button>${s.mobile?`<button class="btn secondary" onclick="callStudent('${esc(s.id)}')">📞 Call</button>`:''}</div>
      <h4>All Payment / Extra Fee History</h4>
      <div class="table-wrap"><table class="table"><tr><th>Date</th><th>Type</th><th>Reason</th><th>Amount</th><th>Action</th></tr>
      ${records.map((f)=>{const i=db.fees.indexOf(f);return `<tr><td>${esc(f.date)}</td><td>${esc(f.type||'Payment')}</td><td>${esc(f.extraType||'Tuition')}</td><td>${money(Number(f.amount||0)+Number(f.extraAmount||0))}</td>
      <td>${f.type==='Extra'?'':`<button class="btn secondary" style="padding:4px 7px;font-size:11px" onclick="whatsappPaidFee(${i})">💬 Paid WhatsApp</button>`}
      ${(role==='admin'||role==='teacher')?`<button class="btn secondary" style="padding:4px 7px;font-size:11px" onclick="closeModal();editFee(${i})">✏️</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="5">Fee history இல்லை.</td></tr>'}</table></div>
      <h4>Month Summary</h4>
      <div class="table-wrap"><table class="table"><tr><th>Month</th><th>Paid</th><th>Extra</th><th>Pending</th></tr>
      ${months.map(m=>{const p=calcPaid(s.id,m),ex=records.filter(f=>f.date?.startsWith(m)&&f.type==='Extra').reduce((a,f)=>a+Number(f.extraAmount||0),0);return `<tr><td>${m}</td><td>${money(p)}</td><td>${money(ex)}</td><td>${money(Math.max(0,Number(s.monthlyFee||0)+ex-p))}</td></tr>`}).join('')||'<tr><td colspan="4">No monthly history.</td></tr>'}</table></div>
    `);
  };

  /* Override fee page to show edit and paid-WhatsApp buttons in record history */
  const originalFeesPage = feesPage;
  window.feesPage=function(){
    originalFeesPage();
    const card=document.querySelector('#content .card.table-wrap');
    if(card){
      const rows=card.querySelectorAll('tbody tr');
      rows.forEach(tr=>{
        const name=tr.querySelector('.student-link');
        if(!name)return;
        const s=db.students.find(x=>x.name===name.textContent.trim());
        if(!s)return;
        const action=tr.lastElementChild;
        if(action){
          const payments=db.fees.map((f,i)=>({f,i})).filter(x=>x.f.studentId===s.id&&x.f.type!=='Extra');
          if(payments.length){
            action.innerHTML += ` <button class="btn secondary" style="padding:4px 8px;font-size:11px" onclick="whatsappPaidFee(${payments[payments.length-1].i})">💬 Paid</button>`;
          }
        }
      });
    }
  };

  /* ---------- INDIVIDUAL STUDENT REPORT PDF ---------- */
  window.exportStudentReportPDF=function(id){
    const s=db.students.find(x=>x.id===id)||currentStudent;if(!s)return;
    const att=db.attendance.filter(a=>a.studentId===s.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    const fees=db.fees.filter(f=>f.studentId===s.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    const marks=db.marks.filter(m=>m.studentId===s.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    const online=(db.onlineMarks||[]).filter(m=>m.studentId===s.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    const totalPaid=fees.filter(f=>f.type!=='Extra').reduce((a,f)=>a+Number(f.amount||0),0);
    const totalExtra=fees.filter(f=>f.type==='Extra').reduce((a,f)=>a+Number(f.extraAmount||0),0);
    const present=att.filter(a=>a.status==='Present').length, absent=att.filter(a=>a.status==='Absent').length;
    const html=`
      <h2>👨‍🎓 Student Details</h2>
      <div class="grid"><div class="box"><b>${esc(s.name)}</b>Name</div><div class="box"><b>${esc(s.id)}</b>Student ID</div><div class="box"><b>${esc(s.class||'-')}</b>Class</div>
      <div class="box"><b>${esc(s.mobile||'-')}</b>Mobile</div><div class="box"><b>${esc(s.parent||'-')}</b>Parent</div><div class="box"><b>${money(s.monthlyFee)}</b>Monthly Fee</div></div>
      <h2>📅 Attendance</h2><p>Present: <b>${present}</b> | Absent: <b>${absent}</b> | Total Marked: <b>${att.length}</b></p>
      <table><tr><th>Date</th><th>Status</th></tr>${att.map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.status)}</td></tr>`).join('')||'<tr><td colspan="2">No attendance records</td></tr>'}</table>
      <h2>💰 Complete Fee History</h2><p>Total Paid: <b>${money(totalPaid)}</b> | Extra: <b>${money(totalExtra)}</b></p>
      <table><tr><th>Date</th><th>Type</th><th>Reason</th><th>Amount</th></tr>${fees.map(f=>`<tr><td>${esc(f.date)}</td><td>${esc(f.type||'Payment')}</td><td>${esc(f.extraType||'Tuition')}</td><td>${money(Number(f.amount||0)+Number(f.extraAmount||0))}</td></tr>`).join('')||'<tr><td colspan="4">No fee records</td></tr>'}</table>
      <h2>📝 Offline / Regular Marks</h2><table><tr><th>Date</th><th>Test</th><th>Mark</th><th>Total</th><th>%</th></tr>${marks.map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.exam)}</td><td>${m.mark}</td><td>${m.total}</td><td>${m.total?((m.mark/m.total)*100).toFixed(1)+'%':'-'}</td></tr>`).join('')||'<tr><td colspan="5">No offline marks</td></tr>'}</table>
      <h2>🧪 Online Test Marks</h2><table><tr><th>Date</th><th>Test</th><th>Subject</th><th>Mark</th><th>Total</th><th>%</th></tr>${online.map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.testName)}</td><td>${esc(m.subject||'-')}</td><td>${m.mark}</td><td>${m.total}</td><td>${m.total?((m.mark/m.total)*100).toFixed(1)+'%':'-'}</td></tr>`).join('')||'<tr><td colspan="6">No online marks</td></tr>'}</table>`;
    pdfPrint('Individual Student Report - '+s.name,html);
  };

  /* ---------- STUDENT LOGIN: FULL PROFILE + FULL FEE HISTORY ---------- */
  window.studentFees=function(){
    const s=currentStudent;if(!s)return;
    const records=db.fees.filter(f=>f.studentId===s.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    const paid=records.filter(f=>f.type!=='Extra').reduce((a,f)=>a+Number(f.amount||0),0);
    const extra=records.filter(f=>f.type==='Extra').reduce((a,f)=>a+Number(f.extraAmount||0),0);
    const m=monthNow(), pending=calcPending(s.id,m);
    document.getElementById('content').innerHTML=`
      <div class="cards"><div class="card stat"><div class="label">This Month Paid</div><div class="value success-text">${money(calcPaid(s.id,m))}</div></div>
      <div class="card stat"><div class="label">This Month Pending</div><div class="value danger-text">${money(pending)}</div></div>
      <div class="card stat"><div class="label">All Time Paid</div><div class="value">${money(paid)}</div></div>
      <div class="card stat"><div class="label">Extra Fees</div><div class="value">${money(extra)}</div></div></div>
      <div class="card"><h3>💰 Complete Fee History</h3>
        <p><b>${esc(s.name)}</b> | ID: ${esc(s.id)} | Class: ${esc(s.class||'-')}</p>
        <button class="btn secondary" onclick="exportStudentReportPDF('${esc(s.id)}')">🖨️ Download Individual Student PDF</button>
        <div class="table-wrap" style="margin-top:15px"><table class="table"><tr><th>Date</th><th>Type</th><th>Reason</th><th>Amount</th></tr>
        ${records.map(f=>`<tr><td>${esc(f.date)}</td><td>${esc(f.type||'Payment')}</td><td>${esc(f.extraType||'Tuition')}</td><td>${money(Number(f.amount||0)+Number(f.extraAmount||0))}</td></tr>`).join('')||'<tr><td colspan="4">Fee history இல்லை.</td></tr>'}</table></div>
      </div>`;
  };

  /* ---------- STUDENT PROFILE: COMPLETE DETAILS ---------- */
  window.studentProfilePage=function(id){
    const s=db.students.find(x=>x.id===id)||currentStudent;if(!s)return;
    const a=calcAttendanceStats(s.id,''), pending=calcPending(s.id,monthNow());
    const paid=db.fees.filter(f=>f.studentId===s.id&&f.type!=='Extra').reduce((x,f)=>x+Number(f.amount||0),0);
    document.getElementById('content').innerHTML=`
      <div class="cards"><div class="card stat"><div class="label">Attendance</div><div class="value">${fmtPct(a.pct)}</div></div>
      <div class="card stat"><div class="label">Present</div><div class="value">${a.present}</div></div>
      <div class="card stat"><div class="label">Absent</div><div class="value danger-text">${a.absent}</div></div>
      <div class="card stat"><div class="label">This Month Pending</div><div class="value danger-text">${money(pending)}</div></div></div>
      <div class="card"><h3>👨‍🎓 Complete Student Details</h3>
        <div class="grid2"><div><p><b>Student ID:</b> ${esc(s.id)}</p><p><b>Name:</b> ${esc(s.name)}</p><p><b>Class:</b> ${esc(s.class||'-')}</p><p><b>Mobile:</b> ${esc(s.mobile||'-')}</p></div>
        <div><p><b>Parent:</b> ${esc(s.parent||'-')}</p><p><b>Birthday:</b> ${esc(s.birthday||'-')}</p><p><b>Address:</b> ${esc(s.address||'-')}</p><p><b>Monthly Fee:</b> ${money(s.monthlyFee)}</p></div></div>
        <div class="toolbar"><button class="btn secondary" onclick="exportStudentReportPDF('${esc(s.id)}')">🖨️ Download Student PDF</button>
        <button class="btn secondary" onclick="showStudentFeeDetails('${esc(s.id)}')">💰 Full Fee History</button>
        ${(role==='admin'||role==='teacher')?`<button class="btn secondary" onclick="studentForm('${esc(s.id)}')">✏️ Edit Profile</button>`:''}</div>
      </div>`;
  };

  /* Ensure navigation uses the latest patched functions */
  window.showPageV2Original = window.showPageV2Original || showPage;
  const oldShowPageV2 = showPage;
  window.showPage = function(p){
    oldShowPageV2(p);
  };

})();
</script>


<style>

   Only 2 main class groups + 3 inner tabs
   Google Sheets sync functions are intentionally untouched.
   ========================================================= */

  --group-accent:#2563eb;
  --group-accent-2:#0f766e;
  --group-bg:#f7f9fc;
  --group-line:#dbe2ea;
}

.group-head{
  background:linear-gradient(135deg,#ffffff,#f8fbff);
  border:1px solid var(--group-line);border-radius:22px;padding:20px;

}

.group-tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}

  border:2px solid var(--group-line);background:#fff;border-radius:17px;padding:17px;

.group-tab .gt-sub{font-size:12px;color:var(--muted);margin-top:3px}

  display:grid;grid-template-columns:repeat(3,1fr);gap:9px;
  background:#fff;border:1px solid var(--group-line);padding:8px;border-radius:16px;
  margin:16px 0
}
.inner-nav button{
  background:transparent;color:var(--muted);padding:12px 8px;border-radius:11px;font-weight:900
}

  background:#fff;border:1px solid var(--group-line);border-radius:16px;padding:15px
}
.group-summary .gs-label{font-size:12px;color:var(--muted)}
.group-summary .gs-value{font-size:23px;font-weight:900;margin-top:5px}
.group-students{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

  background:#fff;border:1px solid var(--group-line);border-radius:15px;padding:13px;
  display:flex;align-items:center;justify-content:space-between;gap:10px
}
.group-student-name{font-weight:900}.group-student-meta{font-size:12px;color:var(--muted);margin-top:3px}
.group-mini-btn{padding:7px 10px;border-radius:9px;background:#eef2ff;color:#3730a3;font-weight:800}
.group-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.group-toolbar>div{min-width:150px;flex:1}

  .group-tabs{gap:8px}.group-tab{padding:13px}.group-tab .gt-name{font-size:16px}

}

  .group-head{padding:15px;border-radius:17px}.group-title{font-size:21px}

  .inner-nav button{font-size:12px;padding:11px 5px}
}

<script>
/* =========================================================
   FINAL GROUP UI
   - LKG-5 and 6-8 only
   - Attendance / Fees / Marks inside each group
   - Teacher can access ALL classes
   - Teacher fee entry is limited to the student's CURRENT PENDING amount
   - Existing Google Sheets sync is preserved
   ========================================================= */
(function(){
  window.currentGroup = window.currentGroup || 'LKG-5';
  window.currentGroupTab = window.currentGroupTab || 'attendance';

  function groupStudents(){
    return db.students.filter(s => classBand(s.class) === currentGroup);
  }
  function groupClasses(){
    return [...new Set(groupStudents().map(s=>s.class).filter(Boolean))]
      .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  }
  function groupLabel(g){ return g==='6-8' ? '6 – 8' : 'LKG – 5'; }

  function groupCounts(){
    const ss=groupStudents(), m=monthNow();
    const pending=ss.reduce((n,s)=>n+calcPending(s.id,m),0);
    const present=ss.filter(s=>db.attendance.some(a=>a.studentId===s.id&&a.date===today()&&a.status==='Present')).length;
    return {students:ss.length,present,pending};
  }

  window.openGroup=function(g){
    currentGroup=g;
    currentGroupTab='attendance';
    renderGroupDashboard();
  };

  window.groupTab=function(tab){
    currentGroupTab=tab;
    renderGroupDashboard();
  };

  window.renderGroupDashboard=function(){
    document.getElementById('hubBackBtn').classList.add('hidden');
    document.getElementById('pageTitle').textContent='Dashboard';
    const c=document.getElementById('content');
    const active=currentGroup;
    const ss=groupStudents(), m=monthNow();
    const pending=ss.reduce((n,s)=>n+calcPending(s.id,m),0);
    const present=ss.filter(s=>db.attendance.some(a=>a.studentId===s.id&&a.date===today()&&a.status==='Present')).length;
    const modules=[
      ['students','👨‍🎓','Students','Student details, profile, add / edit'],
      ['attendance','📅','Attendance','Date-wise attendance, absent reminder, history'],
      ['fees','💰','Fees & Extra','Month-wise fees, pending collection, fee history'],
      ['marks','📝','Marks','Regular, offline & online marks'],
      ['tests','🧪','Online Tests / Links','Test links and student submissions'],
      ['homework','📚','Homework','Class-wise homework and links'],
      ['reports','📊','Reports','Student / group reports and PDF'],
      ['history','🗂️','All History','Attendance, fees and activity history'],
      ['communication','📢','Communication','Fee / absent reminders and notices'],
      ['exams','🗓️','Exam Schedule','Exam schedule management'],
      ['finance','💵','Income & Expense','Financial records and summary'],
      ['calendar','🗓️','Calendar','Events and holidays'],
      ['birthdays','🎂','Birthdays','Student birthday reminders'],
      ['teachers','👨‍🏫','Teachers','Teacher accounts / management'],
      ['backup','💾','Backup & Restore','JSON / CSV backup tools'],
      ['settings','⚙️','Settings','App settings & Google Sheets Sync']
    ];
    c.innerHTML=`
      <div class="group-dashboard">
        <div class="group-head">
          <div class="group-head-row">
            <div>
              <div class="group-kicker">Student Details</div>
              <div class="group-title">Class Group Dashboard</div>
            </div>
            <div class="group-note">${role==='teacher'?'👨‍🏫 Teacher: All Classes Access':'👑 Admin'}</div>
          </div>
          <div class="group-tabs">
            <button class="group-tab ${active==='LKG-5'?'active':''}" onclick="openGroup('LKG-5')">
              <div><div class="gt-name">LKG – 5</div><div class="gt-sub">LKG, UKG & 1st – 5th Classes</div></div>
              <span class="group-count">${groupCountOnly('LKG-5')}</span>
            </button>
            <button class="group-tab ${active==='6-8'?'active':''}" onclick="openGroup('6-8')">
              <div><div class="gt-name">6 – 8</div><div class="gt-sub">6th, 7th & 8th Classes</div></div>
              <span class="group-count">${groupCountOnly('6-8')}</span>
            </button>
          </div>
        </div>

        <div class="group-summary">
          <div class="gs"><div class="gs-label">Total Students</div><div class="gs-value">${ss.length}</div></div>
          <div class="gs"><div class="gs-label">Today Present</div><div class="gs-value success-text">${present}</div></div>
          <div class="gs"><div class="gs-label">Pending Fee</div><div class="gs-value danger-text">${money(pending)}</div></div>
        </div>

        <h3 style="margin:20px 0 10px">✨ ${groupLabel(active)} — All Features</h3>
        <div class="hub-grid group-feature-grid">
          ${modules.map(x=>`<div class="hub-card" onclick="groupOpenFeature('${x[0]}')"><div class="hub-icon">${x[1]}</div><div class="hub-title">${x[2]}</div><div class="hub-desc">${x[3]}</div></div>`).join('')}
        </div>
      </div>`;
  };

  window.groupOpenFeature=function(p){
    currentGroupTab=p;
    document.getElementById('hubBackBtn').classList.remove('hidden');
    document.getElementById('hubBackBtn').onclick=renderGroupDashboard;
    document.getElementById('pageTitle').textContent=groupLabel(currentGroup)+' — '+({students:'Students',attendance:'Attendance',fees:'Fees',marks:'Marks',tests:'Online Tests / Links',homework:'Homework',reports:'Reports',history:'All History',communication:'Communication',exams:'Exam Schedule',finance:'Income & Expense',calendar:'Calendar',birthdays:'Birthdays',teachers:'Teachers',backup:'Backup & Restore',settings:'Settings'}[p]||'Feature');
    if(p==='attendance') return renderGroupAttendance(document.getElementById('content'));
    if(p==='fees') return renderGroupFees(document.getElementById('content'));
    if(p==='marks') return renderGroupMarks(document.getElementById('content'));
    if(p==='students') return renderGroupStudentsPage();
    oldShowPage(p);
    setTimeout(()=>scopeCurrentPageToGroup(p),0);
  };

  window.renderGroupStudentsPage=function(){
    const ss=groupStudents();
    const c=document.getElementById('content');
    c.innerHTML=`<div class="toolbar">
      <button class="btn" onclick="studentForm()">➕ Add Student</button>
      <input id="groupStudentSearch" placeholder="Search student..." oninput="renderGroupStudentsRows()" style="max-width:300px">
    </div>
    <div class="card table-wrap"><h3>👨‍🎓 ${groupLabel(currentGroup)} — Student Details</h3>
      <table class="table"><thead><tr><th>ID</th><th>Name</th><th>Class</th><th>Mobile</th><th>Monthly Fee</th><th>Actions</th></tr></thead><tbody id="groupStudentRows"></tbody></table>
    </div>`;
    renderGroupStudentsRows();
  };
  window.renderGroupStudentsRows=function(){
    const q=(document.getElementById('groupStudentSearch')?.value||'').toLowerCase();
    const rows=groupStudents().filter(s=>(s.name+' '+s.id+' '+s.class).toLowerCase().includes(q));
    document.getElementById('groupStudentRows').innerHTML=rows.map(s=>`<tr><td>${esc(s.id)}</td><td><b>${esc(s.name)}</b></td><td>${esc(s.class||'-')}</td><td>${esc(s.mobile||'-')}</td><td>${money(s.monthlyFee)}</td><td><button class="btn secondary" onclick="studentProfilePage('${esc(s.id)}')">Profile</button> <button class="btn secondary" onclick="studentForm('${esc(s.id)}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="6">இந்த group-ல் மாணவர்கள் இல்லை.</td></tr>';
  };

  window.scopeCurrentPageToGroup=function(p){
    const g=currentGroup;
    const rows=[...document.querySelectorAll('#content table tbody tr')];
    rows.forEach(tr=>{
      const text=tr.innerText||'';
      const students=db.students.filter(s=>classBand(s.class)===g);
      if(['tests','homework'].includes(p)){
        const ok=students.some(s=>text.includes(s.name)||text.includes(String(s.class||'')));
        if(tr.children.length>1 && !ok && text.trim() && !/no records|இல்லை|pending/i.test(text)) tr.style.display='none';
      }
    });
  };

  function groupCountOnly(g){ return db.students.filter(s=>classBand(s.class)===g).length; }

  function groupStudentCards(){
    const ss=groupStudents();
    return ss.map(s=>`
      <div class="group-student">
        <div>
          <div class="group-student-name">${esc(s.name)}</div>
          <div class="group-student-meta">${esc(s.class||'-')} · ID: ${esc(s.id)}</div>
        </div>
        <button class="group-mini-btn" onclick="studentProfilePage('${esc(s.id)}')">View</button>
      </div>`).join('') || '<div class="group-note">இந்த group-ல் மாணவர்கள் இல்லை.</div>';
  }

  function renderGroupAttendance(panel){
    const ss=groupStudents(), classes=groupClasses(), d=today();
    const present=ss.filter(s=>db.attendance.some(a=>a.studentId===s.id&&a.date===d&&a.status==='Present')).length;
    const absent=ss.filter(s=>db.attendance.some(a=>a.studentId===s.id&&a.date===d&&a.status==='Absent')).length;

    panel.innerHTML=`
      <div class="group-summary">
        <div class="gs"><div class="gs-label">Total Students</div><div class="gs-value">${ss.length}</div></div>
        <div class="gs"><div class="gs-label">Today Present</div><div class="gs-value success-text">${present}</div></div>
        <div class="gs"><div class="gs-label">Today Absent</div><div class="gs-value danger-text">${absent}</div></div>
      </div>

      <div class="card">
        <h3>📅 Date-wise Attendance</h3>
        <div class="group-toolbar">
          <div><label>Date</label><input id="groupAttDate" type="date" value="${d}" onchange="renderGroupAttList()"></div>
          <div><label>Class</label><select id="groupAttClass" onchange="renderGroupAttList()"><option value="">All Classes</option>${classes.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div>
          <button class="btn success" style="align-self:flex-end" onclick="saveGroupAttendance()">💾 Auto Save Attendance</button>
        </div>
        <div id="groupAttList" style="margin-top:14px"></div>
      </div>

      <div class="card">
        <h3>📋 Absent Reminder / History</h3>
        <div class="group-toolbar">
          <div><label>From</label><input id="groupAttFrom" type="date" value="${d}"></div>
          <div><label>To</label><input id="groupAttTo" type="date" value="${d}"></div>
          <button class="btn secondary" onclick="renderGroupAttendanceHistory()">View History</button>
        </div>
        <div id="groupAttHistory" style="margin-top:12px"></div>
      </div>

      <div class="card">
        <h3>👨‍🎓 Student Details — ${groupLabel(currentGroup)}</h3>
        <div class="group-students">${groupStudentCards()}</div>
      </div>`;
    renderGroupAttList();
    renderGroupAttendanceHistory();
  }

  window.renderGroupAttList=function(){
    const date=document.getElementById('groupAttDate')?.value||today();
    const cls=document.getElementById('groupAttClass')?.value||'';
    const students=groupStudents().filter(s=>!cls||s.class===cls);
    const existing={};
    db.attendance.filter(a=>a.date===date).forEach(a=>existing[a.studentId]=a.status);
    const box=document.getElementById('groupAttList'); if(!box)return;

    box.innerHTML=students.map((s,i)=>{
      const st=existing[s.id]||'';
      return `<div class="group-student" style="margin-bottom:8px">
        <div><div class="group-student-name">${i+1}. ${esc(s.name)}</div><div class="group-student-meta">${esc(s.class||'-')} · ${esc(s.id)}</div></div>
        <div class="att-buttons" data-student="${esc(s.id)}" data-status="${esc(st)}">
          <button type="button" class="att-btn present ${st==='Present'?'selected':''}" onclick="setAttendanceButton(this,'Present')">✓ Present</button>
          <button type="button" class="att-btn absent ${st==='Absent'?'selected':''}" onclick="setAttendanceButton(this,'Absent')">✕ Absent</button>
        </div>
      </div>`;
    }).join('') || '<div class="group-note">இந்த class-ல் மாணவர்கள் இல்லை.</div>';
  };

  window.saveGroupAttendance=function(){
    const date=document.getElementById('groupAttDate')?.value||today();
    const wraps=[...document.querySelectorAll('#groupAttList .att-buttons')];
    if(!wraps.length)return alert('மாணவர்கள் இல்லை.');
    let count=0;
    wraps.forEach(w=>{
      const id=w.dataset.student,status=w.dataset.status;
      if(status){
        db.attendance=db.attendance.filter(a=>!(a.studentId===id&&a.date===date));
        db.attendance.push({studentId:id,date,status});
        count++;
      }
    });
    save();
    alert(count+' students attendance saved.');
    renderGroupAttendance(document.getElementById('groupPanel'));
  };

  window.renderGroupAttendanceHistory=function(){
    const from=document.getElementById('groupAttFrom')?.value||today();
    const to=document.getElementById('groupAttTo')?.value||today();
    const box=document.getElementById('groupAttHistory'); if(!box)return;
    const arr=db.attendance
      .filter(a=>inPeriod(a.date,from,to))
      .map((a,i)=>({...a,s:db.students.find(s=>s.id===a.studentId),_i:i}))
      .filter(x=>classBand(x.s?.class)===currentGroup)
      .sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    box.innerHTML=`<div class="table-wrap"><table class="table">
      <tr><th>Date</th><th>Class</th><th>Student</th><th>Status</th><th>Reminder</th></tr>
      ${arr.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.s?.class||'-')}</td><td>${esc(x.s?.name||x.studentId)}</td>
      <td><span class="badge ${x.status==='Present'?'ok':'pending'}">${esc(x.status)}</span></td>
      <td>${x.status==='Absent'&&x.s?.mobile?`<button class="btn secondary" style="padding:5px 8px;font-size:11px" onclick="whatsapp('${esc(x.s.id)}','absent')">💬 Reminder</button>`:'-'}</td></tr>`).join('')||'<tr><td colspan="5">History இல்லை.</td></tr>'}
    </table></div>`;
  };

  function renderGroupFees(panel){
    const ss=groupStudents(), m=monthNow();
    const pendingTotal=ss.reduce((n,s)=>n+calcPending(s.id,m),0);
    const paidTotal=ss.reduce((n,s)=>n+calcPaid(s.id,m),0);
    const pendingStudents=ss.filter(s=>calcPending(s.id,m)>0);

    if(role==='teacher'){
      panel.innerHTML=`
        <div class="card teacher-fee-only">
          <h3>💰 Pending Fees Collection — ${groupLabel(currentGroup)}</h3>
          <div class="group-note">👨‍🏫 Teacher can collect <b>pending amount only</b>. Total fee, paid amount and group collection totals are hidden.</div>
        </div>
        <div class="card table-wrap">
          <div class="group-toolbar"><div><label>Month</label><input id="teacherFeeMonth" type="month" value="${m}" onchange="renderTeacherPendingFees()"></div></div>
          <div id="teacherPendingFees" style="margin-top:12px"></div>
        </div>
        <div class="card">
          <h3>🔔 Fee Reminder</h3>
          <div class="group-note">Pending students மட்டும் reminder அனுப்பலாம்.</div>
          <div id="teacherFeeReminderList" style="margin-top:10px"></div>
        </div>`;
      renderTeacherPendingFees();
      return;
    }

    panel.innerHTML=`
      <div class="group-summary">
        <div class="gs"><div class="gs-label">Students</div><div class="gs-value">${ss.length}</div></div>
        <div class="gs"><div class="gs-label">Month</div><div class="gs-value">${m}</div></div>
        <div class="gs"><div class="gs-label">Pending</div><div class="gs-value danger-text">${money(pendingTotal)}</div></div>
      </div>
      <div class="card">
        <div class="group-head-row"><div><h3 style="margin:0">💰 Month-wise Fees — ${groupLabel(currentGroup)}</h3></div>
        <div class="toolbar"><button class="btn" onclick="feeForm()">➕ Record Payment</button><button class="btn secondary" onclick="extraForm()">➕ Extra Fee</button></div></div>
      </div>
      <div class="card table-wrap"><table class="table"><thead><tr><th>Student</th><th>Class</th><th>Monthly</th><th>Extra</th><th>Paid</th><th>Pending</th><th>Action</th></tr></thead>
      <tbody>${ss.map(s=>{const fs=db.fees.filter(f=>f.studentId===s.id&&f.date?.startsWith(m));const ex=fs.filter(f=>f.type==='Extra').reduce((a,f)=>a+Number(f.extraAmount||0),0);const paid=calcPaid(s.id,m),pen=calcPending(s.id,m);return `<tr><td><button class="student-link" onclick="showStudentFeeDetails('${esc(s.id)}')">${esc(s.name)}</button></td><td>${esc(s.class||'-')}</td><td>${money(s.monthlyFee)}</td><td>${money(ex)}</td><td>${money(paid)}</td><td><span class="badge ${pen?'pending':'ok'}">${money(pen)}</span></td><td>${pen?`<button class="btn success" style="padding:6px 9px;font-size:11px" onclick="pendingFeeForm('${esc(s.id)}')">💳 Collect Pending</button> <button class="btn secondary" style="padding:6px 9px;font-size:11px" onclick="whatsapp('${esc(s.id)}','fee')">🔔 Reminder</button>`:'Paid'}</td></tr>`;}).join('')||'<tr><td colspan="7">Students இல்லை.</td></tr>'}</tbody></table></div>`;
  }

  window.renderTeacherPendingFees=function(){
    const m=document.getElementById('teacherFeeMonth')?.value||monthNow();
    const ss=groupStudents().filter(s=>calcPending(s.id,m)>0);
    const box=document.getElementById('teacherPendingFees'), rb=document.getElementById('teacherFeeReminderList');
    if(box) box.innerHTML=`<table class="table"><thead><tr><th>Student</th><th>Class</th><th>Pending</th><th>Action</th></tr></thead><tbody>${ss.map(s=>{const p=calcPending(s.id,m);return `<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.class||'-')}</td><td><span class="badge pending">${money(p)}</span></td><td><button class="btn success" style="padding:6px 9px;font-size:11px" onclick="pendingFeeFormForMonth('${esc(s.id)}','${esc(m)}')">💳 Collect</button> ${s.mobile?`<button class="btn secondary" style="padding:6px 9px;font-size:11px" onclick="whatsapp('${esc(s.id)}','fee')">🔔 Reminder</button>`:''}</td></tr>`;}).join('')||'<tr><td colspan="4">Pending fees இல்லை. 🎉</td></tr>'}</tbody></table>`;
    if(rb) rb.innerHTML=ss.map(s=>s.mobile?`<div class="group-student"><div><b>${esc(s.name)}</b><div class="group-student-meta">Pending: ${money(calcPending(s.id,m))}</div></div><button class="btn secondary" style="padding:6px 9px" onclick="whatsapp('${esc(s.id)}','fee')">💬 Send Reminder</button></div>`:'').join('')||'<div class="group-note">Reminder அனுப்ப pending students இல்லை.</div>';
  };

  window.pendingFeeFormForMonth=function(studentId,month){
    const s=db.students.find(x=>x.id===studentId); if(!s)return;
    const pending=calcPending(s.id,month);
    if(pending<=0)return alert('இந்த month-க்கு pending fee இல்லை.');
    openModal('💳 Collect Pending Fee',`<div class="paybox"><h3>${esc(s.name)}</h3><p>Class: <b>${esc(s.class||'-')}</b></p><p>Pending: <b class="danger-text">${money(pending)}</b></p></div><label>Collect Amount</label><input id="pendingPayAmount" type="number" min="1" max="${pending}" value="${pending}"><label>Date</label><input id="pendingPayDate" type="date" value="${today()}"><p class="group-note">Maximum allowed: ${money(pending)}. Teacher cannot collect more than pending.</p><br><button class="btn success" style="width:100%" onclick="savePendingFeeForMonth('${esc(s.id)}','${esc(month)}',${pending})">Save Payment</button>`);
  };
  window.savePendingFeeForMonth=function(studentId,month,maxPending){
    const amount=Number(document.getElementById('pendingPayAmount')?.value||0);
    const date=document.getElementById('pendingPayDate')?.value||today();
    if(amount<=0||amount>maxPending)return alert('Pending amount-க்குள் மட்டும் payment பதிவு செய்யவும்.');
    db.fees.push({studentId,amount,date,type:'Payment',collectedBy:role==='admin'?'Admin':(db.settings.teacher||'Teacher')});
    save();closeModal();renderGroupFees(document.getElementById('content'));
  };

  window.pendingFeeForm=function(studentId){
    const s=db.students.find(x=>x.id===studentId); if(!s)return;
    const pending=calcPending(s.id,monthNow());
    if(pending<=0)return alert('இந்த student-க்கு pending fee இல்லை.');
    openModal('💳 Collect Pending Fee',`
      <div class="paybox">
        <h3>${esc(s.name)}</h3>
        <p>Class: <b>${esc(s.class||'-')}</b></p>
        <p>Current Pending: <b class="danger-text">${money(pending)}</b></p>
      </div>
      <label>Collect Amount</label>
      <input id="pendingPayAmount" type="number" min="1" max="${pending}" value="${pending}" ${role==='teacher'?'readonly':''}>
      <label>Date</label><input id="pendingPayDate" type="date" value="${today()}">
      <p class="group-note">Teacher account-ல் current pending amount-ஐத் தாண்டி payment பதிவு செய்ய முடியாது.</p>
      <br><button class="btn success" style="width:100%" onclick="savePendingFee('${esc(s.id)}',${pending})">Save Pending Payment</button>
    `);
  };

  window.savePendingFee=function(studentId,maxPending){
    const amount=Number(document.getElementById('pendingPayAmount')?.value||0);
    const date=document.getElementById('pendingPayDate')?.value||today();
    if(amount<=0||amount>maxPending)return alert('Pending amount-க்குள் மட்டும் payment பதிவு செய்யவும்.');
    db.fees.push({studentId,amount,date,type:'Payment',collectedBy:role==='admin'?'Admin':(db.settings.teacher||'Teacher')});
    save();closeModal();renderGroupDashboard();
  };

  function renderGroupMarks(panel){
    const ss=groupStudents(), ids=new Set(ss.map(s=>s.id));
    const marks=db.marks.filter(m=>ids.has(m.studentId)).slice().reverse();
    const online=(db.onlineMarks||[]).filter(m=>ids.has(m.studentId)).slice().reverse();

    panel.innerHTML=`
      <div class="group-summary">
        <div class="gs"><div class="gs-label">Students</div><div class="gs-value">${ss.length}</div></div>
        <div class="gs"><div class="gs-label">Offline / Regular</div><div class="gs-value">${marks.length}</div></div>
        <div class="gs"><div class="gs-label">Online Submitted</div><div class="gs-value">${online.length}</div></div>
      </div>

      <div class="card">
        <div class="group-head-row">
          <div><h3 style="margin:0">📝 Marks — ${groupLabel(currentGroup)}</h3><div class="group-note" style="margin-top:8px">Online marks + regular/offline marks</div></div>
          <div class="toolbar"><button class="btn" onclick="markForm()">➕ Add Mark</button><button class="btn secondary" onclick="showPage('tests')">🧪 Tests</button></div>
        </div>
      </div>

      <div class="card table-wrap">
        <h3>Regular / Offline Marks</h3>
        <table class="table"><tr><th>Date</th><th>Student</th><th>Class</th><th>Test</th><th>Mark</th><th>Total</th><th>%</th><th>Edit</th></tr>
        ${marks.map(m=>{const s=db.students.find(x=>x.id===m.studentId),i=db.marks.indexOf(m),pct=m.total?((m.mark/m.total)*100).toFixed(1)+'%':'-';return `<tr><td>${esc(m.date||'-')}</td><td>${esc(s?.name||m.studentId)}</td><td>${esc(s?.class||'-')}</td><td>${esc(m.exam||'-')}</td><td><b>${m.mark}</b></td><td>${m.total}</td><td>${pct}</td><td><button class="btn secondary" style="padding:5px 8px;font-size:11px" onclick="markForm(${i})">✏️</button></td></tr>`}).join('')||'<tr><td colspan="8">Marks இல்லை.</td></tr>'}</table>
      </div>

      <div class="card table-wrap">
        <h3>🧪 Student Submitted Online Marks</h3>
        <table class="table"><tr><th>Date</th><th>Student</th><th>Test</th><th>Subject</th><th>Mark</th><th>Total</th><th>%</th><th>Edit</th></tr>
        ${online.map(m=>{const s=db.students.find(x=>x.id===m.studentId),i=db.onlineMarks.indexOf(m),pct=m.total?((m.mark/m.total)*100).toFixed(1)+'%':'-';return `<tr><td>${esc(m.date||'-')}</td><td>${esc(s?.name||m.studentName||m.studentId)}</td><td>${esc(m.testName||'-')}</td><td>${esc(m.subject||'-')}</td><td><b>${m.mark}</b></td><td>${m.total}</td><td>${pct}</td><td><button class="btn secondary" style="padding:5px 8px;font-size:11px" onclick="editOnlineMark(${i})">✏️</button></td></tr>`}).join('')||'<tr><td colspan="8">Online Marks இல்லை.</td></tr>'}</table>
      </div>

      <div class="card">
        <h3>👨‍🎓 Student Details — Marks</h3>
        <div class="group-students">${ss.map(s=>`<div class="group-student"><div><div class="group-student-name">${esc(s.name)}</div><div class="group-student-meta">${esc(s.class||'-')} · Marks: ${db.marks.filter(m=>m.studentId===s.id).length}</div></div><button class="group-mini-btn" onclick="studentProfilePage('${esc(s.id)}')">View</button></div>`).join('')||'<div class="group-note">மாணவர்கள் இல்லை.</div>'}</div>
      </div>`;
  }

  /* Teacher: allow ALL class groups; remove any old class-band restriction if present. */
  window.teacherCanAccessClass=function(){ return true; };

  /* Keep the existing full dashboard features available to Admin without changing sync. */
  const oldShowHub = showHubMenu;
  window.showHubMenu = function(){
    if(role==='student'){
      oldShowHub();
      return;
    }
    renderGroupDashboard();
  };

  /* If any code calls showPage('attendance/fees/marks') from the new dashboard,
     route it back into the selected group instead of leaving the group UI. */
  const oldShowPage = showPage;
  window.showPage = function(p){
    if(role!=='student' && ['students','attendance','fees','marks','tests','homework','reports','history','communication','exams','finance','calendar','birthdays','teachers','backup','settings'].includes(p)){
      groupOpenFeature(p);
      return;
    }
    oldShowPage(p);
  };

  /* Teacher payment safety: old fee form remains available elsewhere, but teacher
     payment actions always use the pending-only form from the group dashboard. */
  const oldFeeForm=window.feeForm;
  window.feeForm=function(preselect=''){
    if(role==='teacher'){
      if(preselect) return pendingFeeForm(preselect);
      const ss=groupStudents().filter(s=>calcPending(s.id,monthNow())>0);
      if(!ss.length)return alert('Pending fee உள்ள students இல்லை.');
      return pendingFeeForm(ss[0].id);
    }
    return oldFeeForm(preselect);
  };

  /* Re-render the group dashboard after login, while preserving all sync behavior. */
  const oldEnterApp=enterApp;
  window.enterApp=function(r){
    oldEnterApp(r);
    if(r!=='student') setTimeout(renderGroupDashboard,0);
  };
})();
</script>


<script>
/* =========================================================
   FINAL ROLE + GROUP RULES
   LKG-5 / 6-8 data isolation + Teacher permissions
   Attendance P/A click = immediate save + Google sync
   ========================================================= */
(function(){
  const GROUP_FEATURES_ADMIN=['students','attendance','fees','marks','tests','homework','reports','history','communication','exams','finance','calendar','birthdays','teachers','backup','settings'];
  const GROUP_FEATURES_TEACHER=['students','attendance','fees','marks','tests','notice'];

  function gStudents(g=currentGroup){ return db.students.filter(s=>classBand(s.class)===g); }
  function gClasses(g=currentGroup){ return [...new Set(gStudents(g).map(s=>s.class).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})); }
  function gLabel(g){return g==='6-8'?'6 – 8':'LKG – 5';}

  function teacherNoticePage(){
    const list=(db.notices||[]).slice().reverse();
    document.getElementById('content').innerHTML=`
      <div class="card">
        <div class="group-head-row">
          <div><h3 style="margin:0">📢 Notice Board — ${gLabel(currentGroup)}</h3>
          <div class="group-note" style="margin-top:8px">👨‍🏫 Teacher can add / manage notices. No fee amount is shown here.</div></div>
          <button class="btn" onclick="teacherNoticeForm()">➕ Add Notice</button>
        </div>
      </div>
      ${list.map((n,i)=>`<div class="card" style="margin-top:10px"><b>${esc(n.title)}</b><p>${esc(n.text)}</p><small>${esc(n.date)}</small> <button class="btn danger" style="padding:4px 8px;font-size:11px" onclick="db.notices.splice(${db.notices.length-1-i},1);save();teacherNoticePage()">Delete</button></div>`).join('')||'<div class="card"><p style="color:var(--muted)">Notices இல்லை.</p></div>'}`;
  }
  window.teacherNoticePage=teacherNoticePage;
  window.teacherNoticeForm=function(){
    openModal('Add Notice',`
      <label>Title</label><input id="noticeTitle">
      <label>Message</label><textarea id="noticeText"></textarea>
      <br><button class="btn" style="width:100%" onclick="db.notices.push({title:document.getElementById('noticeTitle').value.trim(),text:document.getElementById('noticeText').value.trim(),date:today()});save();closeModal();teacherNoticePage()">Save Notice</button>`);
  };

  /* Teacher dashboard: ONLY the requested five permissions. */
  function renderRoleGroupDashboard(){
    const c=document.getElementById('content');
    const g=currentGroup, ss=gStudents(g), m=monthNow();
    const present=ss.filter(s=>db.attendance.some(a=>a.studentId===s.id&&a.date===today()&&a.status==='Present')).length;
    const features=role==='teacher' ? GROUP_FEATURES_TEACHER : GROUP_FEATURES_ADMIN;
    const meta={
      students:['👨‍🎓','Students','Add / Edit / Remove student'],
      attendance:['📅','Attendance','Date-wise / Class-wise P & A'],
      fees:['💰','Fees & Extra','Month-wise fee management'],
      marks:['📝','Marks','Regular + Online marks'],
      tests:['🧪','Online Tests','Test links + online marks'],
      homework:['📚','Homework','Class-wise homework'],
      reports:['📊','Reports','Reports & summaries'],
      history:['🗂️','All History','History & logs'],
      communication:['📢','Communication','Reminders & notices'],
      notice:['📢','Notice','Add / manage notices'],
      exams:['🗓️','Exam Schedule','Exam management'],
      finance:['💵','Income & Expense','Financial records'],
      calendar:['🗓️','Calendar','Events & holidays'],
      birthdays:['🎂','Birthdays','Birthday reminders'],
      teachers:['👨‍🏫','Teachers','Teacher management'],
      backup:['💾','Backup & Restore','Backup tools'],
      settings:['⚙️','Settings','Google Sheets Sync & settings']
    };
    document.getElementById('hubBackBtn').classList.add('hidden');
    document.getElementById('pageTitle').textContent='Dashboard';
    c.innerHTML=`<div class="group-dashboard">
      <div class="group-head"><div class="group-head-row"><div><div class="group-kicker">Student Details</div><div class="group-title">Class Group Dashboard</div></div><div class="group-note">${role==='teacher'?'👨‍🏫 Teacher — Attendance, Students, Pending Fees, Marks, Online Tests & Notice only':'👑 Admin — All Features'}</div></div>
      <div class="group-tabs">
        <button class="group-tab ${g==='LKG-5'?'active':''}" onclick="openGroup('LKG-5')"><div><div class="gt-name">LKG – 5</div><div class="gt-sub">Only LKG, UKG & 1st–5th students</div></div><span class="group-count">${gStudents('LKG-5').length}</span></button>
        <button class="group-tab ${g==='6-8'?'active':''}" onclick="openGroup('6-8')"><div><div class="gt-name">6 – 8</div><div class="gt-sub">Only 6th, 7th & 8th students</div></div><span class="group-count">${gStudents('6-8').length}</span></button>
      </div></div>
      <div class="group-summary"><div class="gs"><div class="gs-label">${gLabel(g)} Students</div><div class="gs-value">${ss.length}</div></div><div class="gs"><div class="gs-label">Today Present</div><div class="gs-value success-text">${present}</div></div>${role==='admin'?`<div class="gs"><div class="gs-label">Pending Fee</div><div class="gs-value danger-text">${money(ss.reduce((n,s)=>n+calcPending(s.id,m),0))}</div></div>`:''}</div>
      <h3 style="margin:20px 0 10px">✨ ${gLabel(g)} — Features</h3><div class="hub-grid group-feature-grid">${features.map(k=>{const x=meta[k];return `<div class="hub-card" onclick="groupOpenFeature('${k}')"><div class="hub-icon">${x[0]}</div><div class="hub-title">${x[1]}</div><div class="hub-desc">${x[2]}</div></div>`}).join('')}</div>
    </div>`;
  }

  window.renderGroupDashboard=renderRoleGroupDashboard;
  const oldShowHubOriginal = window.showHubMenu;
  window.showHubMenu=function(){ if(role==='student'){ return oldShowHubOriginal(); } renderRoleGroupDashboard(); };

  /* Group feature router. Teacher cannot open fee/other admin modules. */
  const originalGroupOpenFeature=window.groupOpenFeature;
  window.groupOpenFeature=function(p){
    if(role==='teacher'){
      const allowed=GROUP_FEATURES_TEACHER;
      if(!allowed.includes(p)) return alert('Teacher access: Attendance, Students, Pending Fees, Marks, Online Tests & Notice மட்டும்.');
      if(p==='notice'){document.getElementById('hubBackBtn').classList.remove('hidden');document.getElementById('hubBackBtn').onclick=renderRoleGroupDashboard;document.getElementById('pageTitle').textContent=gLabel(currentGroup)+' — Notice';return teacherNoticePage();}
    }
    return originalGroupOpenFeature(p);
  };

  /* Teacher should only see group-scoped student records. Add Remove button. */
  window.renderGroupStudentsPage=function(){
    const ss=gStudents(currentGroup), c=document.getElementById('content');
    c.innerHTML=`<div class="toolbar"><button class="btn" onclick="studentForm()">➕ Add Student</button><input id="groupStudentSearch" placeholder="Search student..." oninput="renderGroupStudentsRows()" style="max-width:300px"></div><div class="card table-wrap"><h3>👨‍🎓 ${gLabel(currentGroup)} — Student Details</h3><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Class</th><th>Mobile</th><th>Actions</th></tr></thead><tbody id="groupStudentRows"></tbody></table></div>`;
    renderGroupStudentsRows();
  };
  window.renderGroupStudentsRows=function(){
    const q=(document.getElementById('groupStudentSearch')?.value||'').toLowerCase();
    const rows=gStudents(currentGroup).filter(s=>(s.name+' '+s.id+' '+s.class).toLowerCase().includes(q));
    document.getElementById('groupStudentRows').innerHTML=rows.map(s=>`<tr><td>${esc(s.id)}</td><td><b>${esc(s.name)}</b></td><td>${esc(s.class||'-')}</td><td>${esc(s.mobile||'-')}</td><td><button class="btn secondary" onclick="studentProfilePage('${esc(s.id)}')">Profile</button> <button class="btn secondary" onclick="studentForm('${esc(s.id)}')">Edit</button> <button class="btn danger" onclick="deleteStudent('${esc(s.id)}');setTimeout(renderGroupStudentsPage,0)">Remove</button></td></tr>`).join('')||'<tr><td colspan="5">இந்த group-ல் மாணவர்கள் இல்லை.</td></tr>';
  };

  /* Attendance: group + class scoped, and P/A click saves immediately. */
  window.renderGroupAttList=function(){
    const date=document.getElementById('groupAttDate')?.value||today(), cls=document.getElementById('groupAttClass')?.value||'';
    const students=gStudents(currentGroup).filter(s=>!cls||s.class===cls), box=document.getElementById('groupAttList'); if(!box)return;
    const existing={}; db.attendance.filter(a=>a.date===date).forEach(a=>existing[a.studentId]=a.status);
    box.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Student</th><th>Class</th><th>P</th><th>A</th><th>Status</th></tr></thead><tbody>${students.map((s,i)=>{const st=existing[s.id]||'';return `<tr><td>${i+1}</td><td><b>${esc(s.name)}</b><br><small>${esc(s.id)}</small></td><td>${esc(s.class||'-')}</td><td><button type="button" class="att-btn present ${st==='Present'?'selected':''}" data-gstudent="${esc(s.id)}" data-gdate="${esc(date)}" onclick="groupAttendanceClick(this,'Present')">✓ P</button></td><td><button type="button" class="att-btn absent ${st==='Absent'?'selected':''}" data-gstudent="${esc(s.id)}" data-gdate="${esc(date)}" onclick="groupAttendanceClick(this,'Absent')">✕ A</button></td><td><span class="att-status badge ${st==='Present'?'ok':st==='Absent'?'pending':'info'}">${st||'Not Marked'}</span></td></tr>`}).join('')||'<tr><td colspan="6">இந்த class-ல் மாணவர்கள் இல்லை.</td></tr>'}</tbody></table></div>`;
  };
  window.groupAttendanceClick=function(btn,status){
    const id=btn.dataset.gstudent, date=btn.dataset.gdate||today();
    db.attendance=db.attendance.filter(a=>!(a.studentId===id&&a.date===date));
    db.attendance.push({studentId:id,date,status});
    save();
    const row=btn.closest('tr'); row?.querySelectorAll('.att-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected');
    const badge=row?.querySelector('.att-status'); if(badge){badge.textContent=status;badge.className='att-status badge '+(status==='Present'?'ok':'pending');}
    renderGroupAttendanceHistory();
  };

  /* Re-enter selected group after login. */
  const originalEnter=window.enterApp;
  window.enterApp=function(r){ originalEnter(r); if(r!=='student') setTimeout(renderRoleGroupDashboard,0); };
})();
</script>

</body>
</html>
