<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Arul Siragugal Academy</title>

<style>
:root{
--ocean:#075985;
--blue:#0ea5e9;
--cyan:#06b6d4;
--green:#16a34a;
--red:#dc2626;
--amber:#f59e0b;
--purple:#7c3aed;
--bg:#eaf8ff;
--card:#fff;
--text:#102a43;
--muted:#64748b;
--line:#dbeafe;
--shadow:0 10px 28px rgba(2,132,199,.12);
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,"Noto Sans Tamil",sans-serif;
background:linear-gradient(180deg,#e0f7ff,#f8fbff);
color:var(--text)
}

button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}

.login{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:18px;
background:linear-gradient(135deg,#075985,#0ea5e9,#06b6d4)
}

.login-card{
width:100%;
max-width:430px;
background:#fff;
border-radius:26px;
padding:28px;
box-shadow:0 25px 60px rgba(0,0,0,.22)
}

.logo{
width:78px;
height:78px;
border-radius:22px;
display:block;
margin:auto auto 10px;
object-fit:cover;
background:#e0f2fe
}

.login-card h1{
text-align:center;
font-size:23px;
margin:8px 0;
color:#075985
}

.login-card p{
text-align:center;
color:var(--muted);
margin:0 0 18px
}

.roles{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin:16px 0
}

.roles button{
padding:12px 6px;
border-radius:12px;
background:#e0f2fe;
color:#075985;
font-weight:700
}

.roles button.active{
background:#075985;
color:#fff
}

label{
display:block;
font-size:13px;
font-weight:700;
margin:10px 0 6px
}

input,select,textarea{
width:100%;
padding:11px 12px;
border:1px solid var(--line);
border-radius:12px;
background:#fff;
color:var(--text)
}

textarea{min-height:90px}

.btn{
padding:10px 14px;
border-radius:12px;
background:#075985;
color:#fff;
font-weight:700;
display:inline-flex;
align-items:center;
justify-content:center;
gap:6px
}

.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.light{background:#e0f2fe;color:#075985}
.btn.amber{background:var(--amber);color:#111827}

.msg{
text-align:center;
color:var(--red);
font-size:13px;
margin-top:12px
}

.app{
max-width:1200px;
margin:auto;
padding:14px
}

.topbar{
background:#fff;
border:1px solid var(--line);
border-radius:18px;
padding:12px 16px;
box-shadow:var(--shadow);
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:14px
}

.brand{
display:flex;
align-items:center;
gap:10px
}

.brand img{
width:42px;
height:42px;
border-radius:12px;
object-fit:cover
}

.brand h2{
font-size:18px;
margin:0
}

.brand small{color:var(--muted)}

.top-actions{
display:flex;
gap:7px;
align-items:center;
flex-wrap:wrap
}

.sync{
font-size:12px;
color:var(--muted)
}

.group-tabs{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:14px
}

.group-tab{
padding:17px;
border-radius:17px;
border:2px solid #bae6fd;
background:#fff;
text-align:left;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:var(--shadow)
}

.group-tab.active{
background:linear-gradient(135deg,#075985,#0ea5e9);
color:#fff;
border-color:#075985
}

.group-name{
font-weight:800;
font-size:17px
}

.group-sub{
font-size:12px;
opacity:.8;
margin-top:4px
}

.group-count{
font-size:22px;
font-weight:800
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin-bottom:14px
}

.stat{
background:#fff;
border-radius:17px;
padding:16px;
border:1px solid var(--line);
box-shadow:var(--shadow)
}

.stat:nth-child(1){border-top:4px solid var(--blue)}
.stat:nth-child(2){border-top:4px solid var(--green)}
.stat:nth-child(3){border-top:4px solid var(--red)}
.stat:nth-child(4){border-top:4px solid var(--purple)}

.stat .label{
font-size:12px;
color:var(--muted)
}

.stat .value{
font-size:24px;
font-weight:800;
margin-top:6px
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px
}

.card{
background:#fff;
border:1px solid var(--line);
border-radius:17px;
padding:16px;
box-shadow:var(--shadow);
margin-bottom:14px
}

.feature{
min-height:125px;
text-align:center;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
cursor:pointer
}

.icon{
font-size:31px;
margin-bottom:8px
}

.feature b{font-size:15px}
.feature small{
color:var(--muted);
margin-top:4px
}

.toolbar{
display:flex;
gap:8px;
flex-wrap:wrap;
align-items:end;
margin-bottom:12px
}

.toolbar>div{
min-width:130px;
flex:1
}

.table-wrap{overflow:auto}

.table{
width:100%;
border-collapse:collapse
}

.table th,
.table td{
padding:9px;
border-bottom:1px solid #e2e8f0;
text-align:left;
white-space:nowrap;
font-size:13px
}

.table th{background:#f0f9ff}

.badge{
padding:4px 8px;
border-radius:999px;
font-size:11px;
font-weight:800
}

.ok{
background:#dcfce7;
color:#166534
}

.pending{
background:#fee2e2;
color:#991b1b
}

.info{
background:#e0f2fe;
color:#075985
}

.two{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.modal{
position:fixed;
inset:0;
background:rgba(2,6,23,.55);
display:flex;
align-items:center;
justify-content:center;
padding:16px;
z-index:20
}

.modal-box{
width:100%;
max-width:650px;
max-height:92vh;
overflow:auto;
background:#fff;
border-radius:20px;
padding:20px
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid var(--line);
padding-bottom:10px;
margin-bottom:10px
}

.notice{
padding:12px;
border-radius:12px;
background:#eff6ff;
border:1px solid #bfdbfe;
margin:8px 0
}

.danger{color:var(--red)}
.success{color:var(--green)}
.muted{color:var(--muted)}

.p-a{
display:flex;
gap:6px
}

.p-a button{
padding:7px 10px;
border-radius:9px;
border:2px solid #cbd5e1;
background:#fff;
font-weight:800
}

.p-a .p.active{
background:#16a34a;
color:#fff;
border-color:#16a34a
}

.p-a .a.active{
background:#dc2626;
color:#fff;
border-color:#dc2626
}

.analysis-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.bar{
height:10px;
background:#e2e8f0;
border-radius:20px;
overflow:hidden
}

.bar i{
display:block;
height:100%;
background:linear-gradient(90deg,#075985,#0ea5e9)
}

@media(max-width:800px){
.cards{grid-template-columns:repeat(2,1fr)}
.grid{grid-template-columns:repeat(2,1fr)}
.analysis-grid{grid-template-columns:1fr}
}

@media(max-width:480px){
.app{padding:8px}
.cards{grid-template-columns:repeat(2,1fr);gap:8px}
.stat{padding:12px}
.stat .value{font-size:19px}
.grid{grid-template-columns:repeat(2,1fr);gap:8px}
.feature{min-height:105px;padding:10px}
.two{grid-template-columns:1fr}
.group-tabs{gap:7px}
.group-tab{padding:12px}
.group-name{font-size:14px}
.group-count{font-size:18px}
.table th,.table td{
font-size:12px;
padding:7px
}
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="login" class="login">
<div class="login-card">

<img id="loginLogo" class="logo" alt="Academy">

<h1 id="academyTitle">
Arul Siragugal Academy
</h1>

<p>Student Management System</p>

<div id="loading"
class="notice"
style="display:none;text-align:center">
⏳ Google Sheets data loading...
</div>

<div class="roles">

<button id="rAdmin"
onclick="setRole('admin')">
👑 Admin
</button>

<button id="rTeacher"
class="active"
onclick="setRole('teacher')">
👨‍🏫 Teacher
</button>

<button id="rStudent"
onclick="setRole('student')">
👨‍🎓 Student
</button>

</div>

<div id="adminLogin" class="hidden">

<label>Admin ID</label>
<input id="adminId">

<label>Password</label>
<input id="adminPass" type="password">

<button
class="btn"
style="width:100%;margin-top:14px"
onclick="loginAdmin()">
Login
</button>

</div>

<div id="teacherLogin">

<label>Teacher ID</label>
<input id="teacherId">

<label>Password</label>
<input id="teacherPass" type="password">

<button
class="btn"
style="width:100%;margin-top:14px"
onclick="loginTeacher()">
Login
</button>

</div>

<div id="studentLogin" class="hidden">

<label>Student ID</label>
<input id="studentId">

<label>Password</label>
<input id="studentPass" type="password">

<button
class="btn"
style="width:100%;margin-top:14px"
onclick="loginStudent()">
Login
</button>

</div>

<div id="loginMsg" class="msg"></div>

</div>
</div>


<!-- APP -->

<div id="app" class="app hidden">

<div class="topbar">

<div class="brand">

<img id="brandLogo">

<div>

<h2 id="pageTitle">
Dashboard
</h2>

<small id="welcome"></small>

</div>

</div>

<div class="top-actions">

<span id="syncStatus" class="sync"></span>

<button
id="homeBtn"
class="btn light"
onclick="home()">
🏠 Home
</button>

<button
id="syncBtn"
class="btn green"
onclick="syncSheets()">
☁️ Sync
</button>

<button
class="btn red"
onclick="logout()">
🚪 Exit
</button>

</div>

</div>

<main id="content"></main>

</div>


<!-- MODAL -->

<div id="modal" class="modal hidden">

<div class="modal-box">

<div class="modal-head">

<h3 id="modalTitle" style="margin:0">
Form
</h3>

<button
class="btn light"
onclick="closeModal()">
✕
</button>

</div>

<div id="modalBody"></div>

</div>

</div>


<script>

const SHEETS_URL=
'https://script.google.com/macros/s/AKfycbzMAFuKPsGXWJonYqIyqxvNvjLTXG-bUjcbVXEAdulKyh6iuxX7czDZ7CgyE3eybE8/exec';

let db={
settings:{
academy:'Arul Siragugal Academy',
teacher:'Teacher',
mobile:'',
fee:1000,
logo:'',
upi:'',
whatsappGroup:'',
teacherId:'teacher',
teacherPass:'1234',
adminId:'admin',
adminPass:'admin123',
sheetsUrl:SHEETS_URL,

messages:{
fee:'வணக்கம் {student}, உங்கள் {academy} மாத கட்டணம் ₹{amount} நிலுவையில் உள்ளது. தேதி: {date}.',

absent:'வணக்கம் {student}, இன்று {academy} வகுப்பிற்கு வரவில்லை. தேதி: {date}.'
}

},

students:[],
archivedStudents:[],
attendance:[],
fees:[],
marks:[],
onlineMarks:[],
tests:[],
expenses:[],
teachers:[]
};

let role='teacher';
let currentStudent=null;
let currentGroup='LKG-5';
let loaded=false;

const $=id=>document.getElementById(id);

const esc=s=>
String(s??'')
.replace(/[&<>"']/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m]));

const today=()=>
new Date().toISOString().slice(0,10);

const monthNow=()=>
today().slice(0,7);

const money=n=>
'₹'+Number(n||0).toLocaleString('en-IN');


function classBand(c){

let x=String(c||'')
.trim()
.toLowerCase();

if(/^lkg|^ukg/.test(x))
return'LKG-5';

let m=x.match(/\d+/);

if(m){

let n=+m[0];

if(n>=1&&n<=5)
return'LKG-5';

if(n>=6&&n<=8)
return'6-8';

}

return'Other';

}


function groupLabel(g){

return g==='6-8'
?'6 – 8'
:'LKG – 5';

}


function setSyncStatus(t){

$('syncStatus').textContent=
t==='syncing'
?'⏳ Syncing…'
:t==='ok'
?'✅ Synced'
:'⚠️ Sync error';

}


function setRole(r){

role=r;

['admin','teacher','student']
.forEach(x=>{

let id=
x==='admin'
?'rAdmin'
:x==='teacher'
?'rTeacher'
:'rStudent';

$(id).classList.toggle(
'active',
x===r
);

});

$('adminLogin')
.classList.toggle(
'hidden',
r!=='admin'
);

$('teacherLogin')
.classList.toggle(
'hidden',
r!=='teacher'
);

$('studentLogin')
.classList.toggle(
'hidden',
r!=='student'
);

$('loginMsg').textContent='';

}


function loginAdmin(){

let id=$('adminId').value.trim();
let pass=$('adminPass').value;

if(
id===db.settings.adminId &&
pass===db.settings.adminPass
){

role='admin';

$('login').classList.add('hidden');
$('app').classList.remove('hidden');

$('welcome').textContent=
'👑 Admin — Full Control';

home();

}else{

$('loginMsg').textContent=
'Invalid Admin ID / Password';

}

}


function loginTeacher(){

let id=$('teacherId').value.trim();
let pass=$('teacherPass').value;

if(
id===db.settings.teacherId &&
pass===db.settings.teacherPass
){

role='teacher';

$('login').classList.add('hidden');
$('app').classList.remove('hidden');

$('welcome').textContent=
'👨‍🏫 Teacher Portal';

home();

}else{

$('loginMsg').textContent=
'Invalid Teacher ID / Password';

}

}


function loginStudent(){

let id=$('studentId').value.trim();
let pass=$('studentPass').value;

let s=db.students.find(x=>
x.id===id &&
x.password===pass
);

if(!s){

$('loginMsg').textContent=
'Invalid Student ID / Password';

return;

}

currentStudent=s;
role='student';

$('login').classList.add('hidden');
$('app').classList.remove('hidden');

$('welcome').textContent=
'👨‍🎓 '+s.name;

studentHome();

}


function logout(){

currentStudent=null;

$('app').classList.add('hidden');
$('login').classList.remove('hidden');

setRole('teacher');

}


function groupStudents(){

if(role==='student'&&currentStudent)
return [currentStudent];

return db.students.filter(
s=>classBand(s.class)===currentGroup
);

}


function home(){

if(role==='student'){

studentHome();
return;

}

$('pageTitle').textContent=
role==='admin'
?'Admin Dashboard'
:'Teacher Dashboard';

let ss=groupStudents();

let m=monthNow();

let paid=ss.reduce(
(a,s)=>a+calcPaid(s.id,m),0
);

let pending=ss.reduce(
(a,s)=>a+calcPending(s.id,m),0
);

let present=db.attendance.filter(
x=>
x.date===today() &&
ss.some(s=>s.id===x.studentId) &&
x.status==='Present'
).length;

let absent=db.attendance.filter(
x=>
x.date===today() &&
ss.some(s=>s.id===x.studentId) &&
x.status==='Absent'
).length;


$('content').innerHTML=`

<div class="group-tabs">

<button
class="group-tab ${currentGroup==='LKG-5'?'active':''}"
onclick="switchGroup('LKG-5')">

<div>
<div class="group-name">
📚 LKG – 5
</div>

<div class="group-sub">
LKG, UKG, 1 – 5
</div>

</div>

<div class="group-count">
${db.students.filter(s=>classBand(s.class)==='LKG-5').length}
</div>

</button>


<button
class="group-tab ${currentGroup==='6-8'?'active':''}"
onclick="switchGroup('6-8')">

<div>

<div class="group-name">
📘 6 – 8
</div>

<div class="group-sub">
6, 7, 8 Classes
</div>

</div>

<div class="group-count">
${db.students.filter(s=>classBand(s.class)==='6-8').length}
</div>

</button>

</div>


<div class="cards">

<div class="stat">
<div class="label">Total Students</div>
<div class="value">${ss.length}</div>
</div>

<div class="stat">
<div class="label">Present Today</div>
<div class="value success">${present}</div>
</div>

<div class="stat">
<div class="label">Absent Today</div>
<div class="value danger">${absent}</div>
</div>

<div class="stat">
<div class="label">Pending Fees</div>
<div class="value danger">${money(pending)}</div>
</div>

</div>


<div class="grid">

<div class="card feature"
onclick="studentsPage()">

<div class="icon">👨‍🎓</div>
<b>Students</b>
<small>Add / Remove / Edit / Call</small>

</div>


<div class="card feature"
onclick="attendancePage()">

<div class="icon">📅</div>
<b>Attendance</b>
<small>Date-wise / Class-wise</small>

</div>


<div class="card feature"
onclick="feesPage()">

<div class="icon">💰</div>
<b>Fees</b>
<small>Paid / Pending / History</small>

</div>


<div class="card feature"
onclick="marksPage()">

<div class="icon">📝</div>
<b>Marks</b>
<small>Month-wise Marks</small>

</div>


<div class="card feature"
onclick="onlineTestPage()">

<div class="icon">🧪</div>
<b>Online Test</b>
<small>Post / Edit / Student Submit</small>

</div>


<div class="card feature"
onclick="reportsPage()">

<div class="icon">📄</div>
<b>Reports</b>
<small>Student PDF</small>

</div>


${role==='admin'?`

<div class="card feature"
onclick="financePage()">

<div class="icon">📊</div>
<b>Income Analysis</b>
<small>Month / Year / Fees</small>

</div>


<div class="card feature"
onclick="settingsPage()">

<div class="icon">⚙️</div>
<b>Settings</b>
<small>Admin Control</small>

</div>

`:''}

</div>
`;

}


function switchGroup(g){

currentGroup=g;
home();

}


function save(){

syncSheets();

}


function loadSheets(){

$('loading').style.display='block';

fetch(
SHEETS_URL+'?action=getData',
{
method:'GET'
}
)
.then(r=>r.json())
.then(data=>{

if(data&&data.db){

db={
...db,
...data.db
};

}

loaded=true;

$('loading').style.display='none';

applySettings();

})
.catch(err=>{

console.log(err);

$('loading').style.display='none';

});

}


function syncSheets(){

setSyncStatus('syncing');

fetch(
SHEETS_URL,
{
method:'POST',
headers:{
'Content-Type':'text/plain;charset=utf-8'
},
body:JSON.stringify({
action:'saveData',
db:db
})
}
)
.then(r=>r.text())
.then(()=>{

setSyncStatus('ok');

})
.catch(err=>{

console.log(err);

setSyncStatus('error');

});

}


function applySettings(){

$('academyTitle').textContent=
db.settings.academy;

$('pageTitle').textContent=
db.settings.academy;

$('loginLogo').src=
db.settings.logo||'';

$('brandLogo').src=
db.settings.logo||'';

}


function openModal(title,body){

$('modalTitle').textContent=title;
$('modalBody').innerHTML=body;
$('modal').classList.remove('hidden');

}


function closeModal(){

$('modal').classList.add('hidden');

}


function studentsPage(){

let ss=groupStudents();

$('content').innerHTML=`

<div class="card">

<div class="toolbar">

<div>
<label>Search Student</label>
<input
id="studentSearch"
placeholder="Name / ID"
oninput="renderStudents()">
</div>

<button
class="btn"
onclick="studentForm()">
➕ Add Student
</button>

</div>

<div id="studentList"></div>

</div>
`;

renderStudents();

}


function renderStudents(){

let q=($('studentSearch')?.value||'')
.toLowerCase();

let ss=groupStudents().filter(s=>
s.name.toLowerCase().includes(q)||
s.id.toLowerCase().includes(q)
);

$('studentList').innerHTML=`

<div class="table-wrap">

<table class="table">

<tr>
<th>#</th>
<th>Name</th>
<th>ID</th>
<th>Class</th>
<th>Mobile</th>
<th>Fee</th>
<th>Action</th>
</tr>

${ss.map((s,i)=>`

<tr>

<td>${i+1}</td>

<td>
<b>${esc(s.name)}</b>
</td>

<td>${esc(s.id)}</td>

<td>${esc(s.class)}</td>

<td>
${s.mobile||'-'}
</td>

<td>
${money(s.monthlyFee)}
</td>

<td>

${s.mobile?`
<a
class="btn green"
href="tel:${esc(s.mobile)}">
📞 Call
</a>
`:''}

<button
class="btn light"
onclick="studentDetails('${esc(s.id)}')">
View
</button>

<button
class="btn light"

function markAtt(id,date,status){

db.attendance=db.attendance.filter(
a=>!(
a.studentId===id &&

);

});

function waPhone(p){

let n=String(p||'')
.replace(/\D/g,'');

return n.length===10
?'91'+n
:n;

}


function fillAbsent(s){

return db.settings.messages.absent

.replaceAll('{student}',s.name)

.replaceAll(
'{academy}',
db.settings.academy
)

.replaceAll(
'{date}',
new Date().toLocaleDateString('en-IN')
);

}


function calcPaid(id,m){

return db.fees
.filter(
x=>
x.studentId===id &&
x.date.startsWith(m)
)
.reduce(
(a,x)=>
a+Number(x.amount||0),
0
);

}


function calcExtra(id,m){

return db.fees
.filter(
x=>
x.studentId===id &&
x.date.startsWith(m) &&
x.type==='Extra'
)
.reduce(
(a,x)=>
a+Number(x.extraAmount||0),
0
);

}


function calcPending(id,m){

let s=db.students.find(
x=>x.id===id
);

if(!s)return 0;

let expected=
Number(s.monthlyFee||0)+
calcExtra(id,m);

return Math.max(
0,
expected-calcPaid(id,m)
);

}
