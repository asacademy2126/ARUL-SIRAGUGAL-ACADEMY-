function normalize(d){

// Loads a URL via a <script> tag instead of fetch(). Script tags are never subject to
// CORS, which sidesteps Apps Script's unreliable cross-origin fetch() behavior entirely.
// The Apps Script side must support ?callback=name (see Code.gs doGet).

/* =========================
   SUPABASE-ONLY DATA LAYER
   =========================
   The existing UI still uses the same in-memory `db` object.
   Supabase table `app_state` is the single source of truth.
   No localStorage and no Google Apps Script are used.
*/
const SUPABASE_STATE_ID = 1;
const SUPABASE_HISTORY_LIMIT = 50;
const SUPABASE_HEADERS = {
  'apikey': SUPABASE_PUBLISHABLE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_PUBLISHABLE_KEY,
  'Content-Type': 'application/json'
};

// IMPORTANT: Supabase DATABASE only. No Supabase Storage and no browser/localStorage cache.
// app_state = current live data. app_state_history = automatic database backup before every overwrite.
let supabaseSaveChain = Promise.resolve();
let supabaseRetryTimer = null;
let supabaseLastRemoteUpdatedAt = '';

async function supabaseRequest(path, options={}, retry=3){
  try{
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
      ...options,
      headers:{...SUPABASE_HEADERS, ...(options.headers||{})},
      cache:'no-store'
    });
    const txt = await res.text();
    let body = null;
    try { body = txt ? JSON.parse(txt) : null; } catch(e) { body = txt; }
    if(!res.ok){
      const msg = body?.message || body?.hint || body?.details || body?.error || txt || ('HTTP '+res.status);
      const err = new Error(msg); err.status=res.status;
      if(retry>0 && (res.status>=500 || res.status===429)){
        await new Promise(r=>setTimeout(r,(4-retry)*1000));
        return supabaseRequest(path,options,retry-1);
      }
      throw err;
    }
    return body;
  }catch(e){
    if(retry>0 && (e?.name==='TypeError' || /network|fetch|failed|offline/i.test(String(e?.message||'')))){
      await new Promise(r=>setTimeout(r,(4-retry)*1000));
      return supabaseRequest(path,options,retry-1);
    }
    throw e;
  }
}

function safeSnapshot(obj){
  return JSON.parse(JSON.stringify(obj));
}

async function backupCurrentRemote(remoteData, remoteUpdatedAt){
  if(!remoteData || typeof remoteData!=='object') return;
  try{
    await supabaseRequest('app_state_history',{
      method:'POST',
      headers:{'Prefer':'return=minimal'},
      body:JSON.stringify({
        state_id:SUPABASE_STATE_ID,
        data:safeSnapshot(remoteData),
        source_updated_at:remoteUpdatedAt || null,
        saved_at:new Date().toISOString()
      })
    });
  }catch(e){
    // Never overwrite the live database if the safety backup failed.
    throw new Error('Database backup failed. Current data was NOT overwritten. '+(e?.message||e));
  }
}

async function getSupabaseData(){
  const rows = await supabaseRequest(
    'app_state?id=eq.'+SUPABASE_STATE_ID+'&select=id,data,updated_at',
    {method:'GET',headers:{'Accept':'application/json'}}
  );
  if(!Array.isArray(rows) || !rows.length){
    // Fresh Supabase database only. No Google Sheet import.
    await saveSupabaseState(true, true);
    return db;
  }
  const remote = rows[0]?.data;
  if(!remote || typeof remote!=='object') throw new Error('Supabase app_state.data is empty or invalid');
  supabaseLastRemoteUpdatedAt = rows[0]?.updated_at || '';
  normalize(remote);
  return db;
}

async function saveSupabaseState(silent=true, firstRun=false){
  // Serialize writes so two fast saves cannot race each other.
  return supabaseSaveChain = supabaseSaveChain.then(async()=>{
    const snapshot = safeSnapshot(db);
    const now = new Date().toISOString();

    // Read the live row immediately before writing. This prevents an old browser tab
    // from blindly replacing newer data from another device.
    let liveRows=[];
    try{
      liveRows = await supabaseRequest(
        'app_state?id=eq.'+SUPABASE_STATE_ID+'&select=id,data,updated_at',
        {method:'GET',headers:{'Accept':'application/json'}}
      );
    }catch(e){
      throw new Error('Supabase read check failed. Data was NOT overwritten. '+(e?.message||e));
    }

    const live = Array.isArray(liveRows) && liveRows.length ? liveRows[0] : null;

    // If another device changed the database after our last load, do NOT overwrite it.
    // Refresh the app instead; the old local state remains only in memory until refreshed.
    if(live && !firstRun && supabaseLastRemoteUpdatedAt &&
       live.updated_at && live.updated_at !== supabaseLastRemoteUpdatedAt){
      normalize(live.data);
      supabaseLastRemoteUpdatedAt=live.updated_at;
      pendingWrite=false;
      setSyncStatus('ok');
      setSyncTime(live.updated_at);
      throw new Error('Another device updated the database. Latest Supabase data was loaded; please make your change again.');
    }

    // Safety backup in DATABASE before every overwrite. No Storage bucket is used.
    if(live && live.data && typeof live.data==='object' && !firstRun){
      await backupCurrentRemote(live.data, live.updated_at);
    }

    await supabaseRequest('app_state?on_conflict=id',{
      method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify({id:SUPABASE_STATE_ID,data:snapshot,updated_at:now})
    });

    db.settings = db.settings || {};
    db.settings.lastSyncAt = now;
    supabaseLastRemoteUpdatedAt = now;
    setSyncTime(now);
    pendingWrite=false;
    syncFailCount=0;
    setSyncStatus('ok');
    if(!silent) alert('✅ Supabase Database saved successfully.');
    return true;
  }).catch(e=>{ throw e; });
}

let sheetsLoadingPromise=null;
async function loadSheets(){
  if(sheetsLoadingPromise) return sheetsLoadingPromise;
  sheetsLoadingPromise=(async()=>{
    setSyncStatus('syncing');
    const loading=$('loading');
    if(loading){loading.style.display='block';loading.textContent='⏳ Supabase Database loading...';}
    try{
      await getSupabaseData();
      loaded=true;
      setSyncStatus('ok');
      if(loading){loading.textContent='✅ Supabase Database connected';setTimeout(()=>{loading.style.display='none'},350);}
      return true;
    }catch(e){
      setSyncStatus('error');
      if(loading){loading.textContent='⚠️ Supabase error: '+(e?.message||e);loading.style.display='block';}
      console.error('Supabase load error:',e);
      return false;
    }
  })();
  try{return await sheetsLoadingPromise;}finally{sheetsLoadingPromise=null;}
}

let syncInProgress=false;

let syncTimer=null;
async function syncSheets(silent=false){
  if(!loaded){
    const ok=await loadSheets();
    if(!ok){scheduleSupabaseRetry();if(!silent)alert('Supabase Database இன்னும் load ஆகவில்லை.');return false;}
  }
  if(syncInProgress){resyncNeeded=true;return true;}
  syncInProgress=true;
  setSyncStatus('syncing');
  try{
    let ok=true;
    do{
      resyncNeeded=false;
      ok=await saveSupabaseState(silent);
    }while(ok && resyncNeeded);
    return ok;
  }catch(e){
    syncFailCount++;
    setSyncStatus('error');
    console.error('Supabase save error:',e);
    scheduleSupabaseRetry();
    if(!silent)alert('❌ Supabase save failed: '+(e?.message||e));
    return false;
  }finally{syncInProgress=false;}
}

function scheduleSupabaseRetry(){
  clearTimeout(supabaseRetryTimer);
  if(!pendingWrite || !navigator.onLine) return;
  const delay=Math.min(30000,Math.max(2000,2000*Math.pow(2,Math.min(syncFailCount,4))));
  supabaseRetryTimer=setTimeout(()=>{if(pendingWrite && navigator.onLine)syncSheets(true);},delay);
}

function save(){
  pendingWrite=true;
  setSyncStatus('dirty');
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>syncSheets(true),300);
}

window.addEventListener('online',()=>{if(pendingWrite)syncSheets(true);else loadSheets();});
window.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    if(pendingWrite) syncSheets(true); else if(loaded) loadSheets();
  }
});
window.addEventListener('beforeunload',(e)=>{
  if(pendingWrite){ e.preventDefault(); e.returnValue=''; }
});

    const d=new Date(y,mo-1+n,1); return d.toISOString().slice(0,7);
  }
  function monthsFromTo(a,b){

    while(x<=b&&guard++<240){out.push(x);x=monthAdd(x,1)}
