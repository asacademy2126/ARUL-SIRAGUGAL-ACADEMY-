function normalize(d){
  if(!d||typeof d!=='object')return false;
  if(d.success===false || d.error) return false;
  if(d.db&&typeof d.db==='object')d=d.db;
  else if(d.data&&typeof d.data==='object'&&!Array.isArray(d.data))d=d.data;
  else if(d.result&&typeof d.result==='object'&&!Array.isArray(d.result))d=d.result;

  const clean=(v,def='')=>v===undefined||v===null?def:String(v).trim();
  let incomingSettings=d.settings;
  if(Array.isArray(incomingSettings)) incomingSettings=incomingSettings[0]||{};
  if(typeof incomingSettings==='string'){try{incomingSettings=JSON.parse(incomingSettings)}catch(e){incomingSettings={}}}
  incomingSettings=incomingSettings&&typeof incomingSettings==='object'?incomingSettings:{};

  if(d.auth&&typeof d.auth==='object') incomingSettings={...incomingSettings,...d.auth};
  if(d.admin&&typeof d.admin==='object') incomingSettings={...incomingSettings,adminId:d.admin.id??d.admin.adminId,adminPass:d.admin.password??d.admin.adminPass};
  if(d.teacher&&typeof d.teacher==='object') incomingSettings={...incomingSettings,teacherId:d.teacher.id??d.teacher.teacherId,teacherPass:d.teacher.password??d.teacher.teacherPass,teacher:d.teacher.name??incomingSettings.teacher};
  ['adminId','adminPass','teacherId','teacherPass','academy','teacher','mobile','upi','whatsappGroup'].forEach(k=>{
    if(d[k]!==undefined && d[k]!==null) incomingSettings[k]=d[k];
  });

  db.students=(d.students||[]).map(s=>({...s,
    id:clean(s.id),name:clean(s.name),class:clean(s.class),mobile:clean(s.mobile),
    parent:clean(s.parent),address:clean(s.address),birthday:clean(s.birthday),
    password:clean(s.password,'1234'),monthlyFee:Number(s.monthlyFee)||0
  }));
  db.archivedStudents=Array.isArray(d.archivedStudents)?d.archivedStudents:[];
  db.attendance=(d.attendance||[]).map(x=>({...x,studentId:clean(x.studentId),date:clean(x.date),status:clean(x.status)}));
  db.fees=(d.fees||[]).map(x=>({...x,studentId:clean(x.studentId),date:clean(x.date),amount:Number(x.amount)||0,discount:Number(x.discount)||0,extraAmount:x.extraAmount===''||x.extraAmount==null?0:Number(x.extraAmount)||0,type:clean(x.type,'Payment')}));
  db.marks=(d.marks||[]).map((x,i)=>({...x,_id:clean(x._id,'M'+i+'_'+clean(x.date)),studentId:clean(x.studentId),date:clean(x.date)}));
  db.onlineMarks=(d.onlineMarks||[]).map((x,i)=>({...x,_id:clean(x._id,'OM'+i+'_'+clean(x.date)),studentId:clean(x.studentId)}));
  db.tests=(d.tests||[]).map((x,i)=>({...x,_id:clean(x._id,'T'+i+'_'+clean(x.date))}));

async function getSheetsData(){
  // Fast path: the deployed Apps Script normally responds to ?action=get.
  // Keep one fallback only so login does not wait through several sequential requests.
  const actions=['get','getData'];
  let last='';
  for(const action of actions){
    try{
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),9000);
      const r=await fetch(SHEETS_URL+'?action='+action+'&_='+Date.now(),{
        cache:'no-store',
        signal:controller.signal
      });
      clearTimeout(timer);
      const t=await r.text(); last=t;
      let d; try{d=JSON.parse(t)}catch(e){d=null}
      if(d && typeof d==='object' && normalize(d))return d;
    }catch(e){last=String(e)}
  }
  throw new Error(last.slice(0,250)||'No response');
}

let sheetsLoadingPromise=null;
async function loadSheets(){
  if(sheetsLoadingPromise)return sheetsLoadingPromise;
  sheetsLoadingPromise=(async()=>{
    setSyncStatus('syncing');
    $('loading').style.display='block';
    $('loading').textContent='⏳ Google Sheets data loading...';
    try{
      await getSheetsData();
      loaded=true;
      setSyncStatus('ok');
      $('loading').textContent='✅ Google Sheets connected';
      setTimeout(()=>{$('loading').style.display='none'},500);
    }catch(e){
      loaded=false;
      setSyncStatus('error');
      $('loading').textContent='❌ Google Sheets connection failed — check Apps Script deployment / URL';
      console.error(e);
    }finally{
      sheetsLoadingPromise=null;
    }
  })();
  return sheetsLoadingPromise;
}

let syncInProgress=false;
let syncTimer=null;
async function syncSheets(silent=false){
  if(!loaded){if(!silent)alert('Google Sheets data இன்னும் load ஆகவில்லை.');return false;}
  if(syncInProgress)return true;
  syncInProgress=true;
  setSyncStatus('syncing');

  const settingsSnapshot={
    academy:String(db.settings?.academy||''),
    teacher:String(db.settings?.teacher||''),
    mobile:String(db.settings?.mobile||''),
    fee:Number(db.settings?.fee||0),
    adminId:String(db.settings?.adminId||''),
    adminPass:String(db.settings?.adminPass||''),
    teacherId:String(db.settings?.teacherId||''),
    teacherPass:String(db.settings?.teacherPass||''),
    whatsappGroup:String(db.settings?.whatsappGroup||''),
    logo:String(db.settings?.logo||''),
    messages:{
      fee:String(db.settings?.messages?.fee||''),
      absent:String(db.settings?.messages?.absent||'')
    }
  };

  const payload={
    source:'Arul Siragugal Academy',
    syncedAt:new Date().toISOString(),
    settings:{...settingsSnapshot,sheetsUrl:SHEETS_URL},
    // Also expose settings at top-level for Apps Script versions that save flat keys.
    ...settingsSnapshot,
    students:db.students||[],
    archivedStudents:db.archivedStudents||[],
    attendance:db.attendance||[],
    fees:db.fees||[],
    marks:db.marks||[],
    onlineMarks:db.onlineMarks||[],
    tests:db.tests||[],
    expenses:db.expenses||[],
    extraIncome:db.extraIncome||[],
    auditLogs:db.auditLogs||[],
    teachers:(db.teachers||[]).map(t=>({...t,
      allowedClasses:Array.isArray(t.allowedClasses)?t.allowedClasses:t.allowedClasses||[],
      permissions:t.permissions||{},
      studentPermission:!!t.permissions?.students,
      studentsPermission:!!t.permissions?.students,
      attendancePermission:!!t.permissions?.attendance,
      feesPermission:!!t.permissions?.fees,
      marksPermission:!!t.permissions?.marks,
      onlineTestPermission:!!t.permissions?.onlineTests,
      permissionJson:JSON.stringify(t.permissions||{})
    }))
  };

  try{
    let frame=document.getElementById('asaSyncFrame');
    if(!frame){
      frame=document.createElement('iframe');
      frame.id='asaSyncFrame'; frame.name='asaSyncFrame';
      frame.style.display='none'; document.body.appendChild(frame);
    }
    let form=document.getElementById('asaSyncForm');
    if(!form){
      form=document.createElement('form');
      form.id='asaSyncForm'; form.method='POST'; form.target='asaSyncFrame';
      form.enctype='application/x-www-form-urlencoded';
      form.style.display='none'; document.body.appendChild(form);
    }
    form.action=SHEETS_URL;
    form.innerHTML='';
    const input=document.createElement('input');
    input.type='hidden'; input.name='payload'; input.value=JSON.stringify(payload);
    form.appendChild(input);
    form.submit();

    const now=new Date().toISOString();
    db.settings.lastSyncAt=now;
    setSyncTime(now);
    setSyncStatus('ok');
    if(!silent)alert('✅ Google Sheets sync request sent.');
    return true;
  }catch(e){
    setSyncStatus('error');
    if(!silent)alert('❌ Google Sheets Sync failed: '+e.message);
    return false;
  }finally{
    syncInProgress=false;
  }
}

  syncTimer=setTimeout(()=>syncSheets(true),80);
}

function studentDetails(id){let s=db.students.find(x=>x.id===id);if(!s)return;let m=monthNow();openModal('Student Profile',`<div class="card admin-profile-card"><h3>👨‍🎓 ${esc(s.name)}</h3><p><span class="profile-chip">ID ${esc(s.id)}</span> <span class="profile-chip">Class ${esc(s.class||'-')}</span></p><p>📱 Mobile: <b>${esc(s.mobile||'-')}</b></p><p>👪 Parent: <b>${esc(s.parent||'-')}</b></p><p>🏠 Address: <b>${esc(s.address||'-')}</b></p><p>💰 Monthly Tuition: <b>${money(s.monthlyFee)}</b></p>${s.mobile?`<p><a class="btn" href="tel:${esc(s.mobile)}">📞 Call</a> <a class="btn light" href="sms:${esc(s.mobile)}?body=${encodeURIComponent('Student '+s.name+' — '+db.settings.academy)}">✉️ SMS</a></p>`:''}${role==='admin'?`<hr><p>📅 ${m} — Paid: <b class="success">${money(calcPaid(s.id,m))}</b> &nbsp; Pending: <b class="danger">${money(calcPending(s.id,m))}</b></p>`:''}</div>`)}

function attendancePage(){let cls=[...new Set(groupStudents().map(s=>s.class).filter(Boolean))].sort();$('content').innerHTML=`<div class="card"><div class="toolbar"><div><label>Date</label><input id="attDate" type="date" value="${today()}" onchange="renderAtt()"></div><div><label>Class</label><select id="attClass" onchange="renderAtt()"><option value="">Select Class</option>${cls.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div></div><div id="attBox"></div></div><div class="card"><div class="wa-box"><h3 style="margin-top:0">📲 Absent WhatsApp Group</h3><div class="muted">Selected date / class absent students-ஐ ஒரே click-ல் WhatsApp Group-க்கு அனுப்பலாம்.</div><button class="btn green" style="margin-top:10px" onclick="shareAbsentToGroup()">📲 Send All Absent Details to Group</button><button class="btn light" style="margin-top:10px" onclick="copyAbsentDetails()">📋 Copy Absent Details</button></div><div class="card"><h3>Absent Reminder — selected date/class</h3><div id="absentBox"></div></div></div>`;renderAtt()}
function absentRowsForSelection(){const d=$('attDate')?.value||today(),c=$('attClass')?.value||'';return db.students.filter(s=>teacherCanClass(s.class)&&(!c||String(s.class)===c)&&db.attendance.some(a=>a.studentId===s.id&&a.date===d&&a.status==='Absent')).map(s=>({s,date:d}));}
window.copyAbsentDetails=function(){const rows=absentRowsForSelection();if(!rows.length)return alert('இந்த date/class-ல் absent students இல்லை.');const d=rows[0].date,c=$('attClass')?.value||'All Classes';const text=`${db.settings.academy}\n📅 Absent Details — ${d}\n🏫 Class: ${c}\n\n`+rows.map((x,i)=>`${i+1}. ${x.s.name} — ${x.s.class}${x.s.mobile?' — '+x.s.mobile:''}`).join('\n');navigator.clipboard?.writeText(text);return text};
window.shareAbsentToGroup=function(){const link=(db.settings.whatsappGroup||'').trim();if(!link)return alert('Settings → WhatsApp Group Link add செய்யவும்.');const text=copyAbsentDetails();if(!text)return;window.open(link,'_blank');setTimeout(()=>alert('✅ Absent details copied. WhatsApp Group open செய்யப்பட்டுவிட்டது. Group-ல் Paste செய்து Send செய்யவும்.'),300);};
function renderAtt(){let d=$('attDate').value,c=$('attClass').value,ss=groupStudents().filter(s=>!c||s.class===c),existing={};db.attendance.filter(a=>a.date===d).forEach(a=>existing[a.studentId]=a.status);$('attBox').innerHTML=`<div class="table-wrap"><table class="table"><tr><th>#</th><th>Student</th><th>Class</th><th>P / A</th><th>Status</th><th>Last Update</th></tr>${ss.map((s,i)=>{let st=existing[s.id]||'';return `<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${esc(s.class)}</td><td><div class="p-a"><button class="p ${st==='Present'?'active':''}" onclick="markAtt('${esc(s.id)}','${d}','Present')">✓ P</button><button class="a ${st==='Absent'?'active':''}" onclick="markAtt('${esc(s.id)}','${d}','Absent')">✕ A</button></div></td><td><span class="badge ${st==='Present'?'ok':st==='Absent'?'pending':'info'}">${st||'Not Marked'}</span></td><td>${esc((db.attendance.find(a=>a.studentId===s.id&&a.date===d)||{}).teacherName||'-')}</td></tr>`}).join('')||'<tr><td colspan="6">Students இல்லை.</td></tr>'}</table></div>`;let abs=ss.filter(s=>existing[s.id]==='Absent');$('absentBox').innerHTML=abs.map(s=>`<div class="notice"><b>${esc(s.name)}</b> — ${esc(s.class)} ${s.mobile?`<a class="btn light" href="https://wa.me/${waPhone(s.mobile)}?text=${encodeURIComponent(fillAbsent(s))}" target="_blank">💬 WhatsApp Reminder</a> <a class="btn light" href="sms:${esc(s.mobile)}?body=${encodeURIComponent(fillAbsent(s))}" target="_blank">💬 SMS Reminder</a>`:''}</div>`).join('')||'<span class="muted">Absent students இல்லை.</span>'}
function markAtt(id,date,status){if(role==='teacher'&&currentTeacher?.permissions?.attendance===false)return alert('Attendance permission இல்லை');if(!teacherCanClass(db.students.find(s=>s.id===id)?.class))return alert('இந்த class-க்கு Teacher permission இல்லை');db.attendance=db.attendance.filter(a=>!(a.studentId===id&&a.date===date));const actor=role==='admin'?'Admin':(currentTeacher?.name||'Teacher'), actorId=role==='admin'?'admin':(currentTeacher?.id||''); db.attendance.push({studentId:id,date,status,enteredBy:actor,teacherId:actorId,teacherName:actor,updatedAt:new Date().toISOString(),lastUpdatedBy:actor}); addAudit('Attendance','Save',id,`${status} • ${date}`);renderAtt();save()}
function waPhone(p){let n=String(p||'').replace(/\D/g,'');return n.length===10?'91'+n:n}
function fillAbsent(s){return db.settings.messages.absent.replaceAll('{student}',s.name).replaceAll('{academy}',db.settings.academy).replaceAll('{date}',new Date().toLocaleDateString('en-IN'))}

function feesPage(){
  let m=monthNow(),cls=[...new Set(groupStudents().map(s=>s.class).filter(Boolean))].sort();
  $('content').innerHTML=`<div class="card">
    <div class="toolbar">
      <div><label>Month</label><input id="feeMonth" type="month" value="${m}" onchange="renderFees()"></div>
      <div><label>Class</label><select id="feeClass" onchange="renderFees()"><option value="">All Classes</option>${cls.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
      <button class="btn" onclick="feeForm()">➕ Add Payment</button>
      <button class="btn amber" onclick="extraForm()">➕ Extra Fee</button>
    </div>
    <div id="feeBox"></div>
  </div>`;
  renderFees();
}

function renderFees(){
  let m=$('feeMonth').value,c=$('feeClass').value;
  let ss=groupStudents().filter(s=>!c||s.class===c);
  let pendingStudents=ss.filter(s=>calcTotalPending(s.id,m)>0);
  let totalPending=pendingStudents.reduce((a,s)=>a+calcTotalPending(s.id,m),0);

  $('feeBox').innerHTML=`
    <div class="cards">
      <div class="stat"><div class="label">Students</div><div class="value">${ss.length}</div></div>
      <div class="stat stat-click" onclick="showFeePendingStudents()"><div class="label">Pending Students</div><div class="value danger">${pendingStudents.length}</div></div>
      <div class="stat stat-click" onclick="showFeePendingStudents()"><div class="label">Total Pending</div><div class="value danger">${money(totalPending)}</div></div>
    </div>

    <div class="card fee-compact-card">
      <h3 style="margin-top:0">💰 Fee Details — ${m}</h3>
      <div class="notice mini">Student name-ஐ click செய்தால் Tuition Fee + Extra Fee + Total Pending details வரும்.</div>
      <div class="table-wrap"><table class="table">
        <tr><th>Student</th><th>Class</th><th>Total Pending</th></tr>
        ${ss.map(s=>{
          const pen=calcTotalPending(s.id,m);
          return `<tr onclick="studentFeeDetails('${esc(s.id)}','${m}')" style="cursor:pointer">
            <td><button class="btn light" onclick="event.stopPropagation();studentFeeDetails('${esc(s.id)}','${m}')">${esc(s.name)}</button></td>
            <td>${esc(s.class||'-')}</td>
            <td><span class="badge ${pen?'pending':'ok'}">${money(pen)}</span></td>
          </tr>`;
        }).join('')||'<tr><td colspan="3">Students இல்லை.</td></tr>'}
      </table></div>
    </div>

    <div class="card fee-reminder-card">
      <div class="section-title"><span>📲</span><div><h3 style="margin:0">Fee Reminder</h3><small class="muted">Attendance-ல் Absent Reminder இருப்பது போல Fees-க்கு தனி Reminder</small></div></div>
      <div id="feeReminderBox"></div>
    </div>`;
  renderFeeReminders();
}

function renderFeeReminders(){
  const m=$('feeMonth')?.value||monthNow(),c=$('feeClass')?.value||'';
  const rows=groupStudents().filter(s=>(!c||String(s.class)===c)&&calcTotalPending(s.id,m)>0);
  const box=$('feeReminderBox'); if(!box)return;
  box.innerHTML=rows.map(s=>{
    const tuitionPending=calcPending(s.id,m),extraPending=calcExtraPending(s.id,m),totalPending=tuitionPending+extraPending;
    return `<div class="notice fee-reminder-row">
      <div><b>${esc(s.name)}</b> — ${esc(s.class||'-')}<br><small class="danger">Tuition: ${money(tuitionPending)} • Extra: ${money(extraPending)} • Total: ${money(totalPending)}</small></div>
      <div class="p-a">
        ${s.mobile?`<a class="btn light" target="_blank" href="https://wa.me/${waPhone(s.mobile)}?text=${encodeURIComponent(fillFee(s,tuitionPending,extraPending))}">💬 WhatsApp</a><a class="btn light" target="_blank" href="sms:${esc(s.mobile)}?body=${encodeURIComponent(fillFee(s,tuitionPending,extraPending))}">💬 SMS</a>`:'<span class="muted mini">Mobile இல்லை</span>'}
        <button class="btn light" onclick="studentFeeDetails('${esc(s.id)}','${m}')">Details</button>
      </div>
    </div>`;
  }).join('')||'<span class="muted">இந்த month-க்கு pending fee students இல்லை.</span>';
}

window.showFeePendingStudents=function(){
  const m=$('feeMonth')?.value||monthNow(),c=$('feeClass')?.value||'';
  const rows=groupStudents().filter(s=>(!c||String(s.class)===c)&&calcTotalPending(s.id,m)>0);
  const total=rows.reduce((a,s)=>a+calcTotalPending(s.id,m),0);
  openModal('💰 Pending Fee Students — '+m,`
    <div class="notice"><b>Pending Students: ${rows.length}</b><br>Total Pending (Tuition + Extra): <b class="danger">${money(total)}</b></div>
    <div class="table-wrap"><table class="table"><tr><th>Student</th><th>Class</th><th>Total Pending</th></tr>
    ${rows.map(s=>`<tr><td><button class="btn light" onclick="studentFeeDetails('${esc(s.id)}','${m}')">${esc(s.name)}</button></td><td>${esc(s.class||'-')}</td><td class="danger"><b>${money(calcTotalPending(s.id,m))}</b></td></tr>`).join('')||'<tr><td colspan="3">No pending students</td></tr>'}
    </table></div>`);
};

window.studentFeeDetails=function(id,m){
  const s=db.students.find(x=>String(x.id)===String(id));
  if(!s)return;
  m=m||monthNow();
  const paid=calcPaid(id,m),discount=calcDiscount(id,m),pending=calcPending(id,m);
  const extra=calcExtra(id,m),extraPaid=calcExtraPaid(id,m),extraPending=calcExtraPending(id,m),totalPending=pending+extraPending;
  const rows=db.fees.map((x,i)=>({...x,_i:i})).filter(x=>String(x.studentId)===String(id)&&String(x.date).startsWith(m)).slice().reverse();
  openModal('💰 Fee Details — '+s.name,`
    <div class="cards">
      <div class="stat"><div class="label">Tuition Pending</div><div class="value danger">${money(pending)}</div></div>
      <div class="stat"><div class="label">Extra Fee Pending</div><div class="value danger">${money(extraPending)}</div></div>
      <div class="stat"><div class="label">Total Pending</div><div class="value danger">${money(totalPending)}</div></div>
    </div>
    <div class="notice">
      <b>👨‍🎓 ${esc(s.name)}</b> — ${esc(s.class||'-')}<br>
      Monthly Fee: <b>${money(s.monthlyFee)}</b> &nbsp; Paid: <b class="success">${money(paid)}</b> &nbsp; Discount: <b>${money(discount)}</b> &nbsp; Tuition Pending: <b class="danger">${money(pending)}</b><br>
      Extra Fee Total: <b>${money(extra)}</b> &nbsp; Extra Paid: <b class="success">${money(extraPaid)}</b> &nbsp; Extra Pending: <b class="danger">${money(extraPending)}</b><br>
      <b>Total Pending (Tuition + Extra): <span class="danger">${money(totalPending)}</span></b>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
      ${totalPending&&s.mobile?`<a class="btn light" target="_blank" href="https://wa.me/${waPhone(s.mobile)}?text=${encodeURIComponent(fillFee(s,pending,extraPending))}">💬 Fee Reminder</a><a class="btn light" target="_blank" href="sms:${esc(s.mobile)}?body=${encodeURIComponent(fillFee(s,pending,extraPending))}">💬 SMS</a>`:''}
      ${pending?`<button class="btn green" onclick="closeModal();feeForm('${esc(s.id)}')">💳 Add Tuition Payment</button>`:''}${pending&&$('feeMonth')?.value?`<button class="btn amber" onclick="closeModal();transferPendingForm('${esc(s.id)}')">↗️ Transfer Pending</button>`:''}
      ${extraPending?`<button class="btn amber" onclick="closeModal();extraPaymentForm('${esc(s.id)}')">💳 Extra Payment</button>`:''}
    </div>
    <h4>📋 ${m} Fee History</h4>
    <div class="table-wrap"><table class="table"><tr><th>Date</th><th>Type</th><th>Purpose</th><th>Paid</th><th>Discount</th><th>Amount</th><th>Action</th></tr>
    ${rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.extraType||'Monthly Fee')}</td><td>${money(x.amount||0)}</td><td>${money(x.discount||0)}</td><td>${money((x.amount||0)+(x.extraAmount||0))}</td><td><button class="btn light" onclick="editFeeRecord(${x._i})">✏️ Edit</button><button class="btn red" onclick="deleteFeeRecord(${x._i},'${esc(id)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="7">No fee history</td></tr>'}
    </table></div>`);
};

function fillFee(s,tuitionPending=0,extraPending=0){let tp=Number(tuitionPending||0),ep=Number(extraPending||0),total=tp+ep;let msg=(db.settings.messages?.fee||'').replaceAll('{student}',s.name).replaceAll('{amount}',total).replaceAll('{tuitionPending}',tp).replaceAll('{extraPending}',ep).replaceAll('{totalPending}',total).replaceAll('{academy}',db.settings.academy).replaceAll('{date}',new Date().toLocaleDateString('en-IN'));if(!msg.includes('Tuition Pending')&&!msg.includes('{tuitionPending}'))msg+='\n\nTuition Fee Pending: ₹'+tp+'\nExtra Fee Pending: ₹'+ep+'\nTotal Pending: ₹'+total;return msg}
function feeForm(id=''){let m=$('feeMonth')?.value||monthNow();openModal('Record Tuition Fee Payment',`<label>Student</label><select id="feeStudent">${groupStudents().map(s=>`<option value="${esc(s.id)}" ${s.id===id?'selected':''}>${esc(s.name)} — ${esc(s.class)}</option>`).join('')}</select><div class="two"><div><label>Paid Tuition Amount</label><input id="feeAmount" type="number"></div><div><label>Discount Amount</label><input id="feeDiscount" type="number" value="0" min="0"></div></div><div class="notice mini">This payment is only for Tuition Fee. Extra Fees are separate.</div><label>Date</label><input id="feeDate" type="date" value="${today()}"><br><button class="btn green" style="width:100%" onclick="saveFee()">Save Tuition Payment</button>`)}
function saveFee(){if(role==='teacher'&&currentTeacher?.permissions?.fees===false)return alert('Fees permission இல்லை');let id=$('feeStudent').value,a=Number($('feeAmount').value),discount=Number($('feeDiscount').value)||0,d=$('feeDate').value;if(!id||a<0||discount<0||(a<=0&&discount<=0))return alert('Paid / Discount amount சரியாக கொடுக்கவும்');if(role==='teacher'&&!teacherCanStudent(id))return alert('இந்த student class-க்கு Teacher permission இல்லை.');let pendingBefore=calcPending(id,d.slice(0,7));if(a+discount>pendingBefore)return alert('Tuition Paid + Discount amount pending-ஐ விட அதிகமாக இருக்க முடியாது.');const actor=role==='admin'?'Admin':(currentTeacher?.name||'Teacher'), actorId=role==='admin'?'admin':(currentTeacher?.id||''); db.fees.push({studentId:id,amount:a,discount,extraAmount:0,date:d,type:'Payment',collectedBy:actor,teacherId:actorId,teacherName:actor,updatedAt:new Date().toISOString(),lastUpdatedBy:actor}); addAudit('Fees','Save',id,`Payment ₹${a} • ${d}`);closeModal();feesPage();save()}
function studentFeeHistory(id){let s=db.students.find(x=>x.id===id),rows=db.fees.map((x,i)=>({...x,_i:i})).filter(x=>x.studentId===id).slice().reverse();openModal('Fee History — '+(s?.name||id),`<div class="table-wrap"><table class="table"><tr><th>Date</th><th>Type</th><th>Purpose</th><th>Paid</th><th>Discount</th><th>Amount</th><th>Action</th></tr>${rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.extraType||'Monthly Fee')}</td><td>${money(x.amount||0)}</td><td>${money(x.discount||0)}</td><td>${money((x.amount||0)+(x.extraAmount||0))}</td><td><button class="btn light" onclick="editFeeRecord(${x._i})">✏️ Edit</button><button class="btn red" onclick="deleteFeeRecord(${x._i},'${esc(id)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="7">No fee history</td></tr>'}</table></div>`)}
function editFeeRecord(i){let x=db.fees[i];if(!x)return;openModal('Edit Fee',`<label>Date</label><input id="efDate" type="date" value="${esc(x.date)}"><label>Amount</label><input id="efAmount" type="number" value="${Number(x.amount||x.extraAmount||0)}"><label>Discount</label><input id="efDiscount" type="number" value="${Number(x.discount||0)}"><label>Type</label><select id="efType"><option ${x.type==='Payment'?'selected':''}>Payment</option><option ${x.type==='Extra'?'selected':''}>Extra</option></select><label>Purpose</label><input id="efPurpose" value="${esc(x.extraType||'')}"><br><button class="btn" style="width:100%" onclick="saveFeeEdit(${i})">Save Changes</button>`)}
function saveFeeEdit(i){if(role==='teacher'&&currentTeacher?.permissions?.fees===false)return alert('Fees permission இல்லை');let x=db.fees[i],a=Number($('efAmount').value);if(!a)return alert('Amount தேவை');let type=$('efType').value;const actor=role==='admin'?'Admin':(currentTeacher?.name||'Teacher');x.date=$('efDate').value;x.type=type;x.extraType=$('efPurpose').value;x.amount=type==='Payment'?a:0;x.discount=type==='Payment'?(Number($('efDiscount').value)||0):0;x.extraAmount=type==='Extra'?a:0;x.collectedBy=x.collectedBy||actor;x.teacherId=role==='admin'?'admin':(currentTeacher?.id||'');x.teacherName=actor;x.updatedAt=new Date().toISOString();x.lastUpdatedBy=actor;addAudit('Fees','Update',x.studentId,`${type} ₹${a} • ${x.date}`);closeModal();save();feesPage()}
function deleteFeeRecord(i,id){if(!confirm('Fee record delete செய்யவா?'))return;db.fees.splice(i,1);closeModal();save();setTimeout(()=>studentFeeHistory(id),200)}
function extraForm(){openModal('Extra Fee',`<label>Student</label><select id="exStudent">${groupStudents().map(s=>`<option value="${esc(s.id)}">${esc(s.name)} — ${esc(s.class)}</option>`).join('')}</select><label>Purpose</label><select id="exType"><option>Book</option><option>Pen</option><option>Notebook</option><option>Exam</option><option>Other</option></select><label>Amount</label><input id="exAmount" type="number"><label>Date</label><input id="exDate" type="date" value="${today()}"><br><button class="btn" style="width:100%" onclick="saveExtra()">Save Extra Fee</button>`)}
function extraPaymentForm(id=''){let m=$('feeMonth')?.value||monthNow(),s=db.students.find(x=>String(x.id)===String(id));if(!s)return;let pending=calcExtraPending(id,m);if(pending<=0)return alert('இந்த student-க்கு Extra Fee Pending இல்லை.');openModal('Record Extra Fee Payment',`<p><b>${esc(s.name)}</b> — Extra Fee Pending: <b class="danger">${money(pending)}</b></p><label>Paid Extra Fee</label><input id="extraPayAmount" type="number" min="0" max="${pending}" value="${pending}"><label>Date</label><input id="extraPayDate" type="date" value="${today()}"><div class="notice mini">Extra Fee payment Tuition Fee / Income-ல் சேராது. இது Extra Fee History-ல் மட்டும் வரும்.</div><br><button class="btn amber" style="width:100%" onclick="saveExtraPayment('${esc(id)}')">Save Extra Fee Payment</button>`)}

function renderTestsPage(){
  const month=$('testMonth')?.value||'';
  const date=$('testDate')?.value||'';
  const cls=$('testClass')?.value||'';
  let rows=db.tests.slice().reverse().filter(t=>!t.class||!currentGroup||classBand(t.class)===currentGroup);
  if(month) rows=rows.filter(t=>String(t.date||'').startsWith(month));
  if(date) rows=rows.filter(t=>String(t.date||'')===date);
  if(cls) rows=rows.filter(t=>String(t.class||'')===cls);
  window._filteredOnlineTests=rows;
  $('testSummary').innerHTML=`<div class="test-summary-card"><span>🧪</span><b>${rows.length}</b><small>Tests</small></div><div class="test-summary-card"><span>📅</span><b>${date||month||'All'}</b><small>Selected Period</small></div><div class="test-summary-card"><span>🏫</span><b>${cls||'All Classes'}</b><small>Class Filter</small></div>`;
  $('testsTableBox').innerHTML=`<div class="table-wrap"><table class="table test-table"><thead><tr><th>Date</th><th>Test</th><th>Class</th><th>Subject</th><th>Total</th><th>Link</th><th>Action</th></tr></thead><tbody>${rows.map((t,i)=>`<tr><td><span class="date-chip">${esc(t.date||'-')}</span></td><td><b>${esc(t.name||'-')}</b></td><td><span class="class-chip">${esc(t.class||'All')}</span></td><td>${esc(t.subject||'-')}</td><td><span class="mark-chip">${esc(t.total||0)}</span></td><td>${t.link?`<a class="btn light" href="${esc(t.link)}" target="_blank">🔗 Open</a>`:'-'}</td><td><button class="btn light" onclick="testForm('${esc(t._id||'')}')">✏️ Edit</button> <button class="btn red" onclick="deleteTest('${esc(t._id||'')}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty-row">🧪 No online tests for selected filter.</td></tr>'}</tbody></table></div>`;
}

    const type=$('adminClearType')?.value||'all';

    if(!from || !to){alert('Please select From Date and To Date.');return;}
    if(from>to){alert('From Date cannot be after To Date.');return;}

    const labels={attendance:'Attendance',fees:'Fees',marks:'Marks',onlineMarks:'Online Test Marks',auditLogs:'Teacher Activity',all:'All History'};
    const ok=confirm(`⚠️ ADMIN ONLY\n\nClear ${labels[type]} records from ${from} to ${to}?\n\nThis cannot be undone.`);
    if(!ok)return;

    const fields=type==='all'
      ? ['attendance','fees','marks','onlineMarks','auditLogs']
      : [type];

    let removed=0;

    fields.forEach(k=>{
      const arr=Array.isArray(db[k])?db[k]:[];
      const before=arr.length;
      db[k]=arr.filter(x=>{
        const raw=x.date||x.dateTime||x.createdAt||'';
        const d=String(raw).slice(0,10);
        return !(d && d>=from && d<=to);
      });
      removed += before-db[k].length;
    });

    db.auditLogs=Array.isArray(db.auditLogs)?db.auditLogs:[];
    db.auditLogs.push({
      action:'History Clear',
      module:'Admin History Clear',
      teacherId:'Admin',
      teacherName:'Admin',
      dateTime:new Date().toISOString(),
      recordId:'',
      details:`Cleared ${labels[type]} from ${from} to ${to}; removed ${removed} record(s)`
    });

    save();
    alert(`✅ History Clear completed\n\nType: ${labels[type]}\nPeriod: ${from} → ${to}\nRemoved: ${removed} record(s)`);
    adminHistoryClearPage();
  };

  window.financeYearPDF=function(){
    if(role!=='admin')return alert('Admin only');
    const selected=$('financeMonth')?.value||monthNow();
    const year=String(selected).slice(0,4)||String(new Date().getFullYear());
    const months=Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,'0')}`);
    const rows=months.map(m=>{
      const tuition=db.students.reduce((a,s)=>a+calcPaid(s.id,m),0);
      const extraIncome=db.extraIncome.filter(x=>String(x.date).startsWith(m)).reduce((a,x)=>a+Number(x.amount||0),0);
      const total=tuition+extraIncome;
      const expense=db.expenses.filter(x=>String(x.date).startsWith(m)).reduce((a,x)=>a+Number(x.amount||0),0);
      return {m,tuition,extraIncome,total,expense,net:total-expense};
    });
    const totals=rows.reduce((a,r)=>({tuition:a.tuition+r.tuition,extraIncome:a.extraIncome+r.extraIncome,total:a.total+r.total,expense:a.expense+r.expense,net:a.net+r.net}),{tuition:0,extraIncome:0,total:0,expense:0,net:0});
    pdf(`Year-wise Income Report — ${year}`,`<p><b>Year:</b> ${year}</p><h3>Monthly Income Summary</h3><table><tr><th>Month</th><th>Tuition Fees</th><th>Extra Income</th><th>Total Income</th><th>Expenditure</th><th>Net Finance</th></tr>${rows.map(r=>`<tr><td>${r.m}</td><td>${money(r.tuition)}</td><td>${money(r.extraIncome)}</td><td>${money(r.total)}</td><td>${money(r.expense)}</td><td>${money(r.net)}</td></tr>`).join('')}<tr><th>Year Total</th><th>${money(totals.tuition)}</th><th>${money(totals.extraIncome)}</th><th>${money(totals.total)}</th><th>${money(totals.expense)}</th><th>${money(totals.net)}</th></tr></table><p><b>Note:</b> Student Extra Fees are separate and are not included in Tuition Fees, Extra Income, Total Income or Net Finance.</p>`);
  };
  window.financePDF=function(){if(role!=='admin')return alert('Admin only');const m=$('financeMonth')?.value||monthNow(),c=$('financeClass')?.value||'All Classes',ss=db.students.filter(s=>!$('financeClass')?.value||String(s.class)===$('financeClass').value),tuition=ss.reduce((a,s)=>a+calcPaid(s.id,m),0),pending=ss.reduce((a,s)=>a+calcPending(s.id,m),0),tuitionTotal=ss.reduce((a,s)=>a+Number(s.monthlyFee||0),0),extraPaid=ss.reduce((a,s)=>a+calcExtraPaid(s.id,m),0),extraPending=ss.reduce((a,s)=>a+calcExtraPending(s.id,m),0),extraTotal=ss.reduce((a,s)=>a+calcExtra(s.id,m),0),extraIncome=db.extraIncome.filter(x=>String(x.date).startsWith(m)).reduce((a,x)=>a+Number(x.amount||0),0),expenses=db.expenses.filter(x=>String(x.date).startsWith(m)).reduce((a,x)=>a+Number(x.amount||0),0);pdf('Finance Report',`<p><b>Month:</b> ${m} &nbsp; <b>Class:</b> ${esc(c)}</p><h3>Finance Summary</h3><table><tr><th>Item</th><th>Amount</th></tr><tr><td>Tuition Fees</td><td>${money(tuition)}</td></tr><tr><td>Extra Income</td><td>${money(extraIncome)}</td></tr><tr><th>Total Income</th><th>${money(tuition+extraIncome)}</th></tr><tr><td>Expenditure</td><td>${money(expenses)}</td></tr><tr><th>Net Finance</th><th>${money(tuition+extraIncome-expenses)}</th></tr></table><h3>Class-wise Tuition + Extra Fees (Separate)</h3><table><tr><th>Class</th><th>Students</th><th>Tuition Paid</th><th>Tuition Pending</th><th>Tuition Total</th><th>Extra Paid</th><th>Extra Pending</th><th>Extra Total</th></tr>${[...new Set(ss.map(s=>s.class).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true})).map(k=>{const r=ss.filter(s=>s.class===k),p=r.reduce((a,s)=>a+calcPaid(s.id,m),0),q=r.reduce((a,s)=>a+calcPending(s.id,m),0),tt=r.reduce((a,s)=>a+Number(s.monthlyFee||0),0),ep=r.reduce((a,s)=>a+calcExtraPaid(s.id,m),0),eq=r.reduce((a,s)=>a+calcExtraPending(s.id,m),0),et=r.reduce((a,s)=>a+calcExtra(s.id,m),0);return `<tr><td>${esc(k)}</td><td>${r.length}</td><td>${money(p)}</td><td>${money(q)}   function ymOfDate(d){return String(d||'').slice(0,7)}
  function joinMonth(s){
    return String(s?.joinMonth||s?.admissionMonth||s?.joinedMonth||s?.joiningMonth||'').slice(0,7);
  }
  function studentActiveForMonth(s,m){
    const j=joinMonth(s);
    return !j || String(m)>=j;
  }
  function monthAdd(m,n){
    let [y,mo]=String(m).split('-').map(Number); if(!y||!mo)return m;
    const d=new Date(y,mo-1+n,1); return d.toISOString().slice(0,7);
  }
  function monthsFromTo(a,b){
    const out=[]; let x=a; let guard=0;
    while(x<=b&&guard++<240){out.push(x);x=monthAdd(x,1)}
    return out;
  }
  function tuitionDueForMonth(id,m){
    const s=db.students.find(x=>String(x.id)===String(id))||db.archivedStudents?.find(x=>String(x.id)===String(id));
    if(!s||!studentActiveForMonth(s,m))return 0;
    return Math.max(0,Number(s.monthlyFee||0));
  }
  function tuitionDueThrough(id,m){
    const s=db.students.find(x=>String(x.id)===String(id))||db.archivedStudents?.find(x=>String(x.id)===String(id));
    if(!s)return 0;
    let start=joinMonth(s)||String(db.settings?.feeStartMonth||m);
    if(start>m)return 0;
    return monthsFromTo(start,m).reduce((sum,x)=>sum+tuitionDueForMonth(id,x),0);
  }
  /* Manual month-to-month pending transfer.
     Transfer is NOT a payment. It moves pending from the source month to the
     selected target month. The source month is credited in Finance immediately.
     A later payment keeps the real payment date in history and is excluded from
     the target month's Finance, preventing double counting. */
  function transferRows(id,kind){
    return (db.fees||[]).filter(f=>String(f.studentId)===String(id)&&f.type==='PendingTransfer'&&(kind?String(f.transferKind||'Tuition')===String(kind):true));
  }

    return (db.fees||[]).filter(f=>f.type==='TransferPayment'&&String(f.transferId)===String(tr.transferId))
      .reduce((a,f)=>a+Number(f.amount||0)+Number(f.discount||0),0);
  }
  function transferOutstanding(tr){return Math.max(0,Number(tr.amount||0)-transferPaidFor(tr));}
  function transferIn(id,m,kind){return transferRows(id,kind).filter(f=>String(f.toMonth)===String(m)).reduce((a,f)=>a+transferOutstanding(f),0)}
  function transferCreated(id,m,kind){return transferRows(id,kind).filter(f=>String(f.fromMonth)===String(m)).reduce((a,f)=>a+Number(f.amount||0),0)}

  window.calcPaid=function(id,m){

      if(amount>pending)return alert(`${source} Extra Pending ₹${pending}க்குள் transfer amount கொடுக்கவும்.`);
      const transferId='TRX'+Date.now()+Math.random().toString(36).slice(2,7);
      db.fees.push({studentId:id,amount,discount:0,extraAmount:0,date:d,type:'PendingTransfer',transferKind:'Extra',transferId,fromMonth:source,toMonth:target,collectedBy:actor,teacherId:actorId,teacherName:actor,updatedAt:new Date().toISOString(),lastUpdatedBy:actor});
      addAudit('Fees','Extra Pending Transfer',id,`${source} → ${target} • ₹${amount}`);
    }else{
      const pending=Math.max(0,Number(calcExtraPending(id,source)||0));
      if(amount>pending)return alert(`${source} Extra Pending ₹${pending}. அதைவிட அதிகமாக payment செய்ய முடியாது.`);
      db.fees.push({studentId:id,amount,discount:0,extraAmount:0,date:d,type:'ExtraPayment',extraType:'Extra Fee Payment',collectedBy:actor,teacherId:actorId,teacherName:actor,updatedAt:new Date().toISOString(),lastUpdatedBy:actor});
      addAudit('Fees','Extra Fee Payment',id,`Extra Payment ₹${amount} • ${d}`);
    }
    closeModal();save();feesPage();
  };

  /* Old separate transfer popup is kept as a compatibility entry point, but the
     actual transfer now happens from Add Payment with a target-month selector. */
  window.transferPendingForm=function(id=''){return feeForm(id)};

})();

</script>
</body>
