<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arul Siragugal Academy - Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fb;
}

.header{
    background:#0d47a1;
    color:white;
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:20px;
}

/* Dashboard Grid */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    text-align:center;
    cursor:pointer;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h2{
    color:#0d47a1;
    margin-bottom:10px;
}

.card p{
    color:#555;
}

/* Page Sections */
.page-section{
    display:none;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.page-section.active{
    display:block;
}

/* Form Controls */
.form-group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

input{
    padding:10px 15px;
    border:1px solid #ccc;
    border-radius:5px;
    flex:1;
    min-width:200px;
}

button{
    padding:10px 20px;
    background:#0d47a1;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
    transition:background .2s;
}

button:hover{
    background:#0b3c91;
}

.back-btn{
    background:#555;
    margin-bottom:20px;
}

.back-btn:hover{
    background:#444;
}

/* Tables */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th, td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

th{
    background:#0d47a1;
    color:#fff;
}

tr:nth-child(even){
    background:#f9f9f9;
}

.delete-btn{
    background:#d32f2f;
    padding:6px 12px;
    font-size:14px;
}

.delete-btn:hover{
    background:#c62828;
}
</style>
</head>

<body>

<div class="header">
    🎓 Arul Siragugal Academy
</div>

<div class="container">

    <!-- DASHBOARD PAGE -->
    <div id="dashboardPage" class="page-section active">
        <div class="grid">
            <div class="card" onclick="showPage('studentsPage')">
                <h2>👨‍🎓 Students</h2>
                <p>Manage Students</p>
            </div>

            <div class="card" onclick="alert('Attendance module coming soon!')">
                <h2>📅 Attendance</h2>
                <p>Daily Attendance</p>
            </div>

            <div class="card" onclick="alert('Fees module coming soon!')">
                <h2>💰 Fees</h2>
                <p>Fee Collection</p>
            </div>

            <div class="card" onclick="alert('Exams module coming soon!')">
                <h2>📝 Exams</h2>
                <p>Exam Marks</p>
            </div>

            <div class="card" onclick="alert('Homework module coming soon!')">
                <h2>📚 Homework</h2>
                <p>Study Materials</p>
            </div>

            <div class="card" onclick="alert('Reports module coming soon!')">
                <h2>📊 Reports</h2>
                <p>Monthly Reports</p>
            </div>
        </div>
    </div>

    <!-- STUDENTS MANAGEMENT PAGE -->
    <div id="studentsPage" class="page-section">
        <button class="back-btn" onclick="showPage('dashboardPage')">⬅ Back to Dashboard</button>
        
        <h2>👨‍🎓 Student Management</h2>
        <br>

        <div class="form-group">
            <input type="text" id="studentName" placeholder="Student Name">
            <input type="text" id="studentClass" placeholder="Class">
            <input type="text" id="studentMobile" placeholder="Mobile Number">
            <button onclick="addStudent()">Add Student</button>
        </div>

        <table id="studentTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Class</th>
                    <th>Mobile</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <!-- Dynamic Rows Go Here -->
            </tbody>
        </table>
    </div>

</div>

<script>
// Data structure and LocalStorage integration
let students = JSON.parse(localStorage.getItem('academy_students')) || [];
let studentIdCounter = localStorage.getItem('academy_id_counter') ? parseInt(localStorage.getItem('academy_id_counter')) : 1;

// Page Router Handler
function showPage(pageId) {
    document.querySelectorAll('.page-section').forEach(section => {
        section.classList.remove('active');
    });
    document.getElementById(pageId).classList.add('active');
}

// Render Table Data
function renderStudents() {
    let tbody = document.getElementById("studentTableBody");
    tbody.innerHTML = "";

    if (students.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="color:#777;">No students added yet.</td></tr>`;
        return;
    }

    students.forEach((student, index) => {
        let row = tbody.insertRow();
        row.innerHTML = `
            <td>${student.id}</td>
            <td>${student.name}</td>
            <td>${student.cls}</td>
            <td>${student.mobile || '-'}</td>
            <td><button class="delete-btn" onclick="deleteStudent(${index})">Delete</button></td>
        `;
    });
}

// Add Student Function
function addStudent() {
    let name = document.getElementById("studentName").value.trim();
    let cls = document.getElementById("studentClass").value.trim();
    let mobile = document.getElementById("studentMobile").value.trim();

    if (name === "" || cls === "") {
        alert("Please enter Student Name and Class!");
        return;
    }

    let newStudent = {
        id: studentIdCounter++,
        name: name,
        cls: cls,
        mobile: mobile
    };

    students.push(newStudent);
    saveAndRefresh();

    // Clear Inputs
    document.getElementById("studentName").value = "";
    document.getElementById("studentClass").value = "";
    document.getElementById("studentMobile").value = "";
}

// Delete Student Function
function deleteStudent(index) {
    students.splice(index, 1);
    saveAndRefresh();
}

// Save to LocalStorage & Update View
function saveAndRefresh() {
    localStorage.setItem('academy_students', JSON.stringify(students));
    localStorage.setItem('academy_id_counter', studentIdCounter);
    renderStudents();
}

// Initial Render on Page Load
window.onload = function() {
    renderStudents();
};
</script>

</body>
</html>
