<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Arul Siragugal Academy</title>
<style>
:root{--ocean:#075985;--blue:#0ea5e9;--cyan:#06b6d4;--green:#16a34a;--red:#dc2626;--amber:#f59e0b;--purple:#7c3aed;--bg:#eaf8ff;--card:#fff;--text:#102a43;--muted:#64748b;--line:#dbeafe;--shadow:0 10px 28px rgba(2,132,199,.12);--r:18px}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Tamil",sans-serif;background:linear-gradient(180deg,#e0f7ff,#f8fbff);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(135deg,#075985,#0ea5e9,#06b6d4)}.login-card{width:100%;max-width:430px;background:#fff;border-radius:26px;padding:28px;box-shadow:0 25px 60px rgba(0,0,0,.22)}.logo{width:78px;height:78px;border-radius:22px;display:block;margin:auto auto 10px;object-fit:cover;background:#e0f2fe}.login-card h1{text-align:center;font-size:23px;margin:8px 0;color:#075985}.login-card p{text-align:center;color:var(--muted);margin:0 0 18px}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.roles button{padding:12px 6px;border-radius:12px;background:#e0f2fe;color:#075985;font-weight:700}.roles button.active{background:#075985;color:#fff}label{display:block;font-size:13px;font-weight:700;margin:10px 0 6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text)}textarea{min-height:90px}.btn{padding:10px 14px;border-radius:12px;background:#075985;color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn:hover{filter:brightness(.96)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.light{background:#e0f2fe;color:#075985}.btn.amber{background:var(--amber);color:#111827}.msg{text-align:center;color:var(--red);font-size:13px;margin-top:12px}
.app{max-width:1200px;margin:auto;padding:14px}.topbar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;height:42px;border-radius:12px;object-fit:cover}.brand h2{font-size:18px;margin:0}.brand small{color:var(--muted)}.top-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.sync{font-size:12px;color:var(--muted)}
.group-tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.group-tab{padding:17px;border-radius:17px;border:2px solid #bae6fd;background:#fff;text-align:left;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}.group-tab.active{background:linear-gradient(135deg,#075985,#0ea5e9);color:#fff;border-color:#075985}.group-name{font-weight:800;font-size:17px}.group-sub{font-size:12px;opacity:.8;margin-top:4px}.group-count{font-size:22px;font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.stat{background:#fff;border-radius:17px;padding:16px;border:1px solid var(--line);box-shadow:var(--shadow)}.stat:nth-child(1){border-top:4px solid var(--blue)}.stat:nth-child(2){border-top:4px solid var(--green)}.stat:nth-child(3){border-top:4px solid var(--red)}.stat:nth-child(4){border-top:4px solid var(--purple)}.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:24px;font-weight:800;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.feature{min-height:125px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.feature:hover{transform:translateY(-2px)}.icon{font-size:31px;margin-bottom:8px}.feature b{font-size:15px}.feature small{color:var(--muted);margin-top:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.toolbar>div{min-width:130px;flex:1}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;white-space:nowrap;font-size:13px}.table th{background:#f0f9ff}.badge{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.ok{background:#dcfce7;color:#166534}.pending{background:#fee2e2;color:#991b1b}.info{background:#e0f2fe;color:#075985}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal{position:fixed;inset:0;background:rgba(2,6,23,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal-box{width:100%;max-width:650px;max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}.notice{padding:12px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe;margin:8px 0}.danger{color:var(--red)}.success{color:var(--green)}.muted{color:var(--muted)}.p-a{display:flex;gap:6px}.p-a button{padding:7px 10px;border-radius:9px;border:2px solid #cbd5e1;background:#fff;font-weight:800}.p-a .p.active{background:#16a34a;color:#fff;border-color:#16a34a}.p-a .a.active{background:#dc2626;color:#fff;border-color:#dc2626}.mini{font-size:11px}.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bar{height:10px;background:#e2e8f0;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#075985,#0ea5e9)}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.analysis-grid{grid-template-columns:1fr}.top-actions .btn{padding:8px 10px;font-size:12px}}
@media(max-width:480px){.app{padding:8px}.cards{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:12px}.stat .value{font-size:19px}.grid{grid-template-columns:repeat(2,1fr);gap:8px}.feature{min-height:105px;padding:10px}.two{grid-template-columns:1fr}.group-tabs{gap:7px}.group-tab{padding:12px}.group-name{font-size:14px}.group-count{font-size:18px}.table th,.table td{font-size:12px;padding:7px}}
.student-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.student-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);cursor:pointer}.student-card .sc-icon{font-size:28px}.student-card .sc-label{font-size:12px;color:var(--muted);margin-top:8px}.student-card .sc-value{font-size:22px;font-weight:800;margin-top:4px}@media(max-width:800px){.student-cards{grid-template-columns:repeat(2,1fr)}}</style>
</head>
<body>
<div id="login" class="login"><div class="login-card">
<img id="loginLogo" class="logo" alt="Academy">
<h1 id="academyTitle">Arul Siragugal Academy</h1><p>Student Management System</p>
<div id="loading" class="notice" style="display:none;text-align:center">⏳ Google Sheets data loading...</div>
<div class="roles"><button id="rAdmin" onclick="setRole('admin')">👑 Admin</button><button id="rTeacher" class="active" onclick="setRole('teacher')">👨‍🏫 Teacher</button><button id="rStudent" onclick="setRole('student')">👨‍🎓 Student</button></div>
<div id="adminLogin" class="hidden"><label>Admin ID</label><input id="adminId"><label>Password</label><input id="adminPass" type="password"><button class="btn" style="width:100%;margin-top:14px" onclick="loginAdmin()">Login</button></div>
<div id="teacherLogin"><label>Teacher ID</label><input id="teacherId"><label>Password</label><input id="teacherPass" type="password"><button class="btn" style="width:100%;margin-top:14px" onclick="loginTeacher()">Login</button></div>
<div id="studentLogin" class="hidden"><label>Student ID</label><input id="studentId"><label>Password</label><input id="studentPass" type="password"><button class="btn" style="width:100%;margin-top:14px" onclick="loginStudent()">Login</button></div>
<div id="loginMsg" class="msg"></div>
</div></div>

<div id="app" class="app hidden"><div class="topbar"><div class="brand"><img id="brandLogo"><div><h2 id="pageTitle">Dashboard</h2><small id="welcome"></small></div></div><div class="top-actions"><span id="syncStatus" class="sync"></span><button id="homeBtn" class="btn light" onclick="home()">🏠 Home</button><button id="syncBtn" class="btn green" onclick="syncSheets()">☁️ Sync</button><button class="btn red" onclick="logout()">🚪 Exit</button></div></div><main id="content"></main></div>
<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h3 id="modalTitle" style="margin:0">Form</h3><button class="btn light" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>

<script>
const SHEETS_URL='https://script.google.com/macros/s/AKfycbzMAFuKPsGXWJonYqIyqxvNvjLTXG-bUjcbVXEAdulKyh6iuxX7czDZ7CgyE3eybE8/exec';
let db={settings:{academy:'Arul Siragugal Academy',teacher:'Teacher',mobile:'',fee:1000,logo:'',upi:'',whatsappGroup:'',teacherId:'teacher',teacherPass:'1234',adminId:'admin',adminPass:'admin123',sheetsUrl:SHEETS_URL,messages:{fee:'வணக்கம் {student}, உங்கள் {academy} மாத கட்டணம் ₹{amount} நிலுவையில் உள்ளது. தேதி: {date}.',absent:'வணக்கம் {student}, இன்று {academy} வகுப்பிற்கு வரவில்லை. தேதி: {date}.'}},students:[],archivedStudents:[],attendance:[],fees:[],marks:[],onlineMarks:[],tests:[],expenses:[],teachers:[]};
let role='teacher',currentStudent=null,currentGroup='LKG-5',loaded=false;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toISOString().slice(0,10), monthNow=()=>today().slice(0,7), money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function classBand(c){let x=String(c||'').trim().toLowerCase();if(/^lkg|^ukg/.test(x))return'LKG-5';let m=x.match(/\d+/);if(m){let n=+m[0];if(n>=1&&n<=5)return'LKG-5';if(n>=6&&n<=8)return'6-8'}return'Other'}
function groupLabel(g){return g==='6-8'?'6 – 8':'LKG – 5'}
function setSyncStatus(t){$('syncStatus').textContent=t==='syncing'?'⏳ Syncing…':t==='ok'?'✅ Synced':'⚠️ Sync error'}
function setRole(r){role=r;['admin','teacher','student'].forEach(x=>$(x==='admin'?'rAdmin':x==='teacher'?'rTeacher':'rStudent').classList.toggle('active',x===r));$('adminLogin').classList.toggle('hidden',r!=='admin');$('teacherLogin').classList.toggle('hidden',r!=='teacher');$('studentLogin').classList.toggle('hidden',r!=='student');$('loginMsg').textContent=''}
function applySettings(){document.title=db.settings.academy+' - Management';$('academyTitle').textContent=db.settings.academy;$('brandLogo').src=$('loginLogo').src=db.settings.logo||'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" rx="20" fill="#075985"/><text x="50" y="63" text-anchor="middle" fill="white" font-size="34">AS</text></svg>')}
function normalize(d){
  if(!d||typeof d!=='object')return false;
  // Apps Script versions may wrap the database in db/data/result.
  if(d.db&&typeof d.db==='object')d=d.db;
  else if(d.data&&typeof d.data==='object'&&!Array.isArray(d.data))d=d.data;
  else if(d.result&&typeof d.result==='object'&&!Array.isArray(d.result))d=d.result;

  const clean=(v,def='')=>v===undefined||v===null?def:String(v).trim();
  let incomingSettings=d.settings;
  if(Array.isArray(incomingSettings)) incomingSettings=incomingSettings[0]||{};
  if(typeof incomingSettings==='string'){try{incomingSettings=JSON.parse(incomingSettings)}catch(e){incomingSettings={}}}
  incomingSettings=incomingSettings&&typeof incomingSettings==='object'?incomingSettings:{};

  // Accept credentials whether Apps Script returns them under settings,
  // auth/admin/teacher, or as top-level fields.
  if(d.auth&&typeof d.auth==='object') incomingSettings={...incomingSettings,...d.auth};
  if(d.admin&&typeof d.admin==='object') incomingSettings={...incomingSettings,adminId:d.admin.id??d.admin.adminId,adminPass:d.admin.password??d.admin.adminPass};
  if(d.teacher&&typeof d.teacher==='object') incomingSettings={...incomingSettings,teacherId:d.teacher.id??d.teacher.teacherId,teacherPass:d.teacher.password??d.teacher.teacherPass,teacher:d.teacher.name??incomingSettings.teacher};
  ['adminId','adminPass','teacherId','teacherPass','academy','teacher','mobile','upi','whatsappGroup'].forEach(k=>{
    if(d[k]!==undefined && d[k]!==null) incomingSettings[k]=d[k];
  });

  db.students=(d.students||[]).map(s=>({...s,
    id:clean(s.id),name:clean(s.name),class:clean(s.class),mobile:clean(s.mobile),
    parent:clean(s.parent),address:clean(s.address),birthday:clean(s.birthday),
    password:clean(s.password,'1234'),monthlyFee:Number(s.monthlyFee)||0
  }));
  db.archivedStudents=Array.isArray(d.archivedStudents)?d.archivedStudents:[];
  db.attendance=(d.attendance||[]).map(x=>({...x,studentId:clean(x.studentId),date:clean(x.date),status:clean(x.status)}));
  db.fees=(d.fees||[]).map(x=>({...x,studentId:clean(x.studentId),date:clean(x.date),amount:Number(x.amount)||0,extraAmount:x.extraAmount===''||x.extraAmount==null?0:Number(x.extraAmount)||0,type:clean(x.type,'Payment')}));
  db.marks=(d.marks||[]).map((x,i)=>({...x,_id:clean(x._id,'M'+i+'_'+clean(x.date)),studentId:clean(x.studentId),date:clean(x.date)}));
  db.onlineMarks=(d.onlineMarks||[]).map((x,i)=>({...x,_id:clean(x._id,'OM'+i+'_'+clean(x.date)),studentId:clean(x.studentId)}));
  db.tests=(d.tests||[]).map((x,i)=>({...x,_id:clean(x._id,'T'+i+'_'+clean(x.date))}));
  db.expenses=(d.expenses||[]).map((x,i)=>({...x,_id:clean(x._id,'E'+i+'_'+clean(x.date))}));

  db.teachers=(d.teachers||[]).map(t=>({...t,
    id:clean(t.id||t.teacherId),name:clean(t.name||t.teacher),
    password:clean(t.password||t.pass||t.teacherPass),mobile:clean(t.mobile)
  }));

  const old=db.settings||{};
  const msgs=incomingSettings.messages||old.messages||{};
  db.settings={...old,...incomingSettings,
    academy:clean(incomingSettings.academy,old.academy||'Arul Siragugal Academy'),
    teacher:clean(incomingSettings.teacher,old.teacher||'Teacher'),
    mobile:clean(incomingSettings.mobile,old.mobile),
    upi:clean(incomingSettings.upi,old.upi),
    whatsappGroup:clean(incomingSettings.whatsappGroup,old.whatsappGroup),
    teacherId:clean(incomingSettings.teacherId,old.teacherId||'teacher'),
    teacherPass:clean(incomingSettings.teacherPass,old.teacherPass||'1234'),
    adminId:clean(incomingSettings.adminId,old.adminId||'admin'),
    adminPass:clean(incomingSettings.adminPass,old.adminPass||'admin123'),
    fee:Number(incomingSettings.fee??old.fee)||0,
    messages:{fee:clean(msgs.fee,old.messages?.fee||''),absent:clean(msgs.absent,old.messages?.absent||'')},
    sheetsUrl:SHEETS_URL
  };

  // If the main teacher account is stored only in teachers[], allow it for login.
  if(!db.settings.teacherId && db.teachers[0]) db.settings.teacherId=db.teachers[0].id;
  if(!db.settings.teacherPass && db.teachers[0]) db.settings.teacherPass=db.teachers[0].password;
  applySettings();
  return true;
}
async function getSheetsData(){
  const actions=['get','getData','read','load'];
  let last='';
  for(const action of actions){
    try{
      const r=await fetch(SHEETS_URL+'?action='+action+'&_='+Date.now(),{cache:'no-store'});
      const t=await r.text(); last=t;
      let d; try{d=JSON.parse(t)}catch(e){d=null}
      if(d && typeof d==='object' && normalize(d))return d;
    }catch(e){last=String(e)}
  }
  throw new Error(last.slice(0,250)||'No response');
}
async function loadSheets(){
  $('loading').style.display='block';
  $('loading').textContent='⏳ Google Sheets data loading...';
  try{
    await getSheetsData();
    loaded=true;
    setSyncStatus('ok');
    $('loading').textContent='✅ Google Sheets connected';
    setTimeout(()=>{$('loading').style.display='none'},900);
  }catch(e){
    loaded=false;
    setSyncStatus('error');
    $('loading').textContent='❌ Google Sheets connection failed — check Apps Script deployment / URL';
    console.error(e);
  }
}
async function syncSheets(silent=false){
  if(!loaded){if(!silent)alert('Google Sheets data இன்னும் load ஆகவில்லை.');return;}
  setSyncStatus('syncing');
  const payload={source:'Arul Siragugal Academy',syncedAt:new Date().toISOString(),settings:{...db.settings,sheetsUrl:SHEETS_URL},students:db.students||[],archivedStudents:db.archivedStudents||[],attendance:db.attendance||[],fees:db.fees||[],marks:db.marks||[],onlineMarks:db.onlineMarks||[],tests:db.tests||[],expenses:db.expenses||[],teachers:db.teachers||[]};
  try{
    let frame=document.getElementById('asaSyncFrame');
    if(!frame){frame=document.createElement('iframe');frame.id='asaSyncFrame';frame.name='asaSyncFrame';frame.style.display='none';document.body.appendChild(frame)}
    let form=document.getElementById('asaSyncForm');
    if(!form){form=document.createElement('form');form.id='asaSyncForm';form.method='POST';form.target='asaSyncFrame';form.enctype='application/x-www-form-urlencoded';form.style.display='none';document.body.appendChild(form)}
    form.action=SHEETS_URL;
    form.innerHTML='';
    const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(payload);form.appendChild(input);
    form.submit();
    setTimeout(()=>setSyncStatus('ok'),1200);
    if(!silent)alert('✅ Google Sheets-ல் data save செய்யப்பட்டது.');
  }catch(e){setSyncStatus('error');if(!silent)alert('❌ Google Sheets Sync failed: '+e.message);}
}
function save(){syncSheets(true)}
function openModal(t,b){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}
function loginAdmin(){const id=$('adminId').value.trim(),p=String($('adminPass').value||'').trim();const sid=String(db.settings.adminId||'admin').trim(),sp=String(db.settings.adminPass||'admin123').trim();if(id===sid&&p===sp)enter('admin');else $('loginMsg').textContent='Admin ID / Password Google Sheets-ல் உள்ள value-க்கு match ஆகவில்லை.'}
function loginTeacher(){const id=$('teacherId').value.trim(),p=String($('teacherPass').value||'').trim();const ok=id===String(db.settings.teacherId||'').trim()&&p===String(db.settings.teacherPass||'').trim()||db.teachers.some(t=>String(t.id||'').trim()===id&&String(t.password||'').trim()===p);if(ok)enter('teacher');else $('loginMsg').textContent='Teacher ID / Password Google Sheets-ல் உள்ள value-க்கு match ஆகவில்லை.'}
function loginStudent(){let s=db.students.find(x=>x.id===$('studentId').value.trim()&&x.password===$('studentPass').value);if(s){currentStudent=s;enter('student')}else $('loginMsg').textContent='Student ID / Password தவறாக உள்ளது.'}
function enter(r){role=r;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('syncBtn').classList.toggle('hidden',r==='student');$('welcome').textContent=r==='admin'?'👑 Admin':r==='teacher'?'👨‍🏫 Teacher':'👨‍🎓 '+currentStudent.name;applySettings();home()}
function logout(){currentStudent=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');setRole('teacher')}
function home(){if(role==='student')return studentHome();renderDashboard()}
function groupButtons(){return `<div class="group-tabs"><button class="group-tab ${currentGroup==='LKG-5'?'active':''}" onclick="currentGroup='LKG-5';renderDashboard()"><div><div class="group-name">LKG – 5</div><div class="group-sub">LKG, UKG, 1st–5th</div></div><span class="group-count">${db.students.filter(s=>classBand(s.class)==='LKG-5').length}</span></button><button class="group-tab ${currentGroup==='6-8'?'active':''}" onclick="currentGroup='6-8';renderDashboard()"><div><div class="group-name">6 – 8</div><div class="group-sub">6th, 7th, 8th</div></div><span class="group-count">${db.students.filter(s=>classBand(s.class)==='6-8').length}</span></button></div>`}
function groupStudents(){return db.students.filter(s=>classBand(s.class)===currentGroup)}
function calcPaid(id,m){return db.fees.filter(f=>f.studentId===id&&String(f.date).startsWith(m)&&f.type!=='Extra').reduce((a,f)=>a+Number(f.amount||0),0)}
function calcExtra(id,m){return db.fees.filter(f=>f.studentId===id&&String(f.date).startsWith(m)&&f.type==='Extra').reduce((a,f)=>a+Number(f.extraAmount||0),0)}
function calcPending(id,m){let s=db.students.find(x=>x.id===id);return Math.max(0,Number(s?.monthlyFee||0)+calcExtra(id,m)-calcPaid(id,m))}
function renderDashboard(){let ss=groupStudents(),m=monthNow(),present=ss.filter(s=>db.attendance.some(a=>a.studentId===s.id&&a.date===today()&&a.status==='Present')).length,pending=ss.reduce((a,s)=>a+calcPending(s.id,m),0);let features=role==='admin'?[['students','👨‍🎓','Students','Add / Edit / Remove'],['attendance','📅','Attendance','Date-wise P / A'],['fees','💰','Fees','Month-wise / Class-wise'],['marks','📝','Marks','Class-wise marks + WhatsApp'],['tests','🧪','Online Test','Post / Edit / Marks'],['reports','📊','Reports','Student / Monthly / History'],['finance','📈','Admin Finance','Year / Month Analysis'],['settings','⚙️','Settings','Google Sheets + WhatsApp Group']]:[['students','👨‍🎓','Students','Add / Edit / Remove'],['attendance','📅','Attendance','Date-wise P / A'],['fees','💰','Fees','Pending / Paid / Reminder'],['marks','📝','Marks','Add / Edit / Remove'],['tests','🧪','Online Test','Post / Edit']];$('pageTitle').textContent=role==='admin'?'Admin Dashboard':'Teacher Dashboard';$('content').innerHTML=groupButtons()+`<div class="cards"><div class="stat"><div class="label">Total Students</div><div class="value">${ss.length}</div></div><div class="stat"><div class="label">Today Present</div><div class="value success">${present}</div></div><div class="stat"><div class="label">Pending Fee</div><div class="value danger">${money(pending)}</div></div><div class="stat"><div class="label">${m} Paid</div><div class="value">${money(ss.reduce((a,s)=>a+calcPaid(s.id,m),0))}</div></div></div><div class="grid">${features.map(f=>`<div class="card feature" onclick="openFeature('${f[0]}')"><div class="icon">${f[1]}</div><b>${f[2]}</b><small>${f[3]}</small></div>`).join('')}</div>`}
function openFeature(p){$('pageTitle').textContent=groupLabel(currentGroup)+' — '+p; if(p==='students')studentsPage();if(p==='attendance')attendancePage();if(p==='fees')feesPage();if(p==='marks')marksPage();if(p==='tests')testsPage();if(p==='reports')reportsPage();if(p==='finance')financePage();if(p==='settings')settingsPage()}
function studentsPage(){let ss=groupStudents();$('content').innerHTML=`<div class="toolbar"><button class="btn" onclick="studentForm()">➕ Add Student</button><input id="sq" placeholder="Search student..." oninput="renderStudentRows()"></div><div class="card table-wrap"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Class</th><th>Mobile</th><th>Fee</th><th>Call</th><th>Action</th></tr></thead><tbody id="studentRows"></tbody></table></div>`;renderStudentRows()}
function renderStudentRows(){let q=($('sq')?.value||'').toLowerCase();let rows=groupStudents().filter(s=>(s.id+' '+s.name+' '+s.class).toLowerCase().includes(q));$('studentRows').innerHTML=rows.map(s=>`<tr><td>${esc(s.id)}</td><td><button class="btn light" onclick="studentDetails('${esc(s.id)}')">${esc(s.name)}</button></td><td>${esc(s.class)}</td><td>${esc(s.mobile||'-')}</td><td>${money(s.monthlyFee)}</td><td>${s.mobile?`<a class="btn light" href="tel:${esc(s.mobile)}">📞 Call</a>`:'-'}</td><td><button class="btn light" onclick="studentForm('${esc(s.id)}')">✏️ Edit</button><button class="btn red" onclick="removeStudent('${esc(s.id)}')">Remove</button></td></tr>`).join('')||'<tr><td colspan="7">Students இல்லை.</td></tr>'}
function studentForm(id=''){let s=db.students.find(x=>x.id===id)||{id:'',name:'',class:'',mobile:'',parent:'',address:'',monthlyFee:db.settings.fee,password:'1234'};openModal(id?'Edit Student':'Add Student',`<div class="two"><div><label>Student ID</label><input id="fId" value="${esc(s.id)}" ${id?'readonly':''}></div><div><label>Password</label><input id="fPass" value="${esc(s.password)}"></div></div><label>Name</label><input id="fName" value="${esc(s.name)}"><div class="two"><div><label>Class</label><input id="fClass" value="${esc(s.class)}"></div><div><label>Mobile</label><input id="fMobile" value="${esc(s.mobile)}"></div><div><label>Parent</label><input id="fParent" value="${esc(s.parent||'')}"></div><div><label>Monthly Fee</label><input id="fFee" type="number" value="${s.monthlyFee}"></div></div><label>Address</label><input id="fAddress" value="${esc(s.address||'')}"><br><button class="btn" style="width:100%" onclick="saveStudent('${esc(id)}')">Save Student</button>`)}
function saveStudent(old){let id=$('fId').value.trim(),name=$('fName').value.trim();if(!id||!name)return alert('Student ID மற்றும் Name தேவை');if(!old&&db.students.some(s=>s.id===id))return alert('Student ID already exists');let o={id,name,class:$('fClass').value.trim(),mobile:$('fMobile').value.trim(),parent:$('fParent').value.trim(),address:$('fAddress').value.trim(),monthlyFee:Number($('fFee').value)||0,password:$('fPass').value||'1234'};if(old)db.students[db.students.findIndex(s=>s.id===old)]=o;else db.students.push(o);closeModal();studentsPage();save()}
function removeStudent(id){if(!confirm('Student active list-ல் இருந்து remove செய்யவா? Old Attendance / Fees / Marks history preserve ஆகும்.'))return;let s=db.students.find(x=>x.id===id);if(!s)return;db.archivedStudents.push({...s,removedAt:today(),status:'Removed'});db.students=db.students.filter(x=>x.id!==id);save();studentsPage()}
function studentDetails(id){let s=db.students.find(x=>x.id===id);if(!s)return;let m=monthNow();openModal('Student Details',`<div class="card"><h3>👨‍🎓 ${esc(s.name)}</h3><p>ID: <b>${esc(s.id)}</b></p><p>Class: <b>${esc(s.class)}</b></p><p>Mobile: <b>${esc(s.mobile||'-')}</b></p><p>Monthly Fee: <b>${money(s.monthlyFee)}</b></p><p>${s.mobile?`<a class="btn" href="tel:${esc(s.mobile)}">📞 Call</a>`:''}</p><hr><p>Current Month: <b>${m}</b></p><p>Paid: <b class="success">${money(calcPaid(s.id,m))}</b></p><p>Pending: <b class="danger">${money(calcPending(s.id,m))}</b></p></div>`)}
function attendancePage(){let cls=[...new Set(groupStudents().map(s=>s.class).filter(Boolean))].sort();$('content').innerHTML=`<div class="card"><div class="toolbar"><div><label>Date</label><input id="attDate" type="date" value="${today()}" onchange="renderAtt()"></div><div><label>Class</label><select id="attClass" onchange="renderAtt()"><option value="">Select Class</option>${cls.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div></div><div id="attBox"></div></div><div class="card"><h3>Absent Reminder — selected date/class</h3><div id="absentBox"></div></div>`;renderAtt()}
function renderAtt(){let d=$('attDate').value,c=$('attClass').value,ss=groupStudents().filter(s=>!c||s.class===c),existing={};db.attendance.filter(a=>a.date===d).forEach(a=>existing[a.studentId]=a.status);$('attBox').innerHTML=`<div class="table-wrap"><table class="table"><tr><th>#</th><th>Student</th><th>Class</th><th>P / A</th><th>Status</th></tr>${ss.map((s,i)=>{let st=existing[s.id]||'';return `<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${esc(s.class)}</td><td><div class="p-a"><button class="p ${st==='Present'?'active':''}" onclick="markAtt('${esc(s.id)}','${d}','Present')">✓ P</button><button class="a ${st==='Absent'?'active':''}" onclick="markAtt('${esc(s.id)}','${d}','Absent')">✕ A</button></div></td><td><span class="badge ${st==='Present'?'ok':st==='Absent'?'pending':'info'}">${st||'Not Marked'}</span></td></tr>`}).join('')||'<tr><td colspan="5">Students இல்லை.</td></tr>'}</table></div>`;let abs=ss.filter(s=>existing[s.id]==='Absent');$('absentBox').innerHTML=abs.map(s=>`<div class="notice"><b>${esc(s.name)}</b> — ${esc(s.class)} ${s.mobile?`<a class="btn light" href="https://wa.me/${waPhone(s.mobile)}?text=${encodeURIComponent(fillAbsent(s))}" target="_blank">💬 WhatsApp Reminder</a>`:''}</div>`).join('')||'<span class="muted">Absent students இல்லை.</span>'}
function markAtt(id,date,status){db.attendance=db.attendance.filter(a=>!(a.studentId===id&&a.date===date));db.attendance.push({studentId:id,date,status});renderAtt();save()}
function waPhone(p){let n=String(p||'').replace(/\D/g,'');return n.length===10?'91'+n:n}function fillAbsent(s){return db.settings.messages.absent.replaceAll('{student}',s.name).replaceAll('{academy}',db.settings.academy).replaceAll('{date}',new Date().toLocaleDateString('en-IN'))}
function feesPage(){let m=monthNow(),cls=[...new Set(groupStudents().map(s=>s.class).filter(Boolean))].sort();$('content').innerHTML=`<div class="card"><div class="toolbar"><div><label>Month</label><input id="feeMonth" type="month" value="${m}" onchange="renderFees()"></div><div><label>Class</label><select id="feeClass" onchange="renderFees()"><option value="">All Classes</option>${cls.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><button class="btn" onclick="feeForm()">➕ Add Payment</button><button class="btn amber" onclick="extraForm()">➕ Extra Fee</button></div><div id="feeBox"></div></div>`;renderFees()}
function renderFees(){let m=$('feeMonth').value,c=$('feeClass').value,ss=groupStudents().filter(s=>!c||s.class===c);let paid=ss.reduce((a,s)=>a+calcPaid(s.id,m),0),pending=ss.reduce((a,s)=>a+calcPending(s.id,m),0);$('feeBox').innerHTML=`<div class="cards"><div class="stat"><div class="label">Students</div><div class="value">${ss.length}</div></div><div class="stat"><div class="label">Paid</div><div class="value success">${money(paid)}</div></div><div class="stat"><div class="label">Pending</div><div class="value danger">${money(pending)}</div></div><div class="stat"><div class="label">Expected</div><div class="value">${money(paid+pending)}</div></div></div><div class="table-wrap"><table class="table"><tr><th>Student</th><th>Class</th><th>Monthly</th><th>Extra</th><th>Paid</th><th>Pending</th><th>Action</th></tr>${ss.map(s=>{let p=calcPaid(s.id,m),e=calcExtra(s.id,m),pen=calcPending(s.id,m);return `<tr><td>${esc(s.name)}</td><td>${esc(s.class)}</td><td>${money(s.monthlyFee)}</td><td>${money(e)}</td><td>${money(p)}</td><td><span class="badge ${pen?'pending':'ok'}">${money(pen)}</span></td><td>${pen?`<button class="btn green" onclick="feeForm('${esc(s.id)}')">💳 Paid</button> ${s.mobile?`<a class="btn light" target="_blank" href="https://wa.me/${waPhone(s.mobile)}?text=${encodeURIComponent(fillFee(s,pen))}">💬 Reminder</a>`:''}`:'<span class="badge ok">Paid</span>'} <button class="btn light" onclick="studentFeeHistory('${esc(s.id)}')">History</button></td></tr>`}).join('')||'<tr><td colspan="7">Students இல்லை.</td></tr>'}</table></div>`}
function fillFee(s,a){return db.settings.messages.fee.replaceAll('{student}',s.name).replaceAll('{amount}',a).replaceAll('{academy}',db.settings.academy).replaceAll('{date}',new Date().toLocaleDateString('en-IN'))}
function feeForm(id=''){let m=$('feeMonth')?.value||monthNow();openModal('Record Fee Payment',`<label>Student</label><select id="feeStudent">${groupStudents().map(s=>`<option value="${esc(s.id)}" ${s.id===id?'selected':''}>${esc(s.name)} — ${esc(s.class)}</option>`).join('')}</select><label>Amount</label><input id="feeAmount" type="number"><label>Date</label><input id="feeDate" type="date" value="${today()}"><br><button class="btn green" style="width:100%" onclick="saveFee()">Save Payment</button>`)}
function saveFee(){let id=$('feeStudent').value,a=Number($('feeAmount').value),d=$('feeDate').value;if(!id||a<=0)return alert('Amount சரியாக கொடுக்கவும்');if(a>calcPending(id,d.slice(0,7)))return alert('Pending amount-ஐ விட அதிகமாக பதிவு செய்ய முடியாது.');db.fees.push({studentId:id,amount:a,extraAmount:0,date:d,type:'Payment',collectedBy:role==='admin'?'Admin':'Teacher'});closeModal();feesPage();save()}
function studentFeeHistory(id){let s=db.students.find(x=>x.id===id),rows=db.fees.map((x,i)=>({...x,_i:i})).filter(x=>x.studentId===id).slice().reverse();openModal('Fee History — '+(s?.name||id),`<div class="table-wrap"><table class="table"><tr><th>Date</th><th>Type</th><th>Purpose</th><th>Amount</th><th>Action</th></tr>${rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.extraType||'Monthly Fee')}</td><td>${money((x.amount||0)+(x.extraAmount||0))}</td><td><button class="btn light" onclick="editFeeRecord(${x._i})">✏️ Edit</button><button class="btn red" onclick="deleteFeeRecord(${x._i},'${esc(id)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No fee history</td></tr>'}</table></div>`)}
function editFeeRecord(i){let x=db.fees[i];if(!x)return;openModal('Edit Fee',`<label>Date</label><input id="efDate" type="date" value="${esc(x.date)}"><label>Amount</label><input id="efAmount" type="number" value="${Number(x.amount||x.extraAmount||0)}"><label>Type</label><select id="efType"><option ${x.type==='Payment'?'selected':''}>Payment</option><option ${x.type==='Extra'?'selected':''}>Extra</option></select><label>Purpose</label><input id="efPurpose" value="${esc(x.extraType||'')}"><br><button class="btn" style="width:100%" onclick="saveFeeEdit(${i})">Save Changes</button>`)}
function saveFeeEdit(i){let x=db.fees[i],a=Number($('efAmount').value);if(!a)return alert('Amount தேவை');let type=$('efType').value;x.date=$('efDate').value;x.type=type;x.extraType=$('efPurpose').value;x.amount=type==='Payment'?a:0;x.extraAmount=type==='Extra'?a:0;closeModal();save();feesPage()}
function deleteFeeRecord(i,id){if(!confirm('Fee record delete செய்யவா?'))return;db.fees.splice(i,1);closeModal();save();setTimeout(()=>studentFeeHistory(id),200)}
function extraForm(){openModal('Extra Fee',`<label>Student</label><select id="exStudent">${groupStudents().map(s=>`<option value="${esc(s.id)}">${esc(s.name)} — ${esc(s.class)}</option>`).join('')}</select><label>Purpose</label><select id="exType"><option>Book</option><option>Pen</option><option>Notebook</option><option>Exam</option><option>Other</option></select><label>Amount</label><input id="exAmount" type="number"><label>Date</label><input id="exDate" type="date" value="${today()}"><br><button class="btn" style="width:100%" onclick="saveExtra()">Save Extra Fee</button>`)}
function saveExtra(){let id=$('exStudent').value,a=Number($('exAmount').value),d=$('exDate').value;if(!id||a<=0)return alert('Amount சரியாக கொடுக்கவும்');db.fees.push({studentId:id,amount:0,extraAmount:a,date:d,type:'Extra',extraType:$('exType').value});closeModal();feesPage();save()}
function marksPage(){let cls=[...new Set(groupStudents().map(s=>s.class).filter(Boolean))].sort();$('content').innerHTML=`<div class="card"><div class="toolbar"><div><label>Month</label><input id="markMonth" type="month" value="${monthNow()}" onchange="renderMarks()"></div><div><label>Class</label><select id="markClass" onchange="renderMarks()"><option value="">All Classes</option>${cls.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><button class="btn" onclick="markForm()">➕ Add Mark</button><button class="btn green" onclick="shareMarksGroup()">💬 WhatsApp Group</button></div><div id="markBox"></div></div>`;renderMarks()}
function renderMarks(){let m=$('markMonth').value,c=$('markClass').value,ids=new Set(groupStudents().filter(s=>!c||s.class===c).map(s=>s.id)),rows=db.marks.filter(x=>ids.has(x.studentId)&&String(x.date).startsWith(m)).slice().reverse();$('markBox').innerHTML=`<div class="table-wrap"><table class="table"><tr><th>Date</th><th>Student</th><th>Class</th><th>Exam / Subject</th><th>Mark</th><th>Total</th><th>Action</th></tr>${rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(db.students.find(s=>s.id===x.studentId)?.name||x.studentId)}</td><td>${esc(db.students.find(s=>s.id===x.studentId)?.class||'-')}</td><td>${esc(x.exam)}</td><td><b>${x.mark}</b></td><td>${x.total}</td><td><button class="btn light" onclick="editMark('${esc(x._id||'')}')">✏️ Edit</button><button class="btn red" onclick="deleteMark('${esc(x._id||'')}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="7">Marks இல்லை.</td></tr>'}</table></div><h3 style="margin-top:18px">🧪 Student Submitted Online Test Marks</h3><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Student</th><th>Test</th><th>Mark</th><th>Total</th><th>Action</th></tr>${(db.onlineMarks||[]).filter(x=>ids.has(x.studentId)&&String(x.date||'').startsWith(m)).slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(db.students.find(s=>s.id===x.studentId)?.name||x.studentId)}</td><td>${esc(x.testName||'-')}</td><td><b>${x.mark}</b></td><td>${x.total}</td><td><button class="btn light" onclick="editOnlineMark('${esc(x._id||'')}')">✏️ Edit</button><button class="btn red" onclick="deleteOnlineMark('${esc(x._id||'')}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6">Online marks இல்லை.</td></tr>'}</table></div>`}
function markForm(editId=''){let old=db.marks.find(x=>x._id===editId)||{},ss=groupStudents();openModal(editId?'Edit Mark':'Add Mark',`<label>Student</label><select id="mkStudent">${ss.map(s=>`<option value="${esc(s.id)}" ${s.id===old.studentId?'selected':''}>${esc(s.name)} — ${esc(s.class)}</option>`).join('')}</select><label>Exam / Subject</label><input id="mkExam" value="${esc(old.exam||'')}"><div class="two"><div><label>Mark</label><input id="mkMark" type="number" value="${old.mark??''}"></div><div><label>Total</label><input id="mkTotal" type="number" value="${old.total||100}"></div></div><label>Date</label><input id="mkDate" type="date" value="${old.date||today()}"><br><button class="btn" style="width:100%" onclick="saveMark('${esc(editId)}')">Save Mark</button>`)}
function saveMark(id=''){let o={_id:id||('M'+Date.now()),studentId:$('mkStudent').value,exam:$('mkExam').value.trim(),mark:Number($('mkMark').value),total:Number($('mkTotal').value)||100,date:$('mkDate').value,enteredBy:role==='admin'?'Admin':'Teacher'};if(!o.exam)return alert('Exam / Subject தேவை');if(id)db.marks[db.marks.findIndex(x=>x._id===id)]=o;else db.marks.push(o);closeModal();marksPage();save()}
function editMark(id){if(!id){let m=db.marks.find(x=>x);return m&&markForm(m._id)}markForm(id)}function deleteMark(id){if(!confirm('Mark delete செய்யவா?'))return;db.marks=db.marks.filter(x=>x._id!==id);save();marksPage()}
function shareMarksGroup(){let c=$('markClass')?.value||'';if(!c)return alert('Class select செய்யவும்');let m=$('markMonth')?.value||monthNow(),rows=db.marks.filter(x=>String(x.date).startsWith(m)&&db.students.find(s=>s.id===x.studentId)?.class===c);if(!rows.length)return alert('இந்த month/class-ல் marks இல்லை');let text=`${db.settings.academy}\n${c} — ${m} Marks\n\n`+rows.map(x=>{let s=db.students.find(s=>s.id===x.studentId);return `${s?.name||x.studentId} - ${x.mark}/${x.total}`}).join('\n');let link=db.settings.whatsappGroup||'';if(link){window.open(link,'_blank');navigator.clipboard?.writeText(text);alert('Name-Mark text copied. WhatsApp Group open செய்யப்பட்டது.')}else{navigator.clipboard?.writeText(text);window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}}
function editOnlineMark(id){let x=db.onlineMarks.find(o=>o._id===id);if(!x)return;openModal('Edit Online Test Mark',`<label>Mark</label><input id="omMark" type="number" value="${x.mark||0}"><label>Total</label><input id="omTotal" type="number" value="${x.total||100}"><br><button class="btn" style="width:100%" onclick="saveOnlineEdit('${esc(id)}')">Save</button>`)}

function testsPage(){let cls=[...new Set(groupStudents().map(s=>s.class).filter(Boolean))].sort();$('content').innerHTML=`<div class="card"><div class="toolbar"><button class="btn" onclick="testForm()">➕ Post Online Test</button></div><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Test</th><th>Class</th><th>Subject</th><th>Total</th><th>Link</th><th>Action</th></tr>${db.tests.slice().reverse().filter(t=>!t.class||!currentGroup||classBand(t.class)===currentGroup).map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.name)}</td><td>${esc(t.class||'All')}</td><td>${esc(t.subject||'-')}</td><td>${t.total}</td><td><a class="btn light" href="${esc(t.link)}" target="_blank">Open</a></td><td><button class="btn light" onclick="testForm('${esc(t._id||'')}')">✏️ Edit</button><button class="btn red" onclick="deleteTest('${esc(t._id||'')}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="7">Test links இல்லை.</td></tr>'}</table></div></div>`}
function testForm(id=''){let o=db.tests.find(x=>x._id===id)||{};openModal(id?'Edit Online Test':'Post Online Test',`<label>Test Name</label><input id="tName" value="${esc(o.name||'')}"><div class="two"><div><label>Class</label><input id="tClass" value="${esc(o.class||'')}"></div><div><label>Subject</label><input id="tSubject" value="${esc(o.subject||'')}"></div></div><label>Test Link</label><input id="tLink" value="${esc(o.link||'')}"><div class="two"><div><label>Total Mark</label><input id="tTotal" type="number" value="${o.total||100}"></div><div><label>Date</label><input id="tDate" type="date" value="${o.date||today()}"></div></div><br><button class="btn" style="width:100%" onclick="saveTest('${esc(id)}')">Save Test</button>`)}
function saveTest(id=''){let o={_id:id||('T'+Date.now()),name:$('tName').value.trim(),class:$('tClass').value.trim(),subject:$('tSubject').value.trim(),link:$('tLink').value.trim(),total:Number($('tTotal').value)||100,date:$('tDate').value,postedBy:role==='admin'?'Admin':'Teacher'};if(!o.name||!o.link)return alert('Test Name & Link தேவை');if(id)db.tests[db.tests.findIndex(x=>x._id===id)]=o;else db.tests.push(o);closeModal();testsPage();save()}
function deleteTest(id){if(confirm('Test delete செய்யவா?')){db.tests=db.tests.filter(x=>x._id!==id);save();testsPage()}}
function reportsPage(){let cls=[...new Set(groupStudents().map(s=>s.class).filter(Boolean))].sort();$('content').innerHTML=`<div class="analysis-grid"><div class="card"><h3>👨‍🎓 Individual Student Report</h3><label>Student</label><select id="rpStudent">${groupStudents().map(s=>`<option value="${esc(s.id)}">${esc(s.name)} — ${esc(s.class)}</option>`).join('')}</select><label>Month</label><input id="rpMonth" type="month" value="${monthNow()}"><br><button class="btn" style="margin-top:10px" onclick="studentPDF()">⬇️ Month PDF</button></div><div class="card"><h3>📊 Monthly Class Report</h3><label>Month</label><input id="rpM" type="month" value="${monthNow()}"><label>Class</label><select id="rpC"><option value="">All Classes</option>${cls.map(c=>`<option>${esc(c)}</option>`).join('')}</select><br><button class="btn green" style="margin-top:10px" onclick="monthlyPDF()">⬇️ Monthly PDF</button></div></div><div class="card"><h3>🗂️ All History PDF</h3><div class="two"><div><label>From</label><input id="histFrom" type="date" value="${new Date(Date.now()-30*86400000).toISOString().slice(0,10)}"></div><div><label>To</label><input id="histTo" type="date" value="${today()}"></div></div><br><button class="btn amber" onclick="historyPDF()">⬇️ Period PDF</button></div>`}
function pdf(title,html){let w=window.open('','_blank');if(!w)return alert('Popup blocked');w.document.write(`<html><head><title>${esc(title)}</title><style>body{font-family:Arial;padding:25px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #999;padding:6px;font-size:12px}th{background:#eee}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.box{border:1px solid #aaa;padding:8px}@media print{button{display:none}}</style></head><body><h1>${esc(title)}</h1>${html}</body></html>`);w.document.close();setTimeout(()=>w.print(),500)}
function studentPDF(){let s=db.students.find(x=>x.id===$('rpStudent').value),m=$('rpMonth').value;if(!s)return;let att=db.attendance.filter(a=>a.studentId===s.id&&a.date.startsWith(m)),fs=db.fees.filter(f=>f.studentId===s.id&&f.date.startsWith(m)),marks=db.marks.filter(x=>x.studentId===s.id&&x.date.startsWith(m)),paid=calcPaid(s.id,m),extra=calcExtra(s.id,m),p=calcPending(s.id,m);pdf('Student Report',`<p><b>${esc(s.name)}</b> | ${esc(s.class)} | ${m}</p><div class="grid"><div class="box">Present<br><b>${att.filter(a=>a.status==='Present').length}</b></div><div class="box">Absent<br><b>${att.filter(a=>a.status==='Absent').length}</b></div><div class="box">Paid<br><b>${money(paid)}</b></div><div class="box">Pending<br><b>${money(p)}</b></div></div><h3>Attendance</h3><table><tr><th>Date</th><th>Status</th></tr>${att.map(a=>`<tr><td>${a.date}</td><td>${a.status}</td></tr>`).join('')}</table><h3>Fees</h3><table><tr><th>Date</th><th>Type</th><th>Amount</th></tr>${fs.map(f=>`<tr><td>${f.date}</td><td>${f.type}</td><td>${money(f.amount+f.extraAmount)}</td></tr>`).join('')}</table><h3>Marks</h3><table><tr><th>Date</th><th>Exam</th><th>Mark</th></tr>${marks.map(x=>`<tr><td>${x.date}</td><td>${esc(x.exam)}</td><td>${x.mark}/${x.total}</td></tr>`).join('')}</table>`)}
function monthlyPDF(){let m=$('rpM').value,c=$('rpC').value,ss=groupStudents().filter(s=>!c||s.class===c);pdf('Monthly Student Report',`<p>Month: ${m} | Class: ${esc(c||'All')}</p><table><tr><th>Student</th><th>Class</th><th>Paid</th><th>Pending</th><th>Present</th><th>Absent</th></tr>${ss.map(s=>{let a=db.attendance.filter(x=>x.studentId===s.id&&x.date.startsWith(m));return `<tr><td>${esc(s.name)}</td><td>${esc(s.class)}</td><td>${money(calcPaid(s.id,m))}</td><td>${money(calcPending(s.id,m))}</td><td>${a.filter(x=>x.status==='Present').length}</td><td>${a.filter(x=>x.status==='Absent').length}</td></tr>`}).join('')}</table>`)}
function historyPDF(){let f=$('histFrom').value,t=$('histTo').value,att=db.attendance.filter(x=>x.date>=f&&x.date<=t),fees=db.fees.filter(x=>x.date>=f&&x.date<=t);pdf('All History Report',`<p>${f} → ${t}</p><h3>Attendance</h3><table><tr><th>Date</th><th>Student</th><th>Status</th></tr>${att.map(x=>`<tr><td>${x.date}</td><td>${esc(db.students.find(s=>s.id===x.studentId)?.name||x.studentId)}</td><td>${x.status}</td></tr>`).join('')}</table><h3>Fees</h3><table><tr><th>Date</th><th>Student</th><th>Amount</th></tr>${fees.map(x=>`<tr><td>${x.date}</td><td>${esc(db.students.find(s=>s.id===x.studentId)?.name||x.studentId)}</td><td>${money(x.amount+x.extraAmount)}</td></tr>`).join('')}</table>`)}
function financePage(){if(role!=='admin')return alert('Admin only');let years=[...new Set([...db.fees.map(x=>String(x.date).slice(0,4)),...db.expenses.map(x=>String(x.date).slice(0,4))].filter(x=>/^\d{4}$/.test(x)))].sort().reverse();let y=String(new Date().getFullYear());let m=monthNow();$('content').innerHTML=`<div class="cards"><div class="stat"><div class="label">Total Students</div><div class="value">${db.students.length}</div></div><div class="stat"><div class="label">Current Month Fees</div><div class="value success">${money(db.fees.filter(f=>String(f.date).startsWith(m)).reduce((a,f)=>a+f.amount+f.extraAmount,0))}</div></div><div class="stat"><div class="label">Current Month Pending</div><div class="value danger">${money(db.students.reduce((a,s)=>a+calcPending(s.id,m),0))}</div></div><div class="stat"><div class="label">Current Month Expenses</div><div class="value">${money(db.expenses.filter(e=>String(e.date).startsWith(m)).reduce((a,e)=>a+Number(e.amount||0),0))}</div></div></div><div class="analysis-grid"><div class="card"><h3>📈 Year-wise Income / Expense</h3><table class="table"><tr><th>Year</th><th>Income</th><th>Expense</th><th>Net</th></tr>${years.map(yy=>{let inc=db.fees.filter(f=>String(f.date).startsWith(yy)).reduce((a,f)=>a+f.amount+f.extraAmount,0),ex=db.expenses.filter(e=>String(e.date).startsWith(yy)).reduce((a,e)=>a+Number(e.amount||0),0);return `<tr><td>${yy}</td><td class="success">${money(inc)}</td><td class="danger">${money(ex)}</td><td>${money(inc-ex)}</td></tr>`}).join('')||'<tr><td colspan="4">No finance data</td></tr>'}</table></div><div class="card"><h3>📅 Month-wise Income / Expense — ${y}</h3><table class="table"><tr><th>Month</th><th>Income</th><th>Expense</th><th>Net</th></tr>${Array.from({length:12},(_,i)=>{let mm=`${y}-${String(i+1).padStart(2,'0')}`,inc=db.fees.filter(f=>String(f.date).startsWith(mm)).reduce((a,f)=>a+f.amount+f.extraAmount,0),ex=db.expenses.filter(e=>String(e.date).startsWith(mm)).reduce((a,e)=>a+Number(e.amount||0),0);return `<tr><td>${mm}</td><td>${money(inc)}</td><td>${money(ex)}</td><td>${money(inc-ex)}</td></tr>`}).join('')}</table></div></div><div class="card"><h3>👨‍🎓 Total Student Fees Analysis</h3><div class="toolbar"><div><label>Month</label><input id="faMonth" type="month" value="${m}" onchange="renderFeeAnalysis()"></div><div><label>Class</label><select id="faClass" onchange="renderFeeAnalysis()"><option value="">All Classes</option>${[...new Set(db.students.map(s=>s.class).filter(Boolean))].sort().map(c=>`<option>${esc(c)}</option>`).join('')}</select></div></div><div id="feeAnalysis"></div></div><div class="card"><h3>➕ Admin Expense Entry</h3><button class="btn amber" onclick="expenseForm()">Add Expense</button><div class="table-wrap" style="margin-top:10px"><table class="table"><tr><th>Date</th><th>Category</th><th>Note</th><th>Amount</th><th>Action</th></tr>${db.expenses.slice().reverse().map(e=>`<tr><td>${e.date}</td><td>${esc(e.category)}</td><td>${esc(e.note)}</td><td>${money(e.amount)}</td><td><button class="btn red" onclick="deleteExpense('${esc(e._id||'')}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">Expense இல்லை.</td></tr>'}</table></div></div>`;renderFeeAnalysis()}
function renderFeeAnalysis(){let m=$('faMonth').value,c=$('faClass').value,ss=db.students.filter(s=>!c||s.class===c),expected=ss.reduce((a,s)=>a+s.monthlyFee+calcExtra(s.id,m),0),paid=ss.reduce((a,s)=>a+calcPaid(s.id,m),0),pending=ss.reduce((a,s)=>a+calcPending(s.id,m),0);$('feeAnalysis').innerHTML=`<div class="cards"><div class="stat"><div class="label">Students</div><div class="value">${ss.length}</div></div><div class="stat"><div class="label">Expected Fees</div><div class="value">${money(expected)}</div></div><div class="stat"><div class="label">Paid Fees</div><div class="value success">${money(paid)}</div></div><div class="stat"><div class="label">Pending Fees</div><div class="value danger">${money(pending)}</div></div></div><div class="bar"><i style="width:${expected?Math.min(100,paid/expected*100):0}%"></i></div><p class="muted mini">Collection: ${expected?((paid/expected)*100).toFixed(1):0}%</p>`}
function expenseForm(){openModal('Admin Expense',`<label>Category</label><input id="ec"><label>Note</label><input id="en"><label>Amount</label><input id="ea" type="number"><label>Date</label><input id="ed" type="date" value="${today()}"><br><button class="btn amber" style="width:100%" onclick="saveExpense()">Save Expense</button>`)}
function saveExpense(){let e={_id:'E'+Date.now(),category:$('ec').value.trim(),note:$('en').value.trim(),amount:Number($('ea').value)||0,date:$('ed').value};if(!e.amount)return alert('Amount தேவை');db.expenses.push(e);closeModal();financePage();save()}
function deleteExpense(id){if(confirm('Expense delete செய்யவா?')){db.expenses=db.expenses.filter(x=>x._id!==id);save();financePage()}}
function settingsPage(){if(role!=='admin')return alert('Admin only');let m=db.settings.messages||{};$('content').innerHTML=`<div class="card"><h3>⚙️ Admin Settings</h3><div class="two"><div><label>Academy Name</label><input id="sa" value="${esc(db.settings.academy)}"></div><div><label>Teacher Name</label><input id="st" value="${esc(db.settings.teacher)}"></div><div><label>Mobile</label><input id="sm" value="${esc(db.settings.mobile)}"></div><div><label>Default Monthly Fee</label><input id="sf" type="number" value="${db.settings.fee}"></div><div><label>Admin ID</label><input id="sid" value="${esc(db.settings.adminId)}"></div><div><label>Admin Password</label><input id="sp" type="password" value="${esc(db.settings.adminPass)}"></div><div><label>Teacher ID</label><input id="tid" value="${esc(db.settings.teacherId)}"></div><div><label>Teacher Password</label><input id="tp" value="${esc(db.settings.teacherPass)}"></div><div><label>WhatsApp Group Link</label><input id="wg" value="${esc(db.settings.whatsappGroup||'')}" placeholder="https://chat.whatsapp.com/..."> </div></div><label>Fee Reminder Message</label><textarea id="fm">${esc(m.fee||'')}</textarea><label>Absent Reminder Message</label><textarea id="am">${esc(m.absent||'')}</textarea><br><button class="btn" onclick="saveSettings()">💾 Save & Sync</button><button class="btn light" onclick="loadSheets()">↻ Reload Sheets</button></div><div class="card"><b>Database:</b> Google Sheets only. Browser localStorage is not used for student/attendance/fee/marks data.</div>`}
function saveSettings(){db.settings={...db.settings,academy:$('sa').value,teacher:$('st').value,mobile:$('sm').value,fee:Number($('sf').value)||0,adminId:$('sid').value,adminPass:$('sp').value,teacherId:$('tid').value,teacherPass:$('tp').value,whatsappGroup:$('wg').value,messages:{fee:$('fm').value,absent:$('am').value}};applySettings();save();alert('Settings saved to Google Sheets')}
function submitOnlineMark(testId){let t=db.tests.find(x=>x._id===testId);if(!t)return;openModal('Submit Online Test Mark',`<p><b>${esc(t.name)}</b> — Total ${t.total}</p><label>Mark Scored</label><input id="som" type="number" min="0" max="${t.total}"><br><button class="btn green" style="width:100%" onclick="saveOnlineSubmission('${esc(testId)}')">Submit Mark</button>`)}
function saveOnlineSubmission(testId){let t=db.tests.find(x=>x._id===testId),mark=Number($('som').value);if(!t||mark<0||mark>t.total)return alert('Mark சரியாக கொடுக்கவும்');db.onlineMarks.push({_id:'OM'+Date.now(),studentId:currentStudent.id,testId,testName:t.name,mark,total:t.total,date:today(),entryType:'Student Submission'});closeModal();save();alert('✅ Online mark submitted')}
function studentHome(){
  const s=currentStudent,m=monthNow();
  $('pageTitle').textContent='Student Dashboard';
  $('content').innerHTML=`
  <div class="card" style="background:linear-gradient(135deg,#075985,#0ea5e9);color:#fff;border:0">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:32px">👨‍🎓</div>
      <div><div style="font-size:12px;opacity:.8">WELCOME</div><h2 style="margin:4px 0">${esc(s.name)}</h2><div>Class: <b>${esc(s.class)}</b> &nbsp; • &nbsp; ID: <b>${esc(s.id)}</b></div></div>
    </div>
  </div>
  <div class="toolbar"><div><label>Select Month</label><input id="smMonth" type="month" value="${m}" onchange="renderStudentMonth()"></div></div>
  <div id="studentMonth"></div>`;
  renderStudentMonth();
}
function renderStudentMonth(){let s=currentStudent,m=$('smMonth').value,a=db.attendance.filter(x=>x.studentId===s.id&&x.date.startsWith(m)),p=calcPaid(s.id,m),pending=calcPending(s.id,m),fs=db.fees.filter(x=>x.studentId===s.id&&x.date.startsWith(m)),marks=db.marks.filter(x=>x.studentId===s.id&&x.date.startsWith(m));$('studentMonth').innerHTML=`<div class="student-cards"><div class="student-card"><div class="sc-icon">📅</div><div class="sc-label">Present</div><div class="sc-value success">${a.filter(x=>x.status==='Present').length}</div></div><div class="student-card"><div class="sc-icon">⚠️</div><div class="sc-label">Absent</div><div class="sc-value danger">${a.filter(x=>x.status==='Absent').length}</div></div><div class="student-card"><div class="sc-icon">💰</div><div class="sc-label">Paid Fee</div><div class="sc-value">${money(p)}</div></div><div class="student-card"><div class="sc-icon">⏳</div><div class="sc-label">Pending Fee</div><div class="sc-value danger">${money(pending)}</div></div></div><div class="analysis-grid"><div class="card"><h3>📅 Attendance — ${m}</h3><table class="table"><tr><th>Date</th><th>Status</th></tr>${a.map(x=>`<tr><td>${x.date}</td><td><span class="badge ${x.status==='Present'?'ok':'pending'}">${x.status}</span></td></tr>`).join('')||'<tr><td colspan="2">No attendance</td></tr>'}</table></div><div class="card"><h3>💰 Fee History — ${m}</h3><table class="table"><tr><th>Date</th><th>Type</th><th>Amount</th></tr>${fs.map(x=>`<tr><td>${x.date}</td><td>${x.type}</td><td>${money(x.amount+x.extraAmount)}</td></tr>`).join('')||'<tr><td colspan="3">No fee history</td></tr>'}</table></div><div class="card"><h3>📝 Marks — ${m}</h3><table class="table"><tr><th>Date</th><th>Exam</th><th>Mark</th></tr>${marks.map(x=>`<tr><td>${x.date}</td><td>${esc(x.exam)}</td><td>${x.mark}/${x.total}</td></tr>`).join('')||'<tr><td colspan="3">No marks</td></tr>'}</table></div><div class="card"><h3>🧪 Online Tests</h3><table class="table"><tr><th>Test</th><th>Class</th><th>Link</th></tr>${db.tests.filter(t=>!t.class||t.class===s.class||classBand(t.class)===classBand(s.class)).map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.class||'All')}</td><td><a class="btn light" target="_blank" href="${esc(t.link)}">Attend</a> <button class="btn green" onclick="submitOnlineMark('${esc(t._id||'')}')">Submit Mark</button></td></tr>`).join('')||'<tr><td colspan="3">No tests</td></tr>'}</table></div></div><div class="card"><button class="btn" onclick="studentPDFForCurrent()">⬇️ Month PDF</button><button class="btn light" onclick="studentProfileView()">👤 Full Profile</button></div>`}
function studentPDFForCurrent(){let s=currentStudent;openFeature('reports');setTimeout(()=>{if($('rpStudent'))$('rpStudent').value=s.id;if($('rpMonth'))$('rpMonth').value=$('smMonth')?.value||monthNow();studentPDF()},0)}
function studentProfileView(){let s=currentStudent;openModal('My Profile',`<p>Name: <b>${esc(s.name)}</b></p><p>ID: <b>${esc(s.id)}</b></p><p>Class: <b>${esc(s.class)}</b></p><p>Mobile: <b>${esc(s.mobile||'-')}</b></p><p>Parent: <b>${esc(s.parent||'-')}</b></p><p>Address: <b>${esc(s.address||'-')}</b></p>`)}
setRole('teacher');loadSheets();
</script></body></html>
