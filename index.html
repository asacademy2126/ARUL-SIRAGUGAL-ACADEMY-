<style>

.group-tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.group-tab{padding:17px;border-radius:17px;border:2px solid #bae6fd;background:#fff;text-align:left;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}.group-tab.active{background:linear-gradient(135deg,#075985,#0ea5e9);color:#fff;border-color:#075985}.group-name{font-weight:800;font-size:17px}.group-sub{font-size:12px;opacity:.8;margin-top:4px}.group-count{font-size:22px;font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.stat{background:#fff;border-radius:17px;padding:16px;border:1px solid var(--line);box-shadow:var(--shadow)}.stat:nth-child(1){border-top:4px solid var(--blue)}.stat:nth-child(2){border-top:4px solid var(--green)}.stat:nth-child(3){border-top:4px solid var(--red)}.stat:nth-child(4){border-top:4px solid var(--purple)}.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:24px;font-weight:800;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.feature{min-height:125px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.feature:hover{transform:translateY(-2px)}.icon{font-size:31px;margin-bottom:8px}.feature b{font-size:15px}.feature small{color:var(--muted);margin-top:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.toolbar>div{min-width:130px;flex:1}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;white-space:nowrap;font-size:13px}.table th{background:#f0f9ff}.badge{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.ok{background:#dcfce7;color:#166534}.pending{background:#fee2e2;color:#991b1b}.info{background:# @media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.analysis-grid{grid-template-columns:1fr}.top-actions .btn{padding:8px 10px;font-size:12px}}
/* Colorful dashboard cards */
.stat:nth-child(5){border-top:4px solid #06b6d4}.stat:nth-child(6){border-top:4px solid #f59e0b}.feature:nth-child(1){background:linear-gradient(135deg,#eff6ff,#dbeafe)}.feature:nth-child(2){background:linear-gradient(135deg,#ecfdf5,#dcfce7)}.feature:nth-child(3){background:linear-gradient(135deg,#fff7ed,#ffedd5)}.feature:nth-child(4){background:linear-gradient(135deg,#f5f3ff,#ede9fe)}.feature:nth-child(5){background:linear-gradient(135deg,#ecfeff,#cffafe)}.feature:nth-child(6){background:linear-gradient(135deg,#fdf2f8,#fce7f3)}.feature:nth-child(7){background:linear-gradient(135deg,#fffbeb,#fef3c7)}.feature:nth-child(8){background:linear-gradient(135deg,#f0fdfa,#ccfbf1)}.permission-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}.permission-item{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#f8fbff}.permission-item input{width:auto}.class-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-height:180px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:12px}.class-pick label{margin:0;padding:7px;border-radius:9px;background:#f8fafc;font-size:12px}.class-pick input{width:auto}.wa-box{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1px solid #86efac;border-radius:16px;padding:14px}.history-filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:480px){.history-filters,.class-pick{grid-template-columns:repeat(2,1fr)}.permission-grid{grid-template-columns:1fr}.app{padding:8px}.cards{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:12px}.stat .value{font-size:19px}.grid{grid-template-columns:repeat(2,1fr);gap:8px}.feature{min-height:105px;padding:10px}.two{grid-template-columns:1fr}.group-tabs{gap:7px}.group-tab{padding:12px}.group-name{font-size:14px}.group-count{font-size:18px}.table th,.table td{font-size:12px;padding:7px}}
.student-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.student-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);cursor:pointer}.student-card .sc-icon{font-size:28px}.student-card .sc-label{font-size:12px;color:var(--muted);margin-top:8px}.student-card .sc-value{font-size:22px;font-weight:800;margin-top:4px}@media(max-width:800px){.student-cards{grid-template-columns:repeat(2,1fr)}}</style><style>.stat-click{cursor:pointer;transition:.18s}.stat-click:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(2,132,199,.18)}#syncTime{font-size:11px}</style>

<body>
<div id="login" class="login"><div class="login-card">
<img id="loginLogo" class="logo" alt="Academy">
<h1 id="academyTitle">Arul Siragugal Academy</h1><p>Student Management System</p>
<div id="loading" class="notice" style="display:none;text-align:center">⏳ Google Sheets data loading...</div>
<div class="roles"><button id="rAdmin" onclick="setRole('admin')">👑 Admin</button><button id="rTeacher" class="active" onclick="setRole('teacher')">👨‍🏫 Teacher</button><button id="rStudent" onclick="setRole('student')">👨‍🎓 Student</button></div>
<div id="adminLogin" class="hidden"><label>Admin ID</label><input id="adminId"><label>Password</label><input id="adminPass" type="password"><button class="btn" style="width:100%;margin-top:14px" onclick="loginAdmin()">Login</button></div>
<div id="teacherLogin"><label>Teacher ID</label><input id="teacherId"><label>Password</label><input id="teacherPass" type="password"><button class="btn" style="width:100%;margin-top:14px" onclick="loginTeacher()">Login</button></div>
<div id="studentLogin" class="hidden"><label>Student ID</label><input id="studentId"><label>Password</label><input id="studentPass" type="password"><button class="btn" style="width:100%;margin-top:14px" onclick="loginStudent()">Login</button></div>
<div id="loginMsg" class="msg"></div>
</div></div>

<div id="app" class="app hidden"><div class="topbar"><div class="brand"><img id="brandLogo"><div><h2 id="pageTitle">Dashboard</h2><small id="welcome"></small></div></div><div class="top-actions"><span id="syncStatus" class="sync"></span><span id="syncTime" class="sync"></span><button id="homeBtn" class="btn light" onclick="home()">🏠 Home</button><button id="syncBtn" class="btn green" onclick="syncSheets()">☁️ Sync</button><button class="btn red" onclick="logout()">🚪 Exit</button></div></div><main id="content"></main></div>
<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h3 id="modalTitle" style="margin:0">Form</h3><button class="btn light" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>

<script>
const SHEETS_URL='https://script.google.com/macros/s/AKfycbzMAFuKPsGXWJonYqIyqxvNvjLTXG-bUjcbVXEAdulKyh6iuxX7czDZ7CgyE3eybE8/exec';
let db={settings:{academy:'Arul Siragugal Academy',teacher:'Teacher',mobile:'',fee:1000,logo:'',upi:'',whatsappGroup:'',teacherId:'teacher',teacherPass:'1234',adminId:'admin',adminPass:'admin123',sheetsUrl:SHEETS_URL,messages:{fee:'வணக்கம் {student}, உங்கள் {academy} மாத கட்டணம் ₹{amount} நிலுவையில் உள்ளது. தேதி: {date}.',absent:'வணக்கம் {student}, இன்று {academy} வகுப்பிற்கு வரவில்லை. தேதி: {date}.'}},students:[],archivedStudents:[],attendance:[],fees:[],marks:[],onlineMarks:[],tests:[],expenses:[],extraIncome:[],teachers:[],auditLogs:[]};
let role='teacher',currentStudent=null,currentGroup='LKG-5',loaded=false;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toISOString().slice(0,10), monthNow=()=>today().slice(0,7), money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function classBand(c){let x=String(c||'').trim().toLowerCase();if(/^lkg|^ukg/.test(x))return'LKG-5';let m=x.match(/\d+/);if(m){let n=+m[0];if(n>=1&&n<=5)return'LKG-5';if(n>=6&&n<=8)return'6-8'}return'Other'}
function groupLabel(g){return g==='6-8'?'6 – 8':'LKG – 5'}
function setSyncStatus(t){$('syncStatus').textContent=t==='syncing'?'⏳ Syncing…':t==='ok'?'✅ Synced':'⚠️ Sync error'}
function setRole(r){role=r;['admin','teacher','student'].forEach(x=>$(x==='admin'?'rAdmin':x==='teacher'?'rTeacher':'rStudent').classList.toggle('active',x===r));$('adminLogin').classList.toggle('hidden',r!=='admin');$('teacherLogin').classList.toggle('hidden',r!=='teacher');$('studentLogin').classList.toggle('hidden',r!=='student');$('loginMsg').textContent=''}
function applySettings(){document.title=db.settings.academy+' - Management';$('academyTitle').textContent=db.settings.academy;$('brandLogo').src=$('loginLogo').src=db.settings.logo||'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" rx="20" fill="#075985"/><text x="50" y="63" text-anchor="middle" fill="white" font-size="34">AS</text></svg>')}
function normalize(d){
  if(!d||typeof d!=='object')return false;
  if(d.success===false || d.error) return false;
  // Apps Script versions may wrap the database in db/data/result.
  if(d.db&&typeof d.db==='object')d=d.db;
  else if(d.data&&typeof d.data==='object'&&!Array.isArray(d.data))d=d.data;
  else if(d.result&&typeof d.result==='object'&&!Array.isArray(d.result))d=d.result;

  const clean=(v,def='')=>v===undefined||v===null?def:String(v).trim();
  let incomingSettings=d.settings;
  if(Array.isArray(incomingSettings)) incomingSettings=incomingSettings[0]||{};
  if(typeof incomingSettings==='string'){try{incomingSettings=JSON.parse(incomingSettings)}catch(e){incomingSettings={}}}
  incomingSettings=incomingSettings&&typeof incomingSettings==='object'?incomingSettings:{};

  // Accept credentials whether Apps Script returns them under settings,
  // auth/admin/teacher, or as top-level fields.
  if(d.auth&&typeof d.auth==='object') incomingSettings={...incomingSettings,...d.auth};
  if(d.admin&&typeof d.admin==='object') incomingSettings={...incomingSettings,adminId:d.admin.id??d.admin.adminId,adminPass:d.admin.password??d.admin.adminPass};
  if(d.teacher&&typeof d.teacher==='object') incomingSettings={...incomingSettings,teacherId:d.teacher.id??d.teacher.teacherId,teacherPass:d.teacher.password??d.teacher.teacherPass,teacher:d.teacher.name??incomingSettings.teacher};
  ['adminId','adminPass','teacherId','teacherPass','academy','teacher','mobile','upi','whatsappGroup'].forEach(k=>{
    if(d[k]!==undefined && d[k]!==null) incomingSettings[k]=d[k];
  });

  db.students=(d.students||[]).map(s=>({...s,
    id:clean(s.id),name:clean(s.name),class:clean(s.class),mobile:clean(s.mobile),
    parent:clean(s.parent),address:clean(s.address),birthday:clean(s.birthday),
    password:clean(s.password,'1234'),monthlyFee:Number(s.monthlyFee)||0
  }));
  db.archivedStudents=Array.isArray(d.archivedStudents)?d.archivedStudents:[];
  db.attendance=(d.attendance||[]).map(x=>({...x,studentId:clean(x.studentId),date:clean(x.date),status:clean(x.status)}));
  db.fees=(d.fees||[]).map(x=>({...x,studentId:clean(x.studentId),date:clean(x.date),amount:Number(x.amount)||0,extraAmount:x.extraAmount===''||x.extraAmount==null?0:Number(x.extraAmount)||0,type:clean(x.type,'Payment')}));
  db.marks=(d.marks||[]).map((x,i)=>({...x,_id:clean(x._id,'M'+i+'_'+clean(x.date)),studentId:clean(x.studentId),date:clean(x.date)}));
  db.onlineMarks=(d.onlineMarks||[]).map((x,i)=>({...x,_id:clean(x._id,'OM'+i+'_'+clean(x.date)),studentId:clean(x.studentId)}));
  db.tests=(d.tests||[]).map((x,i)=>({...x,_id:clean(x._id,'T'+i+'_'+clean(x.date))}));
  db.expenses=(d.expenses||[]).map((x,i)=>({...x,_id:clean(x._id,'E'+i+'_'+clean(x.date))}));
  db.extraIncome=(d.extraIncome||d.income||[]).map((x,i)=>({...x,_id:clean(x._id,'I'+i+'_'+clean(x.date)),amount:Number(x.amount)||0,date:clean(x.date),source:clean(x.source||x.category||'Extra Income'),note:clean(x.note)}));

  db.teachers=(d.teachers||[]).map(t=>{let perms=t.permissions||t.permissionJson||{};if(typeof perms==='string'){try{perms=JSON.parse(perms)}catch(e){perms={}}}perms=perms&&typeof perms==='object'?perms:{};const pBool=(obj,...keys)=>{for(const k of keys){if(obj[k]!==undefined&&obj[k]!==null)return String(obj[k]).toLowerCase()!=='false'&&obj[k]!==0&&obj[k]!=='';}return true};const rawClasses=t.allowedClasses??t.allowedClass??t.classes??'';let cls=rawClasses;if(typeof cls==='string'){try{const parsed=JSON.parse(cls);if(Array.isArray(parsed))cls=parsed}catch(e){}if(!Array.isArray(cls))cls=String(rawClasses||'').split(',').map(x=>clean(x)).filter(Boolean)}cls=Array.isArray(cls)?cls.map(x=>clean(x)).filter(Boolean):[];return {...t,id:clean(t.id||t.teacherId||t.loginId),name:clean(t.name||t.teacher||t.teacherName),password:clean(t.password||t.pass||t.teacherPass||t.loginPassword),mobile:clean(t.mobile||t.mobileNo),allowedClasses:cls,permissions:{students:pBool(perms,'students','studentPermission','studentsPermission')&&pBool(t,'students','studentPermission','studentsPermission'),attendance:pBool(perms,'attendance','attendancePermission')&&pBool(t,'attendance','attendancePermission'),fees:pBool(perms,'fees','feesPermission')&&pBool(t,'fees','feesPermission'),marks:pBool(perms,'marks','marksPermission')&&pBool(t,'marks','marksPermission'),onlineTests:pBool(perms,'onlineTests','onlineTest','onlineTestsPermission','onlineTestPermission')&&pBool(t,'onlineTests','onlineTest','onlineTestsPermission','onlineTestPermission')}}});

  db.auditLogs=Array.isArray(d.auditLogs)?d.auditLogs.map(x=>({...x,action:clean(x.action),module:clean(x.module),teacherId:clean(x.teacherId),teacherName:clean(x.teacherName),dateTime:clean(x.dateTime),recordId:clean(x.recordId),details:clean(x.details)})):[];

  const old=db.settings||{};
  const msgs=incomingSettings.messages||old.messages||{};
  db.settings={...old,...incomingSettings,
    academy:clean(incomingSettings.academy,old.academy||'Arul Siragugal Academy'),
    teacher:clean(incomingSettings.teacher,old.teacher||'Teacher'),
    mobile:clean(incomingSettings.mobile,old.mobile),
    upi:clean(incomingSettings.upi,old.upi),
    whatsappGroup:clean(incomingSettings.whatsappGroup,old.whatsappGroup),
    teacherId:clean(incomingSettings.teacherId,old.teacherId||'teacher'),
    teacherPass:clean(incomingSettings.teacherPass,old.teacherPass||'1234'),
    adminId:clean(incomingSettings.adminId,old.adminId||'admin'),
    adminPass:clean(incomingSettings.adminPass,old.adminPass||'admin123'),
    fee:Number(incomingSettings.fee??old.fee)||0,
    messages:{fee:clean(msgs.fee,old.messages?.fee||''),absent:clean(msgs.absent,old.messages?.absent||'')},
    lastSyncAt:clean(incomingSettings.lastSyncAt,incomingSettings.syncedAt||old.lastSyncAt||''),
    sheetsUrl:SHEETS_URL
  };

  // If the main teacher account is stored only in teachers[], allow it for login.
  if(!db.settings.teacherId && db.teachers[0]) db.settings.teacherId=db.teachers[0].id;
  if(!db.settings.teacherPass && db.teachers[0]) db.settings.teacherPass=db.teachers[0].password;
  applySettings();
  return true;
}
async function getSheetsData(){
  const actions=['get','getData','read','load'];
  let last='';
  for(const action of actions){
    try{
      const r=await fetch(SHEETS_URL+'?action='+action+'&_='+Date.now(),{cache:'no-store'});
      const t=await r.text(); last=t;
      let d; try{d=JSON.parse(t)}catch(e){d=null}
      if(d && typeof d==='object' && normalize(d))return d;
    }catch(e){last=String(e)}
  }
  throw new Error(last.slice(0,250)||'No response');
}
async function loadSheets(){
  $('loading').style.display='block';
  $('loading').textContent='⏳ Google Sheets data loading...';
  try{
    await getSheetsData();
    loaded=true;
    setSyncStatus('ok');
    $('loading').textContent='✅ Google Sheets connected';
    setTimeout(()=>{$('loading').style.display='none'},900);
  }catch(e){
    loaded=false;
    setSyncStatus('error');
    $('loading').textContent='❌ Google Sheets connection failed — check Apps Script deployment / URL';
    console.error(e);
  }
}
async function syncSheets(silent=false){
  if(!loaded){if(!silent)alert('Google Sheets data இன்னும் load ஆகவில்லை.');return;}
  setSyncStatus('syncing');
  const payload={source:'Arul Siragugal Academy',syncedAt:new Date().toISOString(),settings:{...db.settings,sheetsUrl:SHEETS_URL},students:db.students||[],archivedStudents:db.archivedStudents||[],attendance:db.attendance||[],fees:db.fees||[],marks:db.marks||[],onlineMarks:db.onlineMarks||[],tests:db.tests||[],expenses:db.expenses||[],extraIncome:db.extraIncome||[],auditLogs:db.auditLogs||[],teachers:(db.teachers||[]).map(t=>({...t,allowedClasses:Array.isArray(t.allowedClasses)?t.allowedClasses:t.allowedClasses||[],permissions:t.permissions||{},studentPermission:!!t.permissions?.students,studentsPermission:!!t.permissions?.students,attendancePermission:!!t.permissions?.attendance,feesPermission:!!t.permissions?.fees,marksPermission:!!t.permissions?.marks,onlineTestPermission:!!t.permissions?.onlineTests,permissionJson:JSON.stringify(t.permissions||{})})),};
  try{
    let frame=document.getElementById('asaSyncFrame');
    if(!frame){frame=document.createElement('iframe');frame.id='asaSyncFrame';frame.name='asaSyncFrame';frame.style.display='none';document.body.appendChild(frame)}
    let form=document.getElementById('asaSyncForm');
    if(!form){form=document.createElement('form');form.id='asaSyncForm';form.method='POST';form.target='asaSyncFrame';form.enctype='application/x-www-form-urlencoded';form.style.display='none';document.body.appendChild(form)}
    form.action=SHEETS_URL;
    form.innerHTML='';
    const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(payload);form.appendChild(input);

function studentPDF(){let s=db.students.find(x=>x.id===$('rpStudent').value),m=$('rpMonth').value;if(!s)return;let att=db.attendance.filter(a=>a.studentId===s.id&&a.date.startsWith(m)),fs=db.fees.filter(f=>f.studentId===s.id&&f.date.startsWith(m)),marks=db.marks.filter(x=>x.studentId===s.id&&x.date.startsWith(m)),paid=calcPaid(s.id,m),extra=calcExtra(s.id,m),p=calcPending(s.id,m);pdf('Student Report',`<p><b>${esc(s.name)}</b> | ${esc(s.class)} | ${m}</p><div class="grid"><div class="box">Present<br><b>${att.filter(a=>a.status==='Present').length}</b></div><div class="box">Absent<br><b>${att.filter(a=>a.status==='Absent').length}</b></div><div class="box">Paid<br><b>${money(paid)}</b></div><div class="box">Pending<br><b>${money(p)}</b></div></div><h3>Attendance</h3><table><tr><th>Date</th><th>Status</th></tr>${att.map(a=>`<tr><td>${a.date}</td><td>${a.status}</td></tr>`).join('')}</table><h3>Fees</h3><table><tr><th>Date</th><th>Type</th><th>Amount</th></tr>${fs.map(f=>`<tr><td>${f.date}</td><td>${f.type}</td><td>${money(f.amount+f.extraAmount)}</td></tr>`).join('')}</table><h3>Marks</h3><table><tr><th>Date</th><th>Exam</th><th>Mark</th></tr>${marks.map(x=>`<tr><td>${x.date}</td><td>${esc(x.exam)}</td><td>${x.mark}/${x.total}</td></tr>`).join('')}</table>`)}

function financePage(){if(role!=='admin')return alert('Admin only');let years=[...new Set([...db.fees.map(x=>String(x.date).slice(0,4)),...db.expenses.map(x=>String(x.date).slice(0,4))].filter(x=>/^\d{4}$/.test(x)))].sort().reverse();let y=String(new Date().getFullYear());let m=monthNow();$('content').innerHTML=`<div class="cards"><div class="stat"><div class="label">Total Students</div><div class="value">${db.students.length}</div></div><div class="stat"><div class="label">Current Month Fees</div><div class="value success">${money(db.fees.filter(f=>String(f.date).startsWith(m)).reduce((a,f)=>a+f.amount+f.extraAmount,0))}</div></div><div class="stat"><div class="label">Current Month Pending</div><div class="value danger">${money(db.students.reduce((a,s)=>a+calcPending(s.id,m),0))}</div></div><div class="stat"><div class="label">Current Month Expenses</div><div class="value">${money(db.expenses.filter(e=>String(e.date).startsWith(m)).reduce((a,e)=>a+Number(e.amount||0),0))}</div></div></div><div class="analysis-grid"><div class="card"><h3>📈 Year-wise Income / Expense</h3><table class="table"><tr><th>Year</th><th>Income</th><th>Expense</th><th>Net</th></tr>${years.map(yy=>{let inc=db.fees.filter(f=>String(f.date).startsWith(yy)).reduce((a,f)=>a+f.amount+f.extraAmount,0),ex=db.expenses.filter(e=>String(e.date).startsWith(yy)).reduce((a,e)=>a+Number(e.amount||0),0);return `<tr><td>${yy}</td><td class="success">${money(inc)}</td><td class="danger">${money(ex)}</td><td>${money(inc-ex)}</td></tr>`}).join('')||'<tr><td colspan="4">No finance data</td></tr>'}</table></div><div class="card"><h3>📅 Month-wise Income / Expense — ${y}</h3><table class="table"><tr><th>Month</th><th>Income</th><th>Expense</th><th>Net</th></tr>${Array.from({length:12},(_,i)=>{let mm=`${y}-${String(i+1).padStart(2,'0')}`,inc=db.fees.filter(f=>String(f.date).startsWith(mm)).reduce((a,f)=>a+f.amount+f.extraAmount,0),ex=db.expenses.filter(e=>String(e.date).startsWith(mm)).reduce((a,e)=>a+Number(e.amount window.historyPDF2=function(){const d=historyData();const cls=$('hClass').value||'All Classes',f=$('hFrom').value,t=$('hTo').value;pdf('All History Report',`<p><b>Period:</b> ${f} → ${t} &nbsp; <b>Class:</b> ${esc(cls)}</p><h3>Attendance</h3><table><tr><th>Date</th><th>Student</th><th>Class</th><th>Status</th></tr>${d.attendance.map(x=>{const s=db.students.find(s=>String(s.id)===String(x.studentId));return `<tr><td>${x.date}</td><td>${esc(s?.name||x.studentId)}</td><td>${esc(s?.class||'')}</td><td>${esc(x.status)}</td></tr>`}).join('')}</table><h3>Fees</h3><table><tr><th>Date</th><th>Student</th><th>Class</th><th>Type</th><th>Amount</th></tr>${d.fees.map(x=>{const s=db.students.find(s=>String(s.id)===String(x.studentId));return `<tr><td>${x.date}</td><td>${esc(s?.name||x.studentId)}</td><td>${esc(s?.class||'')}</td><td>${esc(x.type)}</td><td>${money(Number(x.amount||0)+Number(x.extraAmount||0))}</td></tr>`}).join('')}</table><h3>Regular Marks</h3><table><tr><th>Date</th><th>Student</th><th>Class</th><th>Exam</th><th>Mark</th></tr>${d.marks.map(x=>{const s=db.students.find(s=>String(s.id)===String(x.studentId));return `<tr><td>${x.date}</td><td>${esc(s?.name||x.studentId)}</td><td>${esc(s?.class||'')}</td><td>${esc(x.exam||'')}</td><td>${x.mark}/${x.total}</td></tr>`}).join('')}</table><h3>Online Test Marks</h3><table><tr><th>Date</th><th>Student</th><th>Class</th><th>Test</th><th>Mark</th></tr>${d.onlineMarks.map(x=>{const s=db.students.find(s=>String(s.id)===String(x.studentId));return `<tr><td>${esc(x.date||'')}</td><td>${esc(s?.name||x.studentId)}</td><td>${esc(s?.class||'')}</td><td>${esc(x.testName||x.exam||'')}</td><td>${x.mark}/${x.total}</td></tr>`}).join('')}</table><h3>Online Tests</h3><table><tr><th>Date</th><th>Test</th><th>Class</th><th>Subject</th></tr>${d.tests.map(x=>`<tr><td>${esc(x.date||'')}</td><td>${esc(x.name||'')}</td><td>${esc(x.class||'All')}</td><td>${esc(x.subject||'')}</td></tr>`).join('')}</table><h3>Finance</h3><table><tr><th>Date</th>< window.exportAllExcel=function(){const d=historyData();const rows=[['Date','Type','Student ID','Student Name','Class','Status/Description','Amount','Mark','Total']];const add=(date,type,s,desc,amount='',mark='',total='')=>rows.push([date,type,s?.id||'',s?.name||'',s?.class||'',desc,amount,mark,total]);d.attendance.forEach(x=>{const s=db.students.find(s=>String(s.id)===String(x.studentId));add(x.date,'Attendance',s,x.status)});d.fees.forEach(x=>{const s=db.students.find(s=>String(s.id)===String(x.studentId));add(x.date,'Fee',s,x.type,Number(x.amount||0)+Number(x.extraAmount||0))});d.marks.forEach(x=>{const s=db.students.find(s=>String(s.id)===String(x.studentId));add(x.date,'Mark',s,x.exam,'',x.mark,x.total)});d.onlineMarks.forEach(x=>{const s=db.students.find(s=>String(s.id)===String(x.studentId));add(x.date||'', 'Online Mark',s,x.testName||x.exam||'', '',x.mark,x.total)});d.tests.forEach(x=>add(x.date,'Online Test',null,`${x.name||''} / ${x.class||'All'} / ${x.subject||''}`));d.expenses.forEach(x=>add(x.date,'Expense',null,x.category||x.note||'',Number(x.amount||0)));d.extraIncome.forEach(x=>add(x.date,'Extra Income',null,x.source||x.note||'',Number(x.amount||0)));const escX=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const html='<html><head><meta charset="UTF-8"></head><body><table border="1"><tr>'+rows[0].map(x=>`<th>${escX(x)}</th>`).join('')+'</tr>'+rows.slice(1).map(r=>'<tr>'+r.map(x=>`<td>${escX(x)}</td>`).join('')+'</tr>').join('')+'</table></body></html>';const blob=new Blob([html],{type:'application/vnd.ms-excel'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Arul_Siragugal_All_Details_${today()}.xls`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};

setRole('teacher');loadSheets();
(function(){
  db.extraIncome=db.extraIncome||[];
  window.currentTeacher=window.currentTeacher||null;
  function addAudit(module,action,recordId,details){const actor=role==='admin'?'Admin':(currentTeacher?.name||'Teacher');db.auditLogs=db.auditLogs||[];db.auditLogs.push({module,action,recordId:String(recordId??''),teacherId:role==='admin'?'admin':(currentTeacher?.id||''),teacherName:actor,dateTime:new Date().toISOString(),details:String(details??'')});if(db.auditLogs.length>1000)db.auditLogs=db.auditLogs.slice(-1000);}
  function teacherAllowedClassList(){
    if(role!=='teacher') return null;
    const t=currentTeacher; if(!t) return null;
    let a=t.allowedClasses;
    if(Array.isArray(a)) return a.map(v=>String(v).trim()).filter(Boolean);
    if(a===undefined||a===null||String(a).trim()==='') return null;
    return String(a).split(',').map(v=>v.trim()).filter(Boolean);
  }
  function teacherCanClass(c){
    if(role!=='teacher') return true;
    const list=teacherAllowedClassList();
    if(!list||!list.length) return false;
    if(list.some(x=>String(x).trim().toUpperCase()==='ALL')) return true;
    const cc=String(c||'').trim().toUpperCase();
    const band=classBand(c).toUpperCase();
    return list.some(x=>{
      const v=String(x).trim().toUpperCase();
      return v===cc || v===band || (v==='LKG-5' && band==='LKG-5') || (v==='6-8' && band==='6-8');
    });
  }
  function teacherCanStudent(id){const s=db.students.find(x=>String(x.id)===String(id));return !!s&&teacherCanClass(s.class);}
  window.groupStudents=function(){
    if(role==='student'&&currentStudent)return [currentStudent];
    if(role!=='teacher')return db.students.filter(s=>classBand(s.class)===currentGroup);
    return db.students.filter(s=>classBand(s.class)===currentGroup&&teacherCanClass(s.class));
  };
  window.setSyncTime=function(iso){const el=$('syncTime');if(!el)return;if(!iso){el.textContent='';return}const d=new Date(iso);el.textContent='🕒 '+(isNaN(d.getTime())?String(iso):d.toLocaleString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}));};
  const originalSyncSheets=window.syncSheets;
  window.syncSheets=async function(silent=false){db.settings=db.settings||{};const now=new Date().toISOString();db.settings.lastSyncAt=now;setSyncTime(now);return originalSyncSheets(silent);};
  setInterval(()=>{if(loaded&&document.visibilityState!=='hidden')loadSheets();},60000);
  function allGroupSummary(){
    return ['LKG-5','6-8'].map(g=>{
      const rows=db.students.filter(s=>classBand(s.class)===g&&(role!=='teacher'||teacherCanClass(s.class)));
      const present=rows.filter(s=>db.attendance.some(a=>a.studentId===s.id&&a.date===today()&&a.status==='Present'));
      const absent=rows.filter(s=>db.attendance.some(a=>a.studentId===s.id&&a.date===today()&&a.status==='Absent'));
      return{g,rows,present,absent};
    });

window.adminClearHistoryByPeriod=function(){
  if(role!=='admin'){alert('Admin only');return;}
  const from=$('clearFrom').value, to=$('clearTo').value, type=$('clearType').value;
  if(!from || !to){alert('From Date மற்றும் To Date select செய்யவும்.');return;}
  if(from>to){alert('From Date, To Date-க்கு முன்னதாக இருக்க வேண்டும்.');return;}
  const fields=type==='all'?['attendance','fees','marks','onlineMarks','auditLogs']:[type];
  let removed=0;
  fields.forEach(k=>{
    const arr=Array.isArray(db[k])?db[k]:[];
    const before=arr.length;
    db[k]=arr.filter(x=>{
      const d=String(x.date||x.dateTime||'').slice(0,10);
      return !(d && d>=from && d<=to);
    });
    removed += before-db[k].length;
  });
  db.auditLogs=db.auditLogs||[];
  db.auditLogs.push({
    action:'History Clear',
    module:'Admin History Clear',
    teacherId:'Admin',
    teacherName:'Admin',
    dateTime:new Date().toISOString(),
    recordId:'',
    details:`Cleared ${type} from ${from} to ${to}; removed ${removed} record(s)`
  });
  save();
  alert(`✅ History Clear completed.\nRemoved: ${removed} record(s)\nPeriod: ${from} → ${to}`);
  adminHistoryClearPage();
};

    const incomeByGroup=g=>db.students.filter(s=>classBand(s.class)===g).reduce((a,s)=>a+calcPaid(s.id,m)+calcExtra(s.id,m),0),g1=incomeByGroup('LKG-5'),g2=incomeByGroup('6-8');
    const extra=db.extraIncome.filter(x=>String(x.date).startsWith(m)).reduce((a,x)=>a+Number(x.amount||0),0),expenses=db.expenses.filter(x=>String(x.date).startsWith(m)).reduce((a,x)=>a+Number(x.amount||0),0),totalIncome=g1+g2+extra;
    $('content').innerHTML=`<div class="cards"><div class="stat"><div class="label">Current Month Income</div><div class="value success">${money(totalIncome)}</div></div><div class="stat"><div class="label">LKG–5 Income</div><div class="value">${money(g1)}</div></div><div class="stat"><div class="label">6–8 Income</div><div class="value">${money(g2)}</div></div><div class="stat"><div class="label">Extra Income</div><div class="value">${money(extra)}</div></div><div class="stat"><div class="label">Current Month Expense</div><div class="value danger">${money(expenses)}</div></div><div class="stat"><div class="label">Net Income</div><div class="value">${money(totalIncome-expenses)}</div></div></div><div class="card"><div class="toolbar"><div><h3 style="margin:0">📈 Current Month Finance — ${m}</h3><small class="muted">2 Group Income + Extra Income − Expense · Google Sheets: ExtraIncome + Expenses</small></div><button class="btn green" onclick="extraIncomeForm()">➕ Add Extra Income</button><button class="btn amber" onclick="expenseForm()">➕ Add Expense</button></div><table class="table"><tr><th>Source</th><th>Amount</th></tr><tr><td>📚 LKG – 5</td><td>${money(g1)}</td></tr><tr><td>📘 6 – 8</td><td>${money(g2)}</td></tr><tr><td>➕ Extra Income</td><td>${money(extra)}</td></tr><tr><th>Total Income</th><th>${money(totalIncome)}</th></tr><tr><td>💸 Expense</td><td class="danger">${money(expenses)}</td></tr><tr><th>Net</th><th>${money(totalIncome-expenses)}</th></tr></table></div><div class="card"><h3>📚 Class-wise Income Details — ${m}</h3><div class="table-wrap"><table class="table"><tr><th>Class</th><th>Students</th><th>Paid Fee</th><th>Extra Fee</th><th>Total Income</th></tr>${[...new Set(db.students.map(s=>String(s.class||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(c=>{const ss=db.students.filter(s=>String(s.class||'').trim()===c),paidC=ss.reduce((a,s)=>a+calcPaid(s.id,m),0),extraC=ss.reduce((a,s)=>a+calcExtra(s.id,m),0);return `<tr><td><b>${esc(c)}</b></td><td>${ss.length}</td><td>${money(paidC)}</td><td>${money(extraC)}</td><td><b>${money(paidC+extraC)}</b></td></tr>`}).join('')||'<tr><td colspan="5">No class data</td></tr>'}</table></div></div><div class="analysis-grid"><div class="card"><h3>➕ Extra Income History — ${m}</h3><table class="table"><tr><th>Date</th><th>Source</th><th>Note</th><th>Amount</th><th>Action</th></tr>${db.extraIncome.filter(x=>String(x.date).startsWith(m)).slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.source)}</td><td>${esc(x.note||'-')}</td><td>${money(x.amount)}</td><td><button class="btn red" onclick="deleteExtraIncome('${esc(x._id)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No extra income</td></tr>'}</table></div><div class="card"><h3>💸 Expense History — ${m}</h3><table class="table"><tr><th>Date</th><th>Category</th><th>Note</th><th>Amount</th><th>Action</th></tr>${db.expenses.filter(x=>String(x.date).startsWith(m)).slice().reverse().map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.note)}</td><td>${money(e.amount)}</td><td><button class="btn red" onclick="deleteExpense('${esc(e._id||'')}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No expenses</td></tr>'}</table></div></div>`;
  };
  window.extraIncomeForm=function(){openModal('➕ Add Extra Income',`<label>Source / Income Type</label><input id="iiSource" placeholder="Example: Other Income"><label>Note</label><input id="iiNote"><label>Amount</label><input id="iiAmount" type="number"><label>Date</label><input id="iiDate" type="date" value="${today()}"><br><button class="btn green" style="width:100%" onclick="saveExtraIncome()">💾 Save Extra Income</button>`);};
  window.saveExtraIncome=function(){const amount=Number($('iiAmount').value)||0;if(amount<=0)return alert('Amount தேவை');const actor=role==='admin'?'Admin':(currentTeacher?.name||'Teacher');db.extraIncome.push({_id:'I'+Date.now(),source:$('iiSource').value.trim()||'Extra Income',note:$('iiNote').value.trim(),amount,date:$('iiDate').value,teacherId:role==='admin'?'admin':(currentTeacher?.id||''),teacherName:actor,updatedAt:new Date().toISOString(),lastUpdatedBy:actor});addAudit('ExtraIncome','Save',amount,`${$('iiSource').value.trim()||'Extra Income'} • ₹${amount}`);closeModal();save();financePage();};
  window.deleteExtraIncome=function(id){if(!confirm('Extra income delete செய்யவா?'))return;db.extraIncome=db.extraIncome.filter(x=>String(x._id)!==String(id));save();financePage();};
  setSyncTime(db.settings?.lastSyncAt);
})();

</script></body></html>
