<body>
<div id="login" class="login"><div class="login-card">

<script>
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzMAFuKPsGXWJonYqIyqxvNvjLTXG-bUjcbVXEAdulKyh6iuxX7czDZ7CgyE3eybE8/exec';

let db={settings:{academy:'Arul Siragugal Academy',teacher:'Teacher',mobile:'',fee:1000,logo:'',upi:'',whatsappGroup:'',teacherId:'teacher',teacherPass:'1234',adminId:'admin',adminPass:'admin123',sheetsUrl:SHEETS_URL,messages:{fee:'வணக்கம் {student}, உங்கள் {academy} மாத கட்டணம் ₹{amount} நிலுவையில் உள்ளது. தேதி: {date}.',absent:'வணக்கம் {student}, இன்று {academy} வகுப்பிற்கு வரவில்லை. தேதி: {date}.'}},students:[],archivedStudents:[],attendance:[],fees:[],marks:[],onlineMarks:[],tests:[],expenses:[],extraIncome:[],teachers:[],auditLogs:[]};
let role='teacher',currentStudent=null,currentGroup='LKG-5',loaded=false;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function classBand(c){let x=String(c||'').trim().toLowerCase();if(/^lkg|^ukg/.test(x))return'LKG-5';let m=x.match(/\d+/);if(m){let n=+m[0];if(n>=1&&n<=5)return'LKG-5';if(n>=6&&n<=8)return'6-8'}return'Other'}

function setRole(r){role=r;['admin','teacher','student'].forEach(x=>$(x==='admin'?'rAdmin':x==='teacher'?'rTeacher':'rStudent').classList.toggle('active',x===r));$('adminLogin').classList.toggle('hidden',r!=='admin');$('teacherLogin').classList.toggle('hidden',r!=='teacher');$('studentLogin').classList.toggle('hidden',r!=='student');$('loginMsg').textContent=''}

function normalize(d){

async function getSheetsData(){
  const actions=['get','getData','read','load'];
  let last='';
  for(const action of actions){
    try{
      const r=await fetch(SHEETS_URL+'?action='+action+'&_='+Date.now(),{cache:'no-store'});
      const t=await r.text(); last=t;
      let d; try{d=JSON.parse(t)}catch(e){d=null}
      if(d && typeof d==='object' && normalize(d))return d;
    }catch(e){last=String(e)}
  }
  throw new Error(last.slice(0,250)||'No response');
}

async function loadSheets(){
  setSyncStatus('syncing');
  $('loading').style.display='block';
  $('loading').textContent='⏳ Google Sheets data loading...';
  try{
    await getSheetsData();
    loaded=true;
    setSyncStatus('ok');
    $('loading').textContent='✅ Google Sheets connected';
    setTimeout(()=>{$('loading').style.display='none'},900);
  }catch(e){
    loaded=false;
    setSyncStatus('error');
    $('loading').textContent='❌ Google Sheets connection failed — check Apps Script deployment / URL';
    console.error(e);
  }
}

async function syncSheets(silent=false){

  setSyncStatus('syncing');
  const payload={source:'Arul Siragugal Academy',syncedAt:new Date().toISOString(),settings:{...db.settings,sheetsUrl:SHEETS_URL},students:db.students||[],archivedStudents:db.archivedStudents||[],attendance:db.attendance||[],fees:db.fees||[],marks:db.marks||[],onlineMarks:db.onlineMarks||[],tests:db.tests||[],expenses:db.expenses||[],extraIncome:db.extraIncome||[],auditLogs:db.auditLogs||[],teachers:(db.teachers||[]).map(t=>({...t,allowedClasses:Array.isArray(t.allowedClasses)?t.allowedClasses:t.allowedClasses||[],permissions:t.permissions||{},studentPermission:!!t.permissions?.students,studentsPermission:!!t.permissions?.students,attendancePermission:!!t.permissions?.attendance,feesPermission:!!t.permissions?.fees,marksPermission:!!t.permissions?.marks,onlineTestPermission:!!t.permissions?.onlineTests,permissionJson:JSON.stringify(t.permissions||{})}))};

    if(!frame){frame=document.createElement('iframe');frame.id='asaSyncFrame';frame.name='asaSyncFrame';frame.style.display='none';document.body.appendChild(frame)}
    let form=document.getElementById('asaSyncForm');
    if(!form){form=document.createElement('form');form.id='asaSyncForm';form.method='POST';form.target='asaSyncFrame';form.enctype='application/x-www-form-urlencoded';form.style.display='none';document.body.appendChild(form)}
    form.action=SHEETS_URL;
    form.innerHTML='';
    const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(payload);form.appendChild(input);
    form.submit();
    setSyncStatus('ok');
    if(!silent)alert('✅ Google Sheets sync request sent.');
  }catch(e){setSyncStatus('error');if(!silent)alert('❌ Google Sheets Sync failed: '+e.message);}
}

function studentDetails(id){let s=db.students.find(x=>x.id===id);if(!s)return;let m=monthNow();openModal('Student Profile',`<div class="card admin-profile-card"><h3>👨‍🎓 ${esc(s.name)}</h3><p><span class="profile-chip">ID ${esc(s.id)}</span> <span class="profile-chip">Class ${esc(s.class||'-')}</span></p><p>📱 Mobile: <b>${esc(s.mobile||'-')}</b></p><p>👪 Parent: <b>${esc(s.parent||'-')}</b></p><p>🏠 Address: <b>${esc(s.address||'-')}</b></p><p>💰 Monthly Tuition: <b>${money(s.monthlyFee)}</b></p>${s.mobile?`<p><a class="btn" href="tel:${esc(s.mobile)}">📞 Call</a> <a class="btn light" href="sms:${esc(s.mobile)}?body=${encodeURIComponent('Student '+s.name+' — '+db.settings.academy)}">✉️ SMS</a></p>`:''}${role==='admin'?`<hr><p>📅 ${m} — Paid: <b class="success">${money(calcPaid(s.id,m))}</b> &nbsp; Pending: <b class="danger">${money(calcPending(s.id,m))}</b></p>`:''}</div>`)}

function attendancePage(){let cls=[...new Set(groupStudents().map(s=>s.class).filter(Boolean))].sort();$('content').innerHTML=`<div class="card"><div class="toolbar"><div><label>Date</label><input id="attDate" type="date" value="${today()}" onchange="renderAtt()"></div><div><label>Class</label><select id="attClass" onchange="renderAtt()"><option value="">Select Class</option>${cls.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div></div><div id="attBox"></div></div><div class="card"><div class="wa-box"><h3 style="margin-top:0">📲 Absent WhatsApp Group</h3><div class="muted">Selected date / class absent students-ஐ ஒரே click-ல் WhatsApp Group-க்கு அனுப்பலாம்.</div><button class="btn green" style="margin-top:10px" onclick="shareAbsentToGroup()">📲 Send All Absent Details to Group</button><button class="btn light" style="margin-top:10px" onclick="copyAbsentDetails()">📋 Copy Absent Details</button></div><div class="card"><h3>Absent Reminder — selected date/class</h3><div id="absentBox"></div></div></div>`;renderAtt()}
function absentRowsForSelection(){const d=$('attDate')?.value||today(),c=$('attClass')?.value||'';return db.students.filter(s=>teacherCanClass(s.class)&&(!c||String(s.class)===c)&&db.attendance.some(a=>a.studentId===s.id&&a.date===d&&a.status==='Absent')).map(s=>({s,date:d}));}
window.copyAbsentDetails=function(){const rows=absentRowsForSelection();if(!rows.length)return alert('இந்த date/class-ல் absent students இல்லை.');const d=rows[0].date,c=$('attClass')?.value||'All Classes';const text=`${db.settings.academy}\n📅 Absent Details — ${d}\n🏫 Class: ${c}\n\n`+rows.map((x,i)=>`${i+1}. ${x.s.name} — ${x.s.class}${x.s.mobile?' — '+x.s.mobile:''}`).join('\n');navigator.clipboard?.writeText(text);return text};
window.shareAbsentToGroup=function(){const link=(db.settings.whatsappGroup||'').trim();if(!link)return alert('Settings → WhatsApp Group Link add செய்யவும்.');const text=copyAbsentDetails();if(!text)return;window.open(link,'_blank');setTimeout(()=>alert('✅ Absent details copied. WhatsApp Group open செய்யப்பட்டுவிட்டது. Group-ல் Paste செய்து Send செய்யவும்.'),300);};
function renderAtt(){let d=$('attDate').value,c=$('attClass').value,ss=groupStudents().filter(s=>!c||s.class===c),existing={};db.attendance.filter(a=>a.date===d).forEach(a=>existing[a.studentId]=a.status);$('attBox').innerHTML=`<div class="table-wrap"><table class="table"><tr><th>#</th><th>Student</th><th>Class</th><th>P / A</th><th>Status</th><th>Last Update</th></tr>${ss.map((s,i)=>{let st=existing[s.id]||'';return `<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${esc(s.class)}</td><td><div class="p-a"><button class="p ${st==='Present'?'active':''}" onclick="markAtt('${esc(s.id)}','${d}','Present')">✓ P</button><button class="a ${st==='Absent'?'active':''}" onclick="markAtt('${esc(s.id)}','${d}','Absent')">✕ A</button></div></td><td><span class="badge ${st==='Present'?'ok':st==='Absent'?'pending':'info'}">${st||'Not Marked'}</span></td><td>${esc((db.attendance.find(a=>a.studentId===s.id&&a.date===d)||{}).teacherName||'-')}</td></tr>`}).join('')||'<tr><td colspan="6">Students இல்லை.</td></tr>'}</table></div>`;let abs=ss.filter(s=>existing[s.id]==='Absent');$('absentBox').innerHTML=abs.map(s=>`<div class="notice"><b>${esc(s.name)}</b> — ${esc(s.class)} ${s.mobile?`<a class="btn light" href="https://wa.me/${waPhone(s.mobile)}?text=${encodeURIComponent(fillAbsent(s))}" target="_blank">💬 WhatsApp Reminder</a> <a class="btn light" href="sms:${esc(s.mobile)}?body=${encodeURIComponent(fillAbsent(s))}" target="_blank">💬 SMS Reminder</a>`:''}</div>`).join('')||'<span class="muted">Absent students இல்லை.</span>'}
function markAtt(id,date,status){if(role==='teacher'&&currentTeacher?.permissions?.attendance===false)return alert('Attendance permission இல்லை');if(!teacherCanClass(db.students.find(s=>s.id===id)?.class))return alert('இந்த class-க்கு Teacher permission இல்லை');db.attendance=db.attendance.filter(a=>!(a.studentId===id&&a.date===date));const actor=role==='admin'?'Admin':(currentTeacher?.name||'Teacher'), actorId=role==='admin'?'admin':(currentTeacher?.id||''); db.attendance.push({studentId:id,date,status,enteredBy:actor,teacherId:actorId,teacherName:actor,updatedAt:new Date().toISOString(),lastUpdatedBy:actor}); addAudit('Attendance','Save',id,`${status} • ${date}`);renderAtt();save()}
function waPhone(p){let n=String(p||'').replace(/\D/g,'');return n.length===10?'91'+n:n}
function fillAbsent(s){return db.settings.messages.absent.replaceAll('{student}',s.name).replaceAll('{academy}',db.settings.academy).replaceAll('{date}',new Date().toLocaleDateString('en-IN'))}

function feesPage(){let m=monthNow(),cls=[...new Set(groupStudents().map(s=>s.class).filter(Boolean))].sort();$('content').innerHTML=`<div class="card"><div class="toolbar"><div><label>Month</label><input id="feeMonth" type="month" value="${m}" onchange="renderFees()"></div><div><label>Class</label><select id="feeClass" onchange="renderFees()"><option value="">All Classes</option>${cls.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><button class="btn" onclick="feeForm()">➕ Add Payment</button><button class="btn amber" onclick="extraForm()">➕ Extra Fee</button></div><div id="feeBox"></div></div>`;renderFees()}
function renderFees(){let m=$('feeMonth').value,c=$('feeClass').value,ss=groupStudents().filter(s=>!c||s.class===c);let paid=ss.reduce((a,s)=>a+calcPaid(s.id,m),0),pending=ss.reduce((a,s)=>a+calcPending(s.id,m),0),extraPending=ss.reduce((a,s)=>a+calcExtraPending(s.id,m),0),extraPaid=ss.reduce((a,s)=>a+calcExtraPaid(s.id,m),0);const groupFeeSummary=['LKG-5','6-8'].map(g=>{const gs=db.students.filter(s=>classBand(s.class)===g&&(role!=='teacher'||teacherCanClass(s.class)));return {g,n:gs.length,paid:gs.reduce((a,s)=>a+calcPaid(s.id,m),0),pending:gs.reduce((a,s)=>a+calcPending(s.id,m),0),extraPending:gs.reduce((a,s)=>a+calcExtraPending(s.id,m),0)};});$('feeBox').innerHTML=`<div class="cards"><div class="stat"><div class="label">Students</div><div class="value">${ss.length}</div></div>${role==='admin'?`<div class="stat"><div class="label">Tuition Paid</div><div class="value success">${money(paid)}</div></div><div class="stat"><div class="label">Tuition Pending</div><div class="value danger">${money(pending)}</div></div><div class="stat"><div class="label">Extra Fee Pending</div><div class="value danger">${money(extraPending)}</div></div>`:''}</div><div class="card"><h3 style="margin-top:0">📊 Group-wise Fees Summary — ${m}</h3><div class="table-wrap"><table class="table"><tr><th>Group</th><th>Students</th><th>Tuition Paid</th><th>Tuition Pending</th><th>Extra Pending</th></tr>${groupFeeSummary.map(x=>`<tr><td><b>${groupLabel(x.g)}</b></td><td>${x.n}</td><td class="success"><b>${money(x.paid)}</b></td><td class="danger"><b>${money(x.pending)}</b></td><td class="danger"><b>${money(x.extraPending)}</b></td></tr>`).join('')}</table></div></div><div class="table-wrap"><table class="table"><tr><th>Student</th><th>Class</th><th>Monthly Tuition</th><th>Extra Fee Pending</th><th>Tuition Paid</th><th>Tuition Pending</th><th>Last Collected By</th><th>Action</th></tr>${ss.map(s=>{let p=calcPaid(s.id,m),ep=calcExtraPending(s.id,m),pen=calcPending(s.id,m);return `<tr><td>${esc(s.name)}</td><td>${esc(s.class)}</td><td>${money(s.monthlyFee)}</td><td><span class="badge ${ep?'pending':'ok'}">${money(ep)}</span></td><td>${money(p)}</td><td><span class="badge ${pen?'pending':'ok'}">${money(pen)}</span></td><td>${esc((db.fees.filter(f=>f.studentId===s.id&&String(f.date).startsWith(m)).slice().sort((a,b)=>String(b.updatedAt||b.date).localeCompare(String(a.updatedAt||a.date)))[0]||{}).teacherName||'-')}</td><td>${pen?`<button class="btn green" onclick="feeForm('${esc(s.id)}')">💳 Tuition Paid</button>`:''} ${ep?`<button class="btn amber" onclick="extraPaymentForm('${esc(s.id)}')">💳 Extra Paid</button>`:''} ${(pen||ep)&&s.mobile?`<a class="btn light" target="_blank" href="https://wa.me/${waPhone(s.mobile)}?text=${encodeURIComponent(fillFee(s,pen,ep))}">💬 Reminder</a> <a class="btn light" target="_blank" href="sms:${esc(s.mobile)}?body=${encodeURIComponent(fillFee(s,pen,ep))}">💬 SMS</a>`:''} <button class="btn light" onclick="studentFeeHistory('${esc(s.id)}')">History</button></td></tr>`}).join('')||'<tr><td colspan="8">Students இல்லை.</td></tr>'}</table></div>`}
function fillFee(s,a,extraPending=0){let amount=Number(a||0)+Number(extraPending||0);return db.settings.messages.fee.replaceAll('{student}',s.name).replaceAll('{amount}',amount).replaceAll('{academy}',db.settings.academy).replaceAll('{date}',new Date().toLocaleDateString('en-IN'))}
function feeForm(id=''){let m=$('feeMonth')?.value||monthNow();openModal('Record Tuition Fee Payment',`<label>Student</label><select id="feeStudent">${groupStudents().map(s=>`<option value="${esc(s.id)}" ${s.id===id?'selected':''}>${esc(s.name)} — ${esc(s.class)}</option>`).join('')}</select><div class="two"><div><label>Paid Tuition Amount</label><input id="feeAmount" type="number"></div><div><label>Discount Amount</label><input id="feeDiscount" type="number" value="0" min="0"></div></div><div class="notice mini">This payment is only for Tuition Fee. Extra Fees are separate.</div><label>Date</label><input id="feeDate" type="date" value="${today()}"><br><button class="btn green" style="width:100%" onclick="saveFee()">Save Tuition Payment</button>`)}
function saveFee(){if(role==='teacher'&&currentTeacher?.permissions?.fees===false)return alert('Fees permission இல்லை');let id=$('feeStudent').value,a=Number($('feeAmount').value),discount=Number($('feeDiscount').value)||0,d=$('feeDate').value;if(!id||a<0||discount<0||(a<=0&&discount<=0))return alert('Paid / Discount amount சரியாக கொடுக்கவும்');if(role==='teacher'&&!teacherCanStudent(id))return alert('இந்த student class-க்கு Teacher permission இல்லை.');let pendingBefore=calcPending(id,d.slice(0,7));if(a+discount>pendingBefore)return alert('Tuition Paid + Discount amount pending-ஐ விட அதிகமாக இருக்க முடியாது.');const actor=role==='admin'?'Admin':(currentTeacher?.name||'Teacher'), actorId=role==='admin'?'admin':(currentTeacher?.id||''); db.fees.push({studentId:id,amount:a,discount,extraAmount:0,date:d,type:'Payment',collectedBy:actor,teacherId:actorId,teacherName:actor,updatedAt:new Date().toISOString(),lastUpdatedBy:actor}); addAudit('Fees','Save',id,`Payment ₹${a} • ${d}`);closeModal();feesPage();save()}
function studentFeeHistory(id){let s=db.students.find(x=>x.id===id),rows=db.fees.map((x,i)=>({...x,_i:i})).filter(x=>x.studentId===id).slice().reverse();openModal('Fee History — '+(s?.name||id),`<div class="table-wrap"><table class="table"><tr><th>Date</th><th>Type</th><th>Purpose</th><th>Paid</th><th>Discount</th><th>Amount</th><th>Action</th></tr>${rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.extraType||'Monthly Fee')}</td><td>${money(x.amount||0)}</td><td>${money(x.discount||0)}</td><td>${money((x.amount||0)+(x.extraAmount||0))}</td><td><button class="btn light" onclick="editFeeRecord(${x._i})">✏️ Edit</button><button class="btn red" onclick="deleteFeeRecord(${x._i},'${esc(id)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="7">No fee history</td></tr>'}</table></div>`)}
function editFeeRecord(i){let x=db.fees[i];if(!x)return;openModal('Edit Fee',`<label>Date</label><input id="efDate" type="date" value="${esc(x.date)}"><label>Amount</label><input id="efAmount" type="number" value="${Number(x.amount||x.extraAmount||0)}"><label>Discount</label><input id="efDiscount" type="number" value="${Number(x.discount||0)}"><label>Type</label><select id="efType"><option ${x.type==='Payment'?'selected':''}>Payment</option><option ${x.type==='Extra'?'selected':''}>Extra</option></select><label>Purpose</label><input id="efPurpose" value="${esc(x.extraType||'')}"><br><button class="btn" style="width:100%" onclick="saveFeeEdit(${i})">Save Changes</button>`)}
function saveFeeEdit(i){if(role==='teacher'&&currentTeacher?.permissions?.fees===false)return alert('Fees permission இல்லை');let x=db.fees[i],a=Number($('efAmount').value);if(!a)return alert('Amount தேவை');let type=$('efType').value;const actor=role==='admin'?'Admin':(currentTeacher?.name||'Teacher');x.date=$('efDate').value;x.type=type;x.extraType=$('efPurpose').value;x.amount=type==='Payment'?a:0;x.discount=type==='Payment'?(Number($('efDiscount').value)||0):0;x.extraAmount=type==='Extra'?a:0;x.collectedBy=x.collectedBy||actor;x.teacherId=role==='admin'?'admin':(currentTeacher?.id||'');x.teacherName=actor;x.updatedAt=new Date().toISOString();x.lastUpdatedBy=actor;addAudit('Fees','Update',x.studentId,`${type} ₹${a} • ${x.date}`);closeModal();save();feesPage()}
function deleteFeeRecord(i,id){if(!confirm('Fee record delete செய்யவா?'))return;db.fees.splice(i,1);closeModal();save();setTimeout(()=>studentFeeHistory(id),200)}
function extraForm(){openModal('Extra Fee',`<label>Student</label><select id="exStudent">${groupStudents().map(s=>`<option value="${esc(s.id)}">${esc(s.name)} — ${esc(s.class)}</option>`).join('')}</select><label>Purpose</label><select id="exType"><option>Book</option><option>Pen</option><option>Notebook</option><option>Exam</option><option>Other</option></select><label>Amount</label><input id="exAmount" type="number"><label>Date</label><input id="exDate" type="date" value="${today()}"><br><button class="btn" style="width:100%" onclick="saveExtra()">Save Extra Fee</button>`)}
function extraPaymentForm(id=''){let m=$('feeMonth')?.value||monthNow(),s=db.students.find(x=>String(x.id)===String(id));if(!s)return;let pending=calcExtraPending(id,m);if(pending<=0)return alert('இந்த student-க்கு Extra Fee Pending இல்லை.');openModal('Record Extra Fee Payment',`<p><b>${esc(s.name)}</b> — Extra Fee Pending: <b class="danger">${money(pending)}</b></p><label>Paid Extra Fee</label><input id="extraPayAmount" type="number" min="0" max="${pending}" value="${pending}"><label>Date</label><input id="extraPayDate" type="date" value="${today()}"><div class="notice mini">Extra Fee payment Tuition Fee / Income-ல் சேராது. இது Extra Fee History-ல் மட்டும் வரும்.</div><br><button class="btn amber" style="width:100%" onclick="saveExtraPayment('${esc(id)}')">Save Extra Fee Payment</button>`)}
function saveExtraPayment(id){if(role==='teacher'&&currentTeacher?.permissions?.fees===false)return alert('Fees permission இல்லை');let a=Number($('extraPayAmount').value)||0,d=$('extraPayDate').value,m=d.slice(0,7),pending=calcExtraPending(id,m);if(a<=0||a>pending)return alert('Extra Fee payment pending amount-க்குள் இருக்க வேண்டும்.');if(role==='teacher'&&!teacherCanStudent(id))return alert('இந்த student class-க்கு Teacher permission இல்லை.');const actor=role==='admin'?'Admin':(currentTeacher?.name||'Teacher');db.fees.push({studentId:id,amount:a,discount:0,extraAmount:0,date:d,type:'ExtraPayment',extraType:'Extra Fee Payment',collectedBy:actor,teacherId:role==='admin'?'admin':(currentTeacher?.id||''),teacherName:actor,updatedAt:new Date().toISOString(),lastUpdatedBy:actor});addAudit('Fees','Extra Fee Payment',id,`Extra Payment ₹${a} • ${d}`);closeModal();feesPage();save()}
function saveExtra(){if(role==='teacher'&&currentTeacher?.permissions?.fees===false)return alert('Fees permission இல்லை');let id=$('exStudent').value,a=Number($('exAmount').value),d=$('exDate').value;if(!id||a<=0)return alert('Amount சரியாக கொடுக்கவும்');if(role==='teacher'&&!teacherCanStudent(id))return alert('இந்த student class-க்கு Teacher permission இல்லை.');const actor=role==='admin'?'Admin':(currentTeacher?.name||'Teacher');db.fees.push({studentId:id,amount:0,extraAmount:a,date:d,type:'Extra',extraType:$('exType').value,collectedBy:actor,teacherId:role==='admin'?'admin':(currentTeacher?.id||''),teacherName:actor,updatedAt:new Date().toISOString(),lastUpdatedBy:actor});addAudit('Fees','Extra Fee',id,`${$('exType').value} ₹${a} • ${d}`);closeModal();feesPage();save()}

function marksPage(){let cls=[...new Set(groupStudents().map(s=>s.class).filter(Boolean))].sort();$('content').innerHTML=`<div class="card"><div class="toolbar"><div><label>Month</label><input id="markMonth" type="month" value="${monthNow()}" onchange="renderMarks()"></div><div><label>Date (optional)</label><input id="markDate" type="date" onchange="renderMarks()"></div><div><label>Class</label><select id="markClass" onchange="renderMarks()"><option value="">All Classes</option>${cls.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><button class="btn" onclick="markForm()">➕ Add Mark</button><button class="btn green" onclick="shareMarksGroup()">💬 WhatsApp Group</button></div><div id="markBox"></div></div>`;renderMarks()}

function markForm(editId=''){let old=db.marks.find(x=>x._id===editId)||{},ss=groupStudents();openModal(editId?'Edit Mark':'Add Mark',`<label>Student</label><select id="mkStudent">${ss.map(s=>`<option value="${esc(s.id)}" ${s.id===old.studentId?'selected':''}>${esc(s.name)} — ${esc(s.class)}</option>`).join('')}</select><label>Exam / Subject</label><input id="mkExam" value="${esc(old.exam||'')}"><div class="two"><div><label>Mark</label><input id="mkMark" type="number" value="${old.mark??''}"></div><div><label>Total</label><input id="mkTotal" type="number" value="${old.total||100}"></div></div><label>Date</label><input id="mkDate" type="date" value="${old.date||today()}"><br><button class="btn" style="width:100%" onclick="saveMark('${esc(editId)}')">Save Mark</button>`)}

    const rows=classes.map(c=>{
      const ss=db.students.filter(s=>String(s.class)===c);
      const tp=ss.reduce((a,s)=>a+calcPaid(s.id,m),0);
      const tpen=ss.reduce((a,s)=>a+calcPending(s.id,m),0);
      const ttotal=ss.reduce((a,s)=>a+Number(s.monthlyFee||0),0);
      const ep=ss.reduce((a,s)=>a+calcExtraPaid(s.id,m),0);
      const epen=ss.reduce((a,s)=>a+calcExtraPending(s.id,m),0);
      const etotal=ss.reduce((a,s)=>a+calcExtra(s.id,m),0);
      return `<tr class="finance-row"><td><span class="class-chip" style="background:${tone(c)}">${esc(c)}</span></td><td class="student-cell">${ss.length}</td><td class="tuition-paid">${money(tp)}</td><td class="tuition-pending">${money(tpen)}</td><td class="tuition-total">${money(ttotal)}</td><td class="extra-paid">${money(ep)}</td><td class="extra-pending">${money(epen)}</td><td class="extra-total">${money(etotal)}</td></tr>`;
    }).join('')||'<tr><td colspan="8">No class data</td></tr>';
    $('content').innerHTML=`<div class="card finance-card-accent"><div class="toolbar"><div><label>Finance Month</label><input id="financeMonth" type="month" value="${m}" onchange="financePage()"></div><div><label>Class</label><select id="financeClass" onchange="financePage()"><option value="">All Classes</option>${classes.map(c=>`<option value="${esc(c)}" ${selectedClass===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><button class="btn green" onclick="extraIncomeForm()">➕ Add Extra Income</button><button class="btn amber" onclick="expenseForm()">➕ Add Expenditure</button><div class="finance-toolbar-actions"><button class="btn light" onclick="financePDF()">📄 Month-wise Finance PDF</button><button class="btn light" onclick="financeYearPDF()">📊 Year-wise Income PDF</button></div></div></div>
    <div class="cards">
      <div class="stat"><div class="label">Tuition Fee Income</div><div class="value success">${money(tuition)}</div></div>
      <div class="stat"><div class="label">Extra Income</div><div class="value">${money(extraIncome)}</div></div>
      <div class="stat"><div class="label">Total Income</div><div class="value success">${money(totalIncome)}</div></div>
      <div class="stat"><div class="label">Expense</div><div class="value danger">${money(expenses)}</div></div>
      <div class="stat"><div class="label">Net Finance</div><div class="value">${money(net)}</div></div>
      <div class="stat"><div class="label">Extra Fees Paid — Separate</div><div class="value" style="color:#7c3aed">${money(extraPaid)}</div></div>
      <div class="stat"><div class="label">Extra Fees Pending — Separate</div><div class="value danger">${money(extraPending)}</div></div>
      <div class="stat"><div class="label">Extra Fees Total — Separate</div><div class="value" style="color:#be185d">${money(extraTotal)}</div></div>
    </div>
    <div class="card finance-card-accent"><h3>📚 Finance — Class-wise Tuition & Extra Fee Details — ${m}</h3><div class="table-wrap"><table class="table finance-table"><tr><th>Class</th><th>Students</th><th>Tuition Paid</th><th>Tuition Pending</th><th>Tuition Fee Total</th><th>Extra Fees Paid</th><th>Extra Fees Pending</th><th>Extra Fees Total</th></tr>${rows}<tr class="finance-row"><th>Total</th><th>${students.length}</th><th class="tuition-paid">${money(tuition)}</th><th class="tuition-pending">${money(tuitionPending)}</th><th class="tuition-total">${money(tuitionTotal)}</th><th class="extra-paid">${money(extraPaid)}</th><th class="extra-pending">${money(extraPending)}</th><th class="extra-total">${money(extraTotal)}</th></tr></table></div></div>
    <div class="card finance-card-accent"><h3>📊 Finance Summary — ${m}</h3><div class="finance-summary-grid"><table class="table finance-summary-table"><tr><th colspan="2">Income — Tuition + Extra Income Only</th></tr><tr class="income-main"><td>Tuition Fees (Collected)</td><td>${money(tuition)}</td></tr><tr class="income-main"><td>Extra Income</td><td>${money(extraIncome)}</td></tr><tr class="total-row"><th>Total Income</th><th>${money(totalIncome)}</th></tr><tr><td>Expenditure</td><td class="danger">${money(expenses)}</td></tr><tr class="net-row"><th>Net Finance</th><th>${money(net)}</th></tr></table><table class="table finance-summary-table"><tr><th colspan="2">🧾 Student Extra Fees — Separate</th></tr><tr class="extra-separate"><td>Extra Fees Paid</td><td>${money(extraPaid)}</td></tr><tr class="extra-separate"><td>Extra Fees Pending</td><td class="danger">${money(extraPending)}</td></tr><tr class="extra-separate"><th>Extra Fees Total</th><th>${money(extraTotal)}</th></tr></table></div><div class="notice mini finance-extra-note">ℹ️ Student Extra Fees are NOT included in Tuition Fees, Tuition Paid, Tuition Pending, Extra Income, Total Income or Net Finance. Extra Fees are displayed and tracked separately as Paid + Pending + Total.</div></div>
    <div class="card extra-card-accent"><h3>🧾 Extra Fees History — ${m}</h3><div class="table-wrap"><table class="table finance-table"><tr><th>Date</th><th>Student</th><th>Class</th><th>Type</th><th>Purpose</th><th>Amount</th></tr>${db.fees.filter(x=>String(x.date).startsWith(m)&&(x.type==='Extra'||x.type==='ExtraPayment')).map(x=>{const s=db.students.find(s=>String(s.id)===String(x.studentId));return `<tr class="finance-row"><td>${esc(x.date)}</td><td class="student-cell">${esc(s?.name||x.studentId)}</td><td><span class="class-chip" style="background:${tone(s?.class||'Other')}">${esc(s?.class||'-')}</span></td><td>${esc(x.type==='Extra'?'Extra Fee':'Extra Fee Payment')}</td><td>${esc(x.extraType||'Extra Fee')}</td><td>${money(x.type==='Extra'?x.extraAmount:x.amount)}</td></tr>`}).join('')||'<tr><td colspan="6">No extra fee history</td></tr>'}</table></div></div>
    <div class="analysis-grid"><div class="card"><h3>➕ Extra Income — ${m}</h3><table class="table"><tr><th>Date</th><th>Source</th><th>Note</th><th>Amount</th><th>Action</th></tr>${db.extraIncome.filter(x=>String(x.date).startsWith(m)).slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.source)}</td><td>${esc(x.note||'-')}</td><td>${money(x.amount)}</td><td><button class="btn red" onclick="deleteExtraIncome('${esc(x._id)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No extra income</td></tr>'}</table></div><div class="card"><h3>💸 Expenditure — ${m}</h3><table class="table"><tr><th>Date</th><th>Category</th><th>Note</th><th>Amount</th><th>Action</th></tr>${db.expenses.filter(x=>String(x.date).startsWith(m)).slice().reverse().map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.category||'')}</td><td>${esc(e.note||'')}</td><td>${money(e.amount)}</td><td><button class="btn red" onclick="deleteExpense('${esc(e._id||'')}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No expenditure</td></tr>'}</table></div></div>`;
  };
  window.financeYearPDF=function(){
    if(role!=='admin')return alert('Admin only');
    const selected=$('financeMonth')?.value||monthNow();
    const year=String(selected).slice(0,4)||String(new Date().getFullYear());
    const months=Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,'0')}`);
    const rows=months.map(m=>{
      const tuition=db.students.reduce((a,s)=>a+calcPaid(s.id,m),0);
      const extraIncome=db.extraIncome.filter(x=>String(x.date).startsWith(m)).reduce((a,x)=>a+Number(x.amount||0),0);
      const total=tuition+extraIncome;
      const expense=db.expenses.filter(x=>String(x.date).startsWith(m)).reduce((a,x)=>a+Number(x.amount||0),0);
      return {m,tuition,extraIncome,total,expense,net:total-expense};
    });
    const totals=rows.reduce((a,r)=>({tuition:a.tuition+r.tuition,extraIncome:a.extraIncome+r.extraIncome,total:a.total+r.total,expense:a.expense+r.expense,net:a.net+r.net}),{tuition:0,extraIncome:0,total:0,expense:0,net:0});
    pdf(`Year-wise Income Report — ${year}`,`<p><b>Year:</b> ${year}</p><h3>Monthly Income Summary</h3><table><tr><th>Month</th><th>Tuition Fees</th><th>Extra Income</th><th>Total Income</th><th>Expenditure</th><th>Net Finance</th></tr>${rows.map(r=>`<tr><td>${r.m}</td><td>${money(r.tuition)}</td><td>${money(r.extraIncome)}</td><td>${money(r.total)}</td><td>${money(r.expense)}</td><td>${money(r.net)}</td></tr>`).join('')}<tr><th>Year Total</th><th>${money(totals.tuition)}</th><th>${money(totals.extraIncome)}</th><th>${money(totals.total)}</th><th>${money(totals.expense)}</th><th>${money(totals.net)}</th></tr></table><p><b>Note:</b> Student Extra Fees are separate and are not included in Tuition Fees, Extra Income, Total Income or Net Finance.</p>`);
  };
  window.financePDF=function(){if(role!=='admin')return alert('Admin only');const m=$('financeMonth')?.value||monthNow(),c=$('financeClass')?.value||'All Classes',ss=db.students.filter(s=>!$('financeClass')?.value||String(s.class)===$('financeClass').value),tuition=ss.reduce((a,s)=>a+calcPaid(s.id,m),0),pending=ss.reduce((a,s)=>a+calcPending(s.id,m),0),tuitionTotal=ss.reduce((a,s)=>a+Number(s.monthlyFee||0),0),extraPaid=ss.reduce((a,s)=>a+calcExtraPaid(s.id,m),0),extraPending=ss.reduce((a,s)=>a+calcExtraPending(s.id,m),0),extraTotal=ss.reduce((a,s)=>a+calcExtra(s.id,m),0),extraIncome=db.extraIncome.filter(x=>String(x.date).startsWith(m)).reduce((a,x)=>a+Number(x.amount||0),0),expenses=db.expenses.filter(x=>String(x.date).startsWith(m)).reduce((a,x)=>a+Number(x.amount||0),0);pdf('Finance Report',`<p><b>Month:</b> ${m} &nbsp; <b>Class:</b> ${esc(c)}</p><h3>Finance Summary</h3><table><tr><th>Item</th><th>Amount</th></tr><tr><td>Tuition Fees</td><td>${money(tuition)}</td></tr><tr><td>Extra Income</td><td>${money(extraIncome)}</td></tr><tr><th>Total Income</th><th>${money(tuition+extraIncome)}</th></tr><tr><td>Expenditure</td><td>${money(expenses)}</td></tr><tr><th>Net Finance</th><th>${money(tuition+extraIncome-expenses)}</th></tr></table><h3>Class-wise Tuition + Extra Fees (Separate)</h3><table><tr><th>Class</th><th>Students</th><th>Tuition Paid</th><th>Tuition Pending</th><th>Tuition Total</th><th>Extra Paid</th><th>Extra Pending</th><th>Extra Total</th></tr>${[...new Set(ss.map(s=>s.class).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true})).map(k=>{const r=ss.filter(s=>s.class===k),p=r.reduce((a,s)=>a+calcPaid(s.id,m),0),q=r.reduce((a,s)=>a+calcPending(s.id,m),0),tt=r.reduce((a,s)=>a+Number(s.monthlyFee||0),0),ep=r.reduce((a,s)=>a+calcExtraPaid(s.id,m),0),eq=r.reduce((a,s)=>a+calcExtraPending(s.id,m),0),et=r.reduce((a,s)=>a+calcExtra(s.id,m),0);return `<tr><td>${esc(k)}</td><td>${r.length}</td><td>${money(p)}</td><td>${money(q)}</td><td>${money(tt)}</td><td>${money(ep)}</td><td>${money(eq)}</td><td>${money(et)}</td></tr>`}).join('')}</table><p><b>Separate Extra Fees:</b> Paid ${money(extraPaid)} | Pending ${money(extraPending)} | Total ${money(extraTotal)}. Extra Fees are excluded from Finance Income and Net Finance.</p>`) };

  window.expenseForm=function(){openModal('💸 Add Expenditure',`<label>Category</label><input id="expcat" placeholder="Example: Electricity / Rent / Materials"><label>Note</label><input id="expnote"><label>Amount</label><input id="expamount" type="number"><label>Date</label><input id="expdate" type="date" value="${today()}"><br><button class="btn amber" style="width:100%" onclick="saveExpense()">💾 Save Expenditure</button>`)};
  window.saveExpense=function(){const amount=Number($('expamount').value)||0,category=$('expcat').value.trim(),note=$('expnote').value.trim(),date=$('expdate').value;if(amount<=0)return alert('Expenditure amount தேவை');if(!category)return alert('Category தேவை');const actor=role==='admin'?'Admin':(currentTeacher?.name||'Teacher');db.expenses.push({_id:'E'+Date.now(),category,note,amount,date,teacherId:role==='admin'?'admin':(currentTeacher?.id||''),teacherName:actor,updatedAt:new Date().toISOString(),lastUpdatedBy:actor});addAudit('Expenses','Save',amount,`${category} • ₹${amount}`);closeModal();financePage();save();};
  window.deleteExpense=function(id){if(!confirm('Expenditure delete செய்யவா?'))return;db.expenses=db.expenses.filter(x=>String(x._id)!==String(id));save();financePage();};

  window.extraIncomeForm=function(){openModal('➕ Add Extra Income',`<label>Source / Income Type</label><input id="iiSource" placeholder="Example: Other Income"><label>Note</label><input id="iiNote"><label>Amount</label><input id="iiAmount" type="number"><label>Date</label><input id="iiDate" type="date" value="${today()}"><br><button class="btn green" style="width:100%" onclick="saveExtraIncome()">💾 Save Extra Income</button>`);};
  window.saveExtraIncome=function(){const amount=Number($('iiAmount').value)||0;if(amount<=0)return alert('Amount தேவை');const actor=role==='admin'?'Admin':(currentTeacher?.name||'Teacher');db.extraIncome.push({_id:'I'+Date.now(),source:$('iiSource').value.trim()||'Extra Income',note:$('iiNote').value.trim(),amount,date:$('iiDate').value,teacherId:role==='admin'?'admin':(currentTeacher?.id||''),teacherName:actor,updatedAt:new Date().toISOString(),lastUpdatedBy:actor});addAudit('ExtraIncome','Save',amount,`${$('iiSource').value.trim()||'Extra Income'} • ₹${amount}`);closeModal();save();financePage();};
  window.deleteExtraIncome=function(id){if(!confirm('Extra income delete செய்யவா?'))return;db.extraIncome=db.extraIncome.filter(x=>String(x._id)!==String(id));save();financePage();};
  
  window.settingsPage=function(){
    if(role!=='admin')return alert('Admin only');let m=db.settings.messages||{};$('content').innerHTML=`<div class="card"><h3>⚙️ Admin Settings</h3><div class="two"><div><label>Academy Name</label><input id="sa" value="${esc(db.settings.academy)}"></div><div><label>Academy Logo URL</label><input id="slogo" value="${esc(db.settings.logo||'')}" placeholder="https://.../logo.png"><input id="slogoFile" type="file" accept="image/*" style="margin-top:7px"><small class="muted">URL அல்லது image upload. Save செய்ததும் login + dashboard logo update ஆகும்.</small></div><div><label>Teacher Name</label><input id="st" value="${esc(db.settings.teacher)}"></div><div><label>Mobile</label><input id="sm" value="${esc(db.settings.mobile)}"></div><div><label>Default Monthly Fee</label><input id="sf" type="number" value="${db.settings.fee}"></div><div><label>Admin ID</label><input id="sid" value="${esc(db.settings.adminId)}"></div><div><label>Admin Password</label><input id="sp" type="password" value="${esc(db.settings.adminPass)}"></div><div><label>Teacher ID</label><input id="tid" value="${esc(db.settings.teacherId)}"></div><div><label>Teacher Password</label><input id="tp" value="${esc(db.settings.teacherPass)}"></div><div><label>WhatsApp Group Link</label><input id="wg" value="${esc(db.settings.whatsappGroup||'')}" placeholder="https://chat.whatsapp.com/..."> </div></div><label>Fee Reminder Message</label><textarea id="fm">${esc(m.fee||'')}</textarea><label>Absent Reminder Message</label><textarea id="am">${esc(m.absent||'')}</textarea><br><button class="btn" onclick="saveSettings()">💾 Save & Sync</button><button class="btn light" onclick="loadSheets()">↻ Reload Sheets</button></div><div class="card"><b>Database:</b> Google Sheets only. Browser localStorage is not used for student/attendance/fee/marks data.</div>`;
  };

  window.saveSettings=async function(){const file=$('slogoFile')?.files?.[0];let logo=$('slogo')?.value.trim()||'';if(file){if(file.size>1500000)return alert('Logo image 1.5MB-க்கு கீழே இருக்க வேண்டும்.');logo=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});}$('slogo').value=logo;db.settings={...db.settings,academy:$('sa').value,teacher:$('st').value,mobile:$('sm').value,fee:Number($('sf').value)||0,adminId:$('sid').value,adminPass:$('sp').value,teacherId:$('tid').value,teacherPass:$('tp').value,whatsappGroup:$('wg').value,logo,messages:{fee:$('fm').value,absent:$('am').value}};applySettings();save();alert('Settings saved to Google Sheets')};

  setSyncTime(db.settings?.lastSyncAt);
})();
</script>
</body>
</html>
