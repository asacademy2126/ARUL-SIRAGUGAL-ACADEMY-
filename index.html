<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arul Siragugal Academy</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fc;
}

header{
background:#0d47a1;
color:white;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.page{
display:none;
padding:20px;
}

#loginPage{
display:block;
height:100vh;
background:linear-gradient(135deg,#0d47a1,#1976d2);
display:flex;
justify-content:center;
align-items:center;
}

.login-box{
width:350px;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,.3);
}

.login-box h2{
text-align:center;
margin-bottom:20px;
color:#0d47a1;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
padding:12px;
width:100%;
background:#0d47a1;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:white;
padding:25px;
border-radius:10px;
text-align:center;
box-shadow:0 0 10px rgba(0,0,0,.15);
cursor:pointer;
}

.card:hover{
transform:scale(1.03);
transition:.3s;
}

.back{
width:150px;
margin-bottom:20px;
}
</style>

</head>

<body>

<div id="loginPage">

<div class="login-box">

<h2>🎓 Arul Siragugal Academy</h2>

<input id="user" placeholder="Username">

<input id="pass" type="password" placeholder="Password">

<button onclick="login()">
Teacher Login
</button>

</div>

</div>

<div id="dashboardPage" class="page">

<header>
🎓 Arul Siragugal Academy
</header>

<div class="grid">

<div class="card" onclick="showStudents()">
<h2>👨‍🎓 Students</h2>
<p>Manage Students</p>
</div>

<div class="card">
<h2>📅 Attendance</h2>
</div>

<div class="card">
<h2>💰 Fees</h2>
</div>

<div class="card">
<h2>📝 Exams</h2>
</div>

<div class="card">
<h2>📚 Homework</h2>
</div>

<div class="card">
<h2>📊 Reports</h2>
</div>

</div>

</div>

<div id="studentsPage" class="page">

<button class="back" onclick="backDashboard()">⬅ Dashboard</button>

<h2>Student Management</h2>

<input id="studentName" placeholder="Student Name">

<input id="studentClass" placeholder="Class">

<button onclick="addStudent()">
Add Student
</button>

<br><br>

<table border="1" width="100%" id="table">

<tr>

<th>ID</th>

<th>Name</th>

<th>Class</th>

</tr>

</table>

</div>

<script>

let id=1;

function login(){

let u=document.getElementById("user").value;

let p=document.getElementById("pass").value;

if(u=="admin" && p=="1234"){

document.getElementById("loginPage").style.display="none";

document.getElementById("dashboardPage").style.display="block";

}
else{

alert("Invalid Login");

}

}

function showStudents(){

document.getElementById("dashboardPage").style.display="none";

document.getElementById("studentsPage").style.display="block";

}

function backDashboard(){

document.getElementById("studentsPage").style.display="none";

document.getElementById("dashboardPage").style.display="block";

}

function addStudent(){

let name=document.getElementById("studentName").value;

let cls=document.getElementById("studentClass").value;

if(name=="") return;

let table=document.getElementById("table");

let row=table.insertRow();

row.innerHTML=`<td>${id++}</td><td>${name}</td><td>${cls}</td>`;

document.getElementById("studentName").value="";

document.getElementById("studentClass").value="";

}

</script>

</body>
</html>
