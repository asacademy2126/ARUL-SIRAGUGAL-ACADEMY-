<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arul Siragugal Academy - Management</title>
<style>
:root{--primary:#4f46e5;--bg:#f4f6fb;--card:#fff;--text:#172033;--muted:#687386;--danger:#dc2626;--success:#16a34a;--border:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Tamil",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#4f46e5,#7c3aed)}
.login-card{width:100%;max-width:430px;background:white;border-radius:22px;padding:28px;box-shadow:0 20px 50px #0003}
.logo{width:76px;height:76px;border-radius:20px;object-fit:cover;background:#eee;display:block;margin:0 auto 12px}
h1,h2,h3{margin-top:0}.login-card h1{text-align:center;font-size:24px}.login-card p{text-align:center;color:var(--muted)}
.role-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.role-tabs button{padding:12px;border-radius:10px;background:#eef0ff;color:var(--primary);font-weight:bold}.role-tabs .active{background:var(--primary);color:#fff}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text)}textarea{min-height:90px;resize:vertical}.btn{padding:11px 15px;border-radius:10px;background:var(--primary);color:white;font-weight:bold}.btn.secondary{background:#e9ecf7;color:#25304a}.btn.danger{background:var(--danger)}.btn.success{background:var(--success)}.msg{text-align:center;margin-top:12px;font-size:14px;color:var(--danger)}
.app{min-height:100vh;display:flex}.sidebar{width:245px;background:#111827;color:white;padding:20px;position:fixed;left:0;top:0;bottom:0;overflow:auto}.brand{font-size:20px;font-weight:bold;margin-bottom:24px}.nav button{width:100%;text-align:left;padding:12px;margin:4px 0;border-radius:10px;background:transparent;color:#dbe3f0}.nav button.active,.nav button:hover{background:#374151;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:22px}.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.topbar .user{color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 4px 14px #00000008}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:26px;font-weight:bold;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.section{margin-top:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;font-size:14px}.table th{background:#f8fafc}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:bold}.badge.ok{background:#dcfce7;color:#166534}.badge.pending{background:#fee2e2;color:#991b1b}.badge.info{background:#e0e7ff;color:#3730a3}.bar-chart{display:flex;align-items:flex-end;gap:12px;height:220px;padding:20px 8px}.bar{flex:1;min-width:25px;background:var(--primary);border-radius:8px 8px 0 0;position:relative}.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11px;margin-bottom:4px}.bar small{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.modal-box{width:100%;max-width:650px;max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px}
.actions{display:flex;gap:6px;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.paybox{background:#eefbf2;border:1px solid #bbf7d0;padding:15px;border-radius:12px}.danger-text{color:var(--danger)}.success-text{color:var(--success)}.att-buttons{display:flex;gap:7px;flex-wrap:wrap}
.att-btn{padding:9px 13px;border-radius:9px;border:2px solid #d1d5db;background:#f8fafc;color:#374151;font-weight:bold}
.att-btn.present.selected{background:#16a34a;color:#fff;border-color:#16a34a}
.att-btn.absent.selected{background:#dc2626;color:#fff;border-color:#dc2626}
.att-btn:hover{transform:translateY(-1px)}
.student-link{background:none;border:0;padding:0;color:var(--primary);font-weight:bold;text-decoration:underline;cursor:pointer}

@media(max-width:900px){.sidebar{width:72px;padding:10px}.brand{font-size:0}.brand:after{content:"ASA";font-size:18px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:20px}.main{margin-left:72px;width:calc(100% - 72px)}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:600px){.role-tabs{grid-template-columns:1fr}.main{padding:12px}.cards{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.topbar{align-items:flex-start}.topbar h2{font-size:19px}}
.dark{--bg:#0b1220;--card:#111827;--text:#e5e7eb;--muted:#9ca3af;--border:#273449}.dark input,.dark select,.dark textarea{background:#0f172a;color:#e5e7eb}.dark .table th{background:#172033}

@media (max-width:768px){body{padding-bottom:82px}.app{display:block}.sidebar{left:0;right:0;top:auto;bottom:0;width:100%;height:72px;padding:4px 2px;display:flex;align-items:center;z-index:9999;overflow-x:auto;overflow-y:hidden;border-top:1px solid #374151}.brand{display:none}.nav{display:flex;width:100%;height:100%;align-items:center;justify-content:space-around;gap:2px}.nav button{flex:1 0 64px;width:auto;margin:0;padding:6px 3px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;min-height:60px}.main{margin-left:0;width:100%;padding:14px}.topbar{margin-bottom:14px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.table th,.table td{font-size:13px;padding:8px}}
@media (min-width:769px){.sidebar{left:0;top:0;bottom:0}.main{margin-left:245px;width:calc(100% - 245px)}}
</style>
<style>#adminNav,#teacherNav{max-height:calc(100vh - 150px);overflow-y:auto}.nav button{margin-bottom:4px}.card .toolbar a{text-decoration:none;display:inline-block}.section{margin-top:16px}@media(max-width:700px){.nav{display:flex!important;flex-direction:column}.sidebar{overflow-y:auto}}</style><style>
/* Mobile navigation: hamburger + slide-out menu */
.menu-btn{display:none;position:fixed;top:12px;left:12px;z-index:10001;width:46px;height:46px;border-radius:12px;background:#111827;color:#fff;font-size:24px;box-shadow:0 5px 18px #0003}
#menuOverlay{display:none;position:fixed;inset:0;background:#0008;z-index:9998}
#menuOverlay.show{display:block}
@media(max-width:768px){
 body{padding-bottom:0}
 .menu-btn{display:block}
 .sidebar{left:-285px!important;right:auto!important;top:0!important;bottom:0!important;width:280px!important;height:100vh!important;padding:20px!important;display:block!important;overflow-y:auto!important;overflow-x:hidden!important;transition:left .25s ease;z-index:10000!important;box-shadow:10px 0 30px #0004}
 .sidebar.mobile-open{left:0!important}
 .brand{display:block!important;font-size:19px!important;margin-bottom:20px}
 .brand:after{content:none!important}
 .nav{display:block!important;width:auto!important;height:auto!important}
 .nav button{display:block!important;width:100%!important;min-height:auto!important;flex:none!important;margin:4px 0!important;padding:12px!important;text-align:left!important;font-size:14px!important;flex-direction:initial!important}
 .main{margin-left:0!important;width:100%!important;padding:72px 12px 18px!important}
 .topbar{padding-left:0}
 .cards{grid-template-columns:1fr 1fr!important}
 .card{padding:14px}
 .table-wrap{margin-left:-4px;margin-right:-4px}
 .table th,.table td{font-size:12px;padding:8px}
 .toolbar{align-items:stretch}
 .toolbar label{flex:1;min-width:130px}
 .toolbar input,.toolbar select{min-width:0}
 .modal{padding:10px}
 .modal-box{max-height:94vh;padding:16px;border-radius:14px}
}
@media(max-width:430px){
 .cards{grid-template-columns:1fr 1fr!important;gap:8px}
 .stat .value{font-size:20px}
 .topbar h2{font-size:18px}
 .btn{padding:9px 11px;font-size:13px}
}
</style>
</head>
<body>
<div id="loginPage" class="login">
<div class="login-card">
<img id="loginLogo" class="logo" alt="Logo">
<h1 id="loginAcademy">Arul Siragugal Academy</h1>
<p>Tuition Management System</p>
<div id="loginLoading" style="display:none;text-align:center;color:var(--muted);font-size:13px;margin:6px 0">⏳ Shared data ஏற்றப்படுகிறது...</div>
<div class="role-tabs"><button id="adminRole" onclick="setRole('admin')">👑 Admin Login</button><button id="teacherRole" class="active" onclick="setRole('teacher')">👨‍🏫 Teacher Login</button><button id="studentRole" onclick="setRole('student')">👨‍🎓 Student Login</button></div>
<div id="adminLogin" class="hidden"><label>Admin ID</label><input id="adminId" placeholder="Admin ID"><label>Password</label><input id="adminPass" type="password" placeholder="Password"><button class="btn" style="width:100%;margin-top:16px" onclick="loginAdmin()">Login</button></div><div id="teacherLogin">
<label>Teacher ID</label><input id="teacherId" placeholder="Teacher ID">
<label>Password</label><input id="teacherPass" type="password" placeholder="Password">
<button class="btn" id="teacherLoginBtn" style="width:100%;margin-top:16px" onclick="loginTeacher()">Login</button>
</div>
<div id="studentLogin" class="hidden">
<label>Student ID</label><input id="studentId" placeholder="Student ID">
<label>Password</label><input id="studentPass" type="password" placeholder="Password">
<button class="btn" id="studentLoginBtn" style="width:100%;margin-top:16px" onclick="loginStudent()">Login</button>
</div>
<div id="loginMsg" class="msg"></div>
</div></div>

<div id="app" class="app hidden">
<aside class="sidebar">
<div class="brand" id="sideAcademy">Arul Siragugal Academy</div>
<div class="nav" id="adminNav">
<button onclick="showPage('overview')" data-page="overview">🏠 Dashboard</button>
<button onclick="showPage('students')" data-page="students">👨‍🎓 Students</button>
<button onclick="showPage('attendance')" data-page="attendance">📅 Attendance</button>
<button onclick="showPage('fees')" data-page="fees">💰 Fees</button>
<button onclick="showPage('marks')" data-page="marks">📝 Marks</button>
<button onclick="showPage('reports')" data-page="reports">📊 Reports</button>
<button onclick="showPage('communication')" data-page="communication">📢 Communication</button>
<button onclick="showPage('homework')" data-page="homework">📚 Homework</button>
<button onclick="showPage('exams')" data-page="exams">🗓️ Exams</button>
<button onclick="showPage('teachers')" data-page="teachers">👨‍🏫 Teachers</button>
<button onclick="showPage('backup')" data-page="backup">💾 Backup</button>
<button onclick="showPage('finance')" data-page="finance">💵 Income & Expense</button>
<button onclick="showPage('tests')" data-page="tests">🧪 Online Tests</button>
<button onclick="showPage('calendar')" data-page="calendar">🗓️ Calendar</button>
<button onclick="showPage('birthdays')" data-page="birthdays">🎂 Birthdays</button>
<button onclick="showPage('settings')" data-page="settings">⚙️ Settings</button>
</div>
<div class="nav hidden" id="teacherNav">
<button onclick="showPage('attendance')" data-page="attendance">📅 Attendance</button>
<button onclick="showPage('fees')" data-page="fees">💰 Fees Collect</button>
<button onclick="showPage('marks')" data-page="marks">📝 Mark Entry</button>
</div>
<div class="nav hidden" id="studentNav">
<button onclick="showPage('studentHome')" data-page="studentHome">📊 Marks</button>
<button onclick="showPage('studentAttendance')" data-page="studentAttendance">📅 Attendance</button>
<button onclick="showPage('studentFees')" data-page="studentFees">💰 Fees</button><button onclick="showPage('studentProfile')" data-page="studentProfile">👤 Profile</button>
</div>
<button class="btn danger" style="width:100%;margin-top:20px" onclick="logout()">Logout</button>
</aside>
<main class="main">
<div class="topbar"><div><h2 id="pageTitle">Overview</h2><div class="user" id="welcome"></div></div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span id="syncStatus" style="font-size:12px;color:var(--muted)"></span><button class="btn success" id="topSyncBtn" onclick="syncSheets()">☁️ Sync</button><button class="btn secondary" onclick="toggleDark()">🌙 Dark</button></div></div>
<div id="content"></div>
</main></div>

<div id="modal" class="modal hidden"><div class="modal-box"><div class="topbar"><h3 id="modalTitle">Form</h3><button class="btn secondary" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>

<script>
const KEY='asa_management_v2';
const DEFAULT_SHEETS_URL='https://script.google.com/macros/s/AKfycbygpzp54F2mQl2NZHsXc2K9nCBzCtflplemx11_d_zNoUcYPw4qVODHwH0SPOK3r_nY/exec';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 settings:{academy:'Arul Siragugal Academy',teacher:'Teacher',mobile:'',fee:1000,logo:'',upi:'',teacherId:'teacher',teacherPass:'1234',adminId:'admin',adminPass:'admin123',sheetsUrl:DEFAULT_SHEETS_URL,autoSync:true,dark:false},
 students:[],attendance:[],fees:[],marks:[],teachers:[],homework:[],exams:[],notices:[],expenses:[],receipts:[],history:[]
};
db.settings=db.settings||{}; db.settings.sheetsUrl=db.settings.sheetsUrl||DEFAULT_SHEETS_URL;
['students','attendance','fees','marks','teachers','homework','exams','notices','expenses','receipts','history'].forEach(k=>db[k]=Array.isArray(db[k])?db[k]:[]);
let role='teacher',currentStudent=null,currentPage='';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function save(){localStorage.setItem(KEY,JSON.stringify(db)); if(role!=='student') syncNow();}
function syncNow(){ if(!db.settings.sheetsUrl)return; setSyncStatus('syncing'); fetch(db.settings.sheetsUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(db)}).then(()=>setSyncStatus('success')).catch(()=>setSyncStatus('error')); }
function setSyncStatus(s){const e=$('syncStatus');if(!e)return;e.innerHTML=s==='syncing'?'⏳ Saving…':s==='success'?'✅ Synced '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):s==='error'?'⚠️ Sync failed <button class="btn secondary" style="padding:2px 8px;font-size:11px" onclick="syncSheets()">Retry</button>':''}
function syncSheets(){syncNow()}
function setRole(r){role=r;['admin','teacher','student'].forEach(x=>$(x+'Role')?.classList.toggle('active',r===x));$('adminLogin')?.classList.toggle('hidden',r!=='admin');$('teacherLogin')?.classList.toggle('hidden',r!=='teacher');$('studentLogin')?.classList.toggle('hidden',r!=='student');$('loginMsg').textContent=''}
function loginAdmin(){if(($('adminId').value||'').trim()===(db.settings.adminId||'admin')&&$('adminPass').value===(db.settings.adminPass||'admin123'))enterApp('admin');else $('loginMsg').textContent='Admin ID / Password தவறாக உள்ளது.'}
function loginTeacher(){if($('teacherId').value===db.settings.teacherId&&$('teacherPass').value===db.settings.teacherPass)enterApp('teacher');else $('loginMsg').textContent='Teacher ID / Password தவறாக உள்ளது.'}
function loginStudent(){const s=db.students.find(x=>x.id===$('studentId').value&&x.password===$('studentPass').value);if(s){currentStudent=s;enterApp('student')}else $('loginMsg').textContent='Student ID / Password தவறாக உள்ளது.'}
function enterApp(r){role=r;$('loginPage').classList.add('hidden');$('app').classList.remove('hidden');['adminNav','teacherNav','studentNav'].forEach(n=>$(n)?.classList.toggle('hidden',n!==r+'Nav'));$('topSyncBtn')?.classList.toggle('hidden',r==='student');$('welcome').textContent=r==='admin'?'👑 Admin':r==='teacher'?'👨‍🏫 '+db.settings.teacher:'👨‍🎓 '+currentStudent.name;applySettings();buildMobileMenu();showPage(r==='admin'?'overview':r==='teacher'?'attendance':'studentHome')}
function logout(){currentStudent=null;$('app').classList.add('hidden');$('loginPage').classList.remove('hidden');closeMenu()}
function applySettings(){document.title=(db.settings.academy||'Arul Siragugal Academy')+' - Management';$('loginAcademy').textContent=db.settings.academy||'Arul Siragugal Academy';$('sideAcademy').textContent=db.settings.academy||'Arul Siragugal Academy';document.body.classList.toggle('dark',!!db.settings.dark);if(db.settings.logo)$('loginLogo').src=db.settings.logo}
function toggleDark(){db.settings.dark=!db.settings.dark;save();applySettings()}
function showPage(page){currentPage=page;closeMenu();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const titles={overview:'Dashboard',students:'Students',attendance:'Attendance',fees:'Fees Management',marks:'Marks',reports:'Reports & History',communication:'Communication',homework:'Homework',exams:'Exams',teachers:'Teachers',backup:'Backup',finance:'Income & Expense',tests:'Online Tests',calendar:'Calendar',birthdays:'Birthdays',settings:'Settings',studentHome:'My Marks',studentAttendance:'My Attendance',studentFees:'My Fees',studentProfile:'My Profile'};$('pageTitle').textContent=titles[page]||page;renderPage(page)}
function renderPage(p){
 if(p==='overview')return renderOverview();
 if(p==='students')return renderStudents();
 if(p==='attendance'||p==='studentAttendance')return renderAttendance(p==='studentAttendance');
 if(p==='fees'||p==='studentFees')return renderFees(p==='studentFees');
 if(p==='marks'||p==='studentHome')return renderMarks(p==='studentHome');
 if(p==='reports')return renderReports();
 if(p==='settings')return renderSettings();
 if(p==='backup')return renderBackup();
 if(p==='finance')return renderFinance();
 if(p==='teachers')return renderSimple('Teachers','teachers');
 if(p==='homework')return renderSimple('Homework','homework');
 if(p==='exams')return renderSimple('Exams','exams');
 if(p==='communication')return renderSimple('Notices / Communication','notices');
 if(p==='calendar')return renderCalendar();
 if(p==='birthdays')return renderBirthdays();
 if(p==='tests')return renderSimple('Online Tests','tests');
 if(p==='studentProfile')return renderStudentProfile();
 return renderOverview();
}
function toolbar(extra=''){return `<div class="toolbar"><button class="btn" onclick="openQuickMenu()">➕ Add</button><button class="btn secondary" onclick="exportCurrentCSV()">⬇️ Export CSV</button>${extra}</div>`}
function renderOverview(){const s=db.students.length,a=db.attendance.filter(x=>x.date===today()&&x.status==='Present').length,paid=db.fees.reduce((t,x)=>t+Number(x.amount||0),0),due=db.fees.reduce((t,x)=>t+Math.max(0,Number(x.due||0)),0);$('content').innerHTML=`<div class="cards"><div class="card stat"><div class="label">Students</div><div class="value">${s}</div></div><div class="card stat"><div class="label">Today Present</div><div class="value">${a}</div></div><div class="card stat"><div class="label">Fees Collected</div><div class="value">${money(paid)}</div></div><div class="card stat"><div class="label">Fees Due</div><div class="value danger-text">${money(due)}</div></div></div><div class="grid2"><div class="card"><h3>Quick Actions</h3><div class="actions"><button class="btn" onclick="showPage('attendance')">📅 Attendance</button><button class="btn success" onclick="showPage('fees')">💰 Fees</button><button class="btn secondary" onclick="showPage('reports')">🗂️ All History</button></div></div><div class="card"><h3>Recent Activity</h3>${db.history.slice(-6).reverse().map(h=>`<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13px">${esc(h.text)} <span style="color:var(--muted);float:right">${esc(h.time||'')}</span></div>`).join('')||'<span class="user">No activity yet</span>'}</div></div>`}
function renderStudents(){const q=promptSearch('studentSearch','Search students');$('content').innerHTML=`<div class="card">${toolbar(`<input id="studentSearch" placeholder="🔎 Search name / ID / phone" value="${esc(q)}" oninput="renderStudents()">`)}<div class="table-wrap"><table class="table"><tr><th>ID</th><th>Name</th><th>Phone</th><th>Class</th><th>Actions</th></tr>${db.students.filter(s=>{const x=q.toLowerCase();return !x||[s.id,s.name,s.phone,s.class].join(' ').toLowerCase().includes(x)}).map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${esc(s.phone)}</td><td>${esc(s.class)}</td><td><button class="btn secondary" onclick="editStudent('${esc(s.id)}')">Edit</button> <button class="btn danger" onclick="deleteStudent('${esc(s.id)}')">Delete</button></td></tr>`).join('')}</table></div></div>`}
function promptSearch(id,placeholder){return document.getElementById(id)?.value||''}
function openQuickMenu(){openStudentForm()}
function openStudentForm(id=''){const s=db.students.find(x=>x.id===id)||{};modal('Student',`<div class="two"><div><label>Student ID</label><input id="f_id" value="${esc(s.id||'')}"></div><div><label>Name</label><input id="f_name" value="${esc(s.name||'')}"></div><div><label>Phone</label><input id="f_phone" value="${esc(s.phone||'')}"></div><div><label>Class</label><input id="f_class" value="${esc(s.class||'')}"></div><div><label>Password</label><input id="f_pass" value="${esc(s.password||'1234')}"></div><div><label>Monthly Fee</label><input id="f_fee" type="number" value="${s.fee||db.settings.fee||1000}"></div></div><button class="btn" style="margin-top:14px" onclick="saveStudent('${esc(id)}')">Save Student</button>`)}
function saveStudent(old){const o={id:$('f_id').value.trim(),name:$('f_name').value.trim(),phone:$('f_phone').value.trim(),class:$('f_class').value.trim(),password:$('f_pass').value||'1234',fee:Number($('f_fee').value||0)};if(!o.id||!o.name)return alert('ID and Name required');if(old){const i=db.students.findIndex(x=>x.id===old);db.students[i]=o}else{if(db.students.some(x=>x.id===o.id))return alert('Student ID already exists');db.students.push(o)}addHistory('Student saved: '+o.name);save();closeModal();renderStudents()}
function editStudent(id){openStudentForm(id)}
function deleteStudent(id){if(!confirm('Delete this student?'))return;db.students=db.students.filter(x=>x.id!==id);addHistory('Student deleted: '+id);save();renderStudents()}
function renderAttendance(studentOnly=false){const d=document.getElementById('attDate')?.value||today(),from=document.getElementById('attFrom')?.value||d,to=document.getElementById('attTo')?.value||d;if(studentOnly){const rows=db.attendance.filter(x=>x.studentId===currentStudent.id&&x.date>=from&&x.date<=to);return $('content').innerHTML=rangeBox('Attendance History',from,to,'showPage("studentAttendance")')+historyTable(rows,['Date','Status'],r=>`<td>${r.date}</td><td><span class="badge ${r.status==='Present'?'ok':'pending'}">${r.status}</span></td>`)}const rows=db.attendance.filter(x=>x.date>=from&&x.date<=to);$('content').innerHTML=`<div class="card">${rangeBox('Attendance',from,to,'renderAttendance()')}<div class="actions" style="margin-bottom:14px"><button class="btn success" onclick="markAllAttendance('Present')">✓ Mark All Present</button><button class="btn danger" onclick="markAllAttendance('Absent')">✕ Mark All Absent</button><button class="btn secondary" onclick="clearPeriod('attendance')">🗑️ Clear Period</button></div>${db.students.length?`<div class="table-wrap"><table class="table"><tr><th>Student</th><th>Status</th></tr>${db.students.map(s=>{const r=rows.find(x=>x.studentId===s.id&&x.date===d)||{};return `<tr><td>${esc(s.name)}<small> (${esc(s.id)})</small></td><td><div class="att-buttons"><button class="att-btn present ${r.status==='Present'?'selected':''}" onclick="setAttendance('${esc(s.id)}','Present','${d}')">Present</button><button class="att-btn absent ${r.status==='Absent'?'selected':''}" onclick="setAttendance('${esc(s.id)}','Absent','${d}')">Absent</button></div></td></tr>`}).join('')}</table></div>`:'No students yet.'}</div>`}
function setAttendance(studentId,status,date){const i=db.attendance.findIndex(x=>x.studentId===studentId&&x.date===date);const r={studentId,status,date};if(i>=0)db.attendance[i]=r;else db.attendance.push(r);addHistory(`Attendance: ${studentId} ${status} (${date})`);save();renderAttendance()}
function markAllAttendance(status){const d=document.getElementById('attFrom')?.value||today();db.students.forEach(s=>{const i=db.attendance.findIndex(x=>x.studentId===s.id&&x.date===d);const r={studentId:s.id,status,date:d};if(i>=0)db.attendance[i]=r;else db.attendance.push(r)});addHistory(`Marked all ${status} on ${d}`);save();renderAttendance()}
function renderFees(studentOnly=false){const from=document.getElementById('feeFrom')?.value||today().slice(0,8)+'01',to=document.getElementById('feeTo')?.value||today();let rows=db.fees.filter(x=>x.date>=from&&x.date<=to);if(studentOnly)rows=rows.filter(x=>x.studentId===currentStudent.id);$('content').innerHTML=`<div class="card">${rangeBox(studentOnly?'My Fees':'Fees Management',from,to,'renderFees()')}<div class="actions" style="margin-bottom:14px">${!studentOnly?'<button class="btn success" onclick="openFeeForm()">➕ Record Payment</button><button class="btn secondary" onclick="clearPeriod(\"fees\")">🗑️ Clear Period</button>':''}<button class="btn secondary" onclick="exportCurrentCSV()">⬇️ Export CSV</button></div>${historyTable(rows,['Date','Student','Amount','Due','Mode'],r=>`<td>${r.date}</td><td>${esc(db.students.find(s=>s.id===r.studentId)?.name||r.studentId)}</td><td>${money(r.amount)}</td><td>${money(r.due)}</td><td>${esc(r.mode||'Cash')}</td>`)}<div class="paybox" style="margin-top:14px"><b>Total Collected: ${money(rows.reduce((t,x)=>t+Number(x.amount||0),0))}</b> &nbsp; <b>Total Due: ${money(rows.reduce((t,x)=>t+Number(x.due||0),0))}</b></div></div>`}
function openFeeForm(){modal('Record Fee Payment',`<label>Student</label><select id="fee_student">${db.students.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} (${esc(s.id)})</option>`).join('')}</select><div class="two"><div><label>Date</label><input id="fee_date" type="date" value="${today()}"></div><div><label>Amount</label><input id="fee_amount" type="number" value="${db.settings.fee||1000}"></div><div><label>Due After Payment</label><input id="fee_due" type="number" value="0"></div><div><label>Mode</label><select id="fee_mode"><option>Cash</option><option>UPI</option><option>Bank</option><option>Other</option></select></div></div><button class="btn success" style="margin-top:14px" onclick="saveFee()">Save Payment</button>`)}
function saveFee(){const r={studentId:$('fee_student').value,date:$('fee_date').value,amount:Number($('fee_amount').value||0),due:Number($('fee_due').value||0),mode:$('fee_mode').value};if(!r.studentId||!r.date)return alert('Student and date required');db.fees.push(r);addHistory(`Fee payment ${money(r.amount)} - ${r.studentId}`);save();closeModal();renderFees()}
function renderMarks(studentOnly=false){let rows=db.marks;if(studentOnly)rows=rows.filter(x=>x.studentId===currentStudent.id);$('content').innerHTML=`<div class="card"><div class="toolbar"><button class="btn secondary" onclick="exportCurrentCSV()">⬇️ Export CSV</button></div>${historyTable(rows,['Date','Student','Subject','Mark'],r=>`<td>${r.date||''}</td><td>${esc(db.students.find(s=>s.id===r.studentId)?.name||r.studentId||'')}</td><td>${esc(r.subject||'')}</td><td>${esc(r.mark||'')}</td>`)}</div>`}
function rangeBox(title,from,to,refresh){return `<div class="toolbar"><h3 style="margin:0 12px 0 0">${title}</h3><label style="margin:0">From <input id="${title.includes('Fee')||title.includes('Fees')?'feeFrom':'attFrom'}" type="date" value="${from}" onchange="${refresh}"></label><label style="margin:0">To <input id="${title.includes('Fee')||title.includes('Fees')?'feeTo':'attTo'}" type="date" value="${to}" onchange="${refresh}"></label></div>`}
function historyTable(rows,heads,cells){return `<div class="table-wrap"><table class="table"><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cells(r)}</tr>`).join('')||`<tr><td colspan="${heads.length}" style="text-align:center;color:var(--muted)">No records found</td></tr>`}</table></div>`}
function renderReports(){const from=document.getElementById('histFrom')?.value||today().slice(0,8)+'01',to=document.getElementById('histTo')?.value||today();const data=[...db.attendance.map(x=>({...x,type:'Attendance',detail:x.status})),...db.fees.map(x=>({...x,type:'Fee',detail:money(x.amount)})),...db.marks.map(x=>({...x,type:'Mark',detail:x.subject+' '+x.mark})),...db.history.map(x=>({...x,date:x.date||today(),type:'Activity',detail:x.text}))].filter(x=>x.date>=from&&x.date<=to).sort((a,b)=>(b.date||'').localeCompare(a.date||''));$('content').innerHTML=`<div class="card"><div class="toolbar"><h3 style="margin:0">All History Data</h3><label style="margin:0">From <input id="histFrom" type="date" value="${from}" onchange="renderReports()"></label><label style="margin:0">To <input id="histTo" type="date" value="${to}" onchange="renderReports()"></label><button class="btn secondary" onclick="exportCurrentCSV()">⬇️ Export</button><button class="btn danger" onclick="clearAllHistoryPeriod()">🗑️ Clear Selected Period</button></div>${historyTable(data,['Date','Type','Details'],r=>`<td>${r.date}</td><td>${esc(r.type)}</td><td>${esc(r.detail||'')}</td>`)}</div>`}
function clearPeriod(type){const from=(type==='fees'?$('feeFrom'):$('attFrom'))?.value,to=(type==='fees'?$('feeTo'):$('attTo'))?.value;if(!from||!to)return;if(!confirm(`Clear ${type} data from ${from} to ${to}?`))return;db[type]=db[type].filter(x=>x.date<from||x.date>to);addHistory(`Cleared ${type} period ${from} to ${to}`);save();type==='fees'?renderFees():renderAttendance()}
function clearAllHistoryPeriod(){const from=$('histFrom').value,to=$('histTo').value;if(!confirm(`Clear ALL history data from ${from} to ${to}? This cannot be undone.`))return;['attendance','fees','marks','history','expenses','receipts'].forEach(k=>db[k]=db[k].filter(x=>(x.date||today())<from||(x.date||today())>to));save();renderReports()}
function addHistory(text){db.history.push({date:today(),time:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),text})}
function renderSettings(){$('content').innerHTML=`<div class="card"><h3>Settings</h3><div class="two"><div><label>Academy Name</label><input id="set_academy" value="${esc(db.settings.academy)}"></div><div><label>Teacher Name</label><input id="set_teacher" value="${esc(db.settings.teacher)}"></div><div><label>Default Monthly Fee</label><input id="set_fee" type="number" value="${db.settings.fee||0}"></div><div><label>Google Sheets Web App URL</label><input id="set_sheet" value="${esc(db.settings.sheetsUrl)}"></div><div><label>Admin ID</label><input id="set_admin" value="${esc(db.settings.adminId||'admin')}"></div><div><label>Admin Password</label><input id="set_adminpass" value="${esc(db.settings.adminPass||'admin123')}"></div><div><label>Teacher ID</label><input id="set_teacherid" value="${esc(db.settings.teacherId||'teacher')}"></div><div><label>Teacher Password</label><input id="set_teacherpass" value="${esc(db.settings.teacherPass||'1234')}"></div></div><button class="btn" style="margin-top:14px" onclick="saveSettings()">Save Settings</button></div>`}
function saveSettings(){Object.assign(db.settings,{academy:$('set_academy').value,teacher:$('set_teacher').value,fee:Number($('set_fee').value||0),sheetsUrl:$('set_sheet').value.trim(),adminId:$('set_admin').value,adminPass:$('set_adminpass').value,teacherId:$('set_teacherid').value,teacherPass:$('set_teacherpass').value});save();applySettings();alert('Settings saved')}
function renderBackup(){$('content').innerHTML=`<div class="card"><h3>Backup & Restore</h3><p>Download complete data before clearing anything.</p><div class="actions"><button class="btn" onclick="downloadBackup()">⬇️ Download Full Backup</button><label class="btn secondary" style="display:inline-block">⬆️ Restore JSON<input type="file" accept=".json" style="display:none" onchange="restoreBackup(this)"></label><button class="btn danger" onclick="clearDatabase()">🗑️ Clear Entire Database</button></div></div>`}
function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='ASA-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.students||!x.attendance)throw Error();db=x;localStorage.setItem(KEY,JSON.stringify(db));applySettings();showPage(currentPage);alert('Backup restored')}catch(e){alert('Invalid backup file')}};r.readAsText(f)}
function clearDatabase(){if(!confirm('Delete ALL local data? Download backup first.'))return;db={settings:{academy:'Arul Siragugal Academy',teacher:'Teacher',fee:1000,sheetsUrl:DEFAULT_SHEETS_URL,adminId:'admin',adminPass:'admin123',teacherId:'teacher',teacherPass:'1234'},students:[],attendance:[],fees:[],marks:[],teachers:[],homework:[],exams:[],notices:[],expenses:[],receipts:[],history:[]};save();location.reload()}
function renderFinance(){const total=db.expenses.reduce((a,x)=>a+Number(x.amount||0),0);$('content').innerHTML=`<div class="card"><h3>Income & Expense</h3><div class="cards"><div class="card stat"><div class="label">Fee Income</div><div class="value">${money(db.fees.reduce((a,x)=>a+Number(x.amount||0),0))}</div></div><div class="card stat"><div class="label">Expenses</div><div class="value">${money(total)}</div></div></div><div style="margin-top:16px"><button class="btn" onclick="openExpenseForm()">➕ Add Expense</button></div>${historyTable(db.expenses,['Date','Title','Amount'],r=>`<td>${r.date}</td><td>${esc(r.title)}</td><td>${money(r.amount)}</td>`)}</div>`}
function openExpenseForm(){modal('Add Expense',`<div class="two"><div><label>Date</label><input id="ex_date" type="date" value="${today()}"></div><div><label>Title</label><input id="ex_title"></div><div><label>Amount</label><input id="ex_amount" type="number"></div></div><button class="btn" onclick="saveExpense()">Save</button>`)}
function saveExpense(){db.expenses.push({date:$('ex_date').value,title:$('ex_title').value,amount:Number($('ex_amount').value||0)});addHistory('Expense added');save();closeModal();renderFinance()}
function renderSimple(title,key){$('content').innerHTML=`<div class="card"><h3>${title}</h3><p class="user">This module is ready for data. Records: ${db[key]?.length||0}</p>${historyTable(db[key]||[],['Date','Data'],r=>`<td>${r.date||''}</td><td>${esc(JSON.stringify(r))}</td>`)}</div>`}
function renderCalendar(){$('content').innerHTML=`<div class="card"><h3>Calendar</h3><input type="date" value="${today()}" onchange="renderCalendar()"><p class="user">Use Attendance / Fees date filters for detailed records.</p></div>`}
function renderBirthdays(){const m=new Date().getMonth()+1;const rows=db.students.filter(s=>s.dob&&Number(s.dob.slice(5,7))===m);$('content').innerHTML=`<div class="card"><h3>🎂 This Month Birthdays</h3>${rows.map(s=>`<p>🎉 ${esc(s.name)} - ${esc(s.dob)}</p>`).join('')||'No birthdays recorded.'}</div>`}
function renderStudentProfile(){$('content').innerHTML=`<div class="card"><h3>My Profile</h3><div class="two"><p><b>ID</b><br>${esc(currentStudent.id)}</p><p><b>Name</b><br>${esc(currentStudent.name)}</p><p><b>Phone</b><br>${esc(currentStudent.phone)}</p><p><b>Class</b><br>${esc(currentStudent.class)}</p></div></div>`}
function exportCurrentCSV(){let rows=[];if(currentPage==='attendance')rows=db.attendance;else if(currentPage==='fees'||currentPage==='studentFees')rows=db.fees;else if(currentPage==='marks'||currentPage==='studentHome')rows=db.marks;else rows=db.history;if(!rows.length)return alert('No data to export');const keys=[...new Set(rows.flatMap(x=>Object.keys(x)))];const csv=[keys.join(','),...rows.map(r=>keys.map(k=>`"${String(r[k]??'').replace(/"/g,'""')}"`).join(','))].join('\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ASA-'+currentPage+'-'+today()+'.csv';a.click()}
function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
$('modal')?.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function buildMobileMenu(){const sidebar=document.querySelector('.sidebar');if(!sidebar||document.getElementById('menuBtn'))return;const b=document.createElement('button');b.id='menuBtn';b.className='menu-btn';b.innerHTML='☰';b.onclick=toggleMenu;document.body.appendChild(b);const overlay=document.createElement('div');overlay.id='menuOverlay';overlay.onclick=closeMenu;document.body.appendChild(overlay)}
function toggleMenu(){document.querySelector('.sidebar')?.classList.toggle('mobile-open');$('menuOverlay')?.classList.toggle('show')}
function closeMenu(){document.querySelector('.sidebar')?.classList.remove('mobile-open');$('menuOverlay')?.classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenu()}})
applySettings();
</script>
</body></html>
