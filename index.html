<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arul Siragugal Academy - Management</title>
<style>
:root{--primary:#4f46e5;--bg:#f4f6fb;--card:#fff;--text:#172033;--muted:#687386;--danger:#dc2626;--success:#16a34a;--border:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Tamil",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#4f46e5,#7c3aed)}
.login-card{width:100%;max-width:430px;background:white;border-radius:22px;padding:28px;box-shadow:0 20px 50px #0003}
.logo{width:76px;height:76px;border-radius:20px;object-fit:cover;background:#eee;display:block;margin:0 auto 12px}
h1,h2,h3{margin-top:0}.login-card h1{text-align:center;font-size:24px}.login-card p{text-align:center;color:var(--muted)}
.role-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.role-tabs button{padding:12px;border-radius:10px;background:#eef0ff;color:var(--primary);font-weight:bold}.role-tabs .active{background:var(--primary);color:#fff}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text)}textarea{min-height:90px;resize:vertical}.btn{padding:11px 15px;border-radius:10px;background:var(--primary);color:white;font-weight:bold}.btn.secondary{background:#e9ecf7;color:#25304a}.btn.danger{background:var(--danger)}.btn.success{background:var(--success)}.msg{text-align:center;margin-top:12px;font-size:14px;color:var(--danger)}
.app{min-height:100vh;display:flex}.sidebar{width:245px;background:#111827;color:white;padding:20px;position:fixed;left:0;top:0;bottom:0;overflow:auto}.brand{font-size:20px;font-weight:bold;margin-bottom:24px}.nav button{width:100%;text-align:left;padding:12px;margin:4px 0;border-radius:10px;background:transparent;color:#dbe3f0}.nav button.active,.nav button:hover{background:#374151;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:22px}.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.topbar .user{color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 4px 14px #00000008}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:26px;font-weight:bold;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.section{margin-top:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;font-size:14px}.table th{background:#f8fafc}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:bold}.badge.ok{background:#dcfce7;color:#166534}.badge.pending{background:#fee2e2;color:#991b1b}.badge.info{background:#e0e7ff;color:#3730a3}.bar-chart{display:flex;align-items:flex-end;gap:12px;height:220px;padding:20px 8px}.bar{flex:1;min-width:25px;background:var(--primary);border-radius:8px 8px 0 0;position:relative}.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11px;margin-bottom:4px}.bar small{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.modal-box{width:100%;max-width:650px;max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px}
.actions{display:flex;gap:6px;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.paybox{background:#eefbf2;border:1px solid #bbf7d0;padding:15px;border-radius:12px}.danger-text{color:var(--danger)}.success-text{color:var(--success)}.att-buttons{display:flex;gap:7px;flex-wrap:wrap}
.att-btn{padding:9px 13px;border-radius:9px;border:2px solid #d1d5db;background:#f8fafc;color:#374151;font-weight:bold}
.att-btn.present.selected{background:#16a34a;color:#fff;border-color:#16a34a}
.att-btn.absent.selected{background:#dc2626;color:#fff;border-color:#dc2626}
.att-btn:hover{transform:translateY(-1px)}
.student-link{background:none;border:0;padding:0;color:var(--primary);font-weight:bold;text-decoration:underline;cursor:pointer}

@media(max-width:900px){.sidebar{width:72px;padding:10px}.brand{font-size:0}.brand:after{content:"ASA";font-size:18px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:20px}.main{margin-left:72px;width:calc(100% - 72px)}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:600px){.role-tabs{grid-template-columns:1fr}.main{padding:12px}.cards{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.topbar{align-items:flex-start}.topbar h2{font-size:19px}}
.dark{--bg:#0b1220;--card:#111827;--text:#e5e7eb;--muted:#9ca3af;--border:#273449}.dark input,.dark select,.dark textarea{background:#0f172a;color:#e5e7eb}.dark .table th{background:#172033}

@media (max-width:768px){body{padding-bottom:82px}.app{display:block}.sidebar{left:0;right:0;top:auto;bottom:0;width:100%;height:72px;padding:4px 2px;display:flex;align-items:center;z-index:9999;overflow-x:auto;overflow-y:hidden;border-top:1px solid #374151}.brand{display:none}.nav{display:flex;width:100%;height:100%;align-items:center;justify-content:space-around;gap:2px}.nav button{flex:1 0 64px;width:auto;margin:0;padding:6px 3px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;min-height:60px}.main{margin-left:0;width:100%;padding:14px}.topbar{margin-bottom:14px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.table th,.table td{font-size:13px;padding:8px}}
@media (min-width:769px){.sidebar{left:0;top:0;bottom:0}.main{margin-left:245px;width:calc(100% - 245px)}}
</style>
</head>
<body>
<div id="loginPage" class="login">
<div class="login-card">
<img id="loginLogo" class="logo" alt="Logo">
<h1 id="loginAcademy">Arul Siragugal Academy</h1>
<p>Tuition Management System</p>
<div id="loginLoading" style="display:none;text-align:center;color:var(--muted);font-size:13px;margin:6px 0">⏳ Shared data ஏற்றப்படுகிறது...</div>
<div class="role-tabs"><button id="adminRole" onclick="setRole('admin')">👑 Admin Login</button><button id="teacherRole" class="active" onclick="setRole('teacher')">👨‍🏫 Teacher Login</button><button id="studentRole" onclick="setRole('student')">👨‍🎓 Student Login</button></div>
<div id="adminLogin" class="hidden"><label>Admin ID</label><input id="adminId" placeholder="Admin ID"><label>Password</label><input id="adminPass" type="password" placeholder="Password"><button class="btn" style="width:100%;margin-top:16px" onclick="loginAdmin()">Login</button></div><div id="teacherLogin">
<label>Teacher ID</label><input id="teacherId" placeholder="Teacher ID">
<label>Password</label><input id="teacherPass" type="password" placeholder="Password">
<button class="btn" id="teacherLoginBtn" style="width:100%;margin-top:16px" onclick="loginTeacher()">Login</button>
</div>
<div id="studentLogin" class="hidden">
<label>Student ID</label><input id="studentId" placeholder="Student ID">
<label>Password</label><input id="studentPass" type="password" placeholder="Password">
<button class="btn" id="studentLoginBtn" style="width:100%;margin-top:16px" onclick="loginStudent()">Login</button>
</div>
<div id="loginMsg" class="msg"></div>
</div></div>

<div id="app" class="app hidden">
<aside class="sidebar">
<div class="brand" id="sideAcademy">Arul Siragugal Academy</div>
<div class="nav" id="teacherNav">
<button onclick="showPage('overview')" data-page="overview">🏠 Overview</button>
<button onclick="showPage('students')" data-page="students">👨‍🎓 Students</button>
<button onclick="showPage('attendance')" data-page="attendance">📅 Attendance</button>
<button onclick="showPage('fees')" data-page="fees">💰 Fees</button>
<button onclick="showPage('marks')" data-page="marks">📝 Marks</button>
<button onclick="showPage('settings')" data-page="settings">⚙️ Settings</button>
</div>
<div class="nav hidden" id="studentNav">
<button onclick="showPage('studentHome')" data-page="studentHome">📊 Marks</button>
<button onclick="showPage('studentAttendance')" data-page="studentAttendance">📅 Attendance</button>
<button onclick="showPage('studentFees')" data-page="studentFees">💰 Fees</button>
</div>
<button class="btn danger" style="width:100%;margin-top:20px" onclick="logout()">Logout</button>
</aside>
<main class="main">
<div class="topbar"><div><h2 id="pageTitle">Overview</h2><div class="user" id="welcome"></div></div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span id="syncStatus" style="font-size:12px;color:var(--muted)"></span><button class="btn success" id="topSyncBtn" onclick="syncSheets()">☁️ Sync</button><button class="btn secondary" onclick="toggleDark()">🌙 Dark</button></div></div>
<div id="content"></div>
</main></div>

<div id="modal" class="modal hidden"><div class="modal-box"><div class="topbar"><h3 id="modalTitle">Form</h3><button class="btn secondary" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>

<script>
const KEY='asa_management_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
settings:{academy:'Arul Siragugal Academy',teacher:'Teacher',mobile:'',fee:1000,logo:'',upi:'',teacherId:'teacher',teacherPass:'1234',adminId:'admin',adminPass:'admin123',sheetsUrl:'https://script.google.com/macros/s/AKfycbygpzp54F2mQl2NZHsXc2K9nCBzCtflplemx11_d_zNoUcYPw4qVODHwH0SPOK3r_nY/exec',autoSync:true,
messages:{fee:'வணக்கம் {student}, உங்கள் {academy} மாத கட்டணம் ₹{amount} நிலுவையில் உள்ளது. தேதி: {date}. தயவுசெய்து கட்டணத்தை செலுத்தவும்.',absent:'வணக்கம் {student}, இன்று நீங்கள் வகுப்பில் வரவில்லை. {academy} - தேதி: {date}.'}},
students:[],attendance:[],fees:[],marks:[]
};
if(db.settings.adminId===undefined||db.settings.adminId==='')db.settings.adminId='admin';
if(db.settings.adminPass===undefined||db.settings.adminPass==='')db.settings.adminPass='admin123';
if(db.settings.teacherId===undefined||db.settings.teacherId==='')db.settings.teacherId='teacher';
if(db.settings.teacherPass===undefined||db.settings.teacherPass==='')db.settings.teacherPass='1234';
localStorage.setItem(KEY,JSON.stringify(db));
if(db.settings.autoSync===undefined)db.settings.autoSync=true; // legacy field, always true now — sync is mandatory
const DEFAULT_SHEETS_URL='https://script.google.com/macros/s/AKfycbygpzp54F2mQl2NZHsXc2K9nCBzCtflplemx11_d_zNoUcYPw4qVODHwH0SPOK3r_nY/exec';
if(!(db.settings.sheetsUrl||'').trim())db.settings.sheetsUrl=DEFAULT_SHEETS_URL; // migration for data saved before a default URL was built in
let role='teacher', currentStudent=null;
let suppressAutoSync=false;
function save(){localStorage.setItem(KEY,JSON.stringify(db));if(!suppressAutoSync)syncNow()}
function syncNow(){
if(!(db.settings.sheetsUrl||'').trim())return;
setSyncStatus('syncing');
syncSheets(true); // push immediately, no delay — every change goes straight to Google Sheets
}
function setSyncStatus(state){
const el=document.getElementById('syncStatus');
if(!el)return;
if(state==='syncing')el.innerHTML='⏳ Google Sheets-ல் Save ஆகிறது…';
else if(state==='success')el.innerHTML='✅ Synced '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
else if(state==='error')el.innerHTML='⚠️ Google Sheets-ல் Save ஆகவில்லை — Internet சரிபார்க்கவும் <button class="btn secondary" style="padding:2px 8px;font-size:11px;margin-left:4px" onclick="syncSheets()">Retry</button>';
else el.innerHTML='';
}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function today(){return new Date().toISOString().slice(0,10)}
function dateText(){return new Date().toLocaleDateString('ta-IN')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setRole(r){
 role=r;
 adminRole.classList.toggle('active',r==='admin');
 teacherRole.classList.toggle('active',r==='teacher');
 studentRole.classList.toggle('active',r==='student');
 adminLogin.classList.toggle('hidden',r!=='admin');
 teacherLogin.classList.toggle('hidden',r!=='teacher');
 studentLogin.classList.toggle('hidden',r!=='student');
 loginMsg.textContent='';
}
function loginAdmin(){
 const id=String(document.getElementById('adminId').value||'').trim();
 const pass=String(document.getElementById('adminPass').value||'');
 const savedId=String(db.settings.adminId||'admin').trim();
 const savedPass=String(db.settings.adminPass||'admin123');
 if(id===savedId&&pass===savedPass){enterApp('admin')}
 else loginMsg.textContent='Admin ID / Password தவறாக உள்ளது.';
}
function loginTeacher(){if(teacherId.value===db.settings.teacherId&&teacherPass.value===db.settings.teacherPass){enterApp('teacher')}else loginMsg.textContent='Teacher ID / Password தவறாக உள்ளது.'}
function loginStudent(){const s=db.students.find(x=>x.id===studentId.value&&x.password===studentPass.value);if(s){currentStudent=s;enterApp('student')}else loginMsg.textContent='Student ID / Password தவறாக உள்ளது.'}
function enterApp(r){
 role=r;loginPage.classList.add('hidden');app.classList.remove('hidden');
 adminNav.classList.toggle('hidden',r!=='admin');
 teacherNav.classList.toggle('hidden',r!=='teacher');
 studentNav.classList.toggle('hidden',r!=='student');
 topSyncBtn.classList.toggle('hidden',r==='student');
 welcome.textContent=r==='admin'?'👑 Admin':r==='teacher'?'👨‍🏫 '+db.settings.teacher:'👨‍🎓 '+currentStudent.name;
 applySettings();showPage(r==='admin'?'overview':r==='teacher'?'attendance':'studentHome');
}
function logout(){currentStudent=null;app.classList.add('hidden');loginPage.classList.remove('hidden');adminId.value='';adminPass.value='';teacherId.value='';teacherPass.value='';studentId.value='';studentPass.value='';setRole('teacher')}
function applySettings(){document.title=db.settings.academy+' - Management';loginAcademy.textContent=db.settings.academy;sideAcademy.textContent=db.settings.academy;loginLogo.src=db.settings.logo||'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" rx="20" fill="#4f46e5"/><text x="50" y="60" text-anchor="middle" fill="white" font-size="35">AS</text></svg>')}
function showPage(p){
 if(role==='teacher'&&!['attendance','fees','marks'].includes(p))return;
 if(role==='student'&&!['studentHome','studentAttendance','studentFees'].includes(p))return;
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
 const titles={overview:'Overview',students:'Students',attendance:'Attendance',fees:'Fees',marks:'Marks',reports:'Reports',settings:'Settings',studentHome:'My Marks',studentAttendance:'My Attendance',studentFees:'My Fees'};
 pageTitle.textContent=titles[p]||'';
 if(p==='overview')overview();if(p==='students')studentsPage();if(p==='attendance')attendancePage();if(p==='fees')feesPage();if(p==='marks')marksPage();if(p==='reports')reportsPage();if(p==='settings')settingsPage();if(p==='studentHome')studentMarks();if(p==='studentAttendance')studentAttendance();if(p==='studentFees')studentFees();
}
function overview(){const month=new Date().toISOString().slice(0,7), pending=db.students.reduce((a,s)=>a+calcPending(s.id,month),0), collection=db.fees.filter(f=>f.date?.startsWith(month)).reduce((a,f)=>a+Number(f.amount),0),present=db.attendance.filter(a=>a.date===today()&&a.status==='Present').length;content.innerHTML=`<div class="cards"><div class="card stat"><div class="label">Total Students</div><div class="value">${db.students.length}</div></div><div class="card stat"><div class="label">Today Present</div><div class="value">${present}</div></div><div class="card stat"><div class="label">Total Pending Fee</div><div class="value danger-text">${money(pending)}</div></div><div class="card stat"><div class="label">Current Month Collection</div><div class="value success-text">${money(collection)}</div></div></div><div class="grid2"><div class="card"><h3>Monthly Fee Analysis</h3><div id="chart" class="bar-chart"></div></div><div class="card"><h3>Quick Actions</h3><div class="toolbar"><button class="btn" onclick="showPage('students')">➕ Add Student</button><button class="btn" onclick="showPage('fees')">💰 Add Payment</button><button class="btn" onclick="showPage('attendance')">📅 Attendance</button><button class="btn" onclick="showPage('marks')">📝 Marks</button><button class="btn" onclick="showPage('reports')">📊 Reports Dashboard</button><button class="btn success" onclick="syncSheets()">☁️ Sync Now</button></div><p class="user">Google Sheets Apps Script URL Settings-ல் சேர்க்கலாம். LocalStorage data offline-ஆகவும் இயங்கும்.</p></div></div>`;drawChart()}
function drawChart(){const vals=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);const m=d.toISOString().slice(0,7);vals.push([d.toLocaleDateString('en-IN',{month:'short'}),db.fees.filter(f=>f.date?.startsWith(m)).reduce((a,f)=>a+Number(f.amount),0)])}const max=Math.max(1,...vals.map(x=>x[1]));chart.innerHTML=vals.map(x=>`<div class="bar" style="height:${Math.max(8,x[1]/max*160)}px"><span>${money(x[1])}</span><small>${x[0]}</small></div>`).join('')}
function studentsPage(){content.innerHTML=`<div class="toolbar"><button class="btn" onclick="studentForm()">➕ Add Student</button><input id="studentSearch" placeholder="Search student..." oninput="renderStudents()" style="max-width:300px"></div><div class="card table-wrap"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Class</th><th>Mobile</th><th>Monthly Fee</th><th>Actions</th></tr></thead><tbody id="studentRows"></tbody></table></div>`;renderStudents()}
function renderStudents(){const q=(document.getElementById('studentSearch')?.value||'').toLowerCase();studentRows.innerHTML=db.students.filter(s=>(s.name+' '+s.id+' '+s.class).toLowerCase().includes(q)).map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${esc(s.class)}</td><td>${esc(s.mobile)}</td><td>${money(s.monthlyFee)}</td><td class="actions"><button class="btn secondary" onclick="studentForm('${s.id}')">Edit</button><button class="btn danger" onclick="deleteStudent('${s.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6">Student இல்லை.</td></tr>'}
function studentForm(id=''){const s=db.students.find(x=>x.id===id)||{id:'',name:'',class:'',mobile:'',monthlyFee:db.settings.fee,password:''};openModal(id?'Edit Student':'Add Student',`<div class="two"><div><label>Student ID</label><input id="fId" value="${esc(s.id)}" ${id?'readonly':''}></div><div><label>Password</label><input id="fPass" value="${esc(s.password)}"></div></div><label>Student Name</label><input id="fName" value="${esc(s.name)}"><div class="two"><div><label>Class</label><input id="fClass" value="${esc(s.class)}"></div><div><label>Mobile</label><input id="fMobile" value="${esc(s.mobile)}"></div></div><label>Fixed Monthly Tuition Fee</label><input id="fFee" type="number" value="${s.monthlyFee}"><br><br><button class="btn" onclick="saveStudent('${id}')">Save Student</button>`)}
function saveStudent(old){const id=fId.value.trim();if(!id||!fName.value.trim()){alert('Student ID மற்றும் Name தேவை');return}if(!old&&db.students.some(s=>s.id===id)){alert('Student ID already exists');return}const obj={id,name:fName.value.trim(),class:fClass.value.trim(),mobile:fMobile.value.trim(),monthlyFee:Number(fFee.value)||0,password:fPass.value||'1234'};if(old)db.students[db.students.findIndex(s=>s.id===old)]=obj;else db.students.push(obj);save();closeModal();studentsPage()}
function deleteStudent(id){if(confirm('இந்த student profile-ஐ மட்டும் delete செய்யவா?\n\nஇவரின் Attendance, Fees, Marks records பாதுகாக்கப்பட்டு தொடரும் — அவை delete ஆகாது.')){db.students=db.students.filter(s=>s.id!==id);save();renderStudents()}}
function attendancePage(){
const classes=[...new Set(db.students.map(s=>s.class).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
content.innerHTML=`
<div class="card">
<h3>📅 Class-wise Attendance</h3>
<div class="toolbar">
<div style="min-width:160px"><label>Date</label><input id="attDate" type="date" value="${today()}" onchange="renderClassAttendance()"></div>
<div style="min-width:180px"><label>Class</label>
<select id="attClass" onchange="renderClassAttendance()"><option value="">Select Class</option>
${classes.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div>
<button class="btn success" onclick="saveClassAttendance()">💾 Save / Update Class</button>
</div>
<div id="classAttendanceBox"><p class="user">முதலில் Class தேர்வு செய்யவும்.</p></div>
</div>
<div class="card section"><h3>📋 Attendance History</h3>
<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Class</th><th>Student</th><th>Status</th><th>Reminder</th></tr></thead>
<tbody>${db.attendance.slice().reverse().map(a=>{
const s=db.students.find(x=>x.id===a.studentId);
return `<tr><td>${a.date}</td><td>${esc(s?.class||'-')}</td><td>${esc(s?.name||a.studentId)}</td>
<td><span class="badge ${a.status==='Present'?'ok':'pending'}">${a.status}</span></td>

async function syncSheets(silent){
silent=!!silent;
const url=(db.settings.sheetsUrl||'').trim();
if(!url){if(silent){setSyncStatus('error');return}return alert('Settings → Google Sheets Apps Script URL சேர்க்கவும்.')}
if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(url)){
  if(silent){setSyncStatus('error');return}
  return alert('சரியான Google Apps Script Web App URL வேண்டும். URL /exec என்று முடிந்திருக்க வேண்டும்.');
}
if(silent)setSyncStatus('syncing');
const payload={
 source:'Arul Siragugal Academy',
 syncedAt:new Date().toISOString(),
 settings:db.settings,
 students:db.students||[],
 attendance:db.attendance||[],
 fees:db.fees||[],
 marks:db.marks||[]
};
try{
 const response=await fetch(url,{
   method:'POST',
   headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
   body:'payload='+encodeURIComponent(JSON.stringify(payload))
 });
 const text=await response.text();
 let result;
 try{result=JSON.parse(text)}catch(e){result=null}
 if(response.ok && result && result.success){
   if(silent)setSyncStatus('success');else alert('✅ Google Sheets-ல் data save/update ஆகிவிட்டது.');
 }else if(response.ok){
   if(silent)setSyncStatus('error');else alert('⚠️ Request சென்றது. Apps Script response: '+text.slice(0,300));
 }else{
   if(silent)setSyncStatus('error');else alert('❌ Google Sheets Sync Failed. HTTP '+response.status+'\n'+text.slice(0,300));
 }
}catch(err){
 if(silent)setSyncStatus('error');else alert('❌ Sync failed.\n\nBrowser-ல் direct fetch/CORS block ஆகலாம். Apps Script deployment-ஐ "Anyone" access-ஆக வைத்து மீண்டும் Deploy செய்யவும்.');
}}

function applyIncomingData(result,url){
 // Google Sheets auto-detects numeric-looking cells (e.g. a teacher ID or student password of
 // "1234") and stores them as NUMBERS, not text. Login and matching throughout the app use strict
 // (===) comparison against text typed into <input> fields, which is always a string — so every
 // identity/matching field coming back from Sheets must be forced back to a string here, or logins
 // and lookups silently fail after every import even though the values look identical on screen.
 db.students=(result.students||[]).map(s=>({
   ...s,
   id:String(s.id??''),
   name:String(s.name??''),
   class:String(s.class??''),
   mobile:String(s.mobile??''),
   password:String(s.password??''),
   monthlyFee:Number(s.monthlyFee)||0
 }));
 db.attendance=(result.attendance||[]).map(a=>({
   ...a,
   studentId:String(a.studentId??''),
   date:String(a.date??''),
   status:String(a.status??'')
 }));
 db.fees=(result.fees||[]).map(f=>({
   ...f,
   studentId:String(f.studentId??''),
   date:String(f.date??''),
   type:String(f.type??'Payment'),
   extraType:f.extraType!==undefined&&f.extraType!==''?String(f.extraType):f.extraType,
   amount:Number(f.amount)||0,
   extraAmount:f.extraAmount!==undefined&&f.extraAmount!==''?Number(f.extraAmount)||0:undefined
 }));
 db.marks=(result.marks||[]).map(m=>({
   ...m,
   studentId:String(m.studentId??''),
   exam:String(m.exam??''),
   mark:Number(m.mark)||0,
   total:Number(m.total)||0
 }));
 if(result.settings&&Object.keys(result.settings).length){
   const incoming={...result.settings};
   if(typeof incoming.messages==='string'){try{incoming.messages=JSON.parse(incoming.messages)}catch(e){delete incoming.messages}}
   if(incoming.fee!==undefined)incoming.fee=Number(incoming.fee)||0;
   if(incoming.autoSync!==undefined)incoming.autoSync=(incoming.autoSync===true||incoming.autoSync==='true'||incoming.autoSync==='TRUE');
   ['academy','teacher','mobile','upi','teacherId','teacherPass'].forEach(k=>{if(incoming[k]!==undefined)incoming[k]=String(incoming[k])});
   db.settings={...db.settings,...incoming,sheetsUrl:url,logo:db.settings.logo}; // keep this device's logo + confirmed working URL
 }
}

async function importFromSheets(){
const url=(db.settings.sheetsUrl||'').trim();
if(!url)return alert('Settings → Google Sheets Apps Script URL சேர்க்கவும்.');
if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(url)){
  return alert('சரியான Google Apps Script Web App URL வேண்டும். URL /exec என்று முடிந்திருக்க வேண்டும்.');
}
if(!confirm('⚠️ இது இந்த device-ல் உள்ள தற்போதைய data-வை Google Sheets-ல் உள்ள data கொண்டு மாற்றும் (overwrite). Sync செய்யாத local மாற்றங்கள் இருந்தால் அவை இழக்கப்படும்.\n\nதொடரவா?')) return;
try{
 const response=await fetch(url+(url.includes('?')?'&':'?')+'action=get');
 const text=await response.text();
 let result;
 try{result=JSON.parse(text)}catch(e){result=null}
 if(!response.ok||!result){
   alert('❌ Import failed. Response: '+text.slice(0,300));
   return;
 }
 suppressAutoSync=true; // data just came FROM the sheet — no need to immediately push it back
 applyIncomingData(result,url);
 save();
 suppressAutoSync=false;
 setSyncStatus('success');
 applySettings();
 alert('✅ Google Sheets-ல் இருந்து data இந்த device-க்கு import ஆகிவிட்டது.\n\nStudents: '+db.students.length+' | Attendance: '+db.attendance.length+' | Fees: '+db.fees.length+' | Marks: '+db.marks.length);
 showPage(role==='teacher'?'overview':'studentHome');
}catch(err){
 suppressAutoSync=false;
 alert('❌ Import failed.\n\nBrowser-ல் direct fetch/CORS block ஆகலாம். Apps Script deployment-ஐ "Anyone" access-ஆக வைத்து மீண்டும் Deploy செய்யவும்.');
}}

// Runs automatically the moment the app is opened on ANY device, before login — so every
// device shows the same shared data without anyone tapping Import manually.
// Safety rule: if the sheet comes back completely empty but this device already has real
// local data, we do NOT wipe the device — that usually means the sheet isn't set up yet,
// or a network hiccup returned nothing. In that case we push this device's data up instead.
async function autoImportOnLoad(){
const url=(db.settings.sheetsUrl||'').trim();
if(!url||!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(url))return;
setSyncStatus('syncing');
const loadingEl=document.getElementById('loginLoading');
const tBtn=document.getElementById('teacherLoginBtn'),sBtn=document.getElementById('studentLoginBtn');
if(loadingEl)loadingEl.style.display='block';
if(tBtn)tBtn.disabled=true;
if(sBtn)sBtn.disabled=true;
try{
 const response=await fetch(url+(url.includes('?')?'&':'?')+'action=get');
 const text=await response.text();
 let result;
 try{result=JSON.parse(text)}catch(e){result=null}
 if(!response.ok||!result){setSyncStatus('error');return}

 const incomingHasData=(result.students||[]).length>0||(result.attendance||[]).length>0||(result.fees||[]).length>0||(result.marks||[]).length>0;
 const localHasData=db.students.length>0||db.attendance.length>0||db.fees.length>0||db.marks.length>0;

 if(!incomingHasData&&localHasData){
   // Sheet looks empty but this device has real data — protect it, push up instead of pulling down.
   syncNow();
   return;
 }

 suppressAutoSync=true;
 applyIncomingData(result,url);
 save();
 suppressAutoSync=false;
 setSyncStatus('success');
 applySettings();
 // Refresh whatever's currently on screen so the pulled-in data actually shows up
 if(!app.classList.contains('hidden')){
   const activePage=document.querySelector('.nav button.active')?.dataset.page;
   if(activePage)showPage(activePage);
 }
}catch(err){
 setSyncStatus('error');
}finally{
 if(loadingEl)loadingEl.style.display='none';
 if(tBtn)tBtn.disabled=false;
 if(sBtn)sBtn.disabled=false;
}}

if(localStorage.getItem('asa_dark')==='true')document.body.classList.add('dark');applySettings();
autoImportOnLoad();
</script>
