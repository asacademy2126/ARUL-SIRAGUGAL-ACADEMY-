<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arul Siragugal Academy - Management</title>
<style>
:root{--primary:#4f46e5;--bg:#f4f6fb;--card:#fff;--text:#172033;--muted:#687386;--danger:#dc2626;--success:#16a34a;--border:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Tamil",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#4f46e5,#7c3aed)}
.login-card{width:100%;max-width:430px;background:white;border-radius:22px;padding:28px;box-shadow:0 20px 50px #0003}
.logo{width:76px;height:76px;border-radius:20px;object-fit:cover;background:#eee;display:block;margin:0 auto 12px}
h1,h2,h3{margin-top:0}.login-card h1{text-align:center;font-size:24px}.login-card p{text-align:center;color:var(--muted)}
.role-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.role-tabs button{padding:12px;border-radius:10px;background:#eef0ff;color:var(--primary);font-weight:bold}.role-tabs .active{background:var(--primary);color:#fff}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text)}textarea{min-height:90px;resize:vertical}.btn{padding:11px 15px;border-radius:10px;background:var(--primary);color:white;font-weight:bold}.btn.secondary{background:#e9ecf7;color:#25304a}.btn.danger{background:var(--danger)}.btn.success{background:var(--success)}.msg{text-align:center;margin-top:12px;font-size:14px;color:var(--danger)}
.app{min-height:100vh;display:flex}.sidebar{width:245px;background:#111827;color:white;padding:20px;position:fixed;left:0;top:0;bottom:0;overflow:auto}.brand{font-size:20px;font-weight:bold;margin-bottom:24px}.nav button{width:100%;text-align:left;padding:12px;margin:4px 0;border-radius:10px;background:transparent;color:#dbe3f0}.nav button.active,.nav button:hover{background:#374151;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:22px}.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.topbar .user{color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 4px 14px #00000008}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:26px;font-weight:bold;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.section{margin-top:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;font-size:14px}.table th{background:#f8fafc}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:bold}.badge.ok{background:#dcfce7;color:#166534}.badge.pending{background:#fee2e2;color:#991b1b}.badge.info{background:#e0e7ff;color:#3730a3}.bar-chart{display:flex;align-items:flex-end;gap:12px;height:220px;padding:20px 8px}.bar{flex:1;min-width:25px;background:var(--primary);border-radius:8px 8px 0 0;position:relative}.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11px;margin-bottom:4px}.bar small{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.modal-box{width:100%;max-width:650px;max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px}
.actions{display:flex;gap:6px;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.paybox{background:#eefbf2;border:1px solid #bbf7d0;padding:15px;border-radius:12px}.danger-text{color:var(--danger)}.success-text{color:var(--success)}.att-buttons{display:flex;gap:7px;flex-wrap:wrap}
.att-btn{padding:9px 13px;border-radius:9px;border:2px solid #d1d5db;background:#f8fafc;color:#374151;font-weight:bold}
.att-btn.present.selected{background:#16a34a;color:#fff;border-color:#16a34a}
.att-btn.absent.selected{background:#dc2626;color:#fff;border-color:#dc2626}
.att-btn:hover{transform:translateY(-1px)}
.student-link{background:none;border:0;padding:0;color:var(--primary);font-weight:bold;text-decoration:underline;cursor:pointer}

@media(max-width:900px){.sidebar{width:72px;padding:10px}.brand{font-size:0}.brand:after{content:"ASA";font-size:18px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:20px}.main{margin-left:72px;width:calc(100% - 72px)}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:600px){.role-tabs{grid-template-columns:1fr}.main{padding:12px}.cards{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.topbar{align-items:flex-start}.topbar h2{font-size:19px}}
.dark{--bg:#0b1220;--card:#111827;--text:#e5e7eb;--muted:#9ca3af;--border:#273449}.dark input,.dark select,.dark textarea{background:#0f172a;color:#e5e7eb}.dark .table th{background:#172033}

@media (max-width:768px){body{padding-bottom:82px}.app{display:block}.sidebar{left:0;right:0;top:auto;bottom:0;width:100%;height:72px;padding:4px 2px;display:flex;align-items:center;z-index:9999;overflow-x:auto;overflow-y:hidden;border-top:1px solid #374151}.brand{display:none}.nav{display:flex;width:100%;height:100%;align-items:center;justify-content:space-around;gap:2px}.nav button{flex:1 0 64px;width:auto;margin:0;padding:6px 3px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;min-height:60px}.main{margin-left:0;width:100%;padding:14px}.topbar{margin-bottom:14px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.table th,.table td{font-size:13px;padding:8px}}
@media (min-width:769px){.sidebar{left:0;top:0;bottom:0}.main{margin-left:245px;width:calc(100% - 245px)}}
</style>
<style>#adminNav,#teacherNav{max-height:calc(100vh - 150px);overflow-y:auto}.nav button{margin-bottom:4px}.card .toolbar a{text-decoration:none;display:inline-block}.section{margin-top:16px}@media(max-width:700px){.nav{display:flex!important;flex-direction:column}.sidebar{overflow-y:auto}}</style></head>
<body>
<div id="loginPage" class="login">
<div class="login-card">
<img id="loginLogo" class="logo" alt="Logo">
<h1 id="loginAcademy">Arul Siragugal Academy</h1>
<p>Tuition Management System</p>
<div id="loginLoading" style="display:none;text-align:center;color:var(--muted);font-size:13px;margin:6px 0">⏳ Shared data ஏற்றப்படுகிறது...</div>
<div class="role-tabs"><button id="adminRole" onclick="setRole('admin')">👑 Admin Login</button><button id="teacherRole" class="active" onclick="setRole('teacher')">👨‍🏫 Teacher Login</button><button id="studentRole" onclick="setRole('student')">👨‍🎓 Student Login</button></div>
<div id="adminLogin" class="hidden"><label>Admin ID</label><input id="adminId" placeholder="Admin ID"><label>Password</label><input id="adminPass" type="password" placeholder="Password"><button class="btn" style="width:100%;margin-top:16px" onclick="loginAdmin()">Login</button></div><div id="teacherLogin">
<label>Teacher ID</label><input id="teacherId" placeholder="Teacher ID">
<label>Password</label><input id="teacherPass" type="password" placeholder="Password">
<button class="btn" id="teacherLoginBtn" style="width:100%;margin-top:16px" onclick="loginTeacher()">Login</button>
</div>
<div id="studentLogin" class="hidden">
<label>Student ID</label><input id="studentId" placeholder="Student ID">
<label>Password</label><input id="studentPass" type="password" placeholder="Password">
<button class="btn" id="studentLoginBtn" style="width:100%;margin-top:16px" onclick="loginStudent()">Login</button>
</div>
<div id="loginMsg" class="msg"></div>
</div></div>

<div id="app" class="app hidden">
<aside class="sidebar">
<div class="brand" id="sideAcademy">Arul Siragugal Academy</div>
<div class="nav" id="adminNav">
<button onclick="showPage('overview')" data-page="overview">🏠 Dashboard</button>
<button onclick="showPage('students')" data-page="students">👨‍🎓 Students</button>
<button onclick="showPage('attendance')" data-page="attendance">📅 Attendance</button>
<button onclick="showPage('fees')" data-page="fees">💰 Fees</button>
<button onclick="showPage('marks')" data-page="marks">📝 Marks</button>
<button onclick="showPage('reports')" data-page="reports">📊 Reports</button>
<button onclick="showPage('communication')" data-page="communication">📢 Communication</button>
<button onclick="showPage('homework')" data-page="homework">📚 Homework</button>
<button onclick="showPage('exams')" data-page="exams">🗓️ Exams</button>
<button onclick="showPage('teachers')" data-page="teachers">👨‍🏫 Teachers</button>
<button onclick="showPage('backup')" data-page="backup">💾 Backup</button>
<button onclick="showPage('finance')" data-page="finance">💵 Income & Expense</button>
<button onclick="showPage('tests')" data-page="tests">🧪 Online Tests</button>
<button onclick="showPage('calendar')" data-page="calendar">🗓️ Calendar</button>
<button onclick="showPage('birthdays')" data-page="birthdays">🎂 Birthdays</button>
<button onclick="showPage('settings')" data-page="settings">⚙️ Settings</button>
</div>
<div class="nav hidden" id="teacherNav">
<button onclick="showPage('attendance')" data-page="attendance">📅 Attendance</button>
<button onclick="showPage('fees')" data-page="fees">💰 Fees Collect</button>
<button onclick="showPage('marks')" data-page="marks">📝 Mark Entry</button>
</div>
<div class="nav hidden" id="studentNav">
<button onclick="showPage('studentHome')" data-page="studentHome">📊 Marks</button>
<button onclick="showPage('studentAttendance')" data-page="studentAttendance">📅 Attendance</button>
<button onclick="showPage('studentFees')" data-page="studentFees">💰 Fees</button><button onclick="showPage('studentProfile')" data-page="studentProfile">👤 Profile</button>
<button onclick="showPage('studentTests')" data-page="studentTests">📝 Test</button>
<button onclick="showPage('studentHomework')" data-page="studentHomework">📚 Homework</button>
<button onclick="showPage('studentNotices')" data-page="studentNotices">📢 Notice</button>
</div>
<button class="btn danger" style="width:100%;margin-top:20px" onclick="logout()">Logout</button>
</aside>
<main class="main">
<div class="topbar"><div><h2 id="pageTitle">Overview</h2><div class="user" id="welcome"></div></div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span id="syncStatus" style="font-size:12px;color:var(--muted)"></span><button class="btn success" id="topSyncBtn" onclick="syncSheets()">☁️ Sync</button><button class="btn secondary" onclick="toggleDark()">🌙 Dark</button></div></div>
<div id="content"></div>
</main></div>

<div id="modal" class="modal hidden"><div class="modal-box"><div class="topbar"><h3 id="modalTitle">Form</h3><button class="btn secondary" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>

<script>
const KEY='asa_management_v2';
const DEFAULT_SHEETS_URL='https://script.google.com/macros/s/AKfycbygpzp54F2mQl2NZHsXc2K9nCBzCtflplemx11_d_zNoUcYPw4qVODHwH0SPOK3r_nY/exec';
const SHEETS=['Students','Attendance','Fees','Marks','Tests','Homework','Notices','Teachers','Settings'];
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 settings:{academy:'Arul Siragugal Academy',teacher:'Teacher',mobile:'',fee:1000,logo:'',upi:'',teacherId:'teacher',teacherPass:'1234',adminId:'admin',adminPass:'admin123',sheetsUrl:DEFAULT_SHEETS_URL,autoSync:true},
 students:[],attendance:[],fees:[],marks:[],tests:[],homework:[],notices:[],teachers:[]
};
db.settings=db.settings||{}; db.settings.sheetsUrl=(db.settings.sheetsUrl||DEFAULT_SHEETS_URL);
db.settings.autoSync=true;
['students','attendance','fees','marks','tests','homework','notices','teachers'].forEach(k=>db[k]=Array.isArray(db[k])?db[k]:[]);
let role='teacher', currentStudent=null, suppressAutoSync=false, syncBusy=false;

function save(){
 localStorage.setItem(KEY,JSON.stringify(db));
 if(!suppressAutoSync) syncNow();
}
function syncNow(){ if((db.settings.sheetsUrl||'').trim()) syncSheets(true); }
function setSyncStatus(state){
 const el=document.getElementById('syncStatus'); if(!el)return;
 if(state==='syncing')el.innerHTML='⏳ Google Sheets-ல் Save ஆகிறது…';
 else if(state==='success')el.innerHTML='✅ Synced '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
 else if(state==='error')el.innerHTML='⚠️ Sync failed <button class="btn secondary" style="padding:2px 8px;font-size:11px" onclick="syncSheets()">Retry</button>';
 else el.innerHTML='';
}
async function syncSheets(silent=false){
 if(syncBusy)return;
 const url=(db.settings.sheetsUrl||'').trim();
 if(!url){setSyncStatus('error');return}
 syncBusy=true; if(!silent)setSyncStatus('syncing'); else setSyncStatus('syncing');
 try{
  const payload={action:'sync',timestamp:new Date().toISOString(),data:{
   Students:db.students,Attendance:db.attendance,Fees:db.fees,Marks:db.marks,
   Tests:db.tests,Homework:db.homework,Notices:db.notices,Teachers:db.teachers,
   Settings:db.settings
  }};
  await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  setSyncStatus('success');
 }catch(e){console.error(e);setSyncStatus('error')}finally{syncBusy=false}
}
async function loadFromSheets(){
 const url=(db.settings.sheetsUrl||'').trim(); if(!url)return;
 const loading=document.getElementById('loginLoading'); if(loading)loading.style.display='block';
 try{
  const r=await fetch(url+'?action=load',{method:'GET'});
  const j=await r.json();
  if(j&&j.data){
   suppressAutoSync=true;
   if(Array.isArray(j.data.Students))db.students=j.data.Students;
   if(Array.isArray(j.data.Attendance))db.attendance=j.data.Attendance;
   if(Array.isArray(j.data.Fees))db.fees=j.data.Fees;
   if(Array.isArray(j.data.Marks))db.marks=j.data.Marks;
   if(Array.isArray(j.data.Tests))db.tests=j.data.Tests;
   if(Array.isArray(j.data.Homework))db.homework=j.data.Homework;
   if(Array.isArray(j.data.Notices))db.notices=j.data.Notices;
   if(Array.isArray(j.data.Teachers))db.teachers=j.data.Teachers;
   if(j.data.Settings&&typeof j.data.Settings==='object')db.settings={...db.settings,...j.data.Settings,sheetsUrl:url,autoSync:true};
   localStorage.setItem(KEY,JSON.stringify(db)); suppressAutoSync=false; setSyncStatus('success');
  }
 }catch(e){console.warn('Sheet load failed',e)}finally{if(loading)loading.style.display='none'}
}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(prefix='ID'){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6)}
function setRole(r){
 role=r; adminRole.classList.toggle('active',r==='admin'); teacherRole.classList.toggle('active',r==='teacher'); studentRole.classList.toggle('active',r==='student');
 adminLogin.classList.toggle('hidden',r!=='admin'); teacherLogin.classList.toggle('hidden',r!=='teacher'); studentLogin.classList.toggle('hidden',r!=='student'); loginMsg.textContent='';
}
function loginAdmin(){
 const id=String(adminId.value||'').trim(), pass=String(adminPass.value||'');
 if(id===String(db.settings.adminId||'admin')&&pass===String(db.settings.adminPass||'admin123'))enterApp('admin');
 else loginMsg.textContent='Admin ID / Password தவறாக உள்ளது.';
}
function loginTeacher(){
 if(String(teacherId.value||'')===String(db.settings.teacherId||'teacher')&&String(teacherPass.value||'')===String(db.settings.teacherPass||'1234'))enterApp('teacher');
 else loginMsg.textContent='Teacher ID / Password தவறாக உள்ளது.';
}
function loginStudent(){
 const s=db.students.find(x=>String(x.id)===String(studentId.value||'').trim()&&String(x.password||'')===String(studentPass.value||''));
 if(s){currentStudent=s;enterApp('student')}else loginMsg.textContent='Student ID / Password தவறாக உள்ளது.';
}
function enterApp(r){
 role=r;loginPage.classList.add('hidden');app.classList.remove('hidden');
 adminNav.classList.toggle('hidden',r!=='admin');teacherNav.classList.toggle('hidden',r!=='teacher');studentNav.classList.toggle('hidden',r!=='student');
 topSyncBtn.classList.toggle('hidden',r==='student');
 welcome.textContent=r==='admin'?'👑 Admin':r==='teacher'?'👨‍🏫 '+(db.settings.teacher||'Teacher'):'👨‍🎓 '+(currentStudent?.name||'Student');
 applySettings();showPage(r==='admin'?'overview':r==='teacher'?'attendance':'studentHome');
}
function logout(){currentStudent=null;app.classList.add('hidden');loginPage.classList.remove('hidden');setRole('teacher')}
function applySettings(){
 document.title=(db.settings.academy||'Arul Siragugal Academy')+' - Management';
 loginAcademy.textContent=db.settings.academy||'Arul Siragugal Academy';sideAcademy.textContent=db.settings.academy||'Arul Siragugal Academy';
 if(db.settings.logo)loginLogo.src=db.settings.logo; else loginLogo.removeAttribute('src');
}
function showPage(page){
 document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 const titles={overview:'Dashboard',students:'Students',attendance:'Attendance',fees:'Fees',marks:'Marks',reports:'Reports',communication:'Communication',homework:'Homework',exams:'Exams',teachers:'Teachers',backup:'Backup',finance:'Income & Expense',tests:'Test Management',calendar:'Calendar',birthdays:'Birthdays',settings:'Settings',studentHome:'My Marks',studentAttendance:'My Attendance',studentFees:'My Fees',studentProfile:'My Profile',studentTests:'📝 Test',studentHomework:'📚 Homework',studentNotices:'📢 Notice'};
 pageTitle.textContent=titles[page]||page; content.innerHTML=pages[page]?pages[page]():`<div class="card"><h3>Page not found</h3></div>`;
 if(page==='overview')renderOverviewCharts();
}
function card(title,body){return `<div class="card"><h3>${title}</h3>${body}</div>`}
function pagesListRows(arr,cols){
 return arr.length?arr.map(o=>'<tr>'+cols.map(c=>`<td>${esc(o[c]??'')}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${cols.length}">No records</td></tr>`;
}
const pages={};
pages.overview=()=>`<div class="cards">
${card('👨‍🎓 Students',`<div class="stat value">${db.students.length}</div>`)}
${card('📅 Attendance',`<div class="stat value">${db.attendance.length}</div>`)}
${card('📝 Marks',`<div class="stat value">${db.marks.length}</div>`)}
${card('🧪 Tests',`<div class="stat value">${db.tests.length}</div>`)}
</div><div class="grid2"><div class="card"><h3>Quick Actions</h3><div class="toolbar"><button class="btn" onclick="openStudentForm()">+ Student</button><button class="btn" onclick="openTestForm()">+ Test</button><button class="btn" onclick="openHomeworkForm()">+ Homework</button><button class="btn" onclick="openNoticeForm()">+ Notice</button></div></div><div class="card"><h3>☁️ Google Sheets</h3><p>9 tabs sync enabled.</p><button class="btn success" onclick="syncSheets()">Sync Now</button></div></div>`;
function renderOverviewCharts(){}
pages.students=()=>`<div class="card"><div class="toolbar"><button class="btn" onclick="openStudentForm()">+ Add Student</button></div><div class="table-wrap"><table class="table"><tr><th>ID</th><th>Name</th><th>Class</th><th>Phone</th><th>Actions</th></tr>${db.students.map((s,i)=>`<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${esc(s.className)}</td><td>${esc(s.phone)}</td><td><div class="actions"><button class="btn secondary" onclick="editStudent(${i})">Edit</button><button class="btn danger" onclick="deleteItem('students',${i})">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="5">No students</td></tr>'}</table></div></div>`;
pages.attendance=()=>{let rows=db.students.map(s=>{let a=db.attendance.find(x=>x.studentId===s.id&&x.date===today());return `<tr><td>${esc(s.name)}</td><td>${esc(s.className)}</td><td><div class="att-buttons"><button class="att-btn present ${a?.status==='Present'?'selected':''}" onclick="markAttendance('${esc(s.id)}','Present')">Present</button><button class="att-btn absent ${a?.status==='Absent'?'selected':''}" onclick="markAttendance('${esc(s.id)}','Absent')">Absent</button></div></td></tr>`}).join('');return `<div class="card"><h3>Today: ${today()}</h3><div class="table-wrap"><table class="table"><tr><th>Student</th><th>Class</th><th>Status</th></tr>${rows||'<tr><td colspan="3">No students</td></tr>'}</table></div></div>`};
pages.fees=()=>`<div class="card"><div class="toolbar"><button class="btn" onclick="openFeeForm()">+ Fee Entry</button></div><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Student</th><th>Amount</th><th>Month</th><th>Status</th></tr>${db.fees.map(f=>`<tr><td>${esc(f.date)}</td><td>${esc(studentName(f.studentId))}</td><td>${money(f.amount)}</td><td>${esc(f.month)}</td><td>${esc(f.status||'Paid')}</td></tr>`).join('')||'<tr><td colspan="5">No fees</td></tr>'}</table></div></div>`;
pages.marks=()=>`<div class="card"><div class="toolbar"><button class="btn" onclick="openMarkForm()">+ Mark Entry</button></div><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Student</th><th>Subject</th><th>Marks</th><th>Total</th></tr>${db.marks.map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(studentName(m.studentId))}</td><td>${esc(m.subject)}</td><td>${esc(m.marks)}</td><td>${esc(m.total)}</td></tr>`).join('')||'<tr><td colspan="5">No marks</td></tr>'}</table></div></div>`;
pages.reports=()=>`<div class="grid2">${card('Total Fees',money(db.fees.reduce((a,b)=>a+Number(b.amount||0),0)))}${card('Students',db.students.length)}${card('Tests',db.tests.length)}${card('Homework',db.homework.length)}</div>`;
pages.communication=()=>`<div class="card"><h3>📢 Notices</h3><button class="btn" onclick="openNoticeForm()">+ New Notice</button><div class="section">${noticeTable()}</div></div>`;
pages.homework=()=>`<div class="card"><div class="toolbar"><button class="btn" onclick="openHomeworkForm()">+ Add Homework</button></div>${homeworkTable(true)}</div>`;
pages.exams=()=>`<div class="card"><h3>Exams</h3><p>Use Test Management for online tests.</p><button class="btn" onclick="showPage('tests')">Open Tests</button></div>`;
pages.teachers=()=>`<div class="card"><div class="toolbar"><button class="btn" onclick="openTeacherForm()">+ Add Teacher</button></div><table class="table"><tr><th>ID</th><th>Name</th><th>Subject</th><th>Phone</th><th>Action</th></tr>${db.teachers.map((t,i)=>`<tr><td>${esc(t.id)}</td><td>${esc(t.name)}</td><td>${esc(t.subject)}</td><td>${esc(t.phone)}</td><td><button class="btn danger" onclick="deleteItem('teachers',${i})">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No teachers</td></tr>'}</table></div>`;
pages.backup=()=>`<div class="card"><h3>Backup</h3><p>Download a local JSON backup.</p><button class="btn" onclick="downloadBackup()">⬇️ Download Backup</button><button class="btn secondary" onclick="document.getElementById('restoreFile').click()">Restore</button><input id="restoreFile" type="file" accept=".json" hidden onchange="restoreBackup(this)"></div>`;
pages.finance=()=>`<div class="card"><h3>Income & Expense</h3><p>Income: <b>${money(db.fees.reduce((a,b)=>a+Number(b.amount||0),0))}</b></p><p>Expense tracking can be added to the Expenses sheet when needed.</p></div>`;
pages.tests=()=>`<div class="card"><div class="toolbar"><button class="btn" onclick="openTestForm()">+ Create Test</button></div><div class="table-wrap"><table class="table"><tr><th>Title</th><th>Subject</th><th>Date</th><th>Duration</th><th>Questions</th><th>Action</th></tr>${db.tests.map((t,i)=>`<tr><td>${esc(t.title)}</td><td>${esc(t.subject)}</td><td>${esc(t.date)}</td><td>${esc(t.duration)} min</td><td>${(t.questions||[]).length}</td><td><button class="btn danger" onclick="deleteItem('tests',${i})">Delete</button></td></tr>`).join('')||'<tr><td colspan="6">No tests</td></tr>'}</table></div></div>`;
pages.calendar=()=>`<div class="card"><h3>🗓️ Calendar</h3><p>${new Date().toLocaleDateString('en-IN',{dateStyle:'full'})}</p><p>Tests: ${db.tests.filter(x=>x.date===today()).length} · Homework: ${db.homework.filter(x=>x.date===today()).length}</p></div>`;
pages.birthdays=()=>`<div class="card"><h3>🎂 Birthdays</h3><p>Student DOB data can be stored in the Students sheet.</p></div>`;
pages.settings=()=>`<div class="card"><h3>⚙️ Settings</h3><div class="two"><div><label>Academy</label><input id="setAcademy" value="${esc(db.settings.academy)}"></div><div><label>Teacher Name</label><input id="setTeacher" value="${esc(db.settings.teacher)}"></div><div><label>Admin ID</label><input id="setAdminId" value="${esc(db.settings.adminId||'admin')}"></div><div><label>Admin Password</label><input id="setAdminPass" value="${esc(db.settings.adminPass||'admin123')}"></div><div><label>Teacher ID</label><input id="setTeacherId" value="${esc(db.settings.teacherId||'teacher')}"></div><div><label>Teacher Password</label><input id="setTeacherPass" value="${esc(db.settings.teacherPass||'1234')}"></div></div><label>Google Apps Script Web App URL</label><input id="setSheetsUrl" value="${esc(db.settings.sheetsUrl)}"><div class="toolbar" style="margin-top:15px"><button class="btn" onclick="saveSettings()">Save Settings</button><button class="btn success" onclick="syncSheets()">☁️ Sync Now</button></div><hr><p><b>Required tabs:</b> ${SHEETS.join(', ')}</p></div>`;
pages.studentHome=()=>studentDashboard();
pages.studentAttendance=()=>studentAttendancePage();
pages.studentFees=()=>studentFeesPage();
pages.studentProfile=()=>`<div class="card"><h3>👤 Profile</h3><div class="two"><p><b>ID:</b> ${esc(currentStudent?.id)}</p><p><b>Name:</b> ${esc(currentStudent?.name)}</p><p><b>Class:</b> ${esc(currentStudent?.className)}</p><p><b>Phone:</b> ${esc(currentStudent?.phone)}</p></div></div>`;
pages.studentTests=()=>studentTestsPage();
pages.studentHomework=()=>`<div class="card"><h3>📚 Homework</h3>${homeworkTable(false,true)}</div>`;
pages.studentNotices=()=>`<div class="card"><h3>📢 Notice</h3>${noticeTable(false,true)}</div>`;

function studentName(id){const s=db.students.find(x=>x.id===id);return s?s.name:id||''}
function studentDashboard(){const ms=db.marks.filter(x=>x.studentId===currentStudent?.id);return `<div class="cards"><div class="card stat"><div class="label">Marks</div><div class="value">${ms.length}</div></div><div class="card stat"><div class="label">Tests</div><div class="value">${db.tests.length}</div></div><div class="card stat"><div class="label">Homework</div><div class="value">${db.homework.filter(x=>!x.studentId||x.studentId===currentStudent?.id).length}</div></div><div class="card stat"><div class="label">Notices</div><div class="value">${db.notices.length}</div></div></div><div class="grid2"><div class="card"><h3>📝 My Marks</h3>${ms.length?`<table class="table"><tr><th>Subject</th><th>Marks</th><th>Total</th></tr>${ms.map(m=>`<tr><td>${esc(m.subject)}</td><td>${esc(m.marks)}</td><td>${esc(m.total)}</td></tr>`).join('')}</table>`:'No marks yet.'}</div><div class="card"><h3>Quick Access</h3><div class="toolbar"><button class="btn" onclick="showPage('studentTests')">📝 Test</button><button class="btn" onclick="showPage('studentHomework')">📚 Homework</button><button class="btn" onclick="showPage('studentNotices')">📢 Notice</button></div></div></div>`}
function studentAttendancePage(){const a=db.attendance.filter(x=>x.studentId===currentStudent?.id);return `<div class="card"><h3>📅 My Attendance</h3><table class="table"><tr><th>Date</th><th>Status</th></tr>${a.map(x=>`<tr><td>${esc(x.date)}</td><td><span class="badge ${x.status==='Present'?'ok':'pending'}">${esc(x.status)}</span></td></tr>`).join('')||'<tr><td colspan="2">No attendance</td></tr>'}</table></div>`}
function studentFeesPage(){const f=db.fees.filter(x=>x.studentId===currentStudent?.id);return `<div class="card"><h3>💰 My Fees</h3><table class="table"><tr><th>Date</th><th>Month</th><th>Amount</th><th>Status</th></tr>${f.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.month)}</td><td>${money(x.amount)}</td><td>${esc(x.status||'Paid')}</td></tr>`).join('')||'<tr><td colspan="4">No fees</td></tr>'}</table></div>`}
function studentTestsPage(){const ts=db.tests;return `<div class="card"><h3>📝 Tests</h3>${ts.map((t,i)=>`<div class="card" style="margin:10px 0"><h3>${esc(t.title)}</h3><p>${esc(t.subject)} · ${esc(t.date)} · ${esc(t.duration)} min</p><button class="btn" onclick="startTest(${i})">Start Test</button></div>`).join('')||'<p>No tests available.</p>'}</div>`}
function homeworkTable(admin=false,student=false){const arr=db.homework.filter(x=>!student||!x.studentId||x.studentId===currentStudent?.id);return `<table class="table"><tr><th>Title</th><th>Subject</th><th>Due Date</th><th>Description</th>${admin?'<th>Action</th>':''}</tr>${arr.map((h,i)=>`<tr><td>${esc(h.title)}</td><td>${esc(h.subject)}</td><td>${esc(h.dueDate)}</td><td>${esc(h.description)}</td>${admin?`<td><button class="btn danger" onclick="deleteItem('homework',${i})">Delete</button></td>`:''}</tr>`).join('')||`<tr><td colspan="${admin?5:4}">No homework</td></tr>`}</table>`}
function noticeTable(admin=false,student=false){const arr=db.notices;return `<table class="table"><tr><th>Date</th><th>Title</th><th>Message</th>${admin?'<th>Action</th>':''}</tr>${arr.map((n,i)=>`<tr><td>${esc(n.date)}</td><td>${esc(n.title)}</td><td>${esc(n.message)}</td>${admin?`<td><button class="btn danger" onclick="deleteItem('notices',${i})">Delete</button></td>`:''}</tr>`).join('')||`<tr><td colspan="${admin?4:3}">No notices</td></tr>`}</table>`}
function openModal(title,body){modalTitle.textContent=title;modalBody.innerHTML=body;modal.classList.remove('hidden')}
function closeModal(){modal.classList.add('hidden')}
function studentOptions(){return db.students.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} (${esc(s.id)})</option>`).join('')}
function openStudentForm(idx=-1){
 const s=idx>=0?db.students[idx]:{};
 openModal(idx>=0?'Edit Student':'Add Student',`<label>Student ID</label><input id="fId" value="${esc(s.id||'')}"><label>Name</label><input id="fName" value="${esc(s.name||'')}"><div class="two"><div><label>Class</label><input id="fClass" value="${esc(s.className||'')}"></div><div><label>Phone</label><input id="fPhone" value="${esc(s.phone||'')}"></div></div><label>Password</label><input id="fPass" value="${esc(s.password||'1234')}"><button class="btn" style="margin-top:15px" onclick="saveStudent(${idx})">Save</button>`);
}
function saveStudent(idx){const o={id:fId.value.trim(),name:fName.value.trim(),className:fClass.value.trim(),phone:fPhone.value.trim(),password:fPass.value};if(!o.id||!o.name)return alert('Student ID and Name required');if(idx>=0)db.students[idx]=o;else db.students.push(o);closeModal();save();showPage('students')}
function editStudent(i){openStudentForm(i)}
function openFeeForm(){openModal('Fee Entry',`<label>Student</label><select id="fStudent">${studentOptions()}</select><div class="two"><div><label>Month</label><input id="fMonth" value="${new Date().toLocaleString('en-IN',{month:'long',year:'numeric'})}"></div><div><label>Amount</label><input id="fAmount" type="number" value="${db.settings.fee||1000}"></div></div><label>Status</label><select id="fStatus"><option>Paid</option><option>Pending</option></select><button class="btn" style="margin-top:15px" onclick="saveFee()">Save</button>`)}
function saveFee(){db.fees.push({id:uid('FEE'),date:today(),studentId:fStudent.value,month:fMonth.value,amount:Number(fAmount.value||0),status:fStatus.value});closeModal();save();showPage('fees')}
function openMarkForm(){openModal('Mark Entry',`<label>Student</label><select id="fStudent">${studentOptions()}</select><div class="two"><div><label>Subject</label><input id="fSubject"></div><div><label>Marks</label><input id="fMarks" type="number"></div></div><label>Total</label><input id="fTotal" type="number" value="100"><button class="btn" style="margin-top:15px" onclick="saveMark()">Save</button>`)}
function saveMark(){db.marks.push({id:uid('MARK'),date:today(),studentId:fStudent.value,subject:fSubject.value,marks:Number(fMarks.value||0),total:Number(fTotal.value||100)});closeModal();save();showPage('marks')}
function openHomeworkForm(){openModal('Homework Management',`<label>Title</label><input id="fTitle"><div class="two"><div><label>Subject</label><input id="fSubject"></div><div><label>Due Date</label><input id="fDue" type="date"></div></div><label>Assign Student (optional)</label><select id="fStudent"><option value="">All Students</option>${studentOptions()}</select><label>Description</label><textarea id="fDesc"></textarea><button class="btn" style="margin-top:15px" onclick="saveHomework()">Publish Homework</button>`)}
function saveHomework(){db.homework.push({id:uid('HW'),date:today(),title:fTitle.value,subject:fSubject.value,dueDate:fDue.value,studentId:fStudent.value,description:fDesc.value});closeModal();save();showPage('homework')}
function openNoticeForm(){openModal('Notice Management',`<label>Title</label><input id="fTitle"><label>Message</label><textarea id="fMsg"></textarea><button class="btn" style="margin-top:15px" onclick="saveNotice()">Publish Notice</button>`)}
function saveNotice(){db.notices.unshift({id:uid('NOTICE'),date:today(),title:fTitle.value,message:fMsg.value});closeModal();save();showPage(role==='admin'?'communication':'studentNotices')}
function openTestForm(){openModal('Test Management',`<label>Test Title</label><input id="fTitle"><div class="two"><div><label>Subject</label><input id="fSubject"></div><div><label>Date</label><input id="fDate" type="date" value="${today()}"></div></div><label>Duration (minutes)</label><input id="fDuration" type="number" value="30"><label>Questions (one per line: Question | Option A | Option B | Option C | Option D | Answer)</label><textarea id="fQuestions" placeholder="2+2=? | 3 | 4 | 5 | 6 | B"></textarea><button class="btn" style="margin-top:15px" onclick="saveTest()">Create Test</button>`)}
function saveTest(){const questions=fQuestions.value.split('\\n').map(line=>line.trim()).filter(Boolean).map(line=>{const p=line.split('|').map(x=>x.trim());return {question:p[0]||'',options:p.slice(1,5),answer:p[5]||''}});db.tests.push({id:uid('TEST'),title:fTitle.value,subject:fSubject.value,date:fDate.value,duration:Number(fDuration.value||30),questions});closeModal();save();showPage('tests')}
function startTest(i){const t=db.tests[i];let html=`<form id="testForm"><h3>${esc(t.title)}</h3>`;t.questions.forEach((q,qi)=>{html+=`<div class="card" style="margin:10px 0"><b>${qi+1}. ${esc(q.question)}</b>${q.options.map((o,j)=>`<label><input type="radio" name="q${qi}" value="${String.fromCharCode(65+j)}"> ${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}</div>`});html+=`<button class="btn" type="button" onclick="submitTest(${i})">Submit Test</button></form>`;openModal('📝 Test',html)}
function submitTest(i){const t=db.tests[i];let score=0;t.questions.forEach((q,qi)=>{const v=document.querySelector(`input[name="q${qi}"]:checked`);if(v&&v.value.toUpperCase()===String(q.answer).toUpperCase())score++});alert(`Score: ${score}/${t.questions.length}`);closeModal()}
function openTeacherForm(){openModal('Add Teacher',`<label>Teacher ID</label><input id="fId"><label>Name</label><input id="fName"><label>Subject</label><input id="fSubject"><label>Phone</label><input id="fPhone"><button class="btn" style="margin-top:15px" onclick="saveTeacher()">Save</button>`)}
function saveTeacher(){db.teachers.push({id:fId.value,name:fName.value,subject:fSubject.value,phone:fPhone.value});closeModal();save();showPage('teachers')}
function markAttendance(studentId,status){const i=db.attendance.findIndex(x=>x.studentId===studentId&&x.date===today());if(i>=0)db.attendance[i].status=status;else db.attendance.push({id:uid('ATT'),date:today(),studentId,status});save();showPage('attendance')}
function deleteItem(key,i){if(confirm('Delete this record?')){db[key].splice(i,1);save();showPage(key==='notices'?'communication':key==='homework'?'homework':key==='tests'?'tests':key==='teachers'?'teachers':'students')}}
function saveSettings(){db.settings.academy=setAcademy.value.trim()||'Arul Siragugal Academy';db.settings.teacher=setTeacher.value.trim()||'Teacher';db.settings.adminId=setAdminId.value.trim()||'admin';db.settings.adminPass=setAdminPass.value||'admin123';db.settings.teacherId=setTeacherId.value.trim()||'teacher';db.settings.teacherPass=setTeacherPass.value||'1234';db.settings.sheetsUrl=setSheetsUrl.value.trim()||DEFAULT_SHEETS_URL;localStorage.setItem(KEY,JSON.stringify(db));applySettings();setSyncStatus('success');syncSheets();alert('Settings saved');}
function downloadBackup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ASA-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(input){const file=input.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);localStorage.setItem(KEY,JSON.stringify(db));alert('Backup restored');location.reload()}catch(e){alert('Invalid backup')}};r.readAsText(file)}
function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('asa_dark',document.body.classList.contains('dark')?'1':'0')}
if(localStorage.getItem('asa_dark')==='1')document.body.classList.add('dark');
applySettings();
setRole('teacher');
loadFromSheets();
</script>
