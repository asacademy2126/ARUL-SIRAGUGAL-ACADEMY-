<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arul Siragugal Academy - Management</title>
<style>
:root{--primary:#4f46e5;--bg:#f4f6fb;--card:#fff;--text:#172033;--muted:#687386;--danger:#dc2626;--success:#16a34a;--border:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Tamil",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#4f46e5,#7c3aed)}
.login-card{width:100%;max-width:430px;background:white;border-radius:22px;padding:28px;box-shadow:0 20px 50px #0003}
.logo{width:76px;height:76px;border-radius:20px;object-fit:cover;background:#eee;display:block;margin:0 auto 12px}
h1,h2,h3{margin-top:0}.login-card h1{text-align:center;font-size:24px}.login-card p{text-align:center;color:var(--muted)}
.role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0}.role-tabs button{padding:12px;border-radius:10px;background:#eef0ff;color:var(--primary);font-weight:bold}.role-tabs .active{background:var(--primary);color:#fff}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text)}textarea{min-height:90px;resize:vertical}.btn{padding:11px 15px;border-radius:10px;background:var(--primary);color:white;font-weight:bold}.btn.secondary{background:#e9ecf7;color:#25304a}.btn.danger{background:var(--danger)}.btn.success{background:var(--success)}.msg{text-align:center;margin-top:12px;font-size:14px;color:var(--danger)}
.app{min-height:100vh;display:flex}.sidebar{width:245px;background:#111827;color:white;padding:20px;position:fixed;left:0;top:0;bottom:0;overflow:auto}.brand{font-size:20px;font-weight:bold;margin-bottom:24px}.nav button{width:100%;text-align:left;padding:12px;margin:4px 0;border-radius:10px;background:transparent;color:#dbe3f0}.nav button.active,.nav button:hover{background:#374151;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:22px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.topbar .user{color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 4px 14px #00000008}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:26px;font-weight:bold;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.section{margin-top:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;font-size:14px}.table th{background:#f8fafc}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:bold}.badge.ok{background:#dcfce7;color:#166534}.badge.pending{background:#fee2e2;color:#991b1b}.badge.info{background:#e0e7ff;color:#3730a3}.bar-chart{display:flex;align-items:flex-end;gap:12px;height:220px;padding:20px 8px}.bar{flex:1;min-width:25px;background:var(--primary);border-radius:8px 8px 0 0;position:relative}.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11px;margin-bottom:4px}.bar small{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.modal-box{width:100%;max-width:650px;max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px}
.actions{display:flex;gap:6px;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.paybox{background:#eefbf2;border:1px solid #bbf7d0;padding:15px;border-radius:12px}.danger-text{color:var(--danger)}.success-text{color:var(--success)}.att-buttons{display:flex;gap:7px;flex-wrap:wrap}
.att-btn{padding:9px 13px;border-radius:9px;border:2px solid #d1d5db;background:#f8fafc;color:#374151;font-weight:bold}
.att-btn.present.selected{background:#16a34a;color:#fff;border-color:#16a34a}
.att-btn.absent.selected{background:#dc2626;color:#fff;border-color:#dc2626}
.att-btn:hover{transform:translateY(-1px)}
.student-link{background:none;border:0;padding:0;color:var(--primary);font-weight:bold;text-decoration:underline;cursor:pointer}

@media(max-width:900px){.sidebar{width:72px;padding:10px}.brand{font-size:0}.brand:after{content:"ASA";font-size:18px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:20px}.main{margin-left:72px;width:calc(100% - 72px)}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:600px){.main{padding:12px}.cards{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.topbar{align-items:flex-start}.topbar h2{font-size:19px}}
.dark{--bg:#0b1220;--card:#111827;--text:#e5e7eb;--muted:#9ca3af;--border:#273449}.dark input,.dark select,.dark textarea{background:#0f172a;color:#e5e7eb}.dark .table th{background:#172033}

@media (max-width:768px){body{padding-bottom:82px}.app{display:block}.sidebar{left:0;right:0;top:auto;bottom:0;width:100%;height:72px;padding:4px 2px;display:flex;align-items:center;z-index:9999;overflow-x:auto;overflow-y:hidden;border-top:1px solid #374151}.brand{display:none}.nav{display:flex;width:100%;height:100%;align-items:center;justify-content:space-around;gap:2px}.nav button{flex:1 0 64px;width:auto;margin:0;padding:6px 3px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;min-height:60px}.main{margin-left:0;width:100%;padding:14px}.topbar{margin-bottom:14px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.table th,.table td{font-size:13px;padding:8px}}
@media (min-width:769px){.sidebar{left:0;top:0;bottom:0}.main{margin-left:245px;width:calc(100% - 245px)}}
</style>
</head>
<body>
<div id="loginPage" class="login">
<div class="login-card">
<img id="loginLogo" class="logo" alt="Logo">
<h1 id="loginAcademy">Arul Siragugal Academy</h1>
<p>Tuition Management System</p>
<div class="role-tabs"><button id="teacherRole" class="active" onclick="setRole('teacher')">👨‍🏫 Teacher Login</button><button id="studentRole" onclick="setRole('student')">👨‍🎓 Student Login</button></div>
<div id="teacherLogin">
<label>Teacher ID</label><input id="teacherId" placeholder="Teacher ID">
<label>Password</label><input id="teacherPass" type="password" placeholder="Password">
<button class="btn" style="width:100%;margin-top:16px" onclick="loginTeacher()">Login</button>
</div>
<div id="studentLogin" class="hidden">
<label>Student ID</label><input id="studentId" placeholder="Student ID">
<label>Password</label><input id="studentPass" type="password" placeholder="Password">
<button class="btn" style="width:100%;margin-top:16px" onclick="loginStudent()">Login</button>
</div>
<div id="loginMsg" class="msg"></div>
</div></div>

<div id="app" class="app hidden">
<aside class="sidebar">
<div class="brand" id="sideAcademy">Arul Siragugal Academy</div>
<div class="nav" id="teacherNav">
<button onclick="showPage('overview')" data-page="overview">🏠 Overview</button>
<button onclick="showPage('students')" data-page="students">👨‍🎓 Students</button>
<button onclick="showPage('attendance')" data-page="attendance">📅 Attendance</button>
<button onclick="showPage('fees')" data-page="fees">💰 Fees</button>
<button onclick="showPage('marks')" data-page="marks">📝 Marks</button>
<button onclick="showPage('settings')" data-page="settings">⚙️ Settings</button>
</div>
<div class="nav hidden" id="studentNav">
<button onclick="showPage('studentHome')" data-page="studentHome">📊 Marks</button>
<button onclick="showPage('studentAttendance')" data-page="studentAttendance">📅 Attendance</button>
<button onclick="showPage('studentFees')" data-page="studentFees">💰 Fees</button>
</div>
<button class="btn danger" style="width:100%;margin-top:20px" onclick="logout()">Logout</button>
</aside>
<main class="main">
<div class="topbar"><div><h2 id="pageTitle">Overview</h2><div class="user" id="welcome"></div></div><button class="btn secondary" onclick="toggleDark()">🌙 Dark</button></div>
<div id="content"></div>
</main></div>

<div id="modal" class="modal hidden"><div class="modal-box"><div class="topbar"><h3 id="modalTitle">Form</h3><button class="btn secondary" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>

<script>
const KEY='asa_management_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
settings:{academy:'Arul Siragugal Academy',teacher:'Teacher',mobile:'',fee:1000,logo:'',upi:'',teacherId:'teacher',teacherPass:'1234',sheetsUrl:'',
messages:{fee:'வணக்கம் {student}, உங்கள் {academy} மாத கட்டணம் ₹{amount} நிலுவையில் உள்ளது. தேதி: {date}. தயவுசெய்து கட்டணத்தை செலுத்தவும்.',absent:'வணக்கம் {student}, இன்று நீங்கள் வகுப்பில் வரவில்லை. {academy} - தேதி: {date}.'}},
students:[],attendance:[],fees:[],marks:[]
};
let role='teacher', currentStudent=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function today(){return new Date().toISOString().slice(0,10)}
function dateText(){return new Date().toLocaleDateString('ta-IN')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setRole(r){role=r;teacherRole.classList.toggle('active',r==='teacher');studentRole.classList.toggle('active',r==='student');teacherLogin.classList.toggle('hidden',r!=='teacher');studentLogin.classList.toggle('hidden',r!=='student');loginMsg.textContent=''}
function loginTeacher(){if(teacherId.value===db.settings.teacherId&&teacherPass.value===db.settings.teacherPass){enterApp('teacher')}else loginMsg.textContent='Teacher ID / Password தவறாக உள்ளது.'}
function loginStudent(){const s=db.students.find(x=>x.id===studentId.value&&x.password===studentPass.value);if(s){currentStudent=s;enterApp('student')}else loginMsg.textContent='Student ID / Password தவறாக உள்ளது.'}
function enterApp(r){role=r;loginPage.classList.add('hidden');app.classList.remove('hidden');teacherNav.classList.toggle('hidden',r!=='teacher');studentNav.classList.toggle('hidden',r!=='student');welcome.textContent=r==='teacher'?'👨‍🏫 '+db.settings.teacher:'👨‍🎓 '+currentStudent.name;applySettings();showPage(r==='teacher'?'overview':'studentHome')}
function logout(){currentStudent=null;app.classList.add('hidden');loginPage.classList.remove('hidden');teacherId.value='';teacherPass.value='';studentId.value='';studentPass.value=''}
function applySettings(){document.title=db.settings.academy+' - Management';loginAcademy.textContent=db.settings.academy;sideAcademy.textContent=db.settings.academy;loginLogo.src=db.settings.logo||'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" rx="20" fill="#4f46e5"/><text x="50" y="60" text-anchor="middle" fill="white" font-size="35">AS</text></svg>')}
function showPage(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));const titles={overview:'Overview',students:'Students',attendance:'Attendance',fees:'Fees',marks:'Marks',settings:'Settings',studentHome:'My Marks',studentAttendance:'My Attendance',studentFees:'My Fees'};pageTitle.textContent=titles[p]||'';if(p==='overview')overview();if(p==='students')studentsPage();if(p==='attendance')attendancePage();if(p==='fees')feesPage();if(p==='marks')marksPage();if(p==='settings')settingsPage();if(p==='studentHome')studentMarks();if(p==='studentAttendance')studentAttendance();if(p==='studentFees')studentFees()}
function overview(){const month=new Date().toISOString().slice(0,7), pending=db.students.reduce((a,s)=>a+calcPending(s.id,month),0), collection=db.fees.filter(f=>f.date?.startsWith(month)).reduce((a,f)=>a+Number(f.amount),0),present=db.attendance.filter(a=>a.date===today()&&a.status==='Present').length;content.innerHTML=`<div class="cards"><div class="card stat"><div class="label">Total Students</div><div class="value">${db.students.length}</div></div><div class="card stat"><div class="label">Today Present</div><div class="value">${present}</div></div><div class="card stat"><div class="label">Total Pending Fee</div><div class="value danger-text">${money(pending)}</div></div><div class="card stat"><div class="label">Current Month Collection</div><div class="value success-text">${money(collection)}</div></div></div><div class="grid2"><div class="card"><h3>Monthly Fee Analysis</h3><div id="chart" class="bar-chart"></div></div><div class="card"><h3>Quick Actions</h3><div class="toolbar"><button class="btn" onclick="showPage('students')">➕ Add Student</button><button class="btn" onclick="showPage('fees')">💰 Add Payment</button><button class="btn" onclick="showPage('attendance')">📅 Attendance</button><button class="btn" onclick="showPage('marks')">📝 Marks</button></div><p class="user">Google Sheets Apps Script URL Settings-ல் சேர்க்கலாம். LocalStorage data offline-ஆகவும் இயங்கும்.</p></div></div>`;drawChart()}
function drawChart(){const vals=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);const m=d.toISOString().slice(0,7);vals.push([d.toLocaleDateString('en-IN',{month:'short'}),db.fees.filter(f=>f.date?.startsWith(m)).reduce((a,f)=>a+Number(f.amount),0)])}const max=Math.max(1,...vals.map(x=>x[1]));chart.innerHTML=vals.map(x=>`<div class="bar" style="height:${Math.max(8,x[1]/max*160)}px"><span>${money(x[1])}</span><small>${x[0]}</small></div>`).join('')}
function studentsPage(){content.innerHTML=`<div class="toolbar"><button class="btn" onclick="studentForm()">➕ Add Student</button><input id="studentSearch" placeholder="Search student..." oninput="renderStudents()" style="max-width:300px"></div><div class="card table-wrap"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Class</th><th>Mobile</th><th>Monthly Fee</th><th>Actions</th></tr></thead><tbody id="studentRows"></tbody></table></div>`;renderStudents()}
function renderStudents(){const q=(document.getElementById('studentSearch')?.value||'').toLowerCase();studentRows.innerHTML=db.students.filter(s=>(s.name+' '+s.id+' '+s.class).toLowerCase().includes(q)).map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${esc(s.class)}</td><td>${esc(s.mobile)}</td><td>${money(s.monthlyFee)}</td><td class="actions"><button class="btn secondary" onclick="studentForm('${s.id}')">Edit</button><button class="btn danger" onclick="deleteStudent('${s.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6">Student இல்லை.</td></tr>'}
function studentForm(id=''){const s=db.students.find(x=>x.id===id)||{id:'',name:'',class:'',mobile:'',monthlyFee:db.settings.fee,password:''};openModal(id?'Edit Student':'Add Student',`<div class="two"><div><label>Student ID</label><input id="fId" value="${esc(s.id)}" ${id?'readonly':''}></div><div><label>Password</label><input id="fPass" value="${esc(s.password)}"></div></div><label>Student Name</label><input id="fName" value="${esc(s.name)}"><div class="two"><div><label>Class</label><input id="fClass" value="${esc(s.class)}"></div><div><label>Mobile</label><input id="fMobile" value="${esc(s.mobile)}"></div></div><label>Fixed Monthly Tuition Fee</label><input id="fFee" type="number" value="${s.monthlyFee}"><br><br><button class="btn" onclick="saveStudent('${id}')">Save Student</button>`)}
function saveStudent(old){const id=fId.value.trim();if(!id||!fName.value.trim()){alert('Student ID மற்றும் Name தேவை');return}if(!old&&db.students.some(s=>s.id===id)){alert('Student ID already exists');return}const obj={id,name:fName.value.trim(),class:fClass.value.trim(),mobile:fMobile.value.trim(),monthlyFee:Number(fFee.value)||0,password:fPass.value||'1234'};if(old)db.students[db.students.findIndex(s=>s.id===old)]=obj;else db.students.push(obj);save();closeModal();studentsPage()}
function deleteStudent(id){if(confirm('இந்த student-ஐ delete செய்யவா?')){db.students=db.students.filter(s=>s.id!==id);db.attendance=db.attendance.filter(a=>a.studentId!==id);db.fees=db.fees.filter(f=>f.studentId!==id);db.marks=db.marks.filter(m=>m.studentId!==id);save();renderStudents()}}
function attendancePage(){
const classes=[...new Set(db.students.map(s=>s.class).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
content.innerHTML=`
<div class="card">
<h3>📅 Class-wise Attendance</h3>
<div class="toolbar">
<div style="min-width:160px"><label>Date</label><input id="attDate" type="date" value="${today()}" onchange="renderClassAttendance()"></div>
<div style="min-width:180px"><label>Class</label>
<select id="attClass" onchange="renderClassAttendance()"><option value="">Select Class</option>
${classes.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div>
<button class="btn success" onclick="saveClassAttendance()">💾 Save / Update Class</button>
</div>
<div id="classAttendanceBox"><p class="user">முதலில் Class தேர்வு செய்யவும்.</p></div>
</div>
<div class="card section"><h3>📋 Attendance History</h3>
<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Class</th><th>Student</th><th>Status</th><th>Reminder</th></tr></thead>
<tbody>${db.attendance.slice().reverse().map(a=>{
const s=db.students.find(x=>x.id===a.studentId);
return `<tr><td>${a.date}</td><td>${esc(s?.class||'-')}</td><td>${esc(s?.name||a.studentId)}</td>
<td><span class="badge ${a.status==='Present'?'ok':'pending'}">${a.status}</span></td>
<td>${s?`<button class="btn secondary" onclick="callStudent('${s.id}')">📞 Call</button> ${a.status==='Absent'?`<button class="btn secondary" onclick="whatsapp('${s.id}','absent')">💬 WhatsApp</button>`:''}`:''}</td></tr>`;
}).join('')||'<tr><td colspan="5">Attendance இல்லை.</td></tr>'}</tbody></table></div></div>`;
}

function renderClassAttendance(){
const cls=document.getElementById('attClass')?.value;
const date=document.getElementById('attDate')?.value||today();
const box=document.getElementById('classAttendanceBox');
if(!cls){box.innerHTML='<p class="user">முதலில் Class தேர்வு செய்யவும்.</p>';return;}
const students=db.students.filter(s=>s.class===cls);
const existing={};
db.attendance.filter(a=>a.date===date).forEach(a=>existing[a.studentId]=a.status);

box.innerHTML=`
<div class="toolbar"><strong>Class: ${esc(cls)} — ${students.length} Students</strong></div>
<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Student</th><th>Attendance</th></tr></thead>
<tbody>${students.map((s,i)=>{
const st=existing[s.id]||'';
return `<tr>
<td>${i+1}</td>
<td><b>${esc(s.name)}</b><br><small>${esc(s.id)}</small></td>
<td>
<div class="att-buttons" data-student="${esc(s.id)}">
<button type="button" class="att-btn present ${st==='Present'?'selected':''}" onclick="setAttendanceButton(this,'Present')">✓ Present</button>
<button type="button" class="att-btn absent ${st==='Absent'?'selected':''}" onclick="setAttendanceButton(this,'Absent')">✕ Absent</button>
</div>
</td></tr>`;
}).join('')||'<tr><td colspan="3">இந்த Class-ல் Students இல்லை.</td></tr>'}</tbody></table></div>`;
}

function setAttendanceButton(btn,status){
const wrap=btn.parentElement;
wrap.querySelectorAll('.att-btn').forEach(b=>b.classList.remove('selected'));
btn.classList.add('selected');
wrap.dataset.status=status;
}

function saveClassAttendance(){
const cls=document.getElementById('attClass')?.value;
const date=document.getElementById('attDate')?.value||today();
if(!cls)return alert('Class தேர்வு செய்யவும்.');
const buttons=[...document.querySelectorAll('.att-buttons')];
if(!buttons.length)return alert('இந்த Class-ல் Students இல்லை.');

let count=0;
buttons.forEach(wrap=>{
const studentId=wrap.dataset.student;
const status=wrap.dataset.status;
if(status){
db.attendance=db.attendance.filter(a=>!(a.studentId===studentId&&a.date===date));
db.attendance.push({studentId,date,status});
count++;
}
});
save();
alert(count+' Students attendance Save / Update செய்யப்பட்டது.');
attendancePage();
}

function saveAttendance(){if(!attStudent.value)return alert('Student தேர்வு செய்யவும்');db.attendance=db.attendance.filter(a=>!(a.studentId===attStudent.value&&a.date===attDate.value));db.attendance.push({studentId:attStudent.value,date:attDate.value,status:attStatus.value});save();attendancePage()}
function calcPaid(id,month){return db.fees.filter(f=>f.studentId===id&&f.date?.startsWith(month)).reduce((a,f)=>a+Number(f.amount),0)}
function calcPending(id,month){const s=db.students.find(x=>x.id===id);return Math.max(0,Number(s?.monthlyFee||0)+db.fees.filter(f=>f.studentId===id&&f.date?.startsWith(month)&&f.type==='Extra').reduce((a,f)=>a+Number(f.extraAmount||0),0)-calcPaid(id,month))}
function feesPage(){
const month=new Date().toISOString().slice(0,7);
content.innerHTML=`
<div class="toolbar">
<button class="btn" onclick="feeForm()">➕ Record Fee Payment</button>
<button class="btn secondary" onclick="extraForm()">➕ Extra Fee</button>
</div>
<div class="card table-wrap"><table class="table">
<thead><tr><th>Student</th><th>Monthly</th><th>Extra</th><th>Paid</th><th>Pending</th><th>Details</th><th>Reminder</th></tr></thead>
<tbody>
${db.students.map(s=>{
const extras=db.fees.filter(f=>f.studentId===s.id&&f.date?.startsWith(month)&&f.type==='Extra');
const extra=extras.reduce((a,f)=>a+Number(f.extraAmount||0),0);
const paid=calcPaid(s.id,month);
const pending=Math.max(0,Number(s.monthlyFee)+extra-paid);
return `<tr>
<td><button class="student-link" onclick="showStudentFeeDetails('${s.id}')">${esc(s.name)}</button></td>
<td>${money(s.monthlyFee)}</td>
<td>${money(extra)}</td>
<td>${money(paid)}</td>
<td><span class="badge ${pending?'pending':'ok'}">${money(pending)}</span></td>
<td><button class="btn secondary" onclick="showStudentFeeDetails('${s.id}')">👁 View</button></td>
<td>${s.mobile?`<button class="btn secondary" onclick="callStudent('${s.id}')">📞 Call</button>`:''} ${pending?`<button class="btn secondary" onclick="whatsapp('${s.id}','fee')">💬 WhatsApp</button>`:'Paid'}</td>
</tr>`;
}).join('')||'<tr><td colspan="7">Students இல்லை.</td></tr>'}
</tbody></table></div>`;
}

function showStudentFeeDetails(id){
const s=db.students.find(x=>x.id===id);
if(!s)return;
const month=new Date().toISOString().slice(0,7);
const records=db.fees.filter(f=>f.studentId===id&&f.date?.startsWith(month));
const extras=records.filter(f=>f.type==='Extra');
const payments=records.filter(f=>f.type!=='Extra');
const extraTotal=extras.reduce((a,f)=>a+Number(f.extraAmount||0),0);
const paidTotal=payments.reduce((a,f)=>a+Number(f.amount||0),0);
const pending=Math.max(0,Number(s.monthlyFee)+extraTotal-paidTotal);

openModal('Student Fee Details',`
<div class="paybox">
<h3>👨‍🎓 ${esc(s.name)}</h3>
<p>Class: <b>${esc(s.class)}</b> &nbsp; | &nbsp; ID: <b>${esc(s.id)}</b></p>
<p>Monthly Tuition: <b>${money(s.monthlyFee)}</b></p>
<p>Extra Fee: <b>${money(extraTotal)}</b></p>
<p>Paid: <b class="success-text">${money(paidTotal)}</b></p>
<p>Pending: <b class="${pending?'danger-text':'success-text'}">${money(pending)}</b></p>
</div>
<h3 style="margin-top:18px">➕ Extra Fee Details</h3>
<table class="table">
<tr><th>Date</th><th>Reason</th><th>Amount</th></tr>
${extras.map(f=>`<tr><td>${f.date}</td><td>${esc(f.extraType||'Other')}</td><td>${money(f.extraAmount)}</td></tr>`).join('')||'<tr><td colspan="3">Extra Fee இல்லை.</td></tr>'}
</table>
<h3 style="margin-top:18px">💳 Payment Details</h3>
<table class="table">
<tr><th>Date</th><th>Paid Amount</th></tr>
${payments.map(f=>`<tr><td>${f.date}</td><td>${money(f.amount)}</td></tr>`).join('')||'<tr><td colspan="2">Payment இல்லை.</td></tr>'}
</table>
<div class="actions" style="margin-top:16px">
${s.mobile?`<button class="btn secondary" onclick="callStudent('${s.id}')">📞 Direct Call</button>`:''}
<button class="btn" onclick="closeModal();extraForm('${s.id}')">➕ Add Extra Fee</button>
<button class="btn success" onclick="closeModal();feeForm('${s.id}')">💳 Add Payment</button>
</div>`);
}

function feeForm(preselect=''){openModal('Record Paid Amount',`<label>Student</label><select id="feeStudent">${db.students.map(s=>`<option value="${s.id}" ${s.id===preselect?'selected':''}>${esc(s.name)}</option>`).join('')}</select><label>Paid Amount</label><input id="feeAmount" type="number"><label>Date</label><input id="feeDate" type="date" value="${today()}"><br><br><button class="btn success" onclick="saveFee()">Save Payment</button>`)}
function saveFee(){if(!feeStudent.value||Number(feeAmount.value)<=0)return alert('Student மற்றும் amount சரியாக கொடுக்கவும்');db.fees.push({studentId:feeStudent.value,amount:Number(feeAmount.value),date:feeDate.value,type:'Payment'});save();closeModal();feesPage()}
function extraForm(preselect=''){openModal('Extra Fee',`<label>Student</label><select id="extraStudent">${db.students.map(s=>`<option value="${s.id}" ${s.id===preselect?'selected':''}>${esc(s.name)}</option>`).join('')}</select><label>Type</label><select id="extraType"><option>Book</option><option>Pen</option><option>Notebook</option><option>Exam</option><option>Other</option></select><label>Amount</label><input id="extraAmount" type="number"><label>Date</label><input id="extraDate" type="date" value="${today()}"><br><br><button class="btn" onclick="saveExtra()">Save Extra Fee</button>`)}
function saveExtra(){db.fees.push({studentId:extraStudent.value,amount:0,extraAmount:Number(extraAmount.value)||0,date:extraDate.value,type:'Extra',extraType:extraType.value});save();closeModal();feesPage()}
function marksPage(){content.innerHTML=`<div class="toolbar"><button class="btn" onclick="markForm()">➕ Add / Update Mark</button></div><div class="card table-wrap"><table class="table"><thead><tr><th>Student</th><th>Exam</th><th>Mark</th><th>Total</th><th>Action</th></tr></thead><tbody>${db.marks.map((m,i)=>{const s=db.students.find(x=>x.id===m.studentId);return `<tr><td>${esc(s?.name||m.studentId)}</td><td>${esc(m.exam)}</td><td>${m.mark}</td><td>${m.total}</td><td><button class="btn danger" onclick="deleteMark(${i})">Delete</button></td></tr>`}).join('')||'<tr><td colspan="5">Marks இல்லை.</td></tr>'}</tbody></table></div>`}
function markForm(){openModal('Marks',`<label>Student</label><select id="markStudent">${db.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><label>Exam / Subject</label><input id="markExam"><div class="two"><div><label>Mark</label><input id="markValue" type="number"></div><div><label>Total Mark</label><input id="markTotal" type="number" value="100"></div></div><br><button class="btn" onclick="saveMark()">Save Mark</button>`)}
function saveMark(){db.marks.push({studentId:markStudent.value,exam:markExam.value,mark:Number(markValue.value),total:Number(markTotal.value)});save();closeModal();marksPage()}
function deleteMark(i){db.marks.splice(i,1);save();marksPage()}
function settingsPage(){const m=db.settings.messages;content.innerHTML=`<div class="card"><h3>🏫 Academy Settings</h3><div class="two"><div><label>Academy Name</label><input id="setAcademy" value="${esc(db.settings.academy)}"></div><div><label>Teacher Name</label><input id="setTeacher" value="${esc(db.settings.teacher)}"></div><div><label>Mobile</label><input id="setMobile" value="${esc(db.settings.mobile)}"></div><div><label>Default Monthly Fee</label><input id="setFee" type="number" value="${db.settings.fee}"></div><div><label>UPI ID</label><input id="setUpi" value="${esc(db.settings.upi)}"></div><div><label>Teacher ID</label><input id="setTid" value="${esc(db.settings.teacherId)}"></div><div><label>Teacher Password</label><input id="setTpass" value="${esc(db.settings.teacherPass)}"></div><div><label>Logo Upload</label><input id="setLogo" type="file" accept="image/*" onchange="logoPreview(this)"></div></div><div id="logoPreviewBox" style="margin:10px 0;display:${db.settings.logo?'block':'none'}">
<img id="logoPrev" src="${db.settings.logo||''}" style="width:80px;height:80px;object-fit:cover;border-radius:14px;display:block">
</div><label>Google Sheets Apps Script URL</label><input id="setSheets" value="${esc(db.settings.sheetsUrl)}" placeholder="https://script.google.com/macros/s/.../exec"><br><br><h3>🇮🇳 Tamil Reminder Templates</h3><label>Fee Reminder</label><textarea id="feeMsg">${esc(m.fee)}</textarea><label>Absent Reminder</label><textarea id="absMsg">${esc(m.absent)}</textarea><p class="user">Automatic placeholders: {student}, {amount}, {date}, {academy}</p><p class="user">☁️ Google Sheets: Web App URL must end with <b>/exec</b>. Sync sends all current data as a <b>payload</b> to Apps Script <b>doPost(e)</b>.</p><button class="btn" onclick="saveSettings()">Save Settings</button><button class="btn secondary" style="margin-left:8px" onclick="syncSheets()">☁️ Sync to Google Sheets</button></div>`}
let uploadedLogo='';
function logoPreview(input){
const f=input.files?.[0];
if(!f)return;
if(!f.type.startsWith('image/')){alert('Image file மட்டும் தேர்வு செய்யவும்.');input.value='';return}
if(f.size>2*1024*1024){alert('Logo image 2 MB-க்கு குறைவாக இருக்க வேண்டும்.');input.value='';return}
const r=new FileReader();
r.onload=e=>{
 uploadedLogo=e.target.result;
 const box=document.getElementById('logoPreviewBox');
 const img=document.getElementById('logoPrev');
 if(box&&img){img.src=uploadedLogo;box.style.display='block'}
};
r.readAsDataURL(f);
}
function saveSettings(){db.settings={...db.settings,academy:setAcademy.value,teacher:setTeacher.value,mobile:setMobile.value,fee:Number(setFee.value)||0,upi:setUpi.value,teacherId:setTid.value,teacherPass:setTpass.value,sheetsUrl:setSheets.value,messages:{fee:feeMsg.value,absent:absMsg.value}};if(uploadedLogo)db.settings.logo=uploadedLogo;save();applySettings();alert('Settings saved');}
function replaceMsg(t,s,amount=''){return t.replaceAll('{student}',s.name).replaceAll('{amount}',money(amount)).replaceAll('{date}',dateText()).replaceAll('{academy}',db.settings.academy)}
function whatsapp(id,type){const s=db.students.find(x=>x.id===id);if(!s)return;let amount=calcPending(id,new Date().toISOString().slice(0,7));let text=replaceMsg(type==='fee'?db.settings.messages.fee:db.settings.messages.absent,s,amount);window.open('https://wa.me/'+(s.mobile||'')+'?text='+encodeURIComponent(text),'_blank')}
function callStudent(id){const s=db.students.find(x=>x.id===id);if(s?.mobile)location.href='tel:'+s.mobile}
function studentMarks(){const s=currentStudent;const rows=db.marks.filter(m=>m.studentId===s.id);content.innerHTML=`<div class="card"><h3>👨‍🎓 ${esc(s.name)}</h3><p>Class: ${esc(s.class)}</p><div class="table-wrap"><table class="table"><tr><th>Exam / Subject</th><th>Mark</th><th>Total</th></tr>${rows.map(m=>`<tr><td>${esc(m.exam)}</td><td>${m.mark}</td><td>${m.total}</td></tr>`).join('')||'<tr><td colspan="3">Marks இல்லை.</td></tr>'}</table></div></div>`}
function studentAttendance(){const rows=db.attendance.filter(a=>a.studentId===currentStudent.id).slice().reverse();content.innerHTML=`<div class="card"><h3>📅 My Attendance</h3><table class="table"><tr><th>Date</th><th>Status</th></tr>${rows.map(a=>`<tr><td>${a.date}</td><td><span class="badge ${a.status==='Present'?'ok':'pending'}">${a.status}</span></td></tr>`).join('')||'<tr><td colspan="2">Attendance இல்லை.</td></tr>'}</table></div>`}
function studentFees(){const s=currentStudent,month=new Date().toISOString().slice(0,7),extra=db.fees.filter(f=>f.studentId===s.id&&f.date?.startsWith(month)&&f.type==='Extra').reduce((a,f)=>a+Number(f.extraAmount||0),0),paid=calcPaid(s.id,month),pending=Math.max(0,Number(s.monthlyFee)+extra-paid);content.innerHTML=`<div class="cards"><div class="card stat"><div class="label">Monthly Tuition</div><div class="value">${money(s.monthlyFee)}</div></div><div class="card stat"><div class="label">Extra Fee</div><div class="value">${money(extra)}</div></div><div class="card stat"><div class="label">Paid</div><div class="value success-text">${money(paid)}</div></div><div class="card stat"><div class="label">Pending</div><div class="value danger-text">${money(pending)}</div></div></div><div class="card section"><h3>💳 Pay Fee</h3><p>UPI ID: <b>${esc(db.settings.upi||'Settings-ல் UPI ID சேர்க்கவும்')}</b></p>${pending?`<button class="btn success" onclick="payFeeInfo(${pending})">Pay Fee</button>`:'<span class="badge ok">இந்த மாத கட்டணம் Paid</span>'}</div>`}
function payFeeInfo(amount){alert('Payable amount: '+money(amount)+'\\nUPI ID: '+(db.settings.upi||'Not configured')+'\\nPayment செய்த பிறகு Teacher payment-ஐ record செய்ய வேண்டும்.')}
function openModal(t,b){modalTitle.textContent=t;modalBody.innerHTML=b;modal.classList.remove('hidden')}
function closeModal(){modal.classList.add('hidden')}
function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('asa_dark',document.body.classList.contains('dark'))}
function syncSheets(){
const url=(db.settings.sheetsUrl||'').trim();
if(!url)return alert('Settings-ல் Google Sheets Apps Script Web App URL சேர்க்கவும்.');
if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(url)){
  return alert('Google Apps Script Web App URL சரியாக இல்லை. /exec என்று முடியும் deployed URL-ஐ பயன்படுத்தவும்.');
}
try{
  const frame=document.getElementById('sheetsSyncFrame')||(()=>{
    const f=document.createElement('iframe');
    f.id='sheetsSyncFrame';
    f.name='sheetsSyncFrame';
    f.style.display='none';
    document.body.appendChild(f);
    return f;
  })();
  const form=document.createElement('form');
  form.method='POST';
  form.action=url;
  form.target='sheetsSyncFrame';
  form.style.display='none';
  const input=document.createElement('input');
  input.type='hidden';
  input.name='payload';
  input.value=JSON.stringify({
    source:'Arul Siragugal Academy',
    syncedAt:new Date().toISOString(),
    settings:db.settings,
    students:db.students,
    attendance:db.attendance,
    fees:db.fees,
    marks:db.marks
  });
  form.appendChild(input);
  document.body.appendChild(form);
  form.submit();
  setTimeout(()=>form.remove(),3000);
  alert('Google Sheets sync request அனுப்பப்பட்டது.\n\nApps Script doPost(e) payload-ஐ receive செய்து Sheet-ல் save செய்ய வேண்டும்.');
}catch(e){
  alert('Sync தொடங்க முடியவில்லை: '+e.message);
}}

if(localStorage.getItem('asa_dark')==='true')document.body.classList.add('dark');applySettings();
</script>
</body>
</html>
