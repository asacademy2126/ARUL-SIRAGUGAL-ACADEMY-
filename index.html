<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arul Siragugal Academy - Management</title>
<style>
:root{
  --primary:#4f46e5;
  --primary-hover:#4338ca;
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#687386;
  --danger:#dc2626;
  --success:#16a34a;
  --border:#e5e7eb;
  --card-radius:18px;
  --card-shadow:0 6px 20px rgba(15,23,42,0.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Tamil",sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}

/* Login Screen */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#4f46e5,#7c3aed)}
.login-card{width:100%;max-width:430px;background:#fff;border-radius:24px;padding:30px;box-shadow:0 20px 50px rgba(0,0,0,0.25)}
.logo{width:80px;height:80px;border-radius:22px;object-fit:cover;background:#eef0ff;display:block;margin:0 auto 12px}
h1,h2,h3{margin-top:0}.login-card h1{text-align:center;font-size:23px;color:#1e1b4b}.login-card p{text-align:center;color:var(--muted);font-size:14px;margin-bottom:20px}
.role-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}
.role-tabs button{padding:12px 6px;border-radius:12px;background:#eef0ff;color:var(--primary);font-weight:bold;font-size:13px;transition:0.2s}
.role-tabs .active{background:var(--primary);color:#fff}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--text)}
textarea{min-height:90px;resize:vertical}
.btn{padding:11px 16px;border-radius:12px;background:var(--primary);color:white;font-weight:bold;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all 0.15s ease}
.btn:hover{background:var(--primary-hover)}
.btn.secondary{background:#e9ecf7;color:#25304a}
.btn.secondary:hover{background:#dfe4f2}
.btn.danger{background:var(--danger)}
.btn.success{background:var(--success)}
.msg{text-align:center;margin-top:14px;font-size:14px;color:var(--danger)}

/* Main App Shell */
.app{min-height:100vh;max-width:1100px;margin:0 auto;padding:18px}
.topbar{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:14px 20px;border-radius:var(--card-radius);box-shadow:var(--card-shadow);margin-bottom:20px;gap:12px;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar h2{font-size:20px;margin:0;color:var(--text)}
.topbar .user{color:var(--muted);font-size:13px;margin-top:2px}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;background:#eef0ff;color:var(--primary);font-weight:bold;font-size:14px}
.back-btn:hover{background:#dfe4ff}

/* Hub Grid Menu */
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));gap:16px;margin-top:16px}
.hub-card{background:var(--card);border:1px solid var(--border);border-radius:var(--card-radius);padding:22px 18px;text-align:center;box-shadow:var(--card-shadow);cursor:pointer;transition:transform 0.18s ease, box-shadow 0.18s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:140px}
.hub-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(15,23,42,0.12);border-color:#c7d2fe}
/* Different card colour options */
.group-feature-grid .hub-card:nth-child(4n+1){background:linear-gradient(135deg,#eef2ff,#ffffff);border-color:#c7d2fe}
.group-feature-grid .hub-card:nth-child(4n+2){background:linear-gradient(135deg,#ecfdf5,#ffffff);border-color:#bbf7d0}
.group-feature-grid .hub-card:nth-child(4n+3){background:linear-gradient(135deg,#fff7ed,#ffffff);border-color:#fed7aa}
.group-feature-grid .hub-card:nth-child(4n+4){background:linear-gradient(135deg,#fdf2f8,#ffffff);border-color:#fbcfe8}
.card.stat:nth-child(4n+1){border-top:4px solid #4f46e5}
.card.stat:nth-child(4n+2){border-top:4px solid #16a34a}
.card.stat:nth-child(4n+3){border-top:4px solid #f59e0b}
.card.stat:nth-child(4n+4){border-top:4px solid #db2777}
.hub-icon{font-size:36px;margin-bottom:10px;line-height:1}
.hub-title{font-size:16px;font-weight:bold;color:var(--text)}
.hub-desc{font-size:12px;color:var(--muted);margin-top:4px}

/* Generic Cards & Tables */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--card-radius);padding:20px;box-shadow:var(--card-shadow);margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.cards .card.stat{position:relative;overflow:hidden;min-height:105px;margin-bottom:0}
.cards .card.stat:after{content:"";position:absolute;width:60px;height:60px;right:-15px;top:-15px;border-radius:50%;background:rgba(79,70,229,0.08)}
.stat .label{color:var(--muted);font-size:13px}
.stat .value{font-size:24px;font-weight:bold;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:11px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;font-size:14px}
.table th{background:#f8fafc;font-weight:bold}
.table tbody tr:hover{background:#f8fafc}
.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:bold}
.badge.ok{background:#dcfce7;color:#166534}
.badge.pending{background:#fee2e2;color:#991b1b}
.badge.info{background:#e0e7ff;color:#3730a3}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999}
.modal-box{width:100%;max-width:650px;max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:24px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.paybox{background:#eefbf2;border:1px solid #bbf7d0;padding:16px;border-radius:14px}
.danger-text{color:var(--danger)}.success-text{color:var(--success)}
.att-buttons{display:flex;gap:8px;flex-wrap:wrap}
.att-btn{padding:8px 14px;border-radius:10px;border:2px solid #d1d5db;background:#f8fafc;color:#374151;font-weight:bold}
.att-btn.present.selected{background:#16a34a;color:#fff;border-color:#16a34a}
.att-btn.absent.selected{background:#dc2626;color:#fff;border-color:#dc2626}
.student-link{background:none;border:0;padding:0;color:var(--primary);font-weight:bold;text-decoration:underline;cursor:pointer}
.period-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.period-tools>div{min-width:140px;flex:1}

/* Dark Mode */
.dark{--bg:#0b1220;--card:#111827;--text:#e5e7eb;--muted:#9ca3af;--border:#273449}
.dark input,.dark select,.dark textarea{background:#0f172a;color:#e5e7eb}
.dark .table th{background:#172033}
.dark .table tbody tr:hover{background:#1a2333}
.dark .back-btn{background:#1e1b4b;color:#a5b4fc}

/* Responsive Rules */
@media(max-width:768px){
  .app{padding:12px}
  .cards{grid-template-columns:repeat(2,1fr);gap:10px}
  .hub-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .hub-card{padding:16px 12px;min-height:120px}
  .hub-icon{font-size:30px}
  .hub-title{font-size:14px}
  .grid2{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .period-tools{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){
  .role-tabs{grid-template-columns:1fr}
  .topbar{padding:12px}
  .period-tools{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="loginPage" class="login">
  <div class="login-card">
    <img id="loginLogo" class="logo" alt="Logo">
    <h1 id="loginAcademy">Arul Siragugal Academy</h1>
    <p>Management System</p>
    <div id="loginLoading" style="display:none;text-align:center;color:var(--muted);font-size:13px;margin:6px 0">⏳ Shared data ஏற்றப்படுகிறது...</div>
    <div class="role-tabs">
      <button id="adminRole" onclick="setRole('admin')">👑 Admin</button>
      <button id="teacherRole" class="active" onclick="setRole('teacher')">👨‍🏫 Teacher</button>
      <button id="studentRole" onclick="setRole('student')">👨‍🎓 Student</button>
    </div>
    <div id="adminLogin" class="hidden">
      <label>Admin ID</label><input id="adminId" placeholder="Admin ID">
      <label>Password</label><input id="adminPass" type="password" placeholder="Password">
      <button class="btn" id="adminLoginBtn" style="width:100%;margin-top:16px" onclick="loginAdmin()">Login</button>
    </div>
    <div id="teacherLogin">
      <label>Teacher ID</label><input id="teacherId" placeholder="Teacher ID">
      <label>Password</label><input id="teacherPass" type="password" placeholder="Password">
      <button class="btn" id="teacherLoginBtn" style="width:100%;margin-top:16px" onclick="loginTeacher()">Login</button>
    </div>
    <div id="studentLogin" class="hidden">
      <label>Student ID</label><input id="studentId" placeholder="Student ID">
      <label>Password</label><input id="studentPass" type="password" placeholder="Password">
      <button class="btn" id="studentLoginBtn" style="width:100%;margin-top:16px" onclick="loginStudent()">Login</button>
    </div>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="topbar-left">
      <button id="hubBackBtn" class="back-btn hidden" onclick="showHubMenu()">⬅️ Home Menu</button>
      <div>
        <h2 id="pageTitle">Home Menu</h2>
        <div class="user" id="welcome"></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span id="syncStatus" style="font-size:12px;color:var(--muted)"></span>
      <button class="btn success" id="topSyncBtn" onclick="syncSheets()">☁️ Sync</button>
      <button class="btn secondary" onclick="toggleDark()">🌙 Dark</button>
      <button class="btn danger" onclick="logout()">🚪 Exit</button>
    </div>
  </header>
  <main id="content"></main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="topbar" style="margin-bottom:14px;box-shadow:none;border-bottom:1px solid var(--border);padding:0 0 10px">
      <h3 id="modalTitle" style="margin:0">Form</h3>
      <button class="btn secondary" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* =========================================================
   GOOGLE SHEETS IS THE ONLY SHARED DATABASE
   No student/login/fees/attendance/marks data is stored in
   localStorage. Every device loads the same data from Sheets.
   ========================================================= */
const DEFAULT_SHEETS_URL='https://script.google.com/macros/s/AKfycbzMAFuKPsGXWJonYqIyqxvNvjLTXG-bUjcbVXEAdulKyh6iuxX7czDZ7CgyE3eybE8/exec';
let db={
  settings:{academy:'Arul Siragugal Academy',teacher:'Teacher',mobile:'',fee:1000,logo:'',upi:'',teacherId:'teacher',teacherPass:'1234',adminId:'admin',adminPass:'admin123',sheetsUrl:DEFAULT_SHEETS_URL,autoSync:true,
  messages:{fee:'வணக்கம் {student}, உங்கள் {academy} மாத கட்டணம் ₹{amount} நிலுவையில் உள்ளது. தேதி: {date}. தயவுசெய்து கட்டணத்தை செலுத்தவும்.',absent:'வணக்கம் {student}, இன்று நீங்கள் வகுப்பில் வரவில்லை. {academy} - தேதி: {date}.'}},
  students:[],archivedStudents:[],attendance:[],fees:[],marks:[],homework:[],notices:[],exams:[],tests:[],expenses:[],teachers:[],onlineMarks:[],receipts:[]
};
db.archivedStudents=db.archivedStudents||[];
db.teachers=db.teachers||[];
db.homework=db.homework||[];
db.exams=db.exams||[];
db.notices=db.notices||[];
db.expenses=db.expenses||[];
db.receipts=db.receipts||[];
db.tests=db.tests||[];
db.onlineMarks=db.onlineMarks||[]; // Student entered online test marks

let role='teacher', currentStudent=null;
let suppressAutoSync=false;

/* Save ONLY to Google Sheets. No application database is written to localStorage. */
function save(){if(!suppressAutoSync)syncNow()}
function syncNow(){if(!(db.settings.sheetsUrl||'').trim())return;setSyncStatus('syncing');syncSheets(true)}
function setSyncStatus(state){
  const el=document.getElementById('syncStatus');if(!el)return;
  if(state==='syncing')el.innerHTML='⏳ Saving…';
  else if(state==='success')el.innerHTML='✅ Synced '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  else if(state==='error')el.innerHTML='⚠️ Sync Error <button class="btn secondary" style="padding:2px 6px;font-size:11px" onclick="syncSheets()">Retry</button>';
  else el.innerHTML='';
}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function today(){return new Date().toISOString().slice(0,10)}
function dateText(){return new Date().toLocaleDateString('ta-IN')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function setRole(r){
  role=r;
  document.getElementById('adminRole').classList.toggle('active',r==='admin');
  document.getElementById('teacherRole').classList.toggle('active',r==='teacher');
  document.getElementById('studentRole').classList.toggle('active',r==='student');
  document.getElementById('adminLogin').classList.toggle('hidden',r!=='admin');
  document.getElementById('teacherLogin').classList.toggle('hidden',r!=='teacher');
  document.getElementById('studentLogin').classList.toggle('hidden',r!=='student');
  document.getElementById('loginMsg').textContent='';
}

function loginAdmin(){
  const id=String(document.getElementById('adminId').value||'').trim();
  const pass=String(document.getElementById('adminPass').value||'');
  if(id===(db.settings.adminId||'admin') && pass===(db.settings.adminPass||'admin123')){enterApp('admin')}
  else document.getElementById('loginMsg').textContent='Admin ID / Password தவறாக உள்ளது.';
}
function loginTeacher(){
  if(document.getElementById('teacherId').value===db.settings.teacherId && document.getElementById('teacherPass').value===db.settings.teacherPass){enterApp('teacher')}
  else document.getElementById('loginMsg').textContent='Teacher ID / Password தவறாக உள்ளது.';
}
function loginStudent(){
  const s=db.students.find(x=>x.id===document.getElementById('studentId').value && x.password===document.getElementById('studentPass').value);
  if(s){currentStudent=s;enterApp('student')}
  else document.getElementById('loginMsg').textContent='Student ID / Password தவறாக உள்ளது.';
}

function enterApp(r){
  role=r;
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('topSyncBtn').classList.toggle('hidden',r==='student');
  document.getElementById('welcome').textContent=r==='admin'?'👑 Admin':r==='teacher'?'👨‍🏫 '+db.settings.teacher:'👨‍🎓 '+currentStudent.name;
  applySettings();
  showHubMenu();
}

function logout(){
  currentStudent=null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginPage').classList.remove('hidden');
  setRole('teacher');
}

function applySettings(){
  document.title=db.settings.academy+' - Management';
  document.getElementById('loginAcademy').textContent=db.settings.academy;
  document.getElementById('loginLogo').src=db.settings.logo||'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" rx="20" fill="#4f46e5"/><text x="50" y="60" text-anchor="middle" fill="white" font-size="35">AS</text></svg>');
}

/* ========================================================
   HUB MENU (CENTRAL CARD NAVIGATION)
   ======================================================== */
function showHubMenu(){
  document.getElementById('hubBackBtn').classList.add('hidden');
  document.getElementById('pageTitle').textContent='Home Menu';
  const c=document.getElementById('content');
  
  if(role==='admin'){
    const month=new Date().toISOString().slice(0,7);
    const pending=db.students.reduce((a,s)=>a+calcPending(s.id,month),0);
    const collection=db.fees.filter(f=>f.date?.startsWith(month)).reduce((a,f)=>a+Number(f.amount),0);
    const present=db.attendance.filter(a=>a.date===today()&&a.status==='Present').length;

    c.innerHTML=`
      <div class="cards">
        <div class="card stat"><div class="label">Total Students</div><div class="value">${db.students.length}</div></div>
        <div class="card stat"><div class="label">Today Present</div><div class="value">${present}</div></div>
        <div class="card stat"><div class="label">Pending Fee</div><div class="value danger-text">${money(pending)}</div></div>
        <div class="card stat"><div class="label">Monthly Collection</div><div class="value success-text">${money(collection)}</div></div>
      </div>
      <h3 style="margin:20px 0 10px">✨ Modules & Management</h3>
      <div class="hub-grid">
        <div class="hub-card" onclick="showPage('students')"><div class="hub-icon">👨‍🎓</div><div class="hub-title">Students</div><div class="hub-desc">Manage Profiles & Fees</div></div>
        <div class="hub-card" onclick="showPage('attendance')"><div class="hub-icon">📅</div><div class="hub-title">Attendance</div><div class="hub-desc">Daily Entry & History</div></div>
        <div class="hub-card" onclick="showPage('fees')"><div class="hub-icon">💰</div><div class="hub-title">Fees & Extra</div><div class="hub-desc">Payments & Pending list</div></div>
        <div class="hub-card" onclick="showPage('marks')"><div class="hub-icon">📝</div><div class="hub-title">Marks (Regular & Online)</div><div class="hub-desc">All Marks & Test Logs</div></div>
        <div class="hub-card" onclick="showPage('tests')"><div class="hub-icon">🧪</div><div class="hub-title">Online Tests / Links</div><div class="hub-desc">Manage Test Links</div></div>
        <div class="hub-card" onclick="showPage('reports')"><div class="hub-icon">📊</div><div class="hub-title">Reports</div><div class="hub-desc">Summary & CSV Downloads</div></div>
        <div class="hub-card" onclick="showPage('history')"><div class="hub-icon">🗂️</div><div class="hub-title">All History</div><div class="hub-desc">Period Filter & Logs</div></div>
        <div class="hub-card" onclick="showPage('communication')"><div class="hub-icon">📢</div><div class="hub-title">Communication</div><div class="hub-desc">WhatsApp Reminders & Notices</div></div>
        <div class="hub-card" onclick="showPage('homework')"><div class="hub-icon">📚</div><div class="hub-title">Homework</div><div class="hub-desc">Daily Tasks by Class</div></div>
        <div class="hub-card" onclick="showPage('exams')"><div class="hub-icon">🗓️</div><div class="hub-title">Exams</div><div class="hub-desc">Exam Schedule List</div></div>
        <div class="hub-card" onclick="showPage('finance')"><div class="hub-icon">💵</div><div class="hub-title">Income & Expense</div><div class="hub-desc">Financial Summary</div></div>
        <div class="hub-card" onclick="showPage('calendar')"><div class="hub-icon">🗓️</div><div class="hub-title">Calendar</div><div class="hub-desc">Events & Holidays</div></div>
        <div class="hub-card" onclick="showPage('birthdays')"><div class="hub-icon">🎂</div><div class="hub-title">Birthdays</div><div class="hub-desc">Student Reminders</div></div>
        <div class="hub-card" onclick="showPage('teachers')"><div class="hub-icon">👨‍🏫</div><div class="hub-title">Teachers</div><div class="hub-desc">Staff Accounts</div></div>
        <div class="hub-card" onclick="showPage('backup')"><div class="hub-icon">💾</div><div class="hub-title">Backup & Restore</div><div class="hub-desc">JSON / CSV Export</div></div>
        <div class="hub-card" onclick="showPage('settings')"><div class="hub-icon">⚙️</div><div class="hub-title">Settings</div><div class="hub-desc">App, Logo & Google Sync</div></div>
      </div>
    `;
  } else if(role==='teacher'){
    c.innerHTML=`
      <div class="hub-grid">
        <div class="hub-card" onclick="showPage('attendance')"><div class="hub-icon">📅</div><div class="hub-title">Attendance</div><div class="hub-desc">Take Class Attendance</div></div>
        <div class="hub-card" onclick="showPage('fees')"><div class="hub-icon">💰</div><div class="hub-title">Fees Collection</div><div class="hub-desc">Record Payments</div></div>
        <div class="hub-card" onclick="showPage('marks')"><div class="hub-icon">📝</div><div class="hub-title">Mark Entry & Records</div><div class="hub-desc">Regular & Student Online Marks</div></div>
        <div class="hub-card" onclick="showPage('tests')"><div class="hub-icon">🧪</div><div class="hub-title">Post Test Links</div><div class="hub-desc">Share Online Test Link</div></div>
        <div class="hub-card" onclick="showPage('homework')"><div class="hub-icon">📚</div><div class="hub-title">Homework</div><div class="hub-desc">Add Homework Tasks</div></div>
      </div>
    `;
  } else if(role==='student'){
    c.innerHTML=`
      <div class="hub-grid">
        <div class="hub-card" onclick="showPage('studentHome')"><div class="hub-icon">📊</div><div class="hub-title">My Marks</div><div class="hub-desc">Offline & Online Test Marks</div></div>
        <div class="hub-card" onclick="showPage('studentTests')"><div class="hub-icon">🧪</div><div class="hub-title">Online Tests & Exams</div><div class="hub-desc">Attend Test & Enter Mark</div></div>
        <div class="hub-card" onclick="showPage('studentAttendance')"><div class="hub-icon">📅</div><div class="hub-title">My Attendance</div><div class="hub-desc">Monthly Records</div></div>

function saveStudent(old){
  const id=document.getElementById('fId').value.trim();
  const name=document.getElementById('fName').value.trim();
  if(!id||!name)return alert('Student ID மற்றும் Name தேவை');
  if(!old && (db.students.some(s=>s.id===id) || db.archivedStudents.some(s=>s.id===id)))return alert('இந்த Student ID ஏற்கனவே பயன்படுத்தப்பட்டுள்ளது. Removed student ID-ஐ மீண்டும் பயன்படுத்த முடியாது.');
  
  const obj={
    id, name,
    class:document.getElementById('fClass').value.trim(),
    mobile:document.getElementById('fMobile').value.trim(),
    parent:(document.getElementById('fParent')?.value||'').trim(),
    birthday:document.getElementById('fBirthday')?.value||'',
    address:(document.getElementById('fAddress')?.value||'').trim(),
    monthlyFee:Number(document.getElementById('fFee').value)||0,
    password:document.getElementById('fPass').value||'1234'
  };
  if(old) db.students[db.students.findIndex(s=>s.id===old)]=obj;
  else db.students.push(obj);
  save();closeModal();studentsPage();
}

function deleteStudent(id){
  const s=db.students.find(x=>x.id===id);
  if(!s)return;
  if(confirm('இந்த student-ஐ active list-ல் இருந்து remove செய்யவா? Attendance / Fees / Marks / Test records எதுவும் delete ஆகாது.')){
    // Keep a complete snapshot so old records remain linked even after the student is removed.
    const snapshot={...s,removedAt:today(),status:'Removed'};
    db.archivedStudents=db.archivedStudents||[];
    db.archivedStudents=db.archivedStudents.filter(x=>x.id!==id);
    db.archivedStudents.push(snapshot);

    // Stamp historical records with a snapshot. The original records themselves are NEVER deleted.
    const stamp=(arr)=>arr.forEach(r=>{if(r.studentId===id){
      if(!r.studentName)r.studentName=s.name;
      if(!r.studentClass)r.studentClass=s.class||'';
      if(!r.studentMobile)r.studentMobile=s.mobile||'';
    }});
    stamp(db.attendance); stamp(db.fees); stamp(db.marks); stamp(db.onlineMarks||[]);

    // Remove only the active profile. All history arrays stay untouched.
    db.students=db.students.filter(x=>x.id!==id);
    save();
    renderStudents();
    alert('✅ Student removed. Attendance, Fees, Marks and other records are preserved.');
  }
}

function renderClassAttendance(){

    return;
  }

  const students=db.students.filter(s=>s.class===cls);

    box.innerHTML=`<div style="text-align:center;padding:20px;color:var(--muted)">⚠️ இந்த class-ல் students இல்லை.</div>`;

function setAttendanceButton(btn,status){
  const wrap=btn.parentElement;

  const date=wrap.dataset.date||document.getElementById('attDate')?.value||today();
  wrap.querySelectorAll('.att-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');

  db.attendance=db.attendance.filter(a=>!(a.studentId===studentId&&a.date===date));
  db.attendance.push({studentId,date,status});
  save();

function calcPaid(id,month){return db.fees.filter(f=>f.studentId===id&&f.date?.startsWith(month)&&f.type!=='Extra').reduce((a,f)=>a+Number(f.amount||0),0)}
function calcPending(id,month){
  const s=db.students.find(x=>x.id===id);
  const extra=db.fees.filter(f=>f.studentId===id&&f.date?.startsWith(month)&&f.type==='Extra').reduce((a,f)=>a+Number(f.extraAmount||0),0);
  return Math.max(0,Number(s?.monthlyFee||0)+extra-calcPaid(id,month));
}

function renderFeesTable(){

    }).join('')||'<tr><td colspan="8" style="text-align:center">Students இல்லை.</td></tr>'}

function showStudentFeeDetails(id){
  const s=db.students.find(x=>x.id===id);if(!s)return;
  const month=document.getElementById('feeMonth')?.value||new Date().toISOString().slice(0,7);
  const records=db.fees.filter(f=>f.studentId===id&&f.date?.startsWith(month));
  const extras=records.filter(f=>f.type==='Extra');
  const payments=records.filter(f=>f.type!=='Extra');
  const extraTotal=extras.reduce((a,f)=>a+Number(f.extraAmount||0),0);
  const paidTotal=payments.reduce((a,f)=>a+Number(f.amount||0),0);
  const pending=Math.max(0,Number(s.monthlyFee||0)+extraTotal-paidTotal);
  openModal('Student Fee Details',`<div class="paybox"><h3>👨‍🎓 ${esc(s.name)}</h3><p>Class: <b>${esc(s.class)}</b> | Month: <b>${month}</b></p><p>Monthly: <b>${money(s.monthlyFee)}</b></p><p>Extra: <b>${money(extraTotal)}</b></p><p>Paid: <b class="success-text">${money(paidTotal)}</b></p><p>Pending: <b class="${pending?'danger-text':'success-text'}">${money(pending)}</b></p></div><div class="toolbar"><button class="btn success" onclick="closeModal();feeForm('${esc(s.id)}')">💳 Record Pending Amount</button>${extraTotal&&s.mobile?`<button class="btn secondary" onclick="whatsapp('${esc(s.id)}','extra')">💬 Extra Fee Reminder</button>`:''}</div>`);
}

function showFeePending(){

function saveFee(){

  db.fees.push({studentId:sId,amount:amt,date:dt,type:'Payment'});
  save();closeModal();feesPage();
}

function downloadStudentReport(){
  const id=document.getElementById('reportStudent')?.value,month=document.getElementById('reportMonth')?.value||today().slice(0,7),s=db.students.find(x=>x.id===id);
  if(!s)return alert('Student இல்லை.');
  const att=db.attendance.filter(a=>a.studentId===id&&a.date?.startsWith(month));
  const fees=db.fees.filter(f=>f.studentId===id&&f.date?.startsWith(month));
  const marks=db.marks.filter(m=>m.studentId===id);
  const paid=fees.filter(f=>f.type!=='Extra').reduce((a,f)=>a+Number(f.amount||0),0);
  const extra=fees.filter(f=>f.type==='Extra').reduce((a,f)=>a+Number(f.extraAmount||0),0);
  const pending=Math.max(0,Number(s.monthlyFee||0)+extra-paid);
  let csv=`Arul Siragugal Academy - Individual Student Report\nMonth,${month}\nStudent ID,${s.id}\nStudent Name,${s.name}\nClass,${s.class}\nMobile,${s.mobile}\nMonthly Fee,${s.monthlyFee}\nPaid,${paid}\nExtra Fee,${extra}\nPending,${pending}\n\nAttendance\nDate,Status\n`;
  att.forEach(a=>csv+=`${a.date},${a.status}\n`);
  csv+=`\nMarks\nExam / Subject,Mark,Total\n`;marks.forEach(m=>csv+=`${m.exam},${m.mark},${m.total}\n`);
  downloadText(csv,`student-report-${s.id}-${month}.csv`);
}

function downloadMonthlyReport(){
  const month=document.getElementById('monthlyReportMonth')?.value||today().slice(0,7),cls=document.getElementById('monthlyReportClass')?.value||'';
  const students=db.students.filter(s=>!cls||s.class===cls);
  let csv=`Arul Siragugal Academy - Monthly Report\nMonth,${month}\nClass,${cls||'All'}\n\nStudent ID,Student Name,Class,Monthly Fee,Extra Fee,Paid,Pending,Present,Absent\n`;
  students.forEach(s=>{
    const fees=db.fees.filter(f=>f.studentId===s.id&&f.date?.startsWith(month));
    const extra=fees.filter(f=>f.type==='Extra').reduce((a,f)=>a+Number(f.extraAmount||0),0);
    const paid=fees.filter(f=>f.type!=='Extra').reduce((a,f)=>a+Number(f.amount||0),0);
    const pending=Math.max(0,Number(s.monthlyFee||0)+extra-paid);
    const present=db.attendance.filter(a=>a.studentId===s.id&&a.date?.startsWith(month)&&a.status==='Present').length;
    const absent=db.attendance.filter(a=>a.studentId===s.id&&a.date?.startsWith(month)&&a.status==='Absent').length;
    csv+=`${s.id},${s.name},${s.class},${s.monthlyFee},${extra},${paid},${pending},${present},${absent}\n`;
  });
  downloadText(csv,`monthly-report-${month}${cls?'-'+cls:''}.csv`);
}

  const fromId=type.toLowerCase()+'From',toId=type.toLowerCase()+'To';
  return `
    <div class="card" style="margin-top:20px">
      <h3>🗓️ ${type} Date Period Filter</h3>
      <div class="period-tools">
        <div><label>From Date</label><input id="${fromId}" type="date" value="${defaultFromDate()}"></div>
        <div><label>To Date</label><input id="${toId}" type="date" value="${today()}"></div>
        <button class="btn secondary" onclick="exportPeriodCSV('${type}',periodValue('${fromId}'),periodValue('${toId}'))">⬇️ Export CSV</button>
        <button class="btn danger" onclick="clearPeriodData('${type}',periodValue('${fromId}'),periodValue('${toId}'));refreshPeriodPage('${type}')">🗑️ Clear Data</button>
      </div>
    </div>`;
}

function periodValue(id, fallback){return document.getElementById(id)?.value || fallback || ''}
function inPeriod(date, from, to){const d=String(date||'');return (!from || d>=from) && (!to || d<=to)}
function defaultFromDate(){const d=new Date(); d.setDate(d.getDate()-30); return d.toISOString().slice(0,10)}
function refreshPeriodPage(type){if(type==='Attendance')attendancePage();if(type==='Fees')feesPage();if(type==='All History')historyPage()}

function clearPeriodData(type, from, to){
  if(role!=='admin') return alert('Access Denied: Admin மட்டுமே records clear செய்ய முடியும்.');
  if(!from && !to) return alert('From / To date தேர்வு செய்யவும்.');
  if(!confirm(`⚠️ ${from} → ${to} period-ல் உள்ள ${type} records delete செய்யப்படலாமா?`)) return;
  if(type==='Attendance') db.attendance=db.attendance.filter(x=>!inPeriod(x.date,from,to));
  if(type==='Fees') db.fees=db.fees.filter(x=>!inPeriod(x.date,from,to));
  if(type==='All History'){
    db.attendance=db.attendance.filter(x=>!inPeriod(x.date,from,to));
    db.fees=db.fees.filter(x=>!inPeriod(x.date,from,to));
    db.marks=db.marks.filter(x=>!inPeriod(x.date||'',from,to));
    db.onlineMarks=db.onlineMarks.filter(x=>!inPeriod(x.date||'',from,to));
    db.homework=db.homework.filter(x=>!inPeriod(x.date,from,to));
    db.exams=db.exams.filter(x=>!inPeriod(x.date,from,to));
    db.notices=db.notices.filter(x=>!inPeriod(x.date,from,to));
    db.expenses=db.expenses.filter(x=>!inPeriod(x.date,from,to));
  }
  save();
}

function exportPeriodCSV(type,from,to){
  let arr=[];
  if(type==='Attendance') arr=db.attendance.filter(x=>inPeriod(x.date,from,to)).map(x=>{
    const s=db.students.find(st=>st.id===x.studentId);
    return {date:x.date,studentId:x.studentId,student:s?.name||'',class:s?.class||'',status:x.status};
  });
  if(type==='Fees') arr=db.fees.filter(x=>inPeriod(x.date,from,to)).map(x=>({
    date:x.date,studentId:x.studentId,student:db.students.find(s=>s.id===x.studentId)?.name||'',
    type:x.type||'Payment',purpose:x.extraType||'Monthly Fee',
    amount:Number(x.amount||0)+Number(x.extraAmount||0)
  }));
  if(!arr.length)return alert('இந்த date period-ல் data இல்லை.');
  const keys=[...new Set(arr.flatMap(x=>Object.keys(x)))];
  let csv=keys.join(',')+'\n';
  arr.forEach(x=>csv+=keys.map(k=>`"${String(x[k]??'').replaceAll('"','""')}"`).join(',')+'\n');
  downloadText(csv,type.toLowerCase()+'-'+(from||'all')+'-to-'+(to||'all')+'.csv');
}

function exportAllHistoryCSV(from,to){
  const rows=[
    ...db.attendance.filter(x=>inPeriod(x.date,from,to)).map(x=>({module:'Attendance',date:x.date,student:x.studentId,details:x.status,amount:''})),

    ...db.marks.filter(x=>inPeriod(x.date||'',from,to)).map(x=>({module:'Marks',date:x.date||'',student:x.studentId,details:x.exam,amount:x.mark+'/'+x.total})),

  let csv='Module,Date,Student,Details,Amount\n';
  rows.forEach(x=>csv+=['module','date','student','details','amount'].map(k=>`"${String(x[k]??'').replaceAll('"','""')}"`).join(',')+'\n');

/* Utilities */
function fmtPct(n){return Number(n||0).toFixed(1)+'%'}
function monthNow(){return new Date().toISOString().slice(0,7)}
function calcAttendanceStats(id,month){
  const a=db.attendance.filter(x=>x.studentId===id&&(!month||x.date?.startsWith(month)));
  const p=a.filter(x=>x.status==='Present').length;
  const ab=a.filter(x=>x.status==='Absent').length;
  return {total:a.length,present:p,absent:ab,pct:a.length?((p/a.length)*100):0};
}
function waLink(phone,text){let n=String(phone||'').replace(/\D/g,'');if(n.length===10)n='91'+n;return 'https://wa.me/'+n+'?text='+encodeURIComponent(text)}
function callLink(phone){return 'tel:'+String(phone||'').replace(/[^+\d]/g,'')}
function fillMsg(t,s,amount){return String(t||'').replaceAll('{student}',s.name).replaceAll('{amount}',String(amount||0)).replaceAll('{date}',dateText()).replaceAll('{academy}',db.settings.academy)}

/* ========================================================
   FULL COMPLETE GOOGLE SHEETS SYNC (WITH ONLINE MARKS & TEST LINKS)
   ======================================================== */
async function syncSheets(silent){
  silent=!!silent;
  const url=DEFAULT_SHEETS_URL;
  db.settings.sheetsUrl=url;
  if(silent)setSyncStatus('syncing');

  const payload={
    source:'Arul Siragugal Academy',
    syncedAt:new Date().toISOString(),
    settings:{...db.settings,sheetsUrl:url},
    students:db.students||[],
    archivedStudents:db.archivedStudents||[],
    attendance:db.attendance||[],
    fees:db.fees||[],
    marks:db.marks||[],
    onlineMarks:db.onlineMarks||[],
    homework:db.homework||[],
    notices:db.notices||[],
    exams:db.exams||[],
    tests:db.tests||[],
    expenses:db.expenses||[],
    receipts:db.receipts||[],
    teachers:db.teachers||[]
  };

  try{
    let frame=document.getElementById('asaSyncFrame');
    if(!frame){
      frame=document.createElement('iframe');
      frame.id='asaSyncFrame'; frame.name='asaSyncFrame';
      frame.style.display='none'; document.body.appendChild(frame);
    }
    let form=document.getElementById('asaSyncForm');
    if(!form){
      form=document.createElement('form');
      form.id='asaSyncForm'; form.method='POST'; form.target='asaSyncFrame';
      form.enctype='application/x-www-form-urlencoded';
      form.style.display='none'; document.body.appendChild(form);
    }
    form.action=url;
    form.innerHTML='';
    const input=document.createElement('input');
    input.type='hidden'; input.name='payload'; input.value=JSON.stringify(payload);
    form.appendChild(input);
    form.submit();

    /* Apps Script form POST is cross-origin; the browser cannot read its response.
       Treat the request as sent after the form submission and verify again on the next load. */
    setTimeout(()=>setSyncStatus('success'),1200);
    if(!silent)alert('✅ Google Sheets-க்கு data save செய்யப்பட்டது.');
  }catch(err){
    setSyncStatus('error');
    if(!silent)alert('❌ Google Sheets Sync failed: '+err.message);
  }
}

async function importFromSheets(){
  const url=(db.settings.sheetsUrl||'').trim();
  if(!url)return alert('Settings → URL சேர்க்கவும்.');
  if(!confirm('Google Sheets-ல் இருந்து data-வை overwrite செய்யவா?')) return;
  try{
    const response=await fetch(url+(url.includes('?')?'&':'?')+'action=get');
    const text=await response.text();
    let result;try{result=JSON.parse(text)}catch(e){result=null}
    if(!result){alert('❌ Import failed. Response: '+text.slice(0,300));return}
    suppressAutoSync=true;
    applyIncomingData(result,url);
    save();
    suppressAutoSync=false;
    setSyncStatus('success');
    applySettings();
    alert('✅ Import நிறைவடைந்தது.');
    showHubMenu();
  }catch(e){alert('❌ Import failed.\n\nBrowser-ல் direct fetch/CORS block ஆகலாம்.')}
}

// Google Sheets auto-detects numeric-looking cells (an ID, password, or class like "10") and stores
// them as NUMBERS, not text. Every part of this app compares those fields with strict (===) equality
// against text typed into <input> fields — so every identity/reference field coming back from Sheets
// must be forced back to a string here, or logins, class filters, and student lookups silently break
// after every import even though the values look identical on screen.
function applyIncomingData(result,url){
  const str=(v,fallback)=>v===undefined||v===null?(fallback!==undefined?fallback:''):String(v);
  const num=(v)=>Number(v)||0;

  db.students=(result.students||[]).map(s=>({
    ...s,
    id:str(s.id),name:str(s.name),class:str(s.class),mobile:str(s.mobile),
    parent:str(s.parent,''),birthday:str(s.birthday,''),address:str(s.address,''),
    password:str(s.password,'1234'),monthlyFee:num(s.monthlyFee)
  }));
  if(Array.isArray(result.archivedStudents)){
    db.archivedStudents=result.archivedStudents.map(s=>({
      ...s, id:str(s.id),name:str(s.name),class:str(s.class),mobile:str(s.mobile),
      parent:str(s.parent,''),birthday:str(s.birthday,''),address:str(s.address,''),
      password:str(s.password,'1234'),monthlyFee:num(s.monthlyFee),status:'Removed'
    }));
  }else{
    db.archivedStudents=db.archivedStudents||[];
  }
  db.attendance=(result.attendance||[]).map(a=>({...a,studentId:str(a.studentId),date:str(a.date),status:str(a.status),studentName:str(a.studentName,''),studentClass:str(a.studentClass,''),studentMobile:str(a.studentMobile,'')}));
  db.fees=(result.fees||[]).map(f=>({
    ...f,studentId:str(f.studentId),date:str(f.date),type:str(f.type,'Payment'),
    extraType:f.extraType!==undefined&&f.extraType!==''?str(f.extraType):f.extraType,
    amount:num(f.amount),extraAmount:f.extraAmount!==undefined&&f.extraAmount!==''?num(f.extraAmount):undefined,
    studentName:str(f.studentName,''),studentClass:str(f.studentClass,''),studentMobile:str(f.studentMobile,'')
  }));
  db.marks=(result.marks||[]).map(m=>({...m,studentId:str(m.studentId),exam:str(m.exam),date:str(m.date),mark:num(m.mark),total:num(m.total),enteredBy:str(m.enteredBy,''),studentName:str(m.studentName,''),studentClass:str(m.studentClass,'')}));
  db.onlineMarks=(result.onlineMarks||[]).map(m=>({...m,studentId:str(m.studentId),studentName:str(m.studentName,''),class:str(m.class,''),studentClass:str(m.studentClass||m.class,''),testName:str(m.testName),subject:str(m.subject,''),date:str(m.date),mark:num(m.mark),total:num(m.total),enteredBy:str(m.enteredBy,'')}));
  db.homework=(result.homework||[]).map(h=>({...h,class:str(h.class),subject:str(h.subject),text:str(h.text),date:str(h.date)}));
  db.notices=(result.notices||[]).map(n=>({...n,title:str(n.title),text:str(n.text),date:str(n.date)}));
  db.exams=(result.exams||[]).map(x=>({...x,name:str(x.name),class:str(x.class),subject:str(x.subject),date:str(x.date)}));
  db.tests=(result.tests||[]).map(t=>({...t,name:str(t.name),class:str(t.class,''),subject:str(t.subject,''),link:str(t.link),date:str(t.date),total:num(t.total)||100,postedBy:str(t.postedBy,'')}));
  db.expenses=(result.expenses||[]).map(e=>({...e,category:str(e.category),note:str(e.note,''),amount:num(e.amount),date:str(e.date)}));
  db.receipts=(result.receipts||[]).map(r=>({...r,studentId:str(r.studentId),studentName:str(r.studentName,''),date:str(r.date),amount:num(r.amount),receiptNo:str(r.receiptNo,''),month:str(r.month,''),type:str(r.type,'Payment')}));
  db.teachers=(result.teachers||[]).map(t=>({...t,id:str(t.id),name:str(t.name),password:str(t.password,''),mobile:str(t.mobile,'')}));

  if(result.settings&&Object.keys(result.settings).length){
    const incoming={...result.settings};
    if(typeof incoming.messages==='string'){try{incoming.messages=JSON.parse(incoming.messages)}catch(e){delete incoming.messages}}
    if(incoming.fee!==undefined)incoming.fee=num(incoming.fee);
    if(incoming.autoSync!==undefined)incoming.autoSync=(incoming.autoSync===true||incoming.autoSync==='true'||incoming.autoSync==='TRUE');
    ['academy','teacher','mobile','upi','teacherId','teacherPass','adminId','adminPass'].forEach(k=>{if(incoming[k]!==undefined)incoming[k]=str(incoming[k])});
    db.settings={...db.settings,...incoming,sheetsUrl:url,logo:db.settings.logo}; // keep this device's logo + confirmed working URL
  }
}

// Runs automatically the moment the app is opened on ANY device, before login — so every device
// shows the same shared data without anyone tapping Import manually. Login buttons are disabled
// while this runs, since (especially for students) the login check depends on data that doesn't
// exist locally yet on a device opening the app for the first time.
// Safety rule: if the sheet comes back completely empty but this device already has real local
// data, we do NOT wipe the device — that usually means the sheet isn't set up yet, or a network
// hiccup returned nothing. In that case we push this device's data up instead.
async function autoImportOnLoad(){
  const url=DEFAULT_SHEETS_URL;
  db.settings.sheetsUrl=url;
  setSyncStatus('syncing');
  const loadingEl=document.getElementById('loginLoading');
  const btns=['teacherLoginBtn','studentLoginBtn','adminLoginBtn'].map(id=>document.getElementById(id)).filter(Boolean);
  if(loadingEl){loadingEl.style.display='block';loadingEl.textContent='⏳ Google Sheets connect ஆகிறது...';loadingEl.style.color='var(--muted)';}
  btns.forEach(b=>b.disabled=true);

  async function readSheet(attempt){
    const endpoint=url+(url.includes('?')?'&':'?')+'action=get&_='+Date.now();
    try{
      const response=await fetch(endpoint,{method:'GET',mode:'cors',cache:'no-store',redirect:'follow'});
      const text=await response.text();
      let result=null;
      try{result=JSON.parse(text)}catch(e){
        throw new Error('Apps Script JSON response கிடைக்கவில்லை. Web App /exec deployment check செய்யவும்.');
      }
      if(result && result.success===false) throw new Error(result.message||'Apps Script returned an error');
      return result;
    }catch(err){
      if(attempt<2){
        await new Promise(r=>setTimeout(r,1200));
        return readSheet(attempt+1);
      }
      throw err;
    }
  }

  try{
    const result=await readSheet(0);
    suppressAutoSync=true;
    applyIncomingData(result,url);
    suppressAutoSync=false;
    setSyncStatus('success');
    applySettings();
    if(loadingEl){loadingEl.textContent='✅ Google Sheets Connected — Login Ready';loadingEl.style.color='#16a34a';}
    btns.forEach(b=>b.disabled=false);
    console.log('Google Sheets connected:',url,'Students:',db.students.length);
  }catch(e){
    suppressAutoSync=false;
    setSyncStatus('error');
    if(loadingEl){loadingEl.textContent='❌ Google Sheets connection failed';loadingEl.style.color='#dc2626';}
    const msg=document.getElementById('loginMsg');
    if(msg)msg.textContent='Google Sheets connect ஆகவில்லை: '+e.message;
    console.error('Google Sheets startup import failed:',e);
    btns.forEach(b=>b.disabled=true);
  }
}

applySettings();
autoImportOnLoad();
</script>

    box.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Student</th><th>Class</th><th>P</th><th>A</th><th>Status</th></tr></thead><tbody>${students.map((s,i)=>{const st=existing[s.id]||'';return `<tr><td>${i+1}</td><td><b>${esc(s.name)}</b><br><small>${esc(s.id)}</small></td><td>${esc(s.class||'-')}</td><td><button type="button" class="att-btn present ${st==='Present'?'selected':''}" data-gstudent="${esc(s.id)}" data-gdate="${esc(date)}" onclick="groupAttendanceClick(this,'Present')">✓ P</button></td><td><button type="button" class="att-btn absent ${st==='Absent'?'selected':''}" data-gstudent="${esc(s.id)}" data-gdate="${esc(date)}" onclick="groupAttendanceClick(this,'Absent')">✕ A</button></td><td><span class="att-status badge ${st==='Present'?'ok':st==='Absent'?'pending':'info'}">${st||'Not Marked'}</span></td></tr>`}).join('')||'<tr><td colspan="6">இந்த class-ல் மாணவர்கள் இல்லை.</td></tr>'}</tbody></table></div>`;
  };
  window.groupAttendanceClick=function(btn,status){
    const id=btn.dataset.gstudent, date=btn.dataset.gdate||today();
    db.attendance=db.attendance.filter(a=>!(a.studentId===id&&a.date===date));
    db.attendance.push({studentId:id,date,status});
    save();
    const row=btn.closest('tr'); row?.querySelectorAll('.att-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected');
    const badge=row?.querySelector('.att-status'); if(badge){badge.textContent=status;badge.className='att-status badge '+(status==='Present'?'ok':'pending');}
    renderGroupAttendanceHistory();

  /* Re-enter selected group after login. */
  const originalEnter=window.enterApp;
  window.enterApp=function(r){ originalEnter(r); if(r!=='student') setTimeout(renderRoleGroupDashboard,0); };
})();
  window.exportSmartPDF=pdfPrint;

  /* Admin dashboard: clickable Total Students with class-wise Present/Absent */
  window.adminStudentSummary=function(){
    const classes=[...new Set(db.students.map(s=>s.class).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    const date=today();

    document.getElementById('content').innerHTML=`
      <div class="toolbar"><button class="btn secondary" onclick="showHubMenu()">⬅️ Dashboard</button><button class="btn pdf-btn" onclick="exportAdminSummaryPDF()">🖨️ Export PDF</button></div>
      <div class="card"><h3>👨‍🎓 Total Students — Class-wise Summary</h3>
        <div class="smart-filters"><div><label>Date</label><input id="sumDate" type="date" value="${date}" onchange="renderAdminSummary()"></div><div><label>Class Group</label><select id="sumBand" onchange="renderAdminSummary()"><option value="">All Groups</option>${bands.map(x=>`<option value="${x[0]}">${x[1]} (${db.students.filter(s=>classBand(s.class)===x[0]).length})</option>`).join('')}</select></div><div><label>Class</label><select id="sumClass" onchange="renderAdminSummary()"><option value="">All Classes</option>${clsOptions()}</select></div></div>
        <div id="adminSummaryBody"></div>
      </div>`;
    renderAdminSummary();
  };
  window.renderAdminSummary=function(){
    const date=document.getElementById('sumDate')?.value||today(),band=document.getElementById('sumBand')?.value||'',cls=document.getElementById('sumClass')?.value||'';

    const ab=ss.filter(s=>db.attendance.some(a=>a.studentId===s.id&&a.date===date&&a.status==='Absent')).length;

    const groups=[...new Set(ss.map(s=>s.class||'No Class'))];
    document.getElementById('adminSummaryBody').innerHTML=`<div class="summary-cards"><div class="summary-box"><span>Total Students</span><b>${ss.length}</b></div><div class="summary-box"><span>Present — ${date}</span><b class="success-text">${p}</b></div><div class="summary-box"><span>Absent — ${date}</span><b class="danger-text">${ab}</b></div></div><div class="card table-wrap"><table class="table"><thead><tr><th>Class</th><th>Total</th><th>Present</th><th>Absent</th><th>Not Marked</th></tr></thead><tbody>${groups.map(c=>{const x=ss.filter(s=>s.class===c),pr=x.filter(s=>db.attendance.some(a=>a.studentId===s.id&&a.date===date&&a.status==='Present')).length,aa=x.filter(s=>db.attendance.some(a=>a.studentId===s.id&&a.date===date&&a.status==='Absent')).length;return `<tr><td><b>${esc(c)}</b></td><td>${x.length}</td><td><span class="badge ok">${pr}</span></td><td><span class="badge pending">${aa}</span></td><td>${x.length-pr-aa}</td></tr>`}).join('')||'<tr><td colspan="5">Students இல்லை.</td></tr>'}</tbody></table></div><div class="card table-wrap"><h3>Student Details</h3><table class="table"><thead><tr><th>Name</th><th>ID</th><th>Class</th><th>Today</th><th>Action</th></tr></thead><tbody>${ss.map(s=>{const a=db.attendance.find(a=>a.studentId===s.id&&a.date===date);return `<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.id)}</td><td>${esc(s.class)}</td><td><span class="badge ${a?.status==='Present'?'ok':a?.status==='Absent'?'pending':'info'}">${a?.status||'Not Marked'}</span></td><td><button class="btn secondary" onclick="studentProfilePage('${esc(s.id)}')">View</button></td></tr>`}).join('')}</tbody></table></div>`;
  };
  window.exportAdminSummaryPDF=function(){const date=document.getElementById('sumDate')?.value||today();const band=document.getElementById('sumBand')?.value||'';const cls=document.getElementById('sumClass')?.value||'';let ss=db.students.filter(s=>(!band||classBand(s.class)===band)&&(!cls||s.class===cls));const rows=[...new Set(ss.map(s=>s.class||'No Class'))].map(c=>{const x=ss.filter(s=>s.class===c),p=x.filter(s=>db.attendance.some(a=>a.studentId===s.id&&a.date===date&&a.status==='Present')).length,a=x.filter(s=>db.attendance.some(a=>a.studentId===s.id&&a.date===date&&a.status==='Absent')).length;return `<tr><td>${esc(c)}</td><td>${x.length}</td><td>${p}</td><td>${a}</td><td>${x.length-p-a}</td></tr>`}).join('');pdfPrint('Student Class-wise Summary',`<p>Date: <b>${date}</b> | Group: <b>${esc(band||'All')}</b> | Class: <b>${esc(cls||'All')}</b></p><table><tr><th>Class</th><th>Total</th><th>Present</th><th>Absent</th><th>Not Marked</th></tr>${rows}</table>`)};

  /* Admin total card becomes clickable */

  const oldStudentsPage=studentsPage;
  studentsPage=function(){oldStudentsPage();const tb=document.querySelector('#content .toolbar');if(tb&&role!=='admin'&&!tb.querySelector('[data-smart-add]')){const b=document.createElement('button');b.className='btn';b.dataset.smartAdd='1';b.textContent='➕ Add Student';b.onclick=()=>studentForm();tb.insertBefore(b,tb.firstChild);} };

  /* Attendance history: class + group + date range */
  const oldAttendance=attendancePage;
  attendancePage=function(){oldAttendance();const cards=document.querySelectorAll('#content .card');const h=cards[1];if(h){h.innerHTML=`<h3>📋 Attendance History — Class / Date Filter</h3><div class="smart-filters"><div><label>From Date</label><input id="ahFrom" type="date" value="${defaultFromDate()}"></div><div><label>To Date</label><input id="ahTo" type="date" value="${today()}"></div><div><label>Class Group</label><select id="ahBand"><option value="">All</option><option value="LKG-5">LKG–5 Std</option><option value="6-8">6–8</option></select></div><div><label>Class</label><select id="ahClass"><option value="">All Classes</option>${clsOptions()}</select></div><button class="btn secondary" onclick="renderSmartAttendanceHistory()">🔎 Filter</button><button class="btn pdf-btn" onclick="exportSmartAttendancePDF()">🖨️ PDF</button></div><div id="smartAttHistory"></div>`;renderSmartAttendanceHistory();}};
  window.renderSmartAttendanceHistory=function(){const f=document.getElementById('ahFrom')?.value||'',t=document.getElementById('ahTo')?.value||'',b=document.getElementById('ahBand')?.value||'',c=document.getElementById('ahClass')?.value||'';const arr=db.attendance.filter(a=>inPeriod(a.date,f,t)).map(a=>({...a,s:db.students.find(s=>s.id===a.studentId)})).filter(x=>(!b||classBand(x.s?.class)===b)&&(!c||x.s?.class===c));document.getElementById('smartAttHistory').innerHTML=`<div class="summary-cards"><div class="summary-box">Total <b>${arr.length}</b></div><div class="summary-box">Present <b class="success-text">${arr.filter(x=>x.status==='Present').length}</b></div><div class="summary-box">Absent <b class="danger-text">${arr.filter(x=>x.status==='Absent').length}</b></div></div><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Class</th><th>Student</th><th>Status</th></tr>${arr.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(x.s?.class||'-')}</td><td>${esc(x.s?.name||x.studentId)}</td><td><span class="badge ${x.status==='Present'?'ok':'pending'}">${x.status}</span></td></tr>`).join('')||'<tr><td colspan="4">No records.</td></tr>'}</table></div>`};

  /* Fees: class-wise + month-wise filter */
  const oldFees=feesPage;
  feesPage=function(){oldFees();const first=document.querySelector('#content .card');if(first){const bar=document.createElement('div');bar.className='card';bar.innerHTML=`<h3>🔎 Fees Filter</h3><div class="smart-filters"><div><label>Month</label><input id="feeMonthFilter" type="month" value="${monthNow()}"></div><div><label>Class Group</label><select id="feeBandFilter"><option value="">All</option><option value="LKG-5">LKG–5 Std</option><option value="6-8">6–8</option></select></div><div><label>Class</label><select id="feeClassFilter"><option value="">All Classes</option>${clsOptions()}</select></div><button class="btn secondary" onclick="renderSmartFees()">🔎 Filter</button><button class="btn pdf-btn" onclick="exportSmartFeesPDF()">🖨️ PDF</button></div><div id="smartFees"></div>`;first.parentNode.insertBefore(bar,first);renderSmartFees();}};
  window.renderSmartFees=function(){const m=document.getElementById('feeMonthFilter')?.value||monthNow(),b=document.getElementById('feeBandFilter')?.value||'',c=document.getElementById('feeClassFilter')?.value||'';const ss=db.students.filter(s=>(!b||classBand(s.class)===b)&&(!c||s.class===c));const rows=ss.map(s=>{const fs=db.fees.filter(f=>f.studentId===s.id&&f.date?.startsWith(m)),extra=fs.filter(f=>f.type==='Extra').reduce((a,f)=>a+Number(f.extraAmount||0),0),paid=fs.filter(f=>f.type!=='Extra').reduce((a,f)=>a+Number(f.amount||0),0),pending=Math.max(0,Number(s.monthlyFee||0)+extra-paid);return `<tr><td><button class="student-link" onclick="showStudentFeeDetails('${esc(s.id)}')">${esc(s.name)}</button></td><td>${esc(s.class)}</td><td>${money(s.monthlyFee)}</td><td>${money(extra)}</td><td>${money(paid)}</td><td><span class="badge ${pending?'pending':'ok'}">${money(pending)}</span></td></tr>`}).join('');document.getElementById('smartFees').innerHTML=`<div class="summary-cards"><div class="summary-box">Students <b>${ss.length}</b></div><div class="summary-box">Paid <b class="success-text">${money(ss.reduce((a,s)=>a+calcPaid(s.id,m),0))}</b></div><div class="summary-box">Pending <b class="danger-text">${money(ss.reduce((a,s)=>a+calcPending(s.id,m),0))}</b></div></div><div class="table-wrap"><table class="table"><tr><th>Student</th><th>Class</th><th>Monthly</th><th>Extra</th><th>Paid</th><th>Pending</th></tr>${rows||'<tr><td colspan="6">Students இல்லை.</td></tr>'}</table></div>`};
  window.exportSmartFeesPDF=function(){pdfPrint('Fees Class-wise Month-wise Report',document.getElementById('smartFees')?.innerHTML||'No records');};

  /* Homework link */
  const oldHwForm=homeworkForm;
  homeworkForm=function(){openModal('Homework + Link',`<label>Class</label><input id="hwClass"><label>Subject</label><input id="hwSubject"><label>Homework Note</label><textarea id="hwText"></textarea><label>Homework Link (optional)</label><input id="hwLink" placeholder="https://..."><label>Date</label><input id="hwDate" type="date" value="${today()}"><br><button class="btn" style="width:100%" onclick="saveSmartHomework()">Save Homework</button>`)};
  window.saveSmartHomework=function(){const h={class:document.getElementById('hwClass').value.trim(),subject:document.getElementById('hwSubject').value.trim(),text:document.getElementById('hwText').value.trim(),link:document.getElementById('hwLink').value.trim(),date:document.getElementById('hwDate').value||today(),postedBy:role==='admin'?'Admin':(db.settings.teacher||'Teacher')};if(!h.class||!h.text)return alert('Class மற்றும் Homework தேவை');db.homework.push(h);save();closeModal();homeworkPage()};
  const oldHw=homeworkPage;
  homeworkPage=function(){oldHw();document.querySelectorAll('#content table tbody tr').forEach(tr=>{const text=tr.children[3]?.textContent||'';const h=db.homework.find(x=>x.text===text);if(h?.link){tr.children[3].innerHTML+=` <a class="btn secondary" target="_blank" href="${esc(h.link)}" style="padding:4px 8px;font-size:11px">🔗 Link</a>`}})};

  /* Student Login ID / Password Edit from profile */
  window.editStudentLogin=function(id){const s=db.students.find(x=>x.id===id);if(!s)return;openModal('Edit Student Login',`<p><b>${esc(s.name)}</b> (${esc(s.class)})</p><label>Login ID</label><input id="editLoginId" value="${esc(s.id)}"><label>Password</label><input id="editLoginPass" value="${esc(s.password||'1234')}"><br><button class="btn" style="width:100%" onclick="saveStudentLogin('${esc(id)}')">Save Login</button>`)};
  window.saveStudentLogin=function(oldId){const s=db.students.find(x=>x.id===oldId);if(!s)return;const nid=document.getElementById('editLoginId').value.trim(),pw=document.getElementById('editLoginPass').value;if(!nid||!pw)return alert('Login ID / Password தேவை');if(nid!==oldId&&db.students.some(x=>x.id===nid))return alert('இந்த Login ID ஏற்கனவே உள்ளது');s.id=nid;s.password=pw;db.attendance.forEach(a=>{if(a.studentId===oldId)a.studentId=nid});db.fees.forEach(a=>{if(a.studentId===oldId)a.studentId=nid});db.marks.forEach(a=>{if(a.studentId===oldId)a.studentId=nid});db.onlineMarks.forEach(a=>{if(a.studentId===oldId)a.studentId=nid});save();closeModal();studentsPage()};

  /* Patch student profile button by overriding profile renderer with extra login button only when needed */
  const oldProfile=studentProfilePage;
  studentProfilePage=function(id){oldProfile(id);const body=document.getElementById('modalBody');if(body&&document.getElementById('modal').classList.contains('hidden')===false){const b=document.createElement('button');b.className='btn secondary';b.textContent='🔐 Edit Login ID / Password';b.onclick=()=>editStudentLogin(id);body.querySelector('.toolbar')?.appendChild(b);}};

  /* Tests portal: pending students + complete student view */
  const oldTests=testsPage;
  testsPage=function(){oldTests();const c=document.getElementById('content');const pending=db.students.filter(s=>{const target=(db.tests||[]).filter(t=>!t.class||t.class===s.class);return target.some(t=>!db.onlineMarks.some(m=>m.studentId===s.id&&m.testName===t.name));});const card=document.createElement('div');card.className='card';card.innerHTML=`<h3>👨‍🎓 Test Portal — Pending Students (${pending.length})</h3><p style="color:var(--muted)">Pending students மட்டும் இங்கே காட்டப்படும். Student-ஐ click செய்தால் full details பார்க்கலாம்.</p><div class="table-wrap"><table class="table"><tr><th>Student</th><th>Class</th><th>Pending Tests</th><th>View</th></tr>${pending.map(s=>{const n=(db.tests||[]).filter(t=>(!t.class||t.class===s.class)&&!db.onlineMarks.some(m=>m.studentId===s.id&&m.testName===t.name)).length;return `<tr><td><button class="student-link" onclick="showTestStudentDetails('${esc(s.id)}')">${esc(s.name)}</button></td><td>${esc(s.class)}</td><td><span class="badge pending">${n} Pending</span></td><td><button class="btn secondary" onclick="showTestStudentDetails('${esc(s.id)}')">👁 View All Details</button></td></tr>`}).join('')||'<tr><td colspan="4">Pending students இல்லை.</td></tr>'}</table></div>`;c.appendChild(card)};
  window.showTestStudentDetails=function(id){const s=db.students.find(x=>x.id===id);if(!s)return;const att=calcAttendanceStats(id,'');const fees=db.fees.filter(f=>f.studentId===id),paid=fees.reduce((a,f)=>a+Number(f.amount||0),0),tests=(db.tests||[]).filter(t=>!t.class||t.class===s.class),scores=db.onlineMarks.filter(m=>m.studentId===id);openModal('Student — All Details',`<div class="summary-cards"><div class="summary-box">Attendance <b>${att.present}/${att.total}</b></div><div class="summary-box">Absent <b class="danger-text">${att.absent}</b></div><div class="summary-box">Fee Paid <b class="success-text">${money(paid)}</b></div></div><div class="card"><p><b>Name:</b> ${esc(s.name)}</p><p><b>Student ID:</b> ${esc(s.id)}</p><p><b>Class:</b> ${esc(s.class)}</p><p><b>Mobile:</b> ${esc(s.mobile)}</p><p><b>Parent:</b> ${esc(s.parent||'-')}</p><p><b>Birthday:</b> ${esc(s.birthday||'-')}</p></div><h4>Tests / Marks</h4><table class="table"><tr><th>Test</th><th>Total</th><th>Status</th><th>Mark</th></tr>${tests.map(t=>{const m=scores.find(x=>x.testName===t.name);return `<tr><td>${esc(t.name)}</td><td>${t.total}</td><td><span class="badge ${m?'ok':'pending'}">${m?'Submitted':'Pending'}</span></td><td>${m?m.mark+'/'+m.total:'-'}</td></tr>`}).join('')||'<tr><td colspan="4">Tests இல்லை.</td></tr>'}</table>`)};

  /* Export all relevant visible details as PDF from Reports/History */
